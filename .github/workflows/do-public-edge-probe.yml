name: DigitalOcean Public Edge Probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'ops/do-public-edge-probe-trigger.txt'

permissions:
  contents: write

jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      RESULT_BRANCH: ${{ github.head_ref }}
      URL: http://167.172.193.194/
    steps:
      - name: Inspect public Caddy surface
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --connect-timeout 6 --max-time 10 -D /tmp/headers -o /tmp/body "$URL"
          options_code="$(curl -sS -o /tmp/options-body -D /tmp/options-headers -w '%{http_code}' -X OPTIONS --connect-timeout 6 --max-time 10 "$URL" || true)"
          allow="$(awk 'BEGIN{IGNORECASE=1} /^allow:/{sub(/^[^:]*:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' /tmp/options-headers 2>/dev/null || true)"
          TITLE="$(python3 -c 'import re; s=open("/tmp/body",errors="ignore").read(200000); m=re.search(r"<title[^>]*>(.*?)</title>",s,re.I|re.S); print(re.sub(r"\s+"," ",m.group(1)).strip()[:160] if m else "")')"
          TEXT="$(python3 -c 'import re,html; s=open("/tmp/body",errors="ignore").read(200000); s=re.sub(r"(?is)<script.*?</script>|<style.*?</style>"," ",s); s=re.sub(r"(?s)<[^>]+>"," ",s); s=html.unescape(s); print(re.sub(r"\s+"," ",s).strip()[:800])')"
          LINKS="$(python3 -c 'import re,json; s=open("/tmp/body",errors="ignore").read(200000); xs=[]; [xs.append(x) for x in re.findall(r"href=[\"\x27]([^\"\x27]+)",s,re.I) if x.startswith("/") and x not in xs]; print(json.dumps(xs[:30]))')"
          TITLE="$TITLE" TEXT="$TEXT" LINKS="$LINKS" OPTIONS_CODE="$options_code" ALLOW="$allow" python3 -c 'import json,os; print(json.dumps({"url":"http://167.172.193.194/","title":os.environ["TITLE"],"visibleText":os.environ["TEXT"],"localLinks":json.loads(os.environ["LINKS"]),"optionsCode":os.environ["OPTIONS_CODE"],"allowHeader":os.environ["ALLOW"][:160]},indent=2))' >/tmp/result.json

      - name: Persist public edge result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -s /tmp/result.json ]; then printf '{"workflowFailedBeforeResult":true}\n' >/tmp/result.json; fi
          content="$(base64 -w0 /tmp/result.json)"
          payload="$(CONTENT="$content" BRANCH="$RESULT_BRANCH" python3 -c 'import json,os; print(json.dumps({"message":"Record DigitalOcean public edge probe","content":os.environ["CONTENT"],"branch":os.environ["BRANCH"]}))')"
          curl -fsS -X PUT -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/ops/do-public-edge-probe-result.json" -d "$payload" >/dev/null
