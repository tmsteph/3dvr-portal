name: Free Site Third-Line Recovery

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/free-site-third-line-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: free-site-third-line-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      THREEDVR_FREE_SITE_MAX_PER_RUN: '3'
      THREEDVR_FREE_SITE_LOOKBACK_HOURS: '24'
    steps:
      - name: Checkout portal
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: apps/agent/package-lock.json

      - name: Install agent dependencies
        run: npm --prefix apps/agent ci

      - name: Run established bounded free-site worker
        id: worker
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # A second pass is intentional: the first pass may discover a site
          # that was fulfilled by another path and persist `existing` state.
          # Reusing the same runner/state lets the bounded worker finalize that
          # request (marking it seen) without generating or publishing again.
          node apps/agent/thomas-agent/node/free-site-worker.js
          node apps/agent/thomas-agent/node/free-site-worker.js

      - name: Publish third-line recovery status
        if: always()
        env:
          STATUS_TOKEN: ${{ github.token }}
          WORKER_OUTCOME: ${{ steps.worker.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          state=success
          description='Third-line free-site worker completed'
          if [ "$WORKER_OUTCOME" != success ]; then
            state=failure
            description='Third-line free-site worker failed'
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $STATUS_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"$state\",\"context\":\"3DVR Free Site Third-Line\",\"description\":\"$description\"}"
          [ "$state" = success ]
