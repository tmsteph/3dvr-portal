name: OAuth Token Recovery Diagnostic

on:
  push:
    branches:
      - ops/oauth-token-recovery-20260910
    paths:
      - .github/workflows/oauth-token-recovery-diagnostic.yml

permissions:
  contents: read

jobs:
  verify-ovh-mail:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify OVH mail credential loading without exposing secrets
        shell: bash
        env:
          SSH_A: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
          SSH_B: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_C: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          write_key() {
            local raw="$1" dest="$2"
            [ -n "$raw" ] || return 0
            printf '%s\n' "$raw" > "$dest.raw"
            if grep -q 'BEGIN .*PRIVATE KEY' "$dest.raw"; then cp "$dest.raw" "$dest"
            elif base64 -d "$dest.raw" > "$dest" 2>/dev/null && grep -q 'BEGIN .*PRIVATE KEY' "$dest"; then :
            else rm -f "$dest" "$dest.raw"; return 0; fi
            chmod 600 "$dest"; rm -f "$dest.raw"
          }
          write_key "$SSH_A" /tmp/h-a
          write_key "$SSH_B" /tmp/h-b
          write_key "$SSH_C" /tmp/h-c

          cat > /tmp/check-mail.sh <<'REMOTE'
          set -euo pipefail
          home=/home/debian
          [ -d "$home" ] || home="$HOME"
          cfg="$home/.3dvr/config"
          echo "host=$(hostname) operator_home=$home"
          for f in "$cfg/env" "$cfg/portal.env" "$cfg/outreach.env" "$home/.3dvr-agent-operator-email-token" "$home/.3dvr/oauth.json" "$home/.3dvr/connectors/google-oauth.enc.json" "$home/.3dvr/connectors/accounts.json"; do
            if [ -s "$f" ]; then echo "present=$f size=$(stat -c %s "$f") mtime=$(stat -c %y "$f" | cut -d. -f1)"; else echo "missing_or_empty=$f"; fi
          done
          for key in GMAIL_USER GMAIL_APP_PASSWORD AGENT_OPERATOR_EMAIL_TOKEN THREEDVR_CONNECTOR_MASTER_KEY THREEDVR_OUTREACH_EMAIL_TOKEN; do
            files=''
            for f in "$cfg/env" "$cfg/portal.env" "$cfg/outreach.env"; do
              [ -f "$f" ] || continue
              if grep -q "^${key}=" "$f"; then files="$files $f"; fi
            done
            echo "key_present=$key:${files:-no}"
          done
          set -a
          [ -f "$cfg/env" ] && . "$cfg/env"
          [ -f "$cfg/portal.env" ] && . "$cfg/portal.env"
          [ -f "$cfg/outreach.env" ] && . "$cfg/outreach.env"
          set +a
          echo "runtime_GMAIL_USER=${GMAIL_USER:-unset}"
          echo "runtime_GMAIL_APP_PASSWORD_present=$([ -n "${GMAIL_APP_PASSWORD:-}" ] && echo yes || echo no)"
          echo "runtime_OPERATOR_TOKEN_present=$([ -n "${AGENT_OPERATOR_EMAIL_TOKEN:-}" ] && echo yes || echo no)"
          token_file="$home/.3dvr-agent-operator-email-token"
          if [ -s "$token_file" ]; then
            relay_token="$(tr -d '\r\n' < "$token_file")"
            response="$(mktemp)"
            code="$(curl --max-time 8 -sS -o "$response" -w '%{http_code}' -X POST -H 'Content-Type: application/json' -H "Authorization: Bearer $relay_token" http://127.0.0.1:4320/api/calendar/reminder-email -d '{"mode":"lead-outreach"}' || true)"
            if [ "$code" = 400 ] && grep -Fq 'At least one outreach recipient is required' "$response"; then
              echo 'portal_mail_relay_auth=working'
            else
              echo "portal_mail_relay_auth=failed http=$code"
            fi
            rm -f "$response"
          else
            echo 'portal_mail_relay_auth=no-token-file'
          fi
          if command -v 3dvr >/dev/null 2>&1; then
            3dvr email status 2>&1 | sed -E 's/(app password: ).*/\1[status only]/I' | head -20 || true
          fi
          REMOTE

          for user in debian root; do
            for key in /tmp/h-a /tmp/h-b /tmp/h-c; do
              [ -f "$key" ] || continue
              if ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=6 "$user@40.160.137.41" 'sudo -n env HOME=/home/debian bash -s' < /tmp/check-mail.sh; then
                echo "connected_as=$user"
                exit 0
              fi
            done
          done
          exit 1
