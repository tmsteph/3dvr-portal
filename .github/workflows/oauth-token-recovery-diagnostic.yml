name: OAuth Token Recovery Diagnostic

on:
  push:
    branches:
      - ops/oauth-token-recovery-20260910
    paths:
      - .github/workflows/oauth-token-recovery-diagnostic.yml

permissions:
  contents: read

jobs:
  locate-ovh-mail:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Locate mail credential metadata without exposing secrets
        shell: bash
        env:
          SSH_A: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
          SSH_B: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_C: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          write_key() {
            local raw="$1" dest="$2"
            [ -n "$raw" ] || return 0
            printf '%s\n' "$raw" > "$dest.raw"
            if grep -q 'BEGIN .*PRIVATE KEY' "$dest.raw"; then cp "$dest.raw" "$dest"
            elif base64 -d "$dest.raw" > "$dest" 2>/dev/null && grep -q 'BEGIN .*PRIVATE KEY' "$dest"; then :
            else rm -f "$dest" "$dest.raw"; return 0; fi
            chmod 600 "$dest"; rm -f "$dest.raw"
          }
          write_key "$SSH_A" /tmp/h-a
          write_key "$SSH_B" /tmp/h-b
          write_key "$SSH_C" /tmp/h-c

          cat > /tmp/locate-mail.sh <<'REMOTE'
          set -euo pipefail
          home=/home/debian
          cfg="$home/.3dvr/config"
          echo "host=$(hostname)"
          echo '--- candidate config files ---'
          find "$home/.3dvr" /opt/3dvr-portal-production /etc/systemd/system -maxdepth 6 -type f \
            \( -name '*.env' -o -name 'env' -o -name '*.conf' -o -name '*.service' -o -name '*.bak' -o -name '*.backup' -o -name '*.old' \) 2>/dev/null \
            | grep -vE '/node_modules/|/.git/' | head -1200 | while read -r f; do
              keys=''
              for k in GMAIL_USER GMAIL_APP_PASSWORD AGENT_OPERATOR_EMAIL_TOKEN THREEDVR_OUTREACH_EMAIL_TOKEN THREEDVR_CONNECTOR_MASTER_KEY; do
                grep -q "^${k}=" "$f" 2>/dev/null && keys="$keys $k"
              done
              [ -n "$keys" ] && echo "key_file=$f keys=$keys mtime=$(stat -c %y "$f" | cut -d. -f1)"
            done

          echo '--- targeted historical grep filenames only ---'
          for k in GMAIL_APP_PASSWORD GMAIL_USER AGENT_OPERATOR_EMAIL_TOKEN; do
            grep -RIl --exclude-dir=node_modules --exclude-dir=.git --exclude='*.log' --exclude='*.ndjson' -- "$k" "$home/.3dvr" /opt/3dvr-portal-production /etc/systemd/system 2>/dev/null \
              | head -80 | sed "s#^#contains_${k}=#" || true
          done

          echo '--- service runtime booleans ---'
          pid="$(systemctl show -p MainPID --value 3dvr-portal.service 2>/dev/null || true)"
          echo "portal_pid=${pid:-0}"
          if [ -n "$pid" ] && [ "$pid" != 0 ] && [ -r "/proc/$pid/environ" ]; then
            python3 - "$pid" "$home/.3dvr-agent-operator-email-token" <<'PY'
          import sys, os
          pid, token_path = sys.argv[1:]
          raw=open(f'/proc/{pid}/environ','rb').read().split(b'\0')
          env={x.split(b'=',1)[0].decode(errors='ignore'):x.split(b'=',1)[1].decode(errors='ignore') for x in raw if b'=' in x}
          for k in ('GMAIL_USER','GMAIL_APP_PASSWORD','AGENT_OPERATOR_EMAIL_TOKEN','THREEDVR_OUTREACH_EMAIL_TOKEN','THREEDVR_CONNECTOR_MASTER_KEY'):
              if k == 'GMAIL_USER': print(f'portal_runtime_{k}={env.get(k,"unset")}')
              else: print(f'portal_runtime_{k}_present={"yes" if env.get(k) else "no"}')
          tok=''
          try: tok=open(token_path).read().strip()
          except: pass
          print('portal_runtime_operator_token_matches_file=' + ('yes' if tok and env.get('AGENT_OPERATOR_EMAIL_TOKEN') == tok else 'no'))
          PY
          fi

          echo '--- systemd config sources ---'
          systemctl cat 3dvr-portal.service 2>/dev/null | sed -E 's/(Environment=.*=).*/\1<redacted>/' | grep -E 'EnvironmentFile|Environment=' || true
          systemctl cat 3dvr-autopilot.service 2>/dev/null | sed -E 's/(Environment=.*=).*/\1<redacted>/' | grep -E 'EnvironmentFile|Environment=' || true

          echo '--- known secret env files key names ---'
          for f in "$cfg/portal-secrets.env" "$cfg/portal.env" "$cfg/env" "$cfg/outreach.env"; do
            [ -f "$f" ] || continue
            echo "[$f]"
            sed -n 's/^\([A-Za-z_][A-Za-z0-9_]*\)=.*/\1/p' "$f" | grep -Ei 'gmail|google|oauth|token|mail|operator' || true
          done
          REMOTE

          for user in debian root; do
            for key in /tmp/h-a /tmp/h-b /tmp/h-c; do
              [ -f "$key" ] || continue
              if ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=6 "$user@40.160.137.41" 'sudo -n env HOME=/home/debian bash -s' < /tmp/locate-mail.sh; then
                echo "connected_as=$user"
                exit 0
              fi
            done
          done
          exit 1
