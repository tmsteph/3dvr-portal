name: One-shot GUN PR Ready

on:
  push:
    branches:
      - ops/gun-1427-ready-server
    paths:
      - ".github/workflows/ops-gun-1427-ready.yml"

permissions:
  contents: read
  statuses: write

jobs:
  mark-ready:
    name: Mark GUN PR 1427 ready via German worker
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      THREEDVR_AGENT_TASK_OWNER_ALIAS: ${{ vars.THREEDVR_AGENT_TASK_OWNER_ALIAS || '3dvr-managed' }}
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: apps/agent/package-lock.json

      - name: Install agent dependencies
        run: npm ci

      - name: Queue GitHub CLI action on German worker
        id: queue
        shell: bash
        run: |
          set -euo pipefail
          task='gh auth status && gh pr ready 1427 --repo amark/gun && gh pr view 1427 --repo amark/gun --json isDraft,state,url'
          result="$(node thomas-agent/node/agent-task-queue.js enqueue \
            --json \
            --backend shell \
            --risk workspace_write \
            --approval-status approved \
            --unsafe \
            --requires shell \
            --max-runtime-ms 120000 \
            "$task")"
          printf '%s\n' "$result"
          task_id="$(printf '%s' "$result" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const i=s.indexOf('{');if(i<0)throw new Error('task queue JSON payload missing');console.log(JSON.parse(s.slice(i)).id)})")"
          echo "task_id=$task_id" >> "$GITHUB_OUTPUT"

      - name: Wait for German worker receipt
        id: remote
        shell: bash
        run: |
          set -euo pipefail
          task_id='${{ steps.queue.outputs.task_id }}'
          for attempt in $(seq 1 36); do
            result="$(node thomas-agent/node/agent-task-queue.js status --id "$task_id" --json)"
            status="$(printf '%s' "$result" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const i=s.indexOf('{');if(i<0)throw new Error('task status JSON payload missing');console.log((JSON.parse(s.slice(i)).status||''))})")"
            echo "German worker status: $status"
            case "$status" in
              completed)
                echo "remote_status=completed" >> "$GITHUB_OUTPUT"
                printf '%s\n' "$result"
                exit 0
                ;;
              failed|skipped)
                echo "remote_status=$status" >> "$GITHUB_OUTPUT"
                printf '%s\n' "$result"
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "remote_status=timeout" >> "$GITHUB_OUTPUT"
          echo 'German worker did not return a completion receipt.' >&2
          exit 1

      - name: Publish bridge status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE_OUTCOME: ${{ steps.queue.outcome }}
          REMOTE_OUTCOME: ${{ steps.remote.outcome }}
          REMOTE_STATUS: ${{ steps.remote.outputs.remote_status }}
        shell: bash
        run: |
          state=failure
          description='German worker did not mark GUN PR ready'
          if [ "$QUEUE_OUTCOME" = success ] && [ "$REMOTE_OUTCOME" = success ] && [ "$REMOTE_STATUS" = completed ]; then
            state=success
            description='German worker marked GUN PR #1427 ready'
          elif [ "$QUEUE_OUTCOME" != success ]; then
            description='Could not enqueue German worker task'
          elif [ "$REMOTE_STATUS" = timeout ] || [ -z "$REMOTE_STATUS" ]; then
            description='German worker task timed out'
          else
            description="German worker task: ${REMOTE_STATUS:-failed}"
          fi
          curl -fsS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"$state\",\"context\":\"GUN PR Ready Bridge\",\"description\":\"$description\"}"
