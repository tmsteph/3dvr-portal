name: CRM quiet-followup patch

on:
  push:
    branches: [agent/crm-quiet-followup]
    paths: [.github/workflows/crm-quiet-followup-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/crm-quiet-followup
      - name: Apply bounded patch
        run: |
          python - <<'PY'
          from pathlib import Path
          crm = Path('apps/agent/thomas-agent/node/crm-sync.js')
          s = crm.read_text()
          old = "if (status === 'contacted') return 'Watch for a reply; follow up later with one concrete question.';"
          new = "if (status === 'contacted') return 'Wait for a reply; stay quiet unless there is a new material reason to reach out.';"
          assert old in s
          s = s.replace(old, new, 1)
          old = "  const nextFollowUp = status === 'contacted'\n    ? isoDate(addDays(new Date(lastContacted || now), 21))\n    : '';"
          new = "  const nextFollowUp = '';"
          assert old in s
          s = s.replace(old, new, 1)
          crm.write_text(s)

          test = Path('apps/agent/test/crm-sync.test.js')
          t = test.read_text()
          assert "assert.equal(record.nextFollowUp, '2026-06-17');" in t
          t = t.replace("assert.equal(record.nextFollowUp, '2026-06-17');", "assert.equal(record.nextFollowUp, '');", 1)
          assert "assert.match(record.nextBestAction, /Watch for a reply/);" in t
          t = t.replace("assert.match(record.nextBestAction, /Watch for a reply/);", "assert.match(record.nextBestAction, /Wait for a reply; stay quiet/);", 1)
          test.write_text(t)
          PY
          rm .github/workflows/crm-quiet-followup-patch.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add apps/agent/thomas-agent/node/crm-sync.js apps/agent/test/crm-sync.test.js .github/workflows/crm-quiet-followup-patch.yml
          git commit -m "fix(crm): stay quiet after unanswered outreach"
          git push origin HEAD:agent/crm-quiet-followup
