name: 3DVR Web Production Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vercel-web-production.yml'
      - 'ops/vercel-web-production-trigger.txt'

permissions:
  contents: read

concurrency:
  group: 3dvr-web-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_xxJGO7S7h1ZP4BHidYV0CX9Z
  VERCEL_PROJECT_ID: prj_zDwTJEFSq8X16qyXULAJLW4mCawr
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout 3dvr-web main
        uses: actions/checkout@v4
        with:
          repository: tmsteph/3dvr-web
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Detect direct Vercel credentials
        id: vercel-creds
        shell: bash
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy through authenticated Hetzner worker
        if: ${{ steps.vercel-creds.outputs.enabled != 'true' }}
        shell: bash
        env:
          SSH_A: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
          SSH_B: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_C: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          write_key() {
            local raw="$1" dest="$2"
            [ -n "$raw" ] || return 0
            printf '%s\n' "$raw" > "$dest.raw"
            if grep -q 'BEGIN .*PRIVATE KEY' "$dest.raw"; then
              cp "$dest.raw" "$dest"
            elif base64 -d "$dest.raw" > "$dest" 2>/dev/null && grep -q 'BEGIN .*PRIVATE KEY' "$dest"; then
              :
            else
              rm -f "$dest" "$dest.raw"
              return 0
            fi
            chmod 600 "$dest"
            rm -f "$dest.raw"
          }
          write_key "$SSH_A" /tmp/vercel-a
          write_key "$SSH_B" /tmp/vercel-b
          write_key "$SSH_C" /tmp/vercel-c

          connection=''
          for user in root debian ubuntu tmsteph; do
            for key in /tmp/vercel-a /tmp/vercel-b /tmp/vercel-c; do
              [ -f "$key" ] || continue
              if ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=6 "$user@167.233.174.20" \
                'if command -v vercel >/dev/null 2>&1; then vercel whoami >/dev/null 2>&1; else npx --yes vercel@latest whoami >/dev/null 2>&1; fi' >/dev/null 2>&1; then
                connection="$user|$key"
                break 2
              fi
            done
          done
          [ -n "$connection" ] || { echo "::error::No authenticated Hetzner Vercel worker available."; exit 1; }
          IFS='|' read -r user key <<< "$connection"

          ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new "$user@167.233.174.20" 'bash -s' <<'REMOTE'
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          git clone --quiet --depth=1 https://github.com/tmsteph/3dvr-web.git "$work/web"
          cd "$work/web"
          export VERCEL_ORG_ID="team_xxJGO7S7h1ZP4BHidYV0CX9Z"
          export VERCEL_PROJECT_ID="prj_zDwTJEFSq8X16qyXULAJLW4mCawr"
          if command -v vercel >/dev/null 2>&1; then
            vercel_cmd=(vercel)
          else
            vercel_cmd=(npx --yes vercel@latest)
          fi
          "${vercel_cmd[@]}" pull --yes --environment=production
          "${vercel_cmd[@]}" build --prod
          "${vercel_cmd[@]}" deploy --prebuilt --prod --yes
          REMOTE

          rm -f /tmp/vercel-a /tmp/vercel-b /tmp/vercel-c

      - name: Install Vercel CLI
        if: ${{ steps.vercel-creds.outputs.enabled == 'true' }}
        run: npm install --global vercel

      - name: Pull production environment
        if: ${{ steps.vercel-creds.outputs.enabled == 'true' }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production artifact
        if: ${{ steps.vercel-creds.outputs.enabled == 'true' }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production artifact
        if: ${{ steps.vercel-creds.outputs.enabled == 'true' }}
        run: vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"

      - name: Verify public site
        run: |
          curl --fail --silent --show-error --location --retry 8 --retry-delay 3 --retry-all-errors \
            'https://3dvr.tech/' --output /tmp/3dvr-home.html
          grep -qi '<html' /tmp/3dvr-home.html
          echo '3dvr.tech is responding after production deploy.'
