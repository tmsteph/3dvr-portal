name: Manual Workforce Reconcile

on:
  push:
    branches: [main]
    paths:
      - 'ops/control/workforce-reconcile-request.json'

permissions:
  contents: write

concurrency:
  group: workforce-reconcile
  cancel-in-progress: true

env:
  HETZNER_HOST: 167.233.174.20

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Hetzner SSH access
        id: ssh
        shell: bash
        env:
          SSH_A: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
          SSH_B: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_C: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          write_key() {
            local raw="$1" dest="$2"
            [ -n "$raw" ] || return 0
            printf '%s\n' "$raw" > "$dest.raw"
            if grep -q 'BEGIN .*PRIVATE KEY' "$dest.raw"; then
              cp "$dest.raw" "$dest"
            elif base64 -d "$dest.raw" > "$dest" 2>/dev/null && grep -q 'BEGIN .*PRIVATE KEY' "$dest"; then
              :
            else
              rm -f "$dest" "$dest.raw"
              return 0
            fi
            chmod 600 "$dest"
            rm -f "$dest.raw"
          }
          write_key "$SSH_A" /tmp/3dvr-a
          write_key "$SSH_B" /tmp/3dvr-b
          write_key "$SSH_C" /tmp/3dvr-c
          for user in root debian ubuntu tmsteph; do
            for key in /tmp/3dvr-a /tmp/3dvr-b /tmp/3dvr-c; do
              [ -f "$key" ] || continue
              if ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=6 "$user@$HETZNER_HOST" true >/dev/null 2>&1; then
                echo "user=$user" >> "$GITHUB_OUTPUT"
                echo "key=$key" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
          done
          echo 'No configured SSH key can reach Hetzner.' >&2
          exit 1

      - name: Probe Lighthouse and IATSE
        shell: bash
        env:
          HETZNER_USER: ${{ steps.ssh.outputs.user }}
          HETZNER_KEY: ${{ steps.ssh.outputs.key }}
        run: |
          set -euo pipefail
          opts=(-i "$HETZNER_KEY" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8)
          ssh "${opts[@]}" "$HETZNER_USER@$HETZNER_HOST" bash -s > /tmp/workforce-result.json <<'REMOTE'
          set -u
          ssh_opts=(-o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=8)
          ssh "${ssh_opts[@]}" 3dvr-ovh 'bash -s' <<'OVH'
          set -u
          cd /opt/3dvr-portal-production/current || exit 1

          run_capture() {
            label="$1"
            shift
            tmp="$(mktemp)"
            timeout 55s "$@" >"$tmp" 2>&1
            code=$?
            if [ "$code" -eq 0 ]; then
              jq -n --arg label "$label" --arg output "$(head -c 2400 "$tmp")"                 '{label:$label,status:"success",output:$output}'
            else
              jq -n --arg label "$label" --arg code "$code" --arg output "$(head -c 2400 "$tmp")"                 '{label:$label,status:"failed",exitCode:($code|tonumber),output:$output}'
            fi
            rm -f "$tmp"
            return 0
          }

          lh_login="$(run_capture lighthouse_login 3dvr-browser-login lighthouse)"
          ia_login="$(run_capture iatse_login 3dvr-browser-login iatse)"

          schedules='[]'
          for d in 2026-09-26 2026-10-03 2026-10-10 2026-10-17; do
            tmp="$(mktemp)"
            timeout 40s 3dvr-lighthouse-schedule "$d" >"$tmp" 2>&1
            code=$?
            out="$(cat "$tmp")"
            if [ "$code" -eq 0 ] && jq -e . >/dev/null 2>&1 <<<"$out"; then
              schedules="$(jq -c --arg d "$d" --argjson x "$out"                 '. + [{asOf:$d,status:"success",data:$x}]' <<<"$schedules")"
            else
              schedules="$(jq -c --arg d "$d" --arg code "$code" --arg raw "$(head -c 2400 "$tmp")"                 '. + [{asOf:$d,status:"failed",exitCode:($code|tonumber),output:$raw}]' <<<"$schedules")"
            fi
            rm -f "$tmp"
          done

          probe=/tmp/iatse-availability-probe.cjs
          curl -fsSL --retry 3 --retry-delay 1             https://raw.githubusercontent.com/tmsteph/3dvr-portal/main/scripts/ops/iatse-availability-probe.cjs             -o "$probe"

          token=""
          token="$(sudo -n /usr/local/bin/3dvr-browser-lease acquire general manual-workforce-probe 180 2>/dev/null || true)"
          if [ -n "$token" ]; then
            iatse="$(timeout 35s node "$probe" 2>&1 || true)"
            sudo -n /usr/local/bin/3dvr-browser-lease release general "$token" >/dev/null 2>&1 || true
          else
            iatse='{"ok":false,"error":"general-lane-busy"}'
          fi
          if ! jq -e . >/dev/null 2>&1 <<<"$iatse"; then
            iatse="$(jq -n --arg raw "$(printf '%s' "$iatse" | head -c 2400)"               '{ok:false,error:"iatse-probe-invalid-json",output:$raw}')"
          fi

          jq -n             --arg checkedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)"             --argjson lighthouseLogin "$lh_login"             --argjson iatseLogin "$ia_login"             --argjson schedules "$schedules"             --argjson iatse "$iatse"             '{ok:true,checkedAt:$checkedAt,lighthouseLogin:$lighthouseLogin,iatseLogin:$iatseLogin,schedules:$schedules,iatse:$iatse}'
          OVH
          REMOTE
          jq -e . /tmp/workforce-result.json >/dev/null

      - name: Persist sanitized result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -s /tmp/workforce-result.json ] && jq -e . /tmp/workforce-result.json >/dev/null 2>&1; then
            cp /tmp/workforce-result.json /tmp/result.json
          else
            printf '%s\n' '{"ok":false,"error":"workforce probe failed before a sanitized result was produced"}' > /tmp/result.json
          fi
          content="$(base64 -w0 /tmp/result.json)"
          url="https://api.github.com/repos/$GITHUB_REPOSITORY/contents/ops/control/workforce-reconcile-result.json"
          sha="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$url" 2>/dev/null | jq -r '.sha // empty' || true)"
          jq -n --arg message "Record manual workforce reconciliation result" --arg content "$content" --arg sha "$sha"             '{message:$message,content:$content,branch:"main"} + (if $sha=="" then {} else {sha:$sha} end)' > /tmp/payload.json
          curl -fsS -X PUT -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2022-11-28' "$url" --data-binary @/tmp/payload.json >/dev/null

      - name: Remove SSH keys
        if: always()
        run: rm -f /tmp/3dvr-a /tmp/3dvr-b /tmp/3dvr-c /tmp/3dvr-*.raw
