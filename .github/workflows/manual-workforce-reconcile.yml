name: Manual Workforce Reconcile

on:
  push:
    branches: [main]
    paths:
      - 'ops/control/workforce-reconcile-request.json'

permissions:
  contents: write

concurrency:
  group: workforce-reconcile
  cancel-in-progress: true

env:
  HETZNER_HOST: 167.233.174.20

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Hetzner SSH access
        id: ssh
        shell: bash
        env:
          SSH_A: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
          SSH_B: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_C: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          write_key() {
            local raw="$1" dest="$2"
            [ -n "$raw" ] || return 0
            printf '%s\n' "$raw" > "$dest.raw"
            if grep -q 'BEGIN .*PRIVATE KEY' "$dest.raw"; then
              cp "$dest.raw" "$dest"
            elif base64 -d "$dest.raw" > "$dest" 2>/dev/null && grep -q 'BEGIN .*PRIVATE KEY' "$dest"; then
              :
            else
              rm -f "$dest" "$dest.raw"; return 0
            fi
            chmod 600 "$dest"; rm -f "$dest.raw"
          }
          write_key "$SSH_A" /tmp/3dvr-a
          write_key "$SSH_B" /tmp/3dvr-b
          write_key "$SSH_C" /tmp/3dvr-c
          for user in root debian ubuntu tmsteph; do
            for key in /tmp/3dvr-a /tmp/3dvr-b /tmp/3dvr-c; do
              [ -f "$key" ] || continue
              if ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=6 "$user@$HETZNER_HOST" true >/dev/null 2>&1; then
                echo "user=$user" >> "$GITHUB_OUTPUT"
                echo "key=$key" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
          done
          echo 'No configured SSH key can reach Hetzner.' >&2
          exit 1

      - name: Probe Lighthouse and IATSE
        shell: bash
        env:
          HETZNER_USER: ${{ steps.ssh.outputs.user }}
          HETZNER_KEY: ${{ steps.ssh.outputs.key }}
        run: |
          set -euo pipefail
          opts=(-i "$HETZNER_KEY" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8)
          ssh "${opts[@]}" "$HETZNER_USER@$HETZNER_HOST" bash -s > /tmp/workforce-result.json <<'REMOTE'
          set -u
          ssh_opts=(-o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=8)
          ssh "${ssh_opts[@]}" 3dvr-ovh 'bash -s' <<'OVH'
          set -u
          cd /opt/3dvr-portal-production/current || exit 1

          safe_run() {
            local label="$1"; shift
            local tmp
            tmp="$(mktemp)"
            if timeout 55s "$@" >"$tmp" 2>&1; then
              jq -n --arg label "$label" --arg status success --arg output "$(head -c 2500 "$tmp")" '{label:$label,status:$status,output:$output}'
            else
              code=$?
              jq -n --arg label "$label" --arg status failed --arg code "$code" --arg output "$(head -c 2500 "$tmp")" '{label:$label,status:$status,exitCode:($code|tonumber),output:$output}'
            fi
            rm -f "$tmp"
          }

          lh_login="$(safe_run lighthouse_login 3dvr-browser-login lighthouse)"
          ia_login="$(safe_run iatse_login 3dvr-browser-login iatse)"

          schedules='[]'
          for d in 2026-09-26 2026-10-03 2026-10-10 2026-10-17; do
            tmp="$(mktemp)"
            if timeout 35s 3dvr-lighthouse-schedule "$d" >"$tmp" 2>&1; then
              out="$(cat "$tmp")"
              if jq -e . >/dev/null 2>&1 <<<"$out"; then
                schedules="$(jq -c --arg d "$d" --argjson x "$out" '. + [{asOf:$d,status:"success",data:$x}]' <<<"$schedules")"
              else
                schedules="$(jq -c --arg d "$d" --arg raw "$(head -c 2500 "$tmp")" '. + [{asOf:$d,status:"invalid_json",output:$raw}]' <<<"$schedules")"
              fi
            else
              code=$?
              schedules="$(jq -c --arg d "$d" --arg code "$code" --arg raw "$(head -c 2500 "$tmp")" '. + [{asOf:$d,status:"failed",exitCode:($code|tonumber),output:$raw}]' <<<"$schedules")"
            fi
            rm -f "$tmp"
          done

          targets="$(curl -fsS --max-time 5 http://127.0.0.1:9222/json/list 2>/dev/null || printf '[]')"
          ws="$(jq -r '[.[] | select(.type=="page" and (.url|test("member\\.iatse\\.io")))][0].webSocketDebuggerUrl // empty' <<<"$targets" 2>/dev/null || true)"
          iatse='{"status":"target_missing"}'
          if [ -n "$ws" ]; then
            iatse="$(WS_URL="$ws" timeout 25s node - <<'NODE' 2>/dev/null || true
const url = process.env.WS_URL;
let ws, nextId = 1;
const pending = new Map();
function call(method, params={}) {
  return new Promise((resolve,reject)=>{
    const id=nextId++;
    const timer=setTimeout(()=>{pending.delete(id);reject(new Error('cdp-timeout'))},8000);
    pending.set(id,msg=>{clearTimeout(timer);resolve(msg)});
    ws.send(JSON.stringify({id,method,params}));
  });
}
(async()=>{
  ws=new WebSocket(url);
  await new Promise((resolve,reject)=>{
    const timer=setTimeout(()=>reject(new Error('ws-timeout')),8000);
    ws.onopen=()=>{clearTimeout(timer);resolve()};
    ws.onerror=e=>{clearTimeout(timer);reject(e)};
  });
  ws.onmessage=event=>{
    let msg; try{msg=JSON.parse(String(event.data||''))}catch{return}
    const done=pending.get(msg.id); if(done){pending.delete(msg.id);done(msg)}
  };
  const expression = `(() => {
    const clean = s => (s || '').replace(/\\s+/g,' ').trim();
    const body = clean(document.body?.innerText || '').slice(0,24000);
    const controls = [...document.querySelectorAll('button,a,input,select,option,[role="button"],[role="checkbox"],[role="radio"],[role="combobox"]')]
      .map((el,i)=>({
        i,
        tag:el.tagName,
        type:el.getAttribute('type')||'',
        role:el.getAttribute('role')||'',
        text:clean(el.innerText||el.textContent||el.value||el.getAttribute('aria-label')||'').slice(0,260),
        name:el.getAttribute('name')||'',
        id:el.id||'',
        cls:String(el.className||'').slice(0,260),
        value:el.value||el.getAttribute('value')||'',
        checked:!!el.checked,
        disabled:!!el.disabled,
        href:el.href||'',
        title:el.getAttribute('title')||'',
        aria:el.getAttribute('aria-label')||'',
        parent:clean(el.parentElement?.innerText||'').slice(0,400)
      }))
      .filter(x=>x.text||x.name||x.id||x.value||x.href||x.title||x.aria);
    return {status:'success',url:location.href,title:document.title,body,controls:controls.slice(0,700)};
  })()`;
  const msg=await call('Runtime.evaluate',{expression,returnByValue:true,awaitPromise:true});
  if(msg.result?.exceptionDetails) throw new Error('browser-evaluation-failed');
  process.stdout.write(JSON.stringify(msg.result?.result?.value || {status:'empty'}));
  try{ws.close()}catch{}
})().catch(e=>process.stdout.write(JSON.stringify({status:'failed',error:String(e.message||e)})));
NODE
)"
            if ! jq -e . >/dev/null 2>&1 <<<"$iatse"; then
              iatse="$(jq -n --arg raw "$(printf '%s' "$iatse" | head -c 2500)" '{status:"invalid_json",output:$raw}')"
            fi
          fi

          jq -n             --arg checkedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)"             --argjson lighthouseLogin "$lh_login"             --argjson iatseLogin "$ia_login"             --argjson schedules "$schedules"             --argjson iatse "$iatse"             '{ok:true,checkedAt:$checkedAt,lighthouseLogin:$lighthouseLogin,iatseLogin:$iatseLogin,schedules:$schedules,iatse:$iatse}'
          OVH
          REMOTE
          jq -e . /tmp/workforce-result.json >/dev/null

      - name: Persist sanitized result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -s /tmp/workforce-result.json ] && jq -e . /tmp/workforce-result.json >/dev/null 2>&1; then
            cp /tmp/workforce-result.json /tmp/result.json
          else
            printf '%s\n' '{"ok":false,"error":"workforce probe failed before a sanitized result was produced"}' > /tmp/result.json
          fi
          content="$(base64 -w0 /tmp/result.json)"
          url="https://api.github.com/repos/$GITHUB_REPOSITORY/contents/ops/control/workforce-reconcile-result.json"
          sha="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$url" 2>/dev/null | jq -r '.sha // empty' || true)"
          jq -n --arg message "Record manual workforce reconciliation result" --arg content "$content" --arg sha "$sha"             '{message:$message,content:$content,branch:"main"} + (if $sha=="" then {} else {sha:$sha} end)' > /tmp/payload.json
          curl -fsS -X PUT -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$url" --data-binary @/tmp/payload.json >/dev/null

      - name: Remove SSH keys
        if: always()
        run: rm -f /tmp/3dvr-a /tmp/3dvr-b /tmp/3dvr-c /tmp/3dvr-*.raw
