name: Manual Workforce Reconcile

on:
  push:
    branches: [main]
    paths:
      - 'ops/control/workforce-reconcile-request.json'

permissions:
  contents: write

concurrency:
  group: workforce-reconcile
  cancel-in-progress: true

env:
  HETZNER_HOST: 167.233.174.20

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Hetzner SSH access
        id: ssh
        shell: bash
        env:
          SSH_A: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$SSH_A" > /tmp/3dvr-a.raw
          if grep -q 'BEGIN .*PRIVATE KEY' /tmp/3dvr-a.raw; then
            cp /tmp/3dvr-a.raw /tmp/3dvr-a
          else
            base64 -d /tmp/3dvr-a.raw > /tmp/3dvr-a
          fi
          chmod 600 /tmp/3dvr-a
          rm -f /tmp/3dvr-a.raw
          for user in root debian ubuntu tmsteph; do
            if ssh -i /tmp/3dvr-a -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=6 "$user@$HETZNER_HOST" true >/dev/null 2>&1; then
              echo "user=$user" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          exit 1

      - name: Read Lighthouse My Schedule
        shell: bash
        env:
          HETZNER_USER: ${{ steps.ssh.outputs.user }}
        run: |
          set -euo pipefail
          opts=(-i /tmp/3dvr-a -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8)
          ssh "${opts[@]}" "$HETZNER_USER@$HETZNER_HOST" bash -s > /tmp/workforce-result.json <<'REMOTE'
          set -u
          ssh_opts=(-o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=8)
          ssh "${ssh_opts[@]}" 3dvr-ovh 'bash -s' <<'OVH'
          set -u
          schedules='[]'
          for d in 2026-09-21 2026-09-28 2026-10-05 2026-10-12 2026-10-19 2026-10-26; do
            tmp="$(mktemp)"
            timeout 40s 3dvr-lighthouse-schedule "$d" >"$tmp" 2>&1
            code=$?
            out="$(cat "$tmp")"
            if [ "$code" -eq 0 ] && jq -e . >/dev/null 2>&1 <<<"$out"; then
              schedules="$(jq -c --arg d "$d" --argjson x "$out"                 '. + [{asOf:$d,status:"success",data:$x}]' <<<"$schedules")"
            else
              schedules="$(jq -c --arg d "$d" --arg code "$code" --arg raw "$(head -c 2500 "$tmp")"                 '. + [{asOf:$d,status:"failed",exitCode:($code|tonumber),output:$raw}]' <<<"$schedules")"
            fi
            rm -f "$tmp"
          done
          jq -n --arg checkedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson schedules "$schedules"             '{ok:true,checkedAt:$checkedAt,schedules:$schedules}'
          OVH
          REMOTE
          jq -e . /tmp/workforce-result.json >/dev/null

      - name: Persist sanitized result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -s /tmp/workforce-result.json ] && jq -e . /tmp/workforce-result.json >/dev/null 2>&1; then
            cp /tmp/workforce-result.json /tmp/result.json
          else
            printf '%s\n' '{"ok":false,"error":"Lighthouse schedule read failed"}' > /tmp/result.json
          fi
          url="https://api.github.com/repos/$GITHUB_REPOSITORY/contents/ops/control/workforce-reconcile-result.json"
          sha="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$url" 2>/dev/null | jq -r '.sha // empty' || true)"
          RESULT_SHA="$sha" python3 - <<'PY' > /tmp/payload.json
          import base64, json, os
          content = base64.b64encode(open('/tmp/result.json','rb').read()).decode()
          payload = {"message":"Record Lighthouse schedule read","content":content,"branch":"main"}
          sha = os.environ.get("RESULT_SHA","").strip()
          if sha:
              payload["sha"] = sha
          print(json.dumps(payload))
          PY
          curl -fsS -X PUT -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2022-11-28' "$url" --data-binary @/tmp/payload.json >/dev/null

      - name: Remove SSH key
        if: always()
        run: rm -f /tmp/3dvr-a /tmp/3dvr-a.raw
