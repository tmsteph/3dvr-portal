name: Manual Workforce Reconcile

on:
  push:
    branches: [main]
    paths:
      - 'ops/control/workforce-reconcile-request.json'

permissions:
  contents: write

concurrency:
  group: workforce-reconcile
  cancel-in-progress: true

env:
  HETZNER_HOST: 167.233.174.20

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Hetzner SSH access
        id: ssh
        shell: bash
        env:
          SSH_A: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
          SSH_B: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_C: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          write_key() {
            local raw="$1" dest="$2"
            [ -n "$raw" ] || return 0
            printf '%s\n' "$raw" > "$dest.raw"
            if grep -q 'BEGIN .*PRIVATE KEY' "$dest.raw"; then
              cp "$dest.raw" "$dest"
            elif base64 -d "$dest.raw" > "$dest" 2>/dev/null && grep -q 'BEGIN .*PRIVATE KEY' "$dest"; then
              :
            else
              rm -f "$dest" "$dest.raw"; return 0
            fi
            chmod 600 "$dest"; rm -f "$dest.raw"
          }
          write_key "$SSH_A" /tmp/3dvr-a
          write_key "$SSH_B" /tmp/3dvr-b
          write_key "$SSH_C" /tmp/3dvr-c
          for user in root debian ubuntu tmsteph; do
            for key in /tmp/3dvr-a /tmp/3dvr-b /tmp/3dvr-c; do
              [ -f "$key" ] || continue
              if ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=6 "$user@$HETZNER_HOST" true >/dev/null 2>&1; then
                echo "user=$user" >> "$GITHUB_OUTPUT"
                echo "key=$key" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
          done
          exit 1

      - name: Recover SharePoint and test Lighthouse
        shell: bash
        env:
          HETZNER_USER: ${{ steps.ssh.outputs.user }}
          HETZNER_KEY: ${{ steps.ssh.outputs.key }}
        run: |
          set -euo pipefail
          opts=(-i "$HETZNER_KEY" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8)
          ssh "${opts[@]}" "$HETZNER_USER@$HETZNER_HOST" bash -s > /tmp/workforce-result.json <<'REMOTE'
          set -u
          ssh_opts=(-o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=8)
          ssh "${ssh_opts[@]}" 3dvr-ovh 'bash -s' <<'OVH'
          set -u
          probe=/tmp/browser-url-probe.cjs
          curl -fsSL --retry 3 --retry-delay 1             https://raw.githubusercontent.com/tmsteph/3dvr-portal/main/scripts/ops/browser-url-probe.cjs             -o "$probe"

          token="$(sudo -n /usr/local/bin/3dvr-browser-lease acquire general manual-sharepoint-recover 180 2>/dev/null || true)"
          if [ -n "$token" ]; then
            sharepoint="$(timeout 35s node "$probe" https://psav.sharepoint.com/ 2>&1 || true)"
            sudo -n /usr/local/bin/3dvr-browser-lease release general "$token" >/dev/null 2>&1 || true
          else
            sharepoint='{"ok":false,"error":"general-lane-busy"}'
          fi
          if ! jq -e . >/dev/null 2>&1 <<<"$sharepoint"; then
            sharepoint="$(jq -n --arg raw "$(printf '%s' "$sharepoint" | head -c 5000)"               '{ok:false,error:"sharepoint-probe-invalid-json",output:$raw}')"
          fi

          tmp="$(mktemp)"
          timeout 55s 3dvr-browser-login lighthouse >"$tmp" 2>&1
          code=$?
          lighthouse_login="$(jq -n --arg code "$code" --arg output "$(head -c 3500 "$tmp")"             '{exitCode:($code|tonumber),output:$output}')"
          rm -f "$tmp"

          tmp="$(mktemp)"
          timeout 40s 3dvr-lighthouse-schedule 2026-09-26 >"$tmp" 2>&1
          code=$?
          out="$(cat "$tmp")"
          if [ "$code" -eq 0 ] && jq -e . >/dev/null 2>&1 <<<"$out"; then
            schedule="$(jq -n --argjson data "$out" '{status:"success",data:$data}')"
          else
            schedule="$(jq -n --arg code "$code" --arg output "$(head -c 3500 "$tmp")"               '{status:"failed",exitCode:($code|tonumber),output:$output}')"
          fi
          rm -f "$tmp"

          jq -n             --arg checkedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)"             --argjson sharepoint "$sharepoint"             --argjson lighthouseLogin "$lighthouse_login"             --argjson schedule "$schedule"             '{ok:true,checkedAt:$checkedAt,sharepoint:$sharepoint,lighthouseLogin:$lighthouseLogin,schedule:$schedule}'
          OVH
          REMOTE
          jq -e . /tmp/workforce-result.json >/dev/null

      - name: Persist sanitized result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -s /tmp/workforce-result.json ] && jq -e . /tmp/workforce-result.json >/dev/null 2>&1; then
            cp /tmp/workforce-result.json /tmp/result.json
          else
            printf '%s\n' '{"ok":false,"error":"workforce recovery failed"}' > /tmp/result.json
          fi
          url="https://api.github.com/repos/$GITHUB_REPOSITORY/contents/ops/control/workforce-reconcile-result.json"
          sha="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$url" 2>/dev/null | jq -r '.sha // empty' || true)"
          RESULT_SHA="$sha" python3 - <<'PY' > /tmp/payload.json
          import base64, json, os
          content = base64.b64encode(open('/tmp/result.json','rb').read()).decode()
          payload = {"message":"Record workforce recovery result","content":content,"branch":"main"}
          sha = os.environ.get("RESULT_SHA","").strip()
          if sha:
              payload["sha"] = sha
          print(json.dumps(payload))
          PY
          curl -fsS -X PUT -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2022-11-28' "$url" --data-binary @/tmp/payload.json >/dev/null

      - name: Remove SSH keys
        if: always()
        run: rm -f /tmp/3dvr-a /tmp/3dvr-b /tmp/3dvr-c /tmp/3dvr-*.raw
