name: LicheePi fw_setenv Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/licheepi-fwsetenv-diagnostic.yml'
      - 'scripts/ops/licheepi-fwsetenv-diagnostic.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Inspect fw_setenv capabilities without writes
        env:
          SSH_A: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
          SSH_B: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_C: ${{ secrets.SSH_PRIVATE_KEY }}
          OVH_HOST: 40.160.137.41
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/ops/licheepi-fwsetenv-diagnostic.sh
