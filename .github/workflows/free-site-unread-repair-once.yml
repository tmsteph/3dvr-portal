name: Free Site Unread Repair Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/free-site-unread-repair-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      THREEDVR_FREE_SITE_MAX_PER_RUN: '3'
      THREEDVR_FREE_SITE_LOOKBACK_HOURS: '24'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Patch stale-unread handling
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('apps/agent/thomas-agent/node/free-site-worker.js')
          s = p.read_text()
          old1 = "  if (existingState?.status === 'processed' || existingState?.status === 'existing') return { skipped: true };"
          new1 = """  if (existingState?.status === 'processed') return { skipped: true };\n  if (existingState?.status === 'existing') {\n    await markSeen(mailAuth, request.uid);\n    return { skipped: true, existing: true, siteUrl: existingState.siteUrl };\n  }"""
          old2 = "    if (state.messages[key]?.status === 'processed' || state.messages[key]?.status === 'existing') continue;"
          new2 = "    if (state.messages[key]?.status === 'processed') continue;"
          if old1 not in s or old2 not in s:
              raise SystemExit('Expected worker snippets not found; refusing broad edit')
          s = s.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(s)
          PY
          node --check apps/agent/thomas-agent/node/free-site-worker.js

      - name: Persist scoped worker fix and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name '3DVR Reliability Repair'
          git config user.email '3dvr.tech@gmail.com'
          git rm .github/workflows/free-site-unread-repair-once.yml
          git add -- apps/agent/thomas-agent/node/free-site-worker.js
          git commit -m 'fix: mark existing free-site requests seen'
          git push origin HEAD:main

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: apps/agent/package-lock.json

      - name: Install agent dependencies
        run: npm --prefix apps/agent ci

      - name: Recover canonical mailbox once with patched worker
        run: node apps/agent/thomas-agent/node/free-site-worker.js
