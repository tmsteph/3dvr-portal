name: LicheePi OVH Hetzner Jump Alias

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/licheepi-ovh-hetzner-alias.yml'
      - 'scripts/ops/configure-licheepi-ovh-hetzner-alias-remote.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure and verify OVH jump alias
        shell: bash
        env:
          SSH_A: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
          SSH_B: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_C: ${{ secrets.SSH_PRIVATE_KEY }}
          OVH_HOST: 40.160.137.41
        run: |
          set -euo pipefail

          write_key() {
            raw="$1"
            dest="$2"
            [ -n "$raw" ] || return 0
            printf '%s\n' "$raw" > "$dest.raw"
            if grep -q 'BEGIN .*PRIVATE KEY' "$dest.raw"; then
              cp "$dest.raw" "$dest"
            elif base64 -d "$dest.raw" > "$dest" 2>/dev/null && grep -q 'BEGIN .*PRIVATE KEY' "$dest"; then
              :
            else
              rm -f "$dest" "$dest.raw"
              return 0
            fi
            chmod 600 "$dest"
            rm -f "$dest.raw"
          }

          write_key "$SSH_A" /tmp/a
          write_key "$SSH_B" /tmp/b
          write_key "$SSH_C" /tmp/c

          user=''
          key=''
          for candidate_user in debian root; do
            for candidate_key in /tmp/a /tmp/b /tmp/c; do
              [ -f "$candidate_key" ] || continue
              if ssh -i "$candidate_key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=6 "$candidate_user@$OVH_HOST" true >/dev/null 2>&1; then
                user="$candidate_user"
                key="$candidate_key"
                break 2
              fi
            done
          done

          test -n "$user"
          ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new "$user@$OVH_HOST" 'bash -s' < scripts/ops/configure-licheepi-ovh-hetzner-alias-remote.sh

# Used for LicheePi recovery coverage through the OVH -> Hetzner path.
