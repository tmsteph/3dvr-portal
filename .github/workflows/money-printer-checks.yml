name: Money Printer Checks

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'money-printer/**'
      - 'src/money-printer/**'
      - 'scripts/money-printer-*.mjs'
      - 'ops/systemd/money-printer-*'
      - 'tests/money-printer-*.test.js'
      - 'docs/*money-printer*'
      - 'docs/autonomous-business-learning-loop.md'
      - '.github/workflows/money-printer-checks.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'money-printer/**'
      - 'src/money-printer/**'
      - 'scripts/money-printer-*.mjs'
      - 'ops/systemd/money-printer-*'
      - 'tests/money-printer-*.test.js'
      - 'docs/*money-printer*'
      - 'docs/autonomous-business-learning-loop.md'
      - '.github/workflows/money-printer-checks.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Money Printer regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run browser-free Money Printer regression tests
        run: >-
          find tests -maxdepth 1 -type f -name 'money-printer-*.test.js'
          ! -name '*.e2e.test.js' -print0
          | sort -z
          | xargs -0 -r node --test
