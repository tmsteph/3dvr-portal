name: 3DVR Control Bus

on:
  push:
    branches: [main]
    paths:
      - 'ops/control/request.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 3dvr-control-bus
  cancel-in-progress: true

env:
  HETZNER_HOST: 167.233.174.20

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Validate request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          test -s ops/control/request.json
          id="$(jq -r '.id // empty' ops/control/request.json)"
          action="$(jq -r '.action // empty' ops/control/request.json)"
          service="$(jq -r '.service // empty' ops/control/request.json)"
          test -n "$id"
          case "$action" in
            status|termux_status|openbao_status|portal_backend_status|portal_key_status|portal_env_status|portal_promote_secrets|portal_ai_status|portal_points_status|portal_points_reconcile|browser_lane_status|openai_admin_status|openai_admin_handoff|openai_admin_stage|openai_admin_store_clipboard|campaigns_acceptance|campaigns_user_acceptance|campaigns_gmail_handoff|ukg_login|ukg_timeoff_status) ;;
            restart)
              case "$service" in
                3dvr-personal-mcp.service|3dvr-secrets-broker.service|3dvr-self-host-portal.service|3dvr-portal.service|openbao.service) ;;
                *) echo 'service is not allowlisted' >&2; exit 64 ;;
              esac
              ;;
            *) echo 'action is not allowlisted' >&2; exit 64 ;;
          esac
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "service=$service" >> "$GITHUB_OUTPUT"

      - name: Resolve Hetzner SSH access
        id: ssh
        shell: bash
        env:
          SSH_A: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
          SSH_B: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_C: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          write_key() {
            local raw="$1" dest="$2"
            [ -n "$raw" ] || return 0
            printf '%s\n' "$raw" > "$dest.raw"
            if grep -q 'BEGIN .*PRIVATE KEY' "$dest.raw"; then
              cp "$dest.raw" "$dest"
            elif base64 -d "$dest.raw" > "$dest" 2>/dev/null && grep -q 'BEGIN .*PRIVATE KEY' "$dest"; then
              :
            else
              rm -f "$dest" "$dest.raw"
              return 0
            fi
            chmod 600 "$dest"
            rm -f "$dest.raw"
          }
          write_key "$SSH_A" /tmp/3dvr-control-a
          write_key "$SSH_B" /tmp/3dvr-control-b
          write_key "$SSH_C" /tmp/3dvr-control-c
          for user in root debian ubuntu tmsteph; do
            for key in /tmp/3dvr-control-a /tmp/3dvr-control-b /tmp/3dvr-control-c; do
              [ -f "$key" ] || continue
              if ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=6 "$user@$HETZNER_HOST" true >/dev/null 2>&1; then
                echo "user=$user" >> "$GITHUB_OUTPUT"
                echo "key=$key" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
          done
          echo 'No configured SSH key can reach Hetzner.' >&2
          exit 1

      - name: Execute bounded control request
        id: execute
        shell: bash
        env:
          HETZNER_USER: ${{ steps.ssh.outputs.user }}
          HETZNER_KEY: ${{ steps.ssh.outputs.key }}
          ACTION: ${{ steps.request.outputs.action }}
          SERVICE: ${{ steps.request.outputs.service }}
        run: |
          set -euo pipefail
          opts=(-i "$HETZNER_KEY" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8)
          ssh "${opts[@]}" "$HETZNER_USER@$HETZNER_HOST" bash -s -- "$ACTION" "$SERVICE" > /tmp/control-result.json <<'REMOTE'
          set -euo pipefail
          action=${1:-}
          service=${2:-}
          ssh_opts=(-o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=8)
          ovh() { ssh "${ssh_opts[@]}" 3dvr-ovh "$@"; }
          case "$action" in
            browser_lane_status)
              ovh 'bash -s' <<'OVH'
          set -euo pipefail
          leases="$(sudo -n /usr/local/bin/3dvr-browser-lease status 2>/dev/null || true)"
          mem_available_mb="$(awk '/^MemAvailable:/ {printf "%d", $2/1024}' /proc/meminfo)"
          load1="$(awk '{print $1}' /proc/loadavg)"
          cpus="$(nproc)"
          rows='[]'
          for lane in general identity encore messaging training; do
            unit="3dvr-browser-lane@${lane}.service"
            state="$(systemctl is-active "$unit" 2>/dev/null || true)"
            memory="$(systemctl show "$unit" -p MemoryCurrent --value 2>/dev/null || true)"
            [ -n "$memory" ] || memory=0
            lease="$(printf '%s\n' "$leases" | grep -m1 "^lane=${lane} " || true)"
            rows="$(jq -c --arg lane "$lane" --arg state "$state" --arg memory "$memory" --arg lease "$lease" \
              '. + [{lane:$lane,state:$state,memoryBytes:($memory|tonumber? // 0),lease:$lease}]' <<<"$rows")"
          done
          jq -n --argjson lanes "$rows" --arg mem "$mem_available_mb" --arg load "$load1" --arg cpus "$cpus" \
            '{ok:true,lanes:$lanes,host:{memAvailableMb:($mem|tonumber),load1:($load|tonumber),cpus:($cpus|tonumber)}}'
          OVH
              ;;
            status)
              ovh 'bash -s' <<'OVH'
          set -euo pipefail
          openbao=$(curl -fsS http://127.0.0.1:8200/v1/sys/seal-status | jq -c '{initialized,sealed,storage_type}')
          broker=$(curl -fsS --unix-socket /run/3dvr-secrets-broker/broker.sock http://localhost/health)
          termux=false
          ss -ltnH | awk '$4 ~ /^(127\.0\.0\.1|\[::1\]):22[0-9][0-9][0-9]$/ {found=1} END {exit !found}' && termux=true || true
          jq -n --arg host "$(hostname)" --argjson openbao "$openbao" --argjson broker "$broker" --argjson termux "$termux" '{ok:true,host:$host,openbao:$openbao,broker:$broker,termuxReverseSsh:$termux}'
          OVH
              ;;
            browser_lanes_status)
              ovh 'bash -s' <<'OVH'
          set -euo pipefail
          lease_status="$(sudo -n /usr/local/bin/3dvr-browser-lease status)"
          mem_total_mb=$(( $(awk '/^MemTotal:/ {print $2}' /proc/meminfo) / 1024 ))
          mem_available_mb=$(( $(awk '/^MemAvailable:/ {print $2}' /proc/meminfo) / 1024 ))
          load1="$(awk '{print $1}' /proc/loadavg)"
          cpus="$(nproc)"
          active_csv=""
          for lane in general identity encore messaging training; do
            if systemctl is-active --quiet "3dvr-browser-lane@${lane}.service"; then
              active_csv="${active_csv:+$active_csv,}$lane"
            fi
          done
          jq -n \
            --arg leases "$lease_status" \
            --argjson memTotal "$mem_total_mb" \
            --argjson memAvailable "$mem_available_mb" \
            --arg load1 "$load1" \
            --argjson cpus "$cpus" \
            --arg active "$active_csv" \
            '{
              ok:true,
              leases:($leases|split("\n")|map(select(length>0))),
              memory:{totalMB:$memTotal,availableMB:$memAvailable},
              load1:($load1|tonumber),
              cpus:$cpus,
              activeBrowsers:($active|split(",")|map(select(length>0)))
            }'
          OVH
              ;;
            ukg_login)
              ovh 'bash -s' <<'OVH'
          set -euo pipefail
          token=""
          cleanup() {
            [ -n "$token" ] && sudo -n /usr/local/bin/3dvr-browser-lease release encore "$token" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT INT TERM

          token="$(sudo -n /usr/local/bin/3dvr-browser-lease acquire encore control-bus-ukg-login 300)"
          if ! systemctl is-active --quiet 3dvr-browser-lane@encore.service; then
            sudo -n systemctl start 3dvr-browser-lane@encore.service
          fi
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:9333/json/version >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:9333/json/version >/dev/null

          body="$(curl -sS --unix-socket /run/3dvr-secrets-broker/broker.sock             -H 'content-type: application/json'             -X POST             --data '{"site":"ukg"}'             http://localhost/v1/browser-login)"
          jq -e . <<<"$body" >/dev/null
          jq -c '. + {browserLane:"encore"}' <<<"$body"
          OVH
              ;;
            ukg_timeoff_status)
              ovh 'bash -s' <<'OVH'
          set -euo pipefail
          token=""
          cleanup() {
            [ -n "$token" ] && sudo -n /usr/local/bin/3dvr-browser-lease release encore "$token" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT INT TERM

          token="$(sudo -n /usr/local/bin/3dvr-browser-lease acquire encore control-bus-ukg-timeoff-status 300)"
          puppeteer_core="$(find /home/debian/.npm/_npx -type f -path '*/puppeteer-core/lib/puppeteer/puppeteer-core.js' -print -quit 2>/dev/null || true)"
          [ -n "$puppeteer_core" ] && [ -f "$puppeteer_core" ]

          PUPPETEER_CORE_PATH="$puppeteer_core" node - <<'NODE'
          const puppeteer=require(process.env.PUPPETEER_CORE_PATH);
          const dateRe=/(10\/0?1\/2026|10\/0?1\/26|Oct(?:ober)?\s+1,?\s+2026|2026-10-01)/i;
          const statusRe=/(approved|pending|denied|rejected|cancelled|canceled|submitted|unpaid|vacation|time off|request)/i;
          const navRe=/(time\s*off|vacation|leave|pto|request|myself|time\s*management)/i;

          async function snapshot(frame){
            try{
              return await frame.evaluate(({dateSource,statusSource,navSource})=>{
                const dateRe=new RegExp(dateSource,'i');
                const statusRe=new RegExp(statusSource,'i');
                const navRe=new RegExp(navSource,'i');
                const text=(document.body?.innerText||'').replace(/\r/g,'');
                const lines=text.split(/\n+/).map(x=>x.trim()).filter(Boolean);
                const dated=[];
                for(let i=0;i<lines.length;i++){
                  if(dateRe.test(lines[i])){
                    dated.push(lines.slice(Math.max(0,i-4),Math.min(lines.length,i+8)).join(' | ').slice(0,1800));
                  }
                }
                const relevant=lines.filter(x=>statusRe.test(x)).slice(0,120);
                const controls=[...document.querySelectorAll('a,button,input[type="button"],input[type="submit"]')].map((el,i)=>({
                  i,
                  tag:el.tagName,
                  text:(el.innerText||el.textContent||el.value||'').trim().replace(/\s+/g,' ').slice(0,180),
                  href:el.href||'',
                  onclick:el.getAttribute('onclick')||''
                })).filter(x=>navRe.test(x.text)||navRe.test(x.href)||navRe.test(x.onclick)).slice(0,120);
                return {url:location.href,title:document.title,dated,relevant,controls};
              },{dateSource:dateRe.source,statusSource:statusRe.source,navSource:navRe.source});
            }catch{return null}
          }

          (async()=>{
            const browser=await puppeteer.connect({browserURL:'http://127.0.0.1:9333'});
            const pages=await browser.pages();
            const base=pages.find(p=>/n21\.ultipro\.com/.test(p.url()) && !/PostLogout/i.test(p.url()));
            if(!base) throw new Error('Authenticated UKG page not found');

            const inspected=[];
            for(const frame of base.frames()){
              const s=await snapshot(frame);
              if(s) inspected.push(s);
            }

            const directMatches=inspected.flatMap(x=>x.dated.map(d=>({url:x.url,title:x.title,context:d})));
            if(directMatches.length){
              console.log(JSON.stringify({ok:true,found:true,direct:true,matches:directMatches.slice(0,20)}));
              await browser.disconnect();
              return;
            }

            const candidates=[];
            for(const snap of inspected){
              for(const ctl of snap.controls||[]){
                if(!ctl.href || /^javascript:/i.test(ctl.href)) continue;
                try{
                  const u=new URL(ctl.href,snap.url);
                  if(u.hostname==='n21.ultipro.com' && !/PostLogout/i.test(u.pathname)){
                    candidates.push({text:ctl.text,url:u.href});
                  }
                }catch{}
              }
            }

            const uniq=[];
            const seen=new Set();
            for(const x of candidates){
              if(!seen.has(x.url)){seen.add(x.url);uniq.push(x)}
            }

            const visited=[];
            for(const cand of uniq.slice(0,12)){
              const p=await browser.newPage();
              try{
                await p.goto(cand.url,{waitUntil:'domcontentloaded',timeout:30000});
                await new Promise(r=>setTimeout(r,1200));
                const snaps=[];
                for(const frame of p.frames()){
                  const s=await snapshot(frame);
                  if(s) snaps.push(s);
                }
                const matches=snaps.flatMap(x=>x.dated.map(d=>({url:x.url,title:x.title,context:d})));
                visited.push({label:cand.text,url:p.url(),matches});
                if(matches.length){
                  console.log(JSON.stringify({ok:true,found:true,direct:false,matchedNavigation:cand.text,matches:matches.slice(0,20)}));
                  await p.close();
                  await browser.disconnect();
                  return;
                }
              }catch(e){
                visited.push({label:cand.text,url:cand.url,error:String(e.message||e).slice(0,180)});
              }finally{
                try{await p.close()}catch{}
              }
            }

            console.log(JSON.stringify({
              ok:true,
              found:false,
              baseUrl:base.url(),
              navigation:inspected.flatMap(x=>x.controls||[]).slice(0,80),
              visited:visited.slice(0,20),
              relevant:inspected.flatMap(x=>x.relevant||[]).slice(0,100)
            }));
            await browser.disconnect();
          })().catch(e=>{
            console.log(JSON.stringify({ok:false,error:String(e.message||e).slice(0,300)}));
            process.exitCode=1;
          });
          NODE
          OVH
              ;;
            openbao_status)
              ovh 'curl -fsS http://127.0.0.1:8200/v1/sys/seal-status | jq -c "{initialized,sealed,storage_type,version}"'
              ;;
            termux_status)
              ovh 'bash -s' <<'OVH'
          set -euo pipefail
          connected=false
          ss -ltnH | awk '$4 ~ /^(127\.0\.0\.1|\[::1\]):22[0-9][0-9][0-9]$/ {found=1} END {exit !found}' && connected=true || true
          jq -n --argjson connected "$connected" '{ok:true,connected:$connected}'
          OVH
              ;;
            campaigns_acceptance)
              ovh 'bash -s' <<'OVH'
          set -euo pipefail
          lane=""
          port=""
          token=""
          training_started=false

          if token="$(sudo -n /usr/local/bin/3dvr-browser-lease acquire general control-bus-campaigns-acceptance 1200 2>/dev/null)"; then
            lane="general"
            port="9222"
            export SKIP_GMAIL=0
          elif token="$(sudo -n /usr/local/bin/3dvr-browser-lease acquire training control-bus-campaigns-acceptance 1200 2>/dev/null)"; then
            lane="training"
            port="9555"
            export SKIP_GMAIL=1
            if ! systemctl is-active --quiet 3dvr-browser-lane@training.service; then
              sudo -n systemctl start 3dvr-browser-lane@training.service
              training_started=true
            fi
            for _ in $(seq 1 30); do
              curl -fsS "http://127.0.0.1:$port/json/version" >/dev/null 2>&1 && break
              sleep 1
            done
            curl -fsS "http://127.0.0.1:$port/json/version" >/dev/null
          else
            jq -n '{ok:false,error:"No appropriate Campaigns browser lane is currently available.",browserLane:""}'
            exit 0
          fi

          cleanup() {
            sudo -n /usr/local/bin/3dvr-browser-lease release "$lane" "$token" >/dev/null 2>&1 || true
            if [ "$training_started" = true ]; then
              sudo -n systemctl stop 3dvr-browser-lane@training.service >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT INT TERM
          export BROWSER_LANE="$lane"
          export BROWSER_URL="http://127.0.0.1:$port"

          puppeteer_core="$(find /home/debian/.npm/_npx -type f -path '*/puppeteer-core/lib/puppeteer/puppeteer-core.js' -print -quit 2>/dev/null || true)"
          [ -n "$puppeteer_core" ] && [ -f "$puppeteer_core" ]
          export PUPPETEER_CORE_PATH="$puppeteer_core"

          cd /opt/3dvr-portal-production/current
          node scripts/ops/campaigns-acceptance.cjs
          OVH
              ;;
            portal_points_reconcile)
              ovh 'bash -s' <<'OVH'
          set -euo pipefail
          cd /opt/3dvr-portal-production/current

          puppeteer_core="$(find /home/debian/.npm/_npx -type f -path '*/puppeteer-core/lib/puppeteer/puppeteer-core.js' -print -quit 2>/dev/null || true)"
          [ -n "$puppeteer_core" ] && [ -f "$puppeteer_core" ]
          export PUPPETEER_CORE_PATH="$puppeteer_core"

          chrome="$(find /home/debian/.agent-browser/browsers -mindepth 2 -maxdepth 2 -type f -name chrome -perm -u+x 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$chrome" ] || [ ! -x "$chrome" ]; then
            for candidate in google-chrome-stable google-chrome chromium chromium-browser; do
              if command -v "$candidate" >/dev/null 2>&1; then
                chrome="$(command -v "$candidate")"
                break
              fi
            done
          fi
          [ -n "$chrome" ] && [ -x "$chrome" ]
          export CHROME_BIN="$chrome"

          node - <<'NODE'
          const puppeteer = require(process.env.PUPPETEER_CORE_PATH);

          (async () => {
            // Read identity + local score from the leased browser without navigating or clicking.
            const persistent = await puppeteer.connect({ browserURL: 'http://127.0.0.1:9222' });
            const pages = await persistent.pages();
            let identity = null;

            for (const page of pages) {
              let url = '';
              try { url = page.url(); } catch {}
              if (!url.startsWith('https://portal.3dvr.tech/')) continue;
              const current = await page.evaluate(() => {
                const alias = (localStorage.getItem('alias') || '').trim();
                const username = (localStorage.getItem('username') || '').trim();
                const pub = (localStorage.getItem('userPubKey') || '').trim();
                const scores = Object.keys(localStorage)
                  .filter(key => key.startsWith('3dvr:score:'))
                  .map(key => Number(localStorage.getItem(key) || 0))
                  .filter(Number.isFinite)
                  .map(value => Math.max(0, Math.round(value)));
                return {
                  signedIn: localStorage.getItem('signedIn') === 'true',
                  alias,
                  username,
                  pub,
                  localPoints: scores.length ? Math.max(...scores) : 0
                };
              });
              if (current.signedIn && current.alias && current.pub) {
                identity = current;
                break;
              }
            }
            await persistent.disconnect();

            if (!identity) {
              console.log(JSON.stringify({
                ok: false,
                error: 'No signed-in Portal identity is available in the persistent browser.'
              }));
              process.exitCode = 2;
              return;
            }

            // Use a disposable browser with no profile for the public Gun repair.
            const repairBrowser = await puppeteer.launch({
              executablePath: process.env.CHROME_BIN,
              headless: 'new',
              args: ['--no-sandbox', '--disable-dev-shm-usage', '--no-first-run']
            });
            const page = await repairBrowser.newPage();

            try {
              await page.goto('https://portal.3dvr.tech/index.html', {
                waitUntil: 'domcontentloaded',
                timeout: 30000
              });
              await page.waitForFunction(() => typeof window.Gun === 'function', {
                timeout: 10000
              });

              const result = await page.evaluate(async identity => {
                const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
                const once = (node, timeoutMs = 5000) => new Promise(resolve => {
                  let settled = false;
                  const finish = value => {
                    if (settled) return;
                    settled = true;
                    resolve(value ?? null);
                  };
                  setTimeout(() => finish(null), timeoutMs);
                  try { node.once(finish); } catch { finish(null); }
                });
                const put = (node, value, timeoutMs = 6000) => new Promise((resolve, reject) => {
                  let settled = false;
                  const finish = (error, ack) => {
                    if (settled) return;
                    settled = true;
                    if (error) reject(error);
                    else resolve(ack || {});
                  };
                  setTimeout(() => finish(new Error('Gun write timed out.')), timeoutMs);
                  try {
                    node.put(value, ack => ack?.err
                      ? finish(new Error(String(ack.err)))
                      : finish(null, ack));
                  } catch (error) {
                    finish(error);
                  }
                });

                const gun = window.Gun({
                  peers: Array.isArray(window.__GUN_PEERS__) && window.__GUN_PEERS__.length
                    ? window.__GUN_PEERS__
                    : ['wss://gun-relay-3dvr.fly.dev/gun'],
                  localStorage: false,
                  radisk: false
                });
                const root = gun.get('3dvr-portal');
                const aliasNode = root.get('userStats').get(identity.alias);
                const pubNode = root.get('userStatsByPub').get(identity.pub);

                const [aliasBefore, pubBefore] = await Promise.all([
                  once(aliasNode),
                  once(pubNode)
                ]);

                const numbers = [
                  identity.localPoints,
                  Number(aliasBefore?.points),
                  Number(pubBefore?.points)
                ].filter(Number.isFinite).map(value => Math.max(0, Math.round(value)));
                const best = numbers.length ? Math.max(...numbers) : 0;

                if (best <= 0) {
                  return {
                    ok: false,
                    error: 'No positive point total was found to reconcile.'
                  };
                }

                const payload = {
                  alias: identity.alias,
                  username: identity.username || identity.alias.replace(/@3dvr$/i, ''),
                  points: best,
                  lastUpdated: Date.now()
                };

                await put(aliasNode, payload);
                await put(pubNode, { ...payload, pub: identity.pub });
                await wait(800);

                const [aliasAfter, pubAfter] = await Promise.all([
                  once(aliasNode, 3500),
                  once(pubNode, 3500)
                ]);

                return {
                  ok: true,
                  points: best,
                  localPoints: identity.localPoints,
                  aliasPointsBefore: Number.isFinite(Number(aliasBefore?.points))
                    ? Number(aliasBefore.points) : null,
                  pubPointsBefore: Number.isFinite(Number(pubBefore?.points))
                    ? Number(pubBefore.points) : null,
                  aliasPointsAfter: Number.isFinite(Number(aliasAfter?.points))
                    ? Number(aliasAfter.points) : null,
                  pubPointsAfter: Number.isFinite(Number(pubAfter?.points))
                    ? Number(pubAfter.points) : null
                };
              }, identity);

              console.log(JSON.stringify(result));
              if (!result.ok) process.exitCode = 2;
            } finally {
              await repairBrowser.close();
            }
          })().catch(error => {
            console.log(JSON.stringify({ ok: false, error: error.message || 'points-reconcile-failed' }));
            process.exitCode = 1;
          });
          NODE
          OVH
              ;;
            portal_points_status)
              ovh 'bash -s' <<'OVH'
          set -euo pipefail
          puppeteer_core="$(find /home/debian/.npm/_npx -type f -path '*/puppeteer-core/lib/puppeteer/puppeteer-core.js' -print -quit 2>/dev/null || true)"
          [ -n "$puppeteer_core" ] && [ -f "$puppeteer_core" ]
          PUPPETEER_CORE_PATH="$puppeteer_core" node - <<'NODE'
          const puppeteer=require(process.env.PUPPETEER_CORE_PATH);
          (async()=>{
            const browser=await puppeteer.connect({browserURL:'http://127.0.0.1:9222'});
            const pages=await browser.pages();
            const portalPages=[];
            for(const page of pages){
              let url='';
              try{url=page.url();}catch{}
              if(!url.startsWith('https://portal.3dvr.tech/')) continue;
              const data=await page.evaluate(async()=>{
                const alias=localStorage.getItem('alias')||'';
                const pub=localStorage.getItem('userPubKey')||'';
                const result={
                  url:location.href,
