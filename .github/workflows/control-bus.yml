name: 3DVR Control Bus

on:
  push:
    branches: [main]
    paths:
      - 'ops/control/request.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 3dvr-control-bus
  cancel-in-progress: true

env:
  HETZNER_HOST: 167.233.174.20

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Validate request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          test -s ops/control/request.json
          id="$(jq -r '.id // empty' ops/control/request.json)"
          action="$(jq -r '.action // empty' ops/control/request.json)"
          service="$(jq -r '.service // empty' ops/control/request.json)"
          test -n "$id"
          case "$action" in
            status|termux_status|openbao_status|portal_key_status|portal_env_status|portal_ai_status|openai_admin_status|openai_admin_handoff|openai_admin_stage|openai_admin_store_clipboard) ;;
            restart)
              case "$service" in
                3dvr-personal-mcp.service|3dvr-secrets-broker.service|3dvr-self-host-portal.service|3dvr-portal.service|openbao.service) ;;
                *) echo 'service is not allowlisted' >&2; exit 64 ;;
              esac
              ;;
            *) echo 'action is not allowlisted' >&2; exit 64 ;;
          esac
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "service=$service" >> "$GITHUB_OUTPUT"

      - name: Resolve Hetzner SSH access
        id: ssh
        shell: bash
        env:
          SSH_A: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
          SSH_B: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_C: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          write_key() {
            local raw="$1" dest="$2"
            [ -n "$raw" ] || return 0
            printf '%s\n' "$raw" > "$dest.raw"
            if grep -q 'BEGIN .*PRIVATE KEY' "$dest.raw"; then
              cp "$dest.raw" "$dest"
            elif base64 -d "$dest.raw" > "$dest" 2>/dev/null && grep -q 'BEGIN .*PRIVATE KEY' "$dest"; then
              :
            else
              rm -f "$dest" "$dest.raw"
              return 0
            fi
            chmod 600 "$dest"
            rm -f "$dest.raw"
          }
          write_key "$SSH_A" /tmp/3dvr-control-a
          write_key "$SSH_B" /tmp/3dvr-control-b
          write_key "$SSH_C" /tmp/3dvr-control-c
          for user in root debian ubuntu tmsteph; do
            for key in /tmp/3dvr-control-a /tmp/3dvr-control-b /tmp/3dvr-control-c; do
              [ -f "$key" ] || continue
              if ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=6 "$user@$HETZNER_HOST" true >/dev/null 2>&1; then
                echo "user=$user" >> "$GITHUB_OUTPUT"
                echo "key=$key" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
          done
          echo 'No configured SSH key can reach Hetzner.' >&2
          exit 1

      - name: Execute bounded control request
        id: execute
        shell: bash
        env:
          HETZNER_USER: ${{ steps.ssh.outputs.user }}
          HETZNER_KEY: ${{ steps.ssh.outputs.key }}
          ACTION: ${{ steps.request.outputs.action }}
          SERVICE: ${{ steps.request.outputs.service }}
        run: |
          set -euo pipefail
          opts=(-i "$HETZNER_KEY" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8)
          ssh "${opts[@]}" "$HETZNER_USER@$HETZNER_HOST" bash -s -- "$ACTION" "$SERVICE" > /tmp/control-result.json <<'REMOTE'
          set -euo pipefail
          action=${1:-}
          service=${2:-}
          ssh_opts=(-o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=8)
          ovh() { ssh "${ssh_opts[@]}" 3dvr-ovh "$@"; }
          case "$action" in
            status)
              ovh 'bash -s' <<'OVH'
          set -euo pipefail
          openbao=$(curl -fsS http://127.0.0.1:8200/v1/sys/seal-status | jq -c '{initialized,sealed,storage_type}')
          broker=$(curl -fsS --unix-socket /run/3dvr-secrets-broker/broker.sock http://localhost/health)
          termux=false
          ss -ltnH | awk '$4 ~ /^(127\.0\.0\.1|\[::1\]):22[0-9][0-9][0-9]$/ {found=1} END {exit !found}' && termux=true || true
          jq -n --arg host "$(hostname)" --argjson openbao "$openbao" --argjson broker "$broker" --argjson termux "$termux" '{ok:true,host:$host,openbao:$openbao,broker:$broker,termuxReverseSsh:$termux}'
          OVH
              ;;
            openbao_status)
              ovh 'curl -fsS http://127.0.0.1:8200/v1/sys/seal-status | jq -c "{initialized,sealed,storage_type,version}"'
              ;;
            termux_status)
              ovh 'bash -s' <<'OVH'
          set -euo pipefail
          connected=false
          ss -ltnH | awk '$4 ~ /^(127\.0\.0\.1|\[::1\]):22[0-9][0-9][0-9]$/ {found=1} END {exit !found}' && connected=true || true
          jq -n --argjson connected "$connected" '{ok:true,connected:$connected}'
          OVH
              ;;
            openai_admin_store_clipboard)
              ovh 'bash -s' <<'OVH'
          set -euo pipefail
          node - <<'NODE'
          const puppeteer=require('/home/debian/.npm/_npx/81cb1ab08343aa85/node_modules/puppeteer-core/lib/puppeteer/puppeteer-core.js');
          (async()=>{
            const browser=await puppeteer.connect({browserURL:'http://127.0.0.1:9444'});
            const page=await browser.newPage();
            await page.goto('https://portal.3dvr.tech/access/',{waitUntil:'networkidle2',timeout:30000});
            await new Promise(r=>setTimeout(r,1200));

            const open=await page.$('#openSaveSecret');
            if(!open) throw new Error('Save secret control not found');
            const disabled=await open.evaluate(el=>el.disabled || el.getAttribute('aria-disabled')==='true');
            if(disabled) throw new Error('3DVR secret save is not available in this browser session');
            await open.click();

            await page.waitForSelector('#secretKey',{visible:true,timeout:5000});
            await page.type('#secretKey','OPENAI_ADMIN_KEY');
            await page.type('#secretNote','OpenAI organization admin credential for 3DVR control-plane key rotation');

            const value=await page.$('#secretValue');
            if(!value) throw new Error('Secret value field not found');
            await value.focus();
            await page.keyboard.down('Control');
            await page.keyboard.press('V');
            await page.keyboard.up('Control');

            const hasValue=await value.evaluate(el=>Boolean(el.value));
            if(!hasValue) throw new Error('Clipboard paste did not populate the secret field');

            await page.click('#saveSecret');
            await page.waitForFunction(()=>{
              const el=document.querySelector('#secretSaveMessage');
              const text=(el?.textContent||'').trim();
              return /Saved OPENAI_ADMIN_KEY securely\.|approval|error|failed|not confirm/i.test(text);
            },{timeout:15000});
            const message=await page.$eval('#secretSaveMessage',el=>(el.textContent||'').trim());
            const ok=/Saved OPENAI_ADMIN_KEY securely\./.test(message);
            console.log(JSON.stringify({ok,storedKey:ok?'OPENAI_ADMIN_KEY':'',message:ok?'stored securely':'secret save did not complete'}));
            await page.close();
            await browser.disconnect();
            if(!ok) process.exit(2);
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
          OVH
              ;;
            openai_admin_stage)
              ovh 'bash -s' <<'OVH'
          set -euo pipefail
          node - <<'NODE'
          const puppeteer=require('/home/debian/.npm/_npx/81cb1ab08343aa85/node_modules/puppeteer-core/lib/puppeteer/puppeteer-core.js');
          (async()=>{
            const browser=await puppeteer.connect({browserURL:'http://127.0.0.1:9444'});
            const pages=await browser.pages();
            let page=pages.find(p=>p.url().includes('platform.openai.com')) || pages[pages.length-1];
            await page.goto('https://platform.openai.com/settings/organization/admin-keys',{waitUntil:'networkidle2',timeout:30000});
            await new Promise(r=>setTimeout(r,1200));
            const ok=page.url().includes('/settings/organization/admin-keys');
            console.log(JSON.stringify({ok,url:page.url(),title:await page.title()}));
            await browser.disconnect();
            if(!ok) process.exit(2);
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
          OVH
              ;;
            openai_admin_handoff)
              ovh 'bash -s' <<'OVH'
          set -euo pipefail
          cd /home/debian/worktrees/human-handoff-live
          out=$(node apps/agent/thomas-agent/node/human-handoff-gateway.js create             --lane messaging             --origin https://platform.openai.com             --service "OpenAI Admin key bootstrap"             --reason "Create one API Platform organization Admin key for the 3dvr control plane, then return to the agent.")
          url=$(printf '%s\n' "$out" | sed -n 's/^handoff_url=//p')
          id=$(printf '%s\n' "$out" | sed -n 's/^handoff_id=//p')
          expires=$(printf '%s\n' "$out" | sed -n 's/^expires_at=//p')
          [ -n "$url" ] && [ -n "$id" ]
          jq -n --arg id "$id" --arg url "$url" --arg expires "$expires" '{ok:true,handoffId:$id,handoffUrl:$url,expiresAt:$expires}'
          OVH
              ;;
            openai_admin_status)
              ovh 'bash -s' <<'OVH'
          set -euo pipefail
          cd /opt/3dvr-portal-production/current
          present=false
          if node - <<'NODE' >/dev/null 2>&1
          const { OpenBaoBackend } = require('./apps/agent/connectors/secrets/openbao');
          try {
            const backend = new OpenBaoBackend();
            const value = backend.get({ key: 'OPENAI_ADMIN_KEY' });
            process.exit(value ? 0 : 1);
          } catch {
            process.exit(1);
          }
          NODE
          then
            present=true
          fi
          jq -n --argjson present "$present" '{ok:true,openAiAdminKeyConfigured:$present}'
          OVH
              ;;
            portal_env_status)
              ovh 'bash -s' <<'OVH'
          set -euo pipefail
          base=false
          portal=false
          portal_secrets=false
          broker=false
          [ -r /home/debian/.3dvr/config/env ] && grep -q '^OPENAI_API_KEY=.' /home/debian/.3dvr/config/env && base=true || true
          [ -r /home/debian/.3dvr/config/portal.env ] && grep -q '^OPENAI_API_KEY=.' /home/debian/.3dvr/config/portal.env && portal=true || true
          [ -r /home/debian/.3dvr/config/portal-secrets.env ] && grep -q '^OPENAI_API_KEY=.' /home/debian/.3dvr/config/portal-secrets.env && portal_secrets=true || true
          [ -r /etc/3dvr/secrets-broker/portal.env ] && grep -q '^OPENAI_API_KEY=.' /etc/3dvr/secrets-broker/portal.env && broker=true || true
          envfiles=$(systemctl show 3dvr-portal.service -p EnvironmentFiles --value | tr '\n' ' ' | head -c 500)
          jq -n --argjson base "$base" --argjson portal "$portal" --argjson portalSecrets "$portal_secrets" --argjson broker "$broker" --arg envfiles "$envfiles"             '{ok:true,baseEnvHasKey:$base,portalEnvHasKey:$portal,portalSecretsEnvHasKey:$portalSecrets,brokerEnvHasKey:$broker,environmentFiles:$envfiles}'
          OVH
              ;;
            portal_key_status)
              ovh 'bash -s' <<'OVH'
          set -euo pipefail
          pid=$(systemctl show 3dvr-portal.service -p MainPID --value)
          configured=false
          if [ -n "$pid" ] && [ "$pid" != 0 ] && [ -r "/proc/$pid/environ" ]; then
            tr '\0' '\n' < "/proc/$pid/environ" | grep -q '^OPENAI_API_KEY=.' && configured=true || true
          fi
          state=$(systemctl is-active 3dvr-portal.service || true)
          jq -n --arg state "$state" --argjson configured "$configured" '{ok:($state=="active"),service:"3dvr-portal.service",state:$state,openAiKeyConfigured:$configured}'
          OVH
              ;;
            portal_ai_status)
              ovh 'bash -s' <<'OVH'
          set -euo pipefail
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          status=$(curl -sS -o "$body" -w '%{http_code}' -H 'content-type: application/json' --data '{"prompt":"Return the smallest valid HTML page whose visible text is exactly: 3DVR AI OK","model":"gpt-4o-mini"}' https://portal.3dvr.tech/api/openai-site || true)
          passed=false
          [ "$status" = 200 ] && grep -q '3DVR AI OK' "$body" && passed=true || true
          error=""
          if [ "$passed" != true ]; then
            error=$(jq -r '.error // empty' "$body" 2>/dev/null | head -c 300 || true)
          fi
          jq -n --arg status "$status" --arg error "$error" --argjson passed "$passed" '{ok:$passed,httpStatus:($status|tonumber? // 0),error:$error}'
          OVH
              ;;
            restart)
              case "$service" in
                3dvr-personal-mcp.service|3dvr-secrets-broker.service|3dvr-self-host-portal.service|3dvr-portal.service|openbao.service) ;;
                *) exit 64 ;;
              esac
              ovh 'bash -s' -- "$service" <<'OVH'
          set -euo pipefail
          service=${1:-}
          case "$service" in
            3dvr-personal-mcp.service|3dvr-secrets-broker.service|3dvr-self-host-portal.service|3dvr-portal.service|openbao.service) ;;
            *) exit 64 ;;
          esac
          sudo -n /usr/local/sbin/3dvr-control-service restart "$service"
          state=$(systemctl is-active "$service" || true)
          jq -n --arg service "$service" --arg state "$state" '{ok:($state=="active"),service:$service,state:$state}'
          OVH
              ;;
            *) exit 64 ;;
          esac
          REMOTE
          jq -e . /tmp/control-result.json >/dev/null

      - name: Persist sanitized result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ steps.request.outputs.id }}
          ACTION: ${{ steps.request.outputs.action }}
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
        run: |
          set -euo pipefail
          if [ -s /tmp/control-result.json ] && jq -e . /tmp/control-result.json >/dev/null 2>&1; then
            cp /tmp/control-result.json /tmp/result-body.json
          else
            printf '%s\n' '{"ok":false,"error":"control request failed before a sanitized result was produced"}' >/tmp/result-body.json
          fi
          jq --arg id "$REQUEST_ID" --arg action "$ACTION" --arg outcome "$EXECUTE_OUTCOME" --arg checkedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '. + {requestId:$id,action:$action,workflowOutcome:$outcome,checkedAt:$checkedAt}' /tmp/result-body.json > /tmp/result.json
          content="$(base64 -w0 /tmp/result.json)"
          url="https://api.github.com/repos/$GITHUB_REPOSITORY/contents/ops/control/result.json"
          sha="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$url" 2>/dev/null | jq -r '.sha // empty' || true)"
          jq -n --arg message "Record 3DVR control result $REQUEST_ID" --arg content "$content" --arg sha "$sha" '{message:$message,content:$content,branch:"main"} + (if $sha=="" then {} else {sha:$sha} end)' >/tmp/payload.json
          curl -fsS -X PUT -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$url" --data-binary @/tmp/payload.json >/dev/null

      - name: Remove SSH keys
        if: always()
        shell: bash
        run: rm -f /tmp/3dvr-control-a /tmp/3dvr-control-b /tmp/3dvr-control-c /tmp/3dvr-control-*.raw
