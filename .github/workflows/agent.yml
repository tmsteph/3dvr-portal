name: Agent Checks

on:
  push:
    branches: [main, dev]
    paths: ["apps/agent/**", ".github/workflows/agent.yml", "package.json"]
  pull_request:
    branches: [main, dev]
    paths: ["apps/agent/**", ".github/workflows/agent.yml", "package.json"]
  # Production deployment is an explicit manual action, never a side effect of merging.
  workflow_dispatch:
    inputs:
      deploy_digitalocean_worker:
        description: 'I explicitly approve deploying and restarting the DigitalOcean worker'
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  statuses: write

jobs:
  test:
    name: Run agent tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: apps/agent/package-lock.json
      - run: npm ci
      # The planner integration tests build the real operator-core package.
      # Its Node type definitions are dev dependencies of that package, not
      # apps/agent; a clean PR merge checkout must install them explicitly.
      - name: Install and build Operator Core test dependencies
        run: |
          npm --prefix ../../operator-core/operator-core ci --ignore-scripts
          npm --prefix ../../operator-core/operator-core run build
      # Always run regressions even when the separate security gate fails.
      # Keep npm audit blocking; do not silently waive vulnerabilities.
      - run: npm test
      - run: npm audit --omit=dev

  deploy-digitalocean-worker:
    name: Deploy DigitalOcean agent worker
    # A push to main (including a PR merge) runs tests only. Deployment requires
    # a deliberate main-branch workflow dispatch with the approval input checked.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_digitalocean_worker == true
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: digitalocean-agent-worker
      cancel-in-progress: false
    env:
      DO_AGENT_HOST: 167.172.193.194
      DO_AGENT_USER: root
      THREEDVR_NODE_BIN: /opt/node-v22/bin/node
      THREEDVR_AGENT_OWNER_ALIAS: ${{ vars.THREEDVR_AGENT_TASK_OWNER_ALIAS || '3dvr-managed' }}
      THREEDVR_CONTEXT_HQ_OWNER_ALIAS: ${{ vars.THREEDVR_CONTEXT_HQ_OWNER_ALIAS || vars.THREEDVR_AGENT_OWNER_ALIAS || '3dvr.tech@gmail.com' }}
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: apps/agent/package-lock.json
      - run: npm ci
      - name: Resolve DigitalOcean SSH key
        id: ssh_key
        shell: bash
        env:
          SSH_A: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
          SSH_B: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_C: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key=''
          for candidate in "$SSH_A" "$SSH_B" "$SSH_C"; do
            if [ -z "$key" ] && [ -n "$candidate" ]; then key="$candidate"; fi
          done
          if [ -z "$key" ]; then echo 'No DigitalOcean SSH key is configured.' >&2; exit 1; fi
          umask 077
          printf '%s\n' "$key" > /tmp/3dvr-agent-key.raw
          if grep -q 'BEGIN .*PRIVATE KEY' /tmp/3dvr-agent-key.raw; then cp /tmp/3dvr-agent-key.raw /tmp/3dvr-agent-key
          elif base64 -d /tmp/3dvr-agent-key.raw > /tmp/3dvr-agent-key 2>/dev/null && grep -q 'BEGIN .*PRIVATE KEY' /tmp/3dvr-agent-key; then :
          else echo 'Configured DigitalOcean SSH key could not be decoded.' >&2; rm -f /tmp/3dvr-agent-key.raw /tmp/3dvr-agent-key; exit 1; fi
          chmod 600 /tmp/3dvr-agent-key
          rm -f /tmp/3dvr-agent-key.raw
          printf '%s\n' '167.172.193.194 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFoepoGbXWiidk4axaBwsI1Y/GWVckiqJxGLkBpTV6Pc' > /tmp/3dvr-known-hosts
          chmod 600 /tmp/3dvr-known-hosts
          echo 'present=true' >> "$GITHUB_OUTPUT"
      - name: Deploy worker over SSH
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          opts=(-i /tmp/3dvr-agent-key -o BatchMode=yes -o UserKnownHostsFile=/tmp/3dvr-known-hosts -o StrictHostKeyChecking=yes -o ConnectTimeout=10)
          owner_b64="$(printf '%s' "$THREEDVR_AGENT_OWNER_ALIAS" | base64 -w 0)"
          context_owner_b64="$(printf '%s' "$THREEDVR_CONTEXT_HQ_OWNER_ALIAS" | base64 -w 0)"
          ssh "${opts[@]}" "$DO_AGENT_USER@$DO_AGENT_HOST" "GITHUB_REPOSITORY='$GITHUB_REPOSITORY' GITHUB_SHA='$GITHUB_SHA' THREEDVR_AGENT_OWNER_ALIAS_B64='$owner_b64' THREEDVR_CONTEXT_HQ_OWNER_ALIAS_B64='$context_owner_b64' THREEDVR_NODE_BIN='$THREEDVR_NODE_BIN' bash -s" <<'REMOTE'
          set -euo pipefail
          THREEDVR_AGENT_OWNER_ALIAS="$(printf '%s' "$THREEDVR_AGENT_OWNER_ALIAS_B64" | base64 -d)"
          THREEDVR_CONTEXT_HQ_OWNER_ALIAS="$(printf '%s' "$THREEDVR_CONTEXT_HQ_OWNER_ALIAS_B64" | base64 -d)"
          mkdir -p "$HOME/.3dvr/locks"
          command -v flock >/dev/null 2>&1 || { echo 'flock is required for serialized agent deploys.' >&2; exit 1; }
          exec 9>"$HOME/.3dvr/locks/agent-deploy.lock"
          if ! flock -w 90 9; then
            echo 'Timed out waiting 90 seconds for DigitalOcean agent deploy lock.' >&2
            if command -v lslocks >/dev/null 2>&1; then
              lslocks -o PID,COMMAND,PATH 2>/dev/null | grep -F "$HOME/.3dvr/locks/agent-deploy.lock" || true
            fi
            exit 1
          fi
          # Fail closed before checkout, daemon shutdown, or dependency changes.
          # Restarting an unrestricted worker could consume old queued work.
          cfg="$HOME/.3dvr/config/env"
          if [ -f "$cfg" ]; then set -a; . "$cfg"; set +a; fi
          export THREEDVR_AGENT_OWNER_ALIAS="$(printf '%s' "$THREEDVR_AGENT_OWNER_ALIAS_B64" | base64 -d)"
          THREEDVR_NODE_BIN=/opt/node-v22/bin/node
          [ -x "$THREEDVR_NODE_BIN" ] || { echo 'Managed Node runtime missing; deployment blocked.' >&2; exit 1; }
          "$THREEDVR_NODE_BIN" <<'QUEUE_PREFLIGHT'
          const { DatabaseSync } = require('node:sqlite');
          const { existsSync } = require('node:fs');
          const { join } = require('node:path');
          const { homedir } = require('node:os');
          const owner = process.env.THREEDVR_AGENT_OWNER_ALIAS?.trim();
          const dbPath = process.env.THREEDVR_AGENT_QUEUE_DB || join(homedir(), '.3dvr', 'task-queue.sqlite');
          if (!owner) throw new Error('Queue owner unverified; deployment blocked');
          if (!existsSync(dbPath)) throw new Error('Queue database missing; deployment blocked');
          const db = new DatabaseSync(dbPath, { readOnly: true });
          try {
            db.exec('PRAGMA query_only = ON');
            const row = db.prepare(
              "SELECT COUNT(*) AS count FROM tasks WHERE owner_alias = ? AND status IN ('queued', 'running')"
            ).get(owner);
            if (row.count !== 0) {
              throw new Error(`Worker deployment blocked: ${row.count} queued/running tasks require review`);
            }
            console.log('Worker deployment queue preflight passed.');
          } finally {
            db.close();
          }
          QUEUE_PREFLIGHT
          repo="$HOME/.3dvr/portal"
          mkdir -p "$HOME/.3dvr"
          if [ ! -d "$repo/.git" ]; then rm -rf "$repo"; git clone "https://github.com/$GITHUB_REPOSITORY.git" "$repo"; fi
          if ! git -C "$repo" diff --quiet || ! git -C "$repo" diff --cached --quiet || [ -n "$(git -C "$repo" ls-files --others --exclude-standard)" ]; then
            stash_name="agent-deploy-$(date -u +%Y%m%dT%H%M%SZ)"
            git -C "$repo" stash push --include-untracked -m "$stash_name"
            echo "Preserved local checkout changes in stash: $stash_name"
          fi
          git -C "$repo" fetch --prune origin main
          git -C "$repo" checkout main
          git -C "$repo" pull --ff-only origin main
          git -C "$repo" merge-base --is-ancestor "$GITHUB_SHA" HEAD
          cfg="$HOME/.3dvr/config/env"
          mkdir -p "$(dirname "$cfg")"; touch "$cfg"; chmod 600 "$cfg" || true
          cfg_tmp="$(mktemp)"
          printf -v owner_q '%q' "$THREEDVR_AGENT_OWNER_ALIAS"
          printf -v context_owner_q '%q' "$THREEDVR_CONTEXT_HQ_OWNER_ALIAS"
          awk '!/^(THREEDVR_AGENT_OWNER_ALIAS|THREEDVR_CONTEXT_HQ_OWNER_ALIAS|THREEDVR_AGENT_QUEUE_STORE|THREEDVR_NODE_BIN)=/' "$cfg" > "$cfg_tmp"
          printf 'THREEDVR_AGENT_OWNER_ALIAS=%s\n' "$owner_q" >> "$cfg_tmp"
          printf 'THREEDVR_CONTEXT_HQ_OWNER_ALIAS=%s\n' "$context_owner_q" >> "$cfg_tmp"
          printf '%s\n' 'THREEDVR_AGENT_QUEUE_STORE=sqlite' 'THREEDVR_NODE_BIN=/opt/node-v22/bin/node' >> "$cfg_tmp"
          cat "$cfg_tmp" > "$cfg"; rm -f "$cfg_tmp"
          [ -x "$THREEDVR_NODE_BIN" ] || exit 1
          "$THREEDVR_NODE_BIN" -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major < 22 || (major === 22 && minor < 13)) process.exit(1); require("node:sqlite")'
          export PATH="$(dirname "$THREEDVR_NODE_BIN"):$PATH"
          scripts="$repo/apps/agent/thomas-agent/scripts"
          # Stop long-lived Node processes before npm replaces node_modules.
          # Otherwise Gun or another live dependency can race npm's cleanup and
          # leave ENOTEMPTY failures during rapid consecutive deployments.
          "$scripts/ask-agent-worker-daemon" stop || true
          "$scripts/ask-inbox-daemon" stop || true
          "$scripts/ask-context-task-router-daemon" stop || true
          "$scripts/ask-autopilot-daemon" stop || true
          "$scripts/ask-agent-heartbeat-daemon" stop || true
          if ! npm --prefix "$repo/apps/agent" ci; then
            echo 'Initial npm ci failed after daemon shutdown; retrying from a clean node_modules.' >&2
            rm -rf "$repo/apps/agent/node_modules"
            npm --prefix "$repo/apps/agent" ci
          fi
          "$scripts/ask-agent-worker-daemon" start 9>&-
          "$scripts/ask-context-task-router-daemon" start 9>&-
          "$scripts/ask-inbox-daemon" start 9>&-
          "$scripts/ask-autopilot-daemon" start 9>&-
          "$scripts/ask-agent-heartbeat-daemon" start 9>&-
          "$scripts/ask-agent-worker-daemon" status
          "$scripts/ask-context-task-router-daemon" status
          "$scripts/ask-inbox-daemon" status
          "$scripts/ask-autopilot-daemon" status
          "$scripts/ask-agent-heartbeat-daemon" status
          REMOTE
      # A deployment may be checked for revision consistency, but never creates
      # an unapproved task as a side effect. Runtime acceptance is separate.
      - name: Verify deployed revision without queue mutation
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          opts=(-i /tmp/3dvr-agent-key -o BatchMode=yes -o UserKnownHostsFile=/tmp/3dvr-known-hosts -o StrictHostKeyChecking=yes -o ConnectTimeout=10)
          ssh "${opts[@]}" "$DO_AGENT_USER@$DO_AGENT_HOST" "GITHUB_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          repo="$HOME/.3dvr/portal"
          test -d "$repo/.git"
          git -C "$repo" merge-base --is-ancestor "$GITHUB_SHA" HEAD
          echo 'Deployed revision verified read-only; worker execution unverified.'
          REMOTE
      - name: Publish worker deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          SSH_OUTCOME: ${{ steps.ssh_key.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure; description='DigitalOcean agent worker deployment failed'
          if [ "$SSH_OUTCOME" != success ]; then description='DigitalOcean agent SSH credential unavailable'
          elif [ "$DEPLOY_OUTCOME" != success ]; then description='DigitalOcean agent SSH deployment failed'
          elif [ "$VERIFY_OUTCOME" != success ]; then description='DigitalOcean deployed revision verification failed'
          else state=success; description='DigitalOcean deployed revision verified; worker execution unverified'; fi
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "{\"state\":\"$state\",\"context\":\"3DVR DigitalOcean Worker\",\"description\":\"$description\"}"
      - name: Remove SSH key
        if: always()
        shell: bash
        run: rm -f /tmp/3dvr-agent-key /tmp/3dvr-agent-key.raw /tmp/3dvr-known-hosts
