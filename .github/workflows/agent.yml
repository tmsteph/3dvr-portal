name: Agent Checks

on:
  push:
    branches: [main, dev]
    paths: ["apps/agent/**", ".github/workflows/agent.yml", "package.json"]
  pull_request:
    branches: [main, dev]
    paths: ["apps/agent/**", ".github/workflows/agent.yml", "package.json"]
  # Production deployment is an explicit manual action, never a side effect of merging.
  workflow_dispatch:
    inputs:
      deploy_digitalocean_worker:
        description: 'I approve isolated release staging only; no worker activation or restart'
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  statuses: write

jobs:
  test:
    name: Run agent tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: apps/agent/package-lock.json
      - run: npm ci
      # The planner integration tests build the real operator-core package.
      # Its Node type definitions are dev dependencies of that package, not
      # apps/agent; a clean PR merge checkout must install them explicitly.
      - name: Install and build Operator Core test dependencies
        run: |
          npm --prefix ../../operator-core/operator-core ci --ignore-scripts
          npm --prefix ../../operator-core/operator-core run build
      # Always run regressions even when the separate security gate fails.
      # Keep npm audit blocking; do not silently waive vulnerabilities.
      - run: npm test
      - run: npm audit --omit=dev

  deploy-digitalocean-worker:
    name: Stage DigitalOcean agent release (no activation)
    # A push to main (including a PR merge) runs tests only. Deployment requires
    # a deliberate main-branch workflow dispatch with the approval input checked.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_digitalocean_worker == true
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: digitalocean-agent-worker
      cancel-in-progress: false
    env:
      DO_AGENT_HOST: 167.172.193.194
      DO_AGENT_USER: root
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: apps/agent/package-lock.json
      - run: npm ci
      - name: Resolve DigitalOcean SSH key
        id: ssh_key
        shell: bash
        env:
          SSH_A: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
          SSH_B: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_C: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key=''
          for candidate in "$SSH_A" "$SSH_B" "$SSH_C"; do
            if [ -z "$key" ] && [ -n "$candidate" ]; then key="$candidate"; fi
          done
          if [ -z "$key" ]; then echo 'No DigitalOcean SSH key is configured.' >&2; exit 1; fi
          umask 077
          printf '%s\n' "$key" > /tmp/3dvr-agent-key.raw
          if grep -q 'BEGIN .*PRIVATE KEY' /tmp/3dvr-agent-key.raw; then cp /tmp/3dvr-agent-key.raw /tmp/3dvr-agent-key
          elif base64 -d /tmp/3dvr-agent-key.raw > /tmp/3dvr-agent-key 2>/dev/null && grep -q 'BEGIN .*PRIVATE KEY' /tmp/3dvr-agent-key; then :
          else echo 'Configured DigitalOcean SSH key could not be decoded.' >&2; rm -f /tmp/3dvr-agent-key.raw /tmp/3dvr-agent-key; exit 1; fi
          chmod 600 /tmp/3dvr-agent-key
          rm -f /tmp/3dvr-agent-key.raw
          printf '%s\n' '167.172.193.194 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFoepoGbXWiidk4axaBwsI1Y/GWVckiqJxGLkBpTV6Pc' > /tmp/3dvr-known-hosts
          chmod 600 /tmp/3dvr-known-hosts
          echo 'present=true' >> "$GITHUB_OUTPUT"
      - name: Stage release over SSH without touching live runtime
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          opts=(-i /tmp/3dvr-agent-key -o BatchMode=yes -o UserKnownHostsFile=/tmp/3dvr-known-hosts -o StrictHostKeyChecking=yes -o ConnectTimeout=10)
          ssh "${opts[@]}" "$DO_AGENT_USER@$DO_AGENT_HOST" "GITHUB_REPOSITORY='$GITHUB_REPOSITORY' GITHUB_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          mkdir -p "$HOME/.3dvr/locks"
          command -v flock >/dev/null 2>&1 || { echo 'flock is required for serialized agent deploys.' >&2; exit 1; }
          exec 9>"$HOME/.3dvr/locks/agent-deploy.lock"
          if ! flock -w 90 9; then
            echo 'Timed out waiting 90 seconds for DigitalOcean agent deploy lock.' >&2
            if command -v lslocks >/dev/null 2>&1; then
              lslocks -o PID,COMMAND,PATH 2>/dev/null | grep -F "$HOME/.3dvr/locks/agent-deploy.lock" || true
            fi
            exit 1
          fi
          # This is source-only staging: it never starts a worker, so the
          # existing task queue must not block source reconciliation.
          # Task-ID admission and fail-closed queue checks belong exclusively
          # to a separately approved activation workflow.
          # Stage source in a separate checkout. Never alter the live portal,
          # dependency tree, daemon configuration, or historical task queue.
          stage="$HOME/.3dvr/portal-release-stage"
          # A symlink or linked worktree can make a clean "stage" checkout
          # alias a live runtime. Check identity before any fetch or checkout.
          assert_isolated_stage() {
            local candidate="$1" expected_origin="$2"
            local resolved top git_dir common_dir origin live live_real
            if [ -L "$HOME/.3dvr" ] || [ -L "$candidate" ] || [ -L "$candidate/.git" ] || [ ! -d "$candidate/.git" ]; then
              echo 'Release stage must be a standalone, non-symlinked Git checkout.' >&2
              return 1
            fi
            resolved=$(realpath -e -- "$candidate") || return 1
            top=$(realpath -e -- "$(git -C "$candidate" rev-parse --show-toplevel)") || return 1
            git_dir=$(realpath -e -- "$(git -C "$candidate" rev-parse --absolute-git-dir)") || return 1
            common_dir=$(realpath -e -- "$(git -C "$candidate" rev-parse --path-format=absolute --git-common-dir)") || return 1
            if [ "$resolved" != "$top" ] || [ "$git_dir" != "$resolved/.git" ] || [ "$common_dir" != "$git_dir" ]; then
              echo 'Release stage aliases another checkout or Git directory.' >&2
              return 1
            fi
            origin=$(git -C "$candidate" config --get remote.origin.url) || return 1
            if [ "$origin" != "$expected_origin" ]; then
              echo 'Release stage origin does not match the approved repository.' >&2
              return 1
            fi
            # Known live agent and Portal roots must never be staged in place,
            # including when a bind mount aliases a directory by inode.
            for live in /opt/3dvr-agent /opt/3dvr-portal-production/current "$HOME/3dvr-portal" "$HOME/.3dvr/portal"; do
              [ -e "$live" ] || continue
              live_real=$(realpath -e -- "$live") || return 1
              if [ "$resolved" = "$live_real" ] || [[ "$resolved" == "$live_real/"* ]] || [[ "$live_real" == "$resolved/"* ]] || [ "$(stat -Lc '%d:%i' "$candidate")" = "$(stat -Lc '%d:%i' "$live")" ]; then
                echo 'Release stage overlaps a known live runtime checkout.' >&2
                return 1
              fi
            done
          }
          if [ -L "$HOME/.3dvr" ] || [ -L "$stage" ]; then
            echo 'Release staging path or parent is a symlink; refusing to stage.' >&2
            exit 1
          fi
          if [ ! -d "$stage/.git" ]; then
            [ ! -e "$stage" ] || { echo 'Release stage path exists but is not a Git checkout.' >&2; exit 1; }
            git clone "https://github.com/$GITHUB_REPOSITORY.git" "$stage"
          fi
          assert_isolated_stage "$stage" "https://github.com/$GITHUB_REPOSITORY.git"
          if ! git -C "$stage" diff --quiet || ! git -C "$stage" diff --cached --quiet || [ -n "$(git -C "$stage" ls-files --others --exclude-standard)" ]; then
            echo 'Release staging checkout has local changes; refusing to overwrite.' >&2
            exit 1
          fi
          git -C "$stage" fetch --prune origin main
          # Only stage the exact reviewed workflow commit, not a newer main
          # revision that may have landed after this dispatch was approved.
          git -C "$stage" merge-base --is-ancestor "$GITHUB_SHA" origin/main
          git -C "$stage" checkout --detach "$GITHUB_SHA"
          test "$(git -C "$stage" rev-parse HEAD)" = "$GITHUB_SHA"
          echo 'Exact release revision staged separately; live workers, dependencies and queue untouched.'
          REMOTE
      # Staging may be checked for revision consistency. Activation and runtime
      # acceptance require a separately reviewed, task-pinned release path.
      - name: Verify staged revision without runtime mutation
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          opts=(-i /tmp/3dvr-agent-key -o BatchMode=yes -o UserKnownHostsFile=/tmp/3dvr-known-hosts -o StrictHostKeyChecking=yes -o ConnectTimeout=10)
          ssh "${opts[@]}" "$DO_AGENT_USER@$DO_AGENT_HOST" "GITHUB_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          stage="$HOME/.3dvr/portal-release-stage"
          test ! -L "$HOME/.3dvr"
          test ! -L "$stage"
          test ! -L "$stage/.git"
          test -d "$stage/.git"
          test "$(realpath -e -- "$(git -C "$stage" rev-parse --show-toplevel)")" = "$(realpath -e -- "$stage")"
          test "$(realpath -e -- "$(git -C "$stage" rev-parse --absolute-git-dir)")" = "$(realpath -e -- "$stage")/.git"
          test "$(realpath -e -- "$(git -C "$stage" rev-parse --path-format=absolute --git-common-dir)")" = "$(realpath -e -- "$stage")/.git"
          test "$(git -C "$stage" rev-parse HEAD)" = "$GITHUB_SHA"
          echo 'Exact staged revision verified read-only; live worker unchanged and execution unverified.'
          REMOTE
      - name: Publish worker deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          SSH_OUTCOME: ${{ steps.ssh_key.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure; description='DigitalOcean isolated release staging failed'
          if [ "$SSH_OUTCOME" != success ]; then description='DigitalOcean agent SSH credential unavailable'
          elif [ "$DEPLOY_OUTCOME" != success ]; then description='DigitalOcean release staging over SSH failed'
          elif [ "$VERIFY_OUTCOME" != success ]; then description='DigitalOcean staged revision verification failed'
          else state=success; description='DigitalOcean source staged; live worker unchanged'; fi
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "{\"state\":\"$state\",\"context\":\"3DVR DigitalOcean Worker\",\"description\":\"$description\"}"
      - name: Remove SSH key
        if: always()
        shell: bash
        run: rm -f /tmp/3dvr-agent-key /tmp/3dvr-agent-key.raw /tmp/3dvr-known-hosts
