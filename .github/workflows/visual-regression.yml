name: Visual Regression AI Review

on:
  pull_request:
    branches:
      - main
    paths:
      - 'noteverse/**'
      - 'driftspace/**'
      - 'space-jetpack/**'
      - 'jetpack/**'
      - 'scripts/playwright/**'
      - 'visual-regression.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/visual-regression.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Capture baseline and candidate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium runtime
        env:
          PLAYWRIGHT_BROWSERS: chromium
        run: npm run playwright:install:linux

      - name: Checkout baseline worktree
        run: |
          rm -rf /tmp/3dvr-visual-base
          git worktree add --detach /tmp/3dvr-visual-base "${{ github.event.pull_request.base.sha }}"

      - name: Capture, compare, and review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VISUAL_REVIEW_MODEL: ${{ vars.VISUAL_REVIEW_MODEL }}
        run: |
          npm run visual:regression -- \
            --baseline-root /tmp/3dvr-visual-base \
            --candidate-root "$GITHUB_WORKSPACE" \
            --output .tmp/visual-regression

      - name: Add workflow summary
        if: always()
        run: |
          if [ -f .tmp/visual-regression/summary.md ]; then
            cat .tmp/visual-regression/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '# Visual regression review' >> "$GITHUB_STEP_SUMMARY"
            echo 'The visual regression suite did not produce a summary.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-${{ github.event.pull_request.number }}
          path: .tmp/visual-regression
          if-no-files-found: warn
          retention-days: 14

      - name: Comment on pull request
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- 3dvr-visual-regression -->';
            const path = '.tmp/visual-regression/summary.md';
            const summary = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : '# Visual regression review\n\nThe suite did not produce a summary.';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n${summary.slice(0, 55000)}\n\n[Full video + frame artifacts](${runUrl})`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
