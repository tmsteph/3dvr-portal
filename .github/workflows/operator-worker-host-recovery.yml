name: Recover Operator Worker Host

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/operator-worker-host-recovery.yml'
      - 'ops/operator-worker-host-recovery-trigger.txt'

permissions:
  contents: read
  statuses: write

concurrency:
  group: 3dvr-operator-worker-host-recovery
  cancel-in-progress: true

env:
  KNOWN_HOST: 167.172.193.194

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve worker host and credentials
        id: resolve
        shell: bash
        env:
          SSH_A: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
          SSH_B: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_C: ${{ secrets.SSH_PRIVATE_KEY }}
          DO_A: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          DO_B: ${{ secrets.DIGITALOCEAN_TOKEN }}
          DO_C: ${{ secrets.DO_TOKEN }}
        run: |
          set -euo pipefail
          ssh_key=''; do_token=''
          for x in "$SSH_A" "$SSH_B" "$SSH_C"; do
            if [ -z "$ssh_key" ] && [ -n "$x" ]; then ssh_key="$x"; fi
          done
          for x in "$DO_A" "$DO_B" "$DO_C"; do
            if [ -z "$do_token" ] && [ -n "$x" ]; then do_token="$x"; fi
          done

          echo "ssh_present=$([ -n "$ssh_key" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "token_present=$([ -n "$do_token" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

          target="$KNOWN_HOST"
          power_action=unavailable
          if [ -n "$do_token" ]; then
            code="$(curl -sS -o /tmp/droplets.json -w '%{http_code}' -H "Authorization: Bearer $do_token" 'https://api.digitalocean.com/v2/droplets?per_page=200' || true)"
            if [ "$code" = 200 ]; then
              read -r id state ip < <(python3 - "$KNOWN_HOST" <<'PY'
import json,sys
known=sys.argv[1]
data=json.load(open('/tmp/droplets.json'))
for d in data.get('droplets',[]):
    ips=[v.get('ip_address','') for v in d.get('networks',{}).get('v4',[]) if v.get('type')=='public']
    if known in ips or d.get('name')=='3dvr-agent':
        print(d.get('id',''), d.get('status',''), ips[0] if ips else '')
        break
else:
    print('','','')
PY
              )
              if [ -n "${id:-}" ]; then
                [ -n "${ip:-}" ] && target="$ip"
                if [ "${state:-}" = off ]; then
                  action_code="$(curl -sS -o /tmp/power.json -w '%{http_code}' -X POST -H "Authorization: Bearer $do_token" -H 'Content-Type: application/json' -d '{"type":"power_on"}' "https://api.digitalocean.com/v2/droplets/$id/actions" || true)"
                  if [ "$action_code" = 201 ]; then power_action=power_on; else power_action=power_failed; fi
                  sleep 15
                else
                  power_action=already_active
                fi
              else
                power_action=not_found
              fi
            else
              power_action=api_unavailable
            fi
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "power_action=$power_action" >> "$GITHUB_OUTPUT"

          if [ -n "$ssh_key" ]; then
            umask 077
            printf '%s\n' "$ssh_key" > /tmp/key.raw
            if grep -q 'BEGIN .*PRIVATE KEY' /tmp/key.raw; then
              cp /tmp/key.raw /tmp/key
            elif base64 -d /tmp/key.raw > /tmp/key 2>/dev/null && grep -q 'BEGIN .*PRIVATE KEY' /tmp/key; then
              :
            else
              rm -f /tmp/key
            fi
            chmod 600 /tmp/key 2>/dev/null || true
            rm -f /tmp/key.raw
          fi
          rm -f /tmp/droplets.json /tmp/power.json

      - name: Probe SSH port
        id: probe
        shell: bash
        env:
          TARGET: ${{ steps.resolve.outputs.target }}
        run: |
          set -euo pipefail
          if timeout 6 bash -c "</dev/tcp/$TARGET/22" 2>/dev/null; then
            echo 'port22=true' >> "$GITHUB_OUTPUT"
          else
            echo 'port22=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Recover managed worker and process Forge queue
        id: recover
        if: steps.resolve.outputs.ssh_present == 'true' && steps.probe.outputs.port22 == 'true'
        continue-on-error: true
        shell: bash
        env:
          TARGET: ${{ steps.resolve.outputs.target }}
          OWNER_ALIAS: ${{ vars.THREEDVR_AGENT_TASK_OWNER_ALIAS || '3dvr-managed' }}
        run: |
          set -euo pipefail
          [ -f /tmp/key ]
          opts=(-i /tmp/key -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10)
          ssh "${opts[@]}" "root@$TARGET" \
            "GITHUB_REPOSITORY='$GITHUB_REPOSITORY' GITHUB_SHA='$GITHUB_SHA' OWNER_ALIAS='$OWNER_ALIAS' bash -s" <<'REMOTE'
          set -euo pipefail
          repo="$HOME/.3dvr/portal"
          mkdir -p "$HOME/.3dvr"
          if [ ! -d "$repo/.git" ]; then
            rm -rf "$repo"
            git clone "https://github.com/$GITHUB_REPOSITORY.git" "$repo"
          fi

          if ! git -C "$repo" diff --quiet || ! git -C "$repo" diff --cached --quiet; then
            echo 'Worker checkout has uncommitted changes; refusing to overwrite them.' >&2
            git -C "$repo" status --short >&2
            exit 42
          fi

          git -C "$repo" fetch --prune origin main
          git -C "$repo" checkout main
          git -C "$repo" pull --ff-only origin main
          npm --prefix "$repo/apps/agent" ci

          cfg="$HOME/.3dvr/config/env"
          mkdir -p "$(dirname "$cfg")"
          touch "$cfg"
          chmod 600 "$cfg" || true
          cfg_tmp="$(mktemp)"
          awk -v owner="$OWNER_ALIAS" '
            BEGIN { found=0 }
            /^THREEDVR_AGENT_OWNER_ALIAS=/ { print "THREEDVR_AGENT_OWNER_ALIAS=" owner; found=1; next }
            { print }
            END { if (!found) print "THREEDVR_AGENT_OWNER_ALIAS=" owner }
          ' "$cfg" > "$cfg_tmp"
          cat "$cfg_tmp" > "$cfg"
          rm -f "$cfg_tmp"

          scripts="$repo/apps/agent/thomas-agent/scripts"
          "$scripts/ask-agent-worker-daemon" stop || true
          "$scripts/ask-agent-worker-daemon" start
          "$scripts/ask-agent-worker-daemon" status

          set -a
          . "$cfg"
          set +a
          cd "$repo/apps/agent"
          node thomas-agent/node/operator-forge-worker.js run-once --json
          REMOTE
          echo 'recovered=true' >> "$GITHUB_OUTPUT"

      - name: Publish recovery status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SSH_PRESENT: ${{ steps.resolve.outputs.ssh_present }}
          TOKEN_PRESENT: ${{ steps.resolve.outputs.token_present }}
          POWER_ACTION: ${{ steps.resolve.outputs.power_action }}
          PORT22: ${{ steps.probe.outputs.port22 }}
          RECOVER_OUTCOME: ${{ steps.recover.outcome }}
        run: |
          set -euo pipefail
          state=failure
          description='Operator worker host recovery failed'
          if [ "$SSH_PRESENT" != true ]; then
            description='Operator worker SSH credential unavailable'
          elif [ "$PORT22" != true ]; then
            description="Operator worker host unreachable on SSH; power=$POWER_ACTION token=$TOKEN_PRESENT"
          elif [ "$RECOVER_OUTCOME" != success ]; then
            description='Operator worker SSH reached host but recovery command failed'
          else
            state=success
            description='Operator worker recovered and Forge queue pass completed'
          fi
          target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          payload="$(python3 - "$state" "$description" "$target_url" <<'PY'
import json,sys
print(json.dumps({'state':sys.argv[1],'context':'3DVR Operator Worker Recovery','description':sys.argv[2][:140],'target_url':sys.argv[3]}))
PY
          )"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload"
          rm -f /tmp/key
          [ "$state" = success ]

# recovery trigger 2026-08-24T01:30:00Z
