name: Recover Operator Worker Host

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/operator-worker-host-recovery.yml'
      - 'ops/operator-worker-host-recovery-trigger.txt'

permissions:
  contents: read
  statuses: write

concurrency:
  group: 3dvr-operator-worker-host-recovery
  cancel-in-progress: false

env:
  WORKER_HOST: 167.233.174.20

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Hetzner worker credentials
        id: resolve
        shell: bash
        env:
          SSH_A: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
          SSH_B: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_C: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          write_key() {
            local raw="$1" dest="$2"
            [ -n "$raw" ] || return 0
            printf '%s\n' "$raw" > "$dest.raw"
            if grep -q 'BEGIN .*PRIVATE KEY' "$dest.raw"; then
              cp "$dest.raw" "$dest"
            elif base64 -d "$dest.raw" > "$dest" 2>/dev/null && grep -q 'BEGIN .*PRIVATE KEY' "$dest"; then
              :
            else
              rm -f "$dest" "$dest.raw"
              return 0
            fi
            chmod 600 "$dest"
            rm -f "$dest.raw"
          }
          write_key "$SSH_A" /tmp/worker-a
          write_key "$SSH_B" /tmp/worker-b
          write_key "$SSH_C" /tmp/worker-c

          selected=''
          selected_user=''
          for user in root debian ubuntu tmsteph; do
            for key in /tmp/worker-a /tmp/worker-b /tmp/worker-c; do
              [ -f "$key" ] || continue
              if ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 "$user@$WORKER_HOST" true >/dev/null 2>&1; then
                selected="$key"
                selected_user="$user"
                break 2
              fi
            done
          done
          [ -n "$selected" ] || { echo 'Hetzner worker host is not reachable with configured SSH keys.' >&2; exit 1; }
          cp "$selected" /tmp/key
          chmod 600 /tmp/key
          rm -f /tmp/worker-a /tmp/worker-b /tmp/worker-c
          echo "user=$selected_user" >> "$GITHUB_OUTPUT"
          echo 'ssh_present=true' >> "$GITHUB_OUTPUT"
          echo "Worker target: $selected_user@$WORKER_HOST"

      - name: Recover managed worker and process Forge queue
        id: recover
        continue-on-error: true
        shell: bash
        env:
          WORKER_USER: ${{ steps.resolve.outputs.user }}
          OWNER_ALIAS: ${{ vars.THREEDVR_AGENT_TASK_OWNER_ALIAS || '3dvr-managed' }}
        run: |
          set -euo pipefail
          opts=(-i /tmp/key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10)
          ssh "${opts[@]}" "$WORKER_USER@$WORKER_HOST" \
            "GITHUB_REPOSITORY='$GITHUB_REPOSITORY' GITHUB_SHA='$GITHUB_SHA' OWNER_ALIAS='$OWNER_ALIAS' bash -s" <<'REMOTE'
          set -euo pipefail
          repo="$HOME/.3dvr/portal"
          mkdir -p "$HOME/.3dvr"
          if [ ! -d "$repo/.git" ]; then
            rm -rf "$repo"
            git clone "https://github.com/$GITHUB_REPOSITORY.git" "$repo"
          fi

          if ! git -C "$repo" diff --quiet || ! git -C "$repo" diff --cached --quiet; then
            echo 'Worker checkout has uncommitted changes; refusing to overwrite them.' >&2
            git -C "$repo" status --short >&2
            exit 42
          fi

          git -C "$repo" fetch --prune origin main
          git -C "$repo" checkout main
          git -C "$repo" pull --ff-only origin main
          npm --prefix "$repo/apps/agent" ci

          cfg="$HOME/.3dvr/config/env"
          mkdir -p "$(dirname "$cfg")"
          touch "$cfg"
          chmod 600 "$cfg" || true
          cfg_tmp="$(mktemp)"
          awk -v owner="$OWNER_ALIAS" '
            BEGIN { found=0 }
            /^THREEDVR_AGENT_OWNER_ALIAS=/ { print "THREEDVR_AGENT_OWNER_ALIAS=" owner; found=1; next }
            { print }
            END { if (!found) print "THREEDVR_AGENT_OWNER_ALIAS=" owner }
          ' "$cfg" > "$cfg_tmp"
          cat "$cfg_tmp" > "$cfg"
          rm -f "$cfg_tmp"

          scripts="$repo/apps/agent/thomas-agent/scripts"
          "$scripts/ask-agent-worker-daemon" stop || true
          "$scripts/ask-agent-worker-daemon" start
          "$scripts/ask-agent-worker-daemon" status

          set -a
          . "$cfg"
          set +a
          cd "$repo/apps/agent"
          node thomas-agent/node/operator-forge-worker.js run-once --json
          REMOTE
          echo 'recovered=true' >> "$GITHUB_OUTPUT"

      - name: Publish recovery status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SSH_PRESENT: ${{ steps.resolve.outputs.ssh_present }}
          RECOVER_OUTCOME: ${{ steps.recover.outcome }}
        run: |
          set -euo pipefail
          state=failure
          description='Hetzner Operator worker recovery failed'
          if [ "$SSH_PRESENT" != true ]; then
            description='Hetzner Operator worker SSH unavailable'
          elif [ "$RECOVER_OUTCOME" = success ]; then
            state=success
            description='Hetzner Operator worker recovered and Forge queue pass completed'
          fi
          target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          payload="$(python3 - "$state" "$description" "$target_url" <<'PY'
          import json,sys
          print(json.dumps({'state':sys.argv[1],'context':'3DVR Operator Worker Recovery','description':sys.argv[2][:140],'target_url':sys.argv[3]}))
          PY
          )"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload"
          rm -f /tmp/key
          [ "$state" = success ]
