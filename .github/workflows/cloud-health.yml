name: 3DVR Cloud Health

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  ssh-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe cloud nodes
        shell: bash
        env:
          SSH_A: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
          SSH_B: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_C: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          write_key() {
            local raw="$1" dest="$2"
            [ -n "$raw" ] || return 0
            printf '%s\n' "$raw" > "$dest.raw"
            if grep -q 'BEGIN .*PRIVATE KEY' "$dest.raw"; then
              cp "$dest.raw" "$dest"
            elif base64 -d "$dest.raw" > "$dest" 2>/dev/null && grep -q 'BEGIN .*PRIVATE KEY' "$dest"; then
              :
            else
              rm -f "$dest" "$dest.raw"
              return 0
            fi
            chmod 600 "$dest"
            rm -f "$dest.raw"
          }
          write_key "$SSH_A" /tmp/h-a
          write_key "$SSH_B" /tmp/h-b
          write_key "$SSH_C" /tmp/h-c

          probe() {
            local name="$1" host="$2"; shift 2
            local user key
            for user in "$@"; do
              for key in /tmp/h-a /tmp/h-b /tmp/h-c; do
                [ -f "$key" ] || continue
                if ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=6 "$user@$host" \
                  'printf "%s | %s | root-disk=%s\n" "$(hostname)" "$(uptime -p)" "$(df -P / | tail -1 | awk '\''{print $5}'\'')"'; then
                  echo "$name healthy via $user@$host"
                  return 0
                fi
              done
            done
            echo "::error::$name is unreachable over SSH ($host)"
            return 1
          }

          failures=0
          probe OVH 40.160.137.41 debian root || failures=$((failures+1))
          probe Hetzner 167.233.174.20 root debian ubuntu tmsteph || failures=$((failures+1))
          probe DigitalOcean 167.172.193.194 root debian || failures=$((failures+1))
          [ "$failures" -eq 0 ]
