name: Patch 3DVR OS GUN auth integration

on:
  push:
    branches:
      - feature/3dvr-os-gun-auth
    paths:
      - '.github/workflows/patch-3dvr-os-gun-auth.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/3dvr-os-gun-auth
          fetch-depth: 0

      - name: Wire auth and encrypted persistence into 3DVR OS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('3dvr-os/index.html')
          text = path.read_text()

          scripts = '''  <script defer src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>\n  <script defer src="https://cdn.jsdelivr.net/npm/gun/sea.js"></script>\n  <script defer src="/auth.js"></script>\n'''
          if '/auth.js' not in text:
              text = text.replace('</head>', scripts + '</head>', 1)

          text = text.replace(
              'Your files stay local to this browser for now.',
              'Your files stay local-first and sync encrypted through GUN when you sign in.'
          )

          marker = 'let fs=loadFS();function loadFS()'
          replacement = '''let fs=loadFS();window.addEventListener('daedalos:filesystem',event=>{const remote=event.detail&&event.detail.fs;if(!remote||typeof remote!=='object'||Array.isArray(remote))return;fs={...starterFS,...remote};if($('#window-files')?.classList.contains('open'))renderFiles();if($('#window-editor')?.classList.contains('open')&&fs[editorFile]!==undefined)loadEditor(editorFile);toast('Workspace synced')});function loadFS()'''
          if marker in text:
              text = text.replace(marker, replacement, 1)
          elif 'daedalos:filesystem' not in text:
              raise SystemExit('filesystem integration marker not found')

          text = text.replace(
              "case'whoami':termPrint('tommy');",
              "case'whoami':termPrint(window.DaedalosIdentity?.username||'tommy');",
              1
          )

          path.write_text(text)
          PY

      - name: Validate static integration
        shell: bash
        run: |
          grep -q 'src="/auth.js"' 3dvr-os/index.html
          grep -q 'daedalos:filesystem' 3dvr-os/index.html
          grep -q 'DaedalosIdentity' 3dvr-os/index.html
          grep -q 'gun-relay-3dvr.fly.dev/gun' 3dvr-os/auth.js
          node --check 3dvr-os/auth.js

      - name: Commit patch to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name '3dvr-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add 3dvr-os/index.html
          if git diff --cached --quiet; then
            echo 'Index integration already applied.'
            exit 0
          fi
          git commit -m 'Wire GUN auth into 3DVR OS shell'
          git push origin HEAD:feature/3dvr-os-gun-auth
