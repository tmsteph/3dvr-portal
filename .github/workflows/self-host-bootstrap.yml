name: Bootstrap Self-Hosted 3DVR Portal

on:
  push:
    branches:
      - main
    paths:
      - 'ops/self-host-bootstrap-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 3dvr-self-host-bootstrap
  cancel-in-progress: true

env:
  HOST: 167.172.193.194
  VERCEL_ORG_ID: team_xxJGO7S7h1ZP4BHidYV0CX9Z
  VERCEL_PROJECT_ID: prj_rAhxzdSdrK9MwKjUMeAXGxk8z8Ch

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Resolve persistent SSH credential
        shell: bash
        env:
          SSH_A: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
          SSH_B: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_C: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          ssh_key=''
          for value in "$SSH_A" "$SSH_B" "$SSH_C"; do
            if [ -z "$ssh_key" ] && [ -n "$value" ]; then ssh_key="$value"; fi
          done
          [ -n "$ssh_key" ] || { echo 'No 3DVR server SSH private key is configured.' >&2; exit 1; }
          umask 077
          printf '%s\n' "$ssh_key" > /tmp/3dvr-key.raw
          if grep -q 'BEGIN .*PRIVATE KEY' /tmp/3dvr-key.raw; then
            cp /tmp/3dvr-key.raw /tmp/3dvr-key
          elif base64 -d /tmp/3dvr-key.raw > /tmp/3dvr-key 2>/dev/null && grep -q 'BEGIN .*PRIVATE KEY' /tmp/3dvr-key; then
            :
          else
            echo 'Configured 3DVR SSH key is invalid.' >&2
            exit 1
          fi
          chmod 600 /tmp/3dvr-key
          rm -f /tmp/3dvr-key.raw

      - name: Pull canonical Vercel production environment
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$VERCEL_TOKEN" ] || { echo 'VERCEL_TOKEN is not configured.' >&2; exit 1; }
          npm install --global vercel
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          test -s .vercel/.env.production.local

      - name: Migrate Vercel environment to self-host
        shell: bash
        env:
          TARGET: ${{ env.HOST }}
        run: |
          set -euo pipefail
          env_file=.vercel/.env.production.local
          updates="$(mktemp)"
          trap 'rm -f "$updates" /tmp/3dvr-key' EXIT
          umask 077

          mapfile -t keys < <(sed -n 's/^\([A-Za-z_][A-Za-z0-9_]*\)=.*/\1/p' "$env_file" | sort -u)
          set -a
          . "$env_file"
          set +a

          : > "$updates"
          for key in "${keys[@]}"; do
            case "$key" in
              VERCEL_*|NEXT_PUBLIC_VERCEL_*|TURBO_*) continue ;;
            esac
            value="${!key-}"
            printf '%s=%q\n' "$key" "$value" >> "$updates"
          done
          [ -s "$updates" ] || { echo 'No portable Vercel environment variables were found.' >&2; exit 1; }

          opts=(-i /tmp/3dvr-key -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10)
          scp "${opts[@]}" "$updates" "root@$TARGET:/tmp/3dvr-vercel-env.updates"
          scp "${opts[@]}" scripts/ops/merge-env-updates.sh "root@$TARGET:/tmp/3dvr-merge-env-updates.sh"
          ssh "${opts[@]}" "root@$TARGET" 'bash -s' <<'REMOTE'
          set -euo pipefail
          config_dir="$HOME/.3dvr/config"
          secrets_env="$config_dir/portal-secrets.env"
          updates=/tmp/3dvr-vercel-env.updates
          merge_script=/tmp/3dvr-merge-env-updates.sh
          trap 'rm -f "$updates" "$merge_script"' EXIT
          chmod 600 "$updates" "$merge_script"
          bash "$merge_script" "$secrets_env" "$updates"
          set -a
          . "$secrets_env"
          set +a
          [ -n "${OPENAI_API_KEY:-}" ] || [ -n "${AI_GATEWAY_API_KEY:-}" ] || {
            echo 'Vercel migration completed, but no OpenAI or AI Gateway credential was present.' >&2
            exit 1
          }
          echo 'Canonical Vercel production environment migrated to the self-host runtime.'
          REMOTE
