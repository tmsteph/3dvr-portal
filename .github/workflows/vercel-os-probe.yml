name: Probe 3DVR OS live response

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/vercel-os-probe.yml'

permissions:
  contents: read

env:
  DEV_HOST: 167.71.156.94
  SSH_USER: root

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve server SSH key
        shell: bash
        env:
          SSH_A: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
          SSH_B: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_C: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key=''
          for candidate in "$SSH_A" "$SSH_B" "$SSH_C"; do
            if [ -z "$key" ] && [ -n "$candidate" ]; then key="$candidate"; fi
          done
          [ -n "$key" ] || exit 1
          umask 077
          printf '%s\n' "$key" > /tmp/key.raw
          if grep -q 'BEGIN .*PRIVATE KEY' /tmp/key.raw; then cp /tmp/key.raw /tmp/key; else base64 -d /tmp/key.raw > /tmp/key; fi
          chmod 600 /tmp/key

      - name: Probe from 3dvr-dev
        shell: bash
        run: |
          set -euo pipefail
          ssh -i /tmp/key -o BatchMode=yes -o StrictHostKeyChecking=accept-new root@$DEV_HOST 'bash -s' <<'REMOTE'
          set +e
          urls=(
            'https://3dvr-f7qrqbmgz-3dvr.vercel.app/'
            'https://os.3dvr.tech/'
            'https://portal.3dvr.tech/'
            'https://3dvr.tech/'
          )
          i=0
          for url in "${urls[@]}"; do
            i=$((i+1))
            echo "===== $url ====="
            rm -f "/tmp/probe-$i.headers" "/tmp/probe-$i.body"
            curl -sS -L --max-time 20 -D "/tmp/probe-$i.headers" -o "/tmp/probe-$i.body" \
              -w 'status=%{http_code} final=%{url_effective} bytes=%{size_download}\n' "$url"
            echo '-- response headers --'
            grep -Ei '^(HTTP/|content-type:|location:|server:|x-vercel|cache-control:)' "/tmp/probe-$i.headers" | tail -20
            echo '-- title --'
            grep -Eoi '<title>[^<]+' "/tmp/probe-$i.body" | head -2
            echo '-- app markers --'
            grep -Eo 'Daedalos|TommyOS|3DVR|Authentication|Sign in|404|NOT_FOUND' "/tmp/probe-$i.body" | sort -u | tr '\n' ' '; echo
            echo '-- body prefix --'
            head -c 400 "/tmp/probe-$i.body" | tr '\n' ' '; echo
          done

          echo '===== authenticated Vercel curl ====='
          npx --yes vercel@latest curl https://3dvr-f7qrqbmgz-3dvr.vercel.app/ --scope 3dvr 2>&1 | head -c 800
          echo
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f /tmp/key /tmp/key.raw
