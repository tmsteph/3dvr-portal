name: LicheePi One-Shot State Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/licheepi-oneshot-state-audit.yml'
      - 'scripts/ops/licheepi-oneshot-state-audit.sh'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Audit live one-shot boot state without writes
        env:
          SSH_A: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
          SSH_B: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_C: ${{ secrets.SSH_PRIVATE_KEY }}
          OVH_HOST: 40.160.137.41
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/ops/licheepi-oneshot-state-audit.sh
