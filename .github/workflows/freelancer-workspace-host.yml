name: Freelancer Workspace Host

on:
  push:
    branches: [main]
    paths:
      - 'apps/agent/thomas-agent/node/freelancer-workspace*.js'
      - 'apps/agent/thomas-agent/scripts/ask-freelancer-workspace'
      - 'apps/agent/test/freelancer-workspace-runtime.test.js'
      - 'ops/host/install-resource-lanes.sh'
      - '.github/workflows/freelancer-workspace-host.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  WORKSPACE_HOST: 40.160.137.41
  SSH_USER: debian

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve server SSH key
        shell: bash
        env:
          SSH_A: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
          SSH_B: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_C: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key=''
          for candidate in "$SSH_A" "$SSH_B" "$SSH_C"; do
            if [ -z "$key" ] && [ -n "$candidate" ]; then key="$candidate"; fi
          done
          [ -n "$key" ] || { echo '::error::No 3DVR server SSH key is configured.'; exit 1; }
          umask 077
          printf '%s\n' "$key" > /tmp/3dvr-workspace-key.raw
          if grep -q 'BEGIN .*PRIVATE KEY' /tmp/3dvr-workspace-key.raw; then
            cp /tmp/3dvr-workspace-key.raw /tmp/3dvr-workspace-key
          elif base64 -d /tmp/3dvr-workspace-key.raw > /tmp/3dvr-workspace-key 2>/dev/null && grep -q 'BEGIN .*PRIVATE KEY' /tmp/3dvr-workspace-key; then
            :
          else
            echo '::error::Configured SSH key could not be decoded.'
            exit 1
          fi
          chmod 600 /tmp/3dvr-workspace-key
          rm -f /tmp/3dvr-workspace-key.raw
          echo "OVH_DEPLOY_PUBLIC_KEY=$(ssh-keygen -y -f /tmp/3dvr-workspace-key)"

      - name: Configure OVH workspace host
        id: configure
        shell: bash
        run: |
          set -euo pipefail
          opts=(-i /tmp/3dvr-workspace-key -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10)
          ssh "${opts[@]}" "$SSH_USER@$WORKSPACE_HOST" "GITHUB_REPOSITORY='$GITHUB_REPOSITORY' GITHUB_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          repo="$HOME/.3dvr/freelancer-workspace-host"
          mkdir -p "$HOME/.3dvr"
          if [ ! -d "$repo/.git" ]; then
            git clone "https://github.com/$GITHUB_REPOSITORY.git" "$repo"
          fi
          git -C "$repo" fetch --prune origin main
          git -C "$repo" checkout -B main origin/main
          git -C "$repo" reset --hard origin/main
          git -C "$repo" merge-base --is-ancestor "$GITHUB_SHA" HEAD

          sudo bash "$repo/ops/host/install-resource-lanes.sh"

          current_node_major="$(node -p 'Number(process.versions.node.split(".")[0])' 2>/dev/null || echo 0)"
          if [ "$current_node_major" -lt 22 ]; then
            echo "Upgrading OVH host Node.js from major $current_node_major to 22..."
            sudo apt-get update -qq
            sudo apt-get install -y ca-certificates curl
            curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y nodejs
            hash -r
          fi

          node_bin="$(command -v node || true)"
          [ -n "$node_bin" ] || { echo 'Node is not installed on workspace host.' >&2; exit 1; }
          node_major="$($node_bin -p 'Number(process.versions.node.split(".")[0])')"
          [ "$node_major" -ge 22 ] || { echo "Node 22+ is required; found $($node_bin --version)." >&2; exit 1; }
          echo "HOST_NODE=$($node_bin --version)"
          "$node_bin" --check "$repo/apps/agent/thomas-agent/node/freelancer-workspace-runtime.js"
          "$node_bin" --check "$repo/apps/agent/thomas-agent/node/freelancer-workspace.js"
          PATH="$(dirname "$node_bin"):$PATH" FREELANCER_WORKSPACE_ROOT="$HOME/.3dvr/freelancer-workspaces" \
            bash "$repo/apps/agent/thomas-agent/scripts/ask-freelancer-workspace" status fw-host-health --json

          if command -v docker >/dev/null 2>&1 && docker version >/dev/null 2>&1; then
            echo 'WORKSPACE_DOCKER_READY=1'
            docker ps --filter 'label=3dvr.kind=freelancer-workspace' --format 'WORKSPACE={{.Names}} STATUS={{.Status}}'
          else
            echo 'WORKSPACE_DOCKER_READY=0'
            echo 'Workspace runtime is installed; Docker host setup is still required before provisioning.'
          fi

          /usr/local/bin/3dvr-lane-status
          REMOTE

      - name: Publish OVH host status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ steps.configure.outcome }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: '3DVR OVH resource lanes',
              description: ok ? 'OVH resource lanes active' : 'OVH resource lane deployment failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Remove SSH key
        if: always()
        shell: bash
        run: rm -f /tmp/3dvr-workspace-key /tmp/3dvr-workspace-key.raw
