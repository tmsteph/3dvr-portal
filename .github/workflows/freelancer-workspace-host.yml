name: Freelancer Workspace Host

on:
  push:
    branches: [main]
    paths:
      - 'apps/agent/thomas-agent/node/freelancer-workspace*.js'
      - 'apps/agent/thomas-agent/scripts/ask-freelancer-workspace'
      - 'apps/agent/test/freelancer-workspace-runtime.test.js'
      - '.github/workflows/freelancer-workspace-host.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  WORKSPACE_HOST: 167.71.156.94
  SSH_USER: root

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve server SSH key
        shell: bash
        env:
          SSH_A: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
          SSH_B: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_C: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key=''
          for candidate in "$SSH_A" "$SSH_B" "$SSH_C"; do
            if [ -z "$key" ] && [ -n "$candidate" ]; then key="$candidate"; fi
          done
          [ -n "$key" ] || { echo '::error::No 3DVR server SSH key is configured.'; exit 1; }
          umask 077
          printf '%s\n' "$key" > /tmp/3dvr-workspace-key.raw
          if grep -q 'BEGIN .*PRIVATE KEY' /tmp/3dvr-workspace-key.raw; then
            cp /tmp/3dvr-workspace-key.raw /tmp/3dvr-workspace-key
          elif base64 -d /tmp/3dvr-workspace-key.raw > /tmp/3dvr-workspace-key 2>/dev/null && grep -q 'BEGIN .*PRIVATE KEY' /tmp/3dvr-workspace-key; then
            :
          else
            echo '::error::Configured SSH key could not be decoded.'
            exit 1
          fi
          chmod 600 /tmp/3dvr-workspace-key
          rm -f /tmp/3dvr-workspace-key.raw

      - name: Install workspace runtime on 3DVR dev host
        shell: bash
        run: |
          set -euo pipefail
          opts=(-i /tmp/3dvr-workspace-key -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10)
          ssh "${opts[@]}" "$SSH_USER@$WORKSPACE_HOST" "GITHUB_REPOSITORY='$GITHUB_REPOSITORY' GITHUB_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          repo="$HOME/.3dvr/freelancer-workspace-host"
          mkdir -p "$HOME/.3dvr"
          if [ ! -d "$repo/.git" ]; then
            git clone "https://github.com/$GITHUB_REPOSITORY.git" "$repo"
          fi
          git -C "$repo" fetch --prune origin main
          git -C "$repo" checkout -B main origin/main
          git -C "$repo" reset --hard origin/main
          git -C "$repo" merge-base --is-ancestor "$GITHUB_SHA" HEAD

          node_bin="$(command -v node || true)"
          if [ -x /opt/node-v22/bin/node ]; then node_bin=/opt/node-v22/bin/node; fi
          [ -n "$node_bin" ] || { echo 'Node is not installed on workspace host.' >&2; exit 1; }
          "$node_bin" --check "$repo/apps/agent/thomas-agent/node/freelancer-workspace-runtime.js"
          "$node_bin" --check "$repo/apps/agent/thomas-agent/node/freelancer-workspace.js"
          FREELANCER_WORKSPACE_ROOT="$HOME/.3dvr/freelancer-workspaces" \
            "$node_bin" "$repo/apps/agent/thomas-agent/node/freelancer-workspace.js" status fw-host-health --json

          if command -v docker >/dev/null 2>&1 && docker version >/dev/null 2>&1; then
            echo 'WORKSPACE_DOCKER_READY=1'
          else
            echo 'WORKSPACE_DOCKER_READY=0'
            echo 'Workspace runtime is installed; Docker host setup is still required before provisioning.'
          fi
          REMOTE

      - name: Remove SSH key
        if: always()
        shell: bash
        run: rm -f /tmp/3dvr-workspace-key /tmp/3dvr-workspace-key.raw
