name: Operator runtime worker E2E

# Contract tests only. No live admission, signing secrets, or worker execution
# in GitHub Actions. A real isolated canary requires separate authorization.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'operator/delegate-task.js'
      - 'src/operator-runtime/**'
      - 'scripts/operator-runtime-worker-e2e.mjs'
      - 'tests/operator-runtime-worker-e2e-ack.test.mjs'
      - '.github/workflows/operator-runtime-worker-e2e.yml'
  push:
    branches:
      - main
    paths:
      - 'operator/delegate-task.js'
      - 'src/operator-runtime/**'
      - 'scripts/operator-runtime-worker-e2e.mjs'
      - 'tests/operator-runtime-worker-e2e-ack.test.mjs'
      - '.github/workflows/operator-runtime-worker-e2e.yml'

permissions:
  contents: read

jobs:
  signed-canary-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify signed canary contract with synthetic transport only
        run: node --test tests/operator-runtime-worker-e2e-ack.test.mjs
