name: Operator runtime worker E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'operator/delegate-task.js'
      - 'src/operator-runtime/**'
      - 'scripts/operator-runtime-worker-e2e*.mjs'
      - '.github/workflows/operator-runtime-worker-e2e.yml'
  push:
    branches:
      - main
    paths:
      - 'operator/delegate-task.js'
      - 'src/operator-runtime/**'
      - 'scripts/operator-runtime-worker-e2e*.mjs'
      - '.github/workflows/operator-runtime-worker-e2e.yml'

permissions:
  contents: read

jobs:
  relay-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify unsafe relays reject before enqueue
        run: node scripts/operator-runtime-worker-e2e-guard.test.mjs

  runtime-worker:
    # Legacy direct-Gun queue writes bypass authenticated Operator dispatch.
    # Keep disabled even for manual runs until isolated signed-dispatch E2E exists.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Enqueue task and wait for managed worker
        run: node scripts/operator-runtime-worker-e2e.mjs
