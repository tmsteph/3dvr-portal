name: Operator runtime worker E2E

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'operator/delegate-task.js'
      - 'src/operator-runtime/**'
      - 'scripts/operator-runtime-worker-e2e.mjs'
      - '.github/workflows/operator-runtime-worker-e2e.yml'

permissions:
  contents: read

jobs:
  runtime-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Enqueue task and wait for managed worker
        run: node scripts/operator-runtime-worker-e2e.mjs
