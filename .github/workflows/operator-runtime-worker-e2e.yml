name: Operator runtime worker E2E

# This legacy test writes directly to a Gun queue. Never run it automatically
# against a production-default relay on push. Manual runs remain unsafe until
# the isolated relay and authenticated-dispatch work is completed (#3311, #3680).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-worker:
    if: ${{ false }} # Disabled until authenticated isolated E2E replaces direct Gun writes
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Enqueue task and wait for managed worker
        run: node scripts/operator-runtime-worker-e2e.mjs
