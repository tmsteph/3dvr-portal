name: Operator runtime worker E2E

# No automatic or GitHub-hosted live task admission. An authenticated Codex
# canary may consume paid capacity and must run on an authorized existing server
# after separate approval, using credentials already held there.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-canary-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify signed canary contract without network writes
        run: node --test tests/operator-runtime-worker-e2e-ack.test.mjs
