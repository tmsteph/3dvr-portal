name: 3DVR Self-Hosted Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/self-host-production.yml'
      - 'ops/self-host-production-trigger.txt'

permissions:
  contents: write
  statuses: write

concurrency:
  group: 3dvr-self-host-production
  cancel-in-progress: false

env:
  PRIMARY_HOST: 40.160.137.41
  FALLBACK_HOST: 167.172.193.194

jobs:
  deploy:
    name: Deploy portal to OVH-first 3DVR production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Verify self-host server code
        run: |
          set -euo pipefail
          npm ci
          node --check scripts/self-host-server.mjs
          node --check scripts/organism-bridge-server.mjs
          bash -n scripts/ops/deploy-self-host-portal.sh
          bash -n scripts/ops/install-organism-owner-bridge.sh
          node --test tests/operator-developer-access.test.js tests/organism-access.test.js

      - name: Resolve OVH-first portal credentials
        id: resolve
        shell: bash
        env:
          SSH_A: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
          SSH_B: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_C: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          write_key() {
            local raw="$1" dest="$2"
            [ -n "$raw" ] || return 0
            printf '%s\n' "$raw" > "$dest.raw"
            if grep -q 'BEGIN .*PRIVATE KEY' "$dest.raw"; then
              cp "$dest.raw" "$dest"
            elif base64 -d "$dest.raw" > "$dest" 2>/dev/null && grep -q 'BEGIN .*PRIVATE KEY' "$dest"; then
              :
            else
              rm -f "$dest" "$dest.raw"
              return 0
            fi
            chmod 600 "$dest"
            rm -f "$dest.raw"
          }
          write_key "$SSH_A" /tmp/prod-a
          write_key "$SSH_B" /tmp/prod-b
          write_key "$SSH_C" /tmp/prod-c

          pick() {
            local host="$1"; shift
            local user key
            for user in "$@"; do
              for key in /tmp/prod-a /tmp/prod-b /tmp/prod-c; do
                [ -f "$key" ] || continue
                if ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=6 "$user@$host" true >/dev/null 2>&1; then
                  printf '%s|%s|%s\n' "$host" "$user" "$key"
                  return 0
                fi
              done
            done
            return 1
          }

          connection="$(pick "$PRIMARY_HOST" debian root || true)"
          role=primary
          if [ -z "$connection" ]; then
            echo 'OVH primary is unavailable; trying DigitalOcean emergency fallback.' >&2
            connection="$(pick "$FALLBACK_HOST" root debian || true)"
            role=fallback
          fi
          [ -n "$connection" ] || { echo 'Neither OVH nor DigitalOcean is reachable with configured SSH keys.' >&2; exit 1; }

          IFS='|' read -r host user key <<< "$connection"
          if [ "$user" != root ]; then
            ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=6 "$user@$host" 'sudo -n true' \
              || { echo "$user@$host is reachable but passwordless sudo is unavailable." >&2; exit 1; }
          fi
          cp "$key" /tmp/3dvr-key
          chmod 600 /tmp/3dvr-key
          rm -f /tmp/prod-a /tmp/prod-b /tmp/prod-c
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "user=$user" >> "$GITHUB_OUTPUT"
          echo "role=$role" >> "$GITHUB_OUTPUT"
          echo "Production target: $role $user@$host"

      - name: Provision portal runtime secrets
        shell: bash
        env:
          TARGET: ${{ steps.resolve.outputs.host }}
          TARGET_USER: ${{ steps.resolve.outputs.user }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          TUNNEL_TOKEN: ${{ secrets.THREEDVR_CLOUDFLARE_TUNNEL_TOKEN }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          opts=(-i /tmp/3dvr-key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10)
          updates="$(mktemp)"
          trap 'rm -f "$updates"' EXIT
          {
            [ -n "$OPENAI_API_KEY" ] && printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY"
            [ -n "$AI_GATEWAY_API_KEY" ] && printf 'AI_GATEWAY_API_KEY=%s\n' "$AI_GATEWAY_API_KEY"
            [ -n "$TUNNEL_TOKEN" ] && printf 'THREEDVR_CLOUDFLARE_TUNNEL_TOKEN=%s\n' "$TUNNEL_TOKEN"
            [ -n "$GOOGLE_OAUTH_CLIENT_ID" ] && printf 'GOOGLE_OAUTH_CLIENT_ID=%s\n' "$GOOGLE_OAUTH_CLIENT_ID"
            [ -n "$GOOGLE_OAUTH_CLIENT_SECRET" ] && printf 'GOOGLE_OAUTH_CLIENT_SECRET=%s\n' "$GOOGLE_OAUTH_CLIENT_SECRET"
          } > "$updates"

          if [ ! -s "$updates" ]; then
            echo 'No runtime secret updates supplied; preserving server configuration.'
            exit 0
          fi

          ssh "${opts[@]}" "$TARGET_USER@$TARGET" \
            'mkdir -p "$HOME/.3dvr/config"; chmod 700 "$HOME/.3dvr/config"; umask 077; cat > "$HOME/.3dvr/config/portal-secrets.update"' \
            < "$updates"

          ssh "${opts[@]}" "$TARGET_USER@$TARGET" 'bash -s' <<'REMOTE'
          set -euo pipefail
          config_dir="$HOME/.3dvr/config"
          secrets_env="$config_dir/portal-secrets.env"
          incoming="$config_dir/portal-secrets.update"
          next="$(mktemp)"
          trap 'rm -f "$incoming" "$next" "${next}.filtered"' EXIT
          umask 077
          touch "$secrets_env"
          cp "$secrets_env" "$next"
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            key="${line%%=*}"
            grep -v "^${key}=" "$next" > "${next}.filtered" || true
            mv "${next}.filtered" "$next"
            printf '%s\n' "$line" >> "$next"
          done < "$incoming"
          mv "$next" "$secrets_env"
          chmod 600 "$secrets_env"
          REMOTE

      - name: Deploy portal and Organism bridge
        id: deploy
        shell: bash
        env:
          TARGET: ${{ steps.resolve.outputs.host }}
          TARGET_USER: ${{ steps.resolve.outputs.user }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          opts=(-i /tmp/3dvr-key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10)
          remote_home="/root"
          prefix="env"
          if [ "$TARGET_USER" != root ]; then
            remote_home="/home/$TARGET_USER"
            prefix="sudo -n env HOME=$remote_home"
          fi
          output="$(ssh "${opts[@]}" "$TARGET_USER@$TARGET" "$prefix GITHUB_REPOSITORY='$GITHUB_REPOSITORY' DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          source_repo="$HOME/.3dvr/self-host-portal-source"
          mkdir -p "$HOME/.3dvr"
          if [ ! -d "$source_repo/.git" ]; then
            rm -rf "$source_repo"
            git clone "https://github.com/$GITHUB_REPOSITORY.git" "$source_repo"
          fi
          git -C "$source_repo" fetch --prune origin main
          git -C "$source_repo" cat-file -e "$DEPLOY_SHA^{commit}"
          git -C "$source_repo" checkout --detach "$DEPLOY_SHA"

          config_dir="$HOME/.3dvr/config"
          secrets_env="$config_dir/portal-secrets.env"
          mkdir -p "$config_dir"
          if [ -f "$secrets_env" ]; then
            set -a
            . "$secrets_env"
            set +a
          fi

          bash "$source_repo/scripts/ops/deploy-self-host-portal.sh" "$source_repo" main "$DEPLOY_SHA" 4320
          bash "$source_repo/scripts/ops/install-organism-owner-bridge.sh"
          echo 'Forge/agent workers are intentionally kept off the production portal host.'
          REMOTE
          )"
          printf '%s\n' "$output"
          url="$(printf '%s\n' "$output" | sed -n 's/^PORTAL_SELF_HOST_URL=//p' | tail -n1)"
          bridge_url="$(printf '%s\n' "$output" | sed -n 's/^PORTAL_ORGANISM_BRIDGE_URL=//p' | tail -n1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "bridge_url=$bridge_url" >> "$GITHUB_OUTPUT"

      - name: Verify self-host from outside server
        id: verify
        shell: bash
        env:
          URL: ${{ steps.deploy.outputs.url }}
          BRIDGE_URL: ${{ steps.deploy.outputs.bridge_url }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$URL" == https://*.trycloudflare.com ]]; then
            curl -fsS --retry 10 --retry-delay 2 --retry-all-errors "$URL/__3dvr-health" > /tmp/health.json
            node -e 'const fs=require("node:fs"); const expected=process.argv[1]; const health=JSON.parse(fs.readFileSync("/tmp/health.json","utf8")); if(!health.ok||health.sha!==expected||health.operatorApi!=="native") throw new Error(`self-host health mismatch: ${JSON.stringify(health)}`)' "$SHA"
            curl -fsS --retry 5 --retry-delay 1 "$URL/operator/" | grep -Fq 'Message your operator'
            options="$(curl -sS -o /dev/null -w '%{http_code}' -X OPTIONS "$URL/api/openai-site?provider=operator")"
            [ "$options" = 200 ]
            private_status="$(curl -sS -o /dev/null -w '%{http_code}' "$URL/package.json")"
            [ "$private_status" = 404 ]
          elif [ "$URL" = named-cloudflare-tunnel ]; then
            echo 'Named Cloudflare tunnel started; domain verification is handled after DNS/tunnel binding.'
          else
            echo 'No public HTTPS URL was returned by the server.' >&2
            exit 1
          fi

          [[ "$BRIDGE_URL" == https://*.trycloudflare.com ]] || { echo 'Organism bridge URL was not published.' >&2; exit 1; }
          curl -fsS --retry 8 --retry-delay 2 --retry-all-errors "$BRIDGE_URL/health" > /tmp/organism-bridge-health.json
          node -e 'const fs=require("node:fs"); const health=JSON.parse(fs.readFileSync("/tmp/organism-bridge-health.json","utf8")); if(!health.ok||health.service!=="3dvr-organism-owner-bridge") throw new Error(`organism bridge health mismatch: ${JSON.stringify(health)}`)'

      - name: Publish Organism bridge pointer
        if: steps.deploy.outcome == 'success' && steps.verify.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRIDGE_URL: ${{ steps.deploy.outputs.bridge_url }}
        run: |
          set -euo pipefail
          [[ "$BRIDGE_URL" == https://*.trycloudflare.com ]]
          payload="$(BRIDGE_URL="$BRIDGE_URL" node -e 'process.stdout.write(JSON.stringify({origin:process.env.BRIDGE_URL,updatedAt:new Date().toISOString()},null,2)+"\n")')"
          content="$(printf '%s' "$payload" | base64 -w0)"
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/runtime/organism-bridge.json?ref=main" --jq .sha 2>/dev/null || true)"
          args=(--method PUT "repos/$GITHUB_REPOSITORY/contents/runtime/organism-bridge.json" -f message='Update live Organism bridge pointer' -f "content=$content" -f branch=main)
          if [ -n "$current_sha" ]; then args+=(-f "sha=$current_sha"); fi
          gh api "${args[@]}" >/dev/null

      - name: Publish self-host status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          URL: ${{ steps.deploy.outputs.url }}
          ROLE: ${{ steps.resolve.outputs.role }}
        run: |
          set -euo pipefail
          state=failure
          description="3DVR self-host production deploy failed ($ROLE)"
          target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$DEPLOY_OUTCOME" = success ] && [ "$VERIFY_OUTCOME" = success ]; then
            state=success
            description="3DVR portal and Organism bridge deployed ($ROLE)"
            if [[ "$URL" == https://* ]]; then target_url="$URL"; fi
          fi
          payload="$(STATE="$state" DESCRIPTION="$description" TARGET_URL="$target_url" node -e 'process.stdout.write(JSON.stringify({state:process.env.STATE,context:"3DVR Self Host Production",description:process.env.DESCRIPTION,target_url:process.env.TARGET_URL}))')"
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "$payload"
          rm -f /tmp/3dvr-key /tmp/health.json /tmp/organism-bridge-health.json
          [ "$state" = success ]
