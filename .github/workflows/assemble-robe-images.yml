name: Assemble robe images

on:
  push:
    paths:
      - 'linen/robe/.parts/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble full-resolution WebP files
        shell: bash
        run: |
          set -euo pipefail
          test -f linen/robe/.parts/READY || exit 0
          cat linen/robe/.parts/work.*.b64 | tr -d '\n' | base64 -d > linen/robe/work-robe.webp
          cat linen/robe/.parts/jedi.*.b64 | tr -d '\n' | base64 -d > linen/robe/jedi-study.webp
          cat linen/robe/.parts/short.*.b64 | tr -d '\n' | base64 -d > linen/robe/short-wrap.webp
          file linen/robe/*.webp
          rm -rf linen/robe/.parts
          git config user.name '3DVR Builder'
          git config user.email 'builder@3dvr.tech'
          git add -A linen/robe
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add full-resolution robe concept images'
          git push
