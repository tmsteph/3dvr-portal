name: Vercel Production Fallback

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ops/vercel-production-trigger.txt'

permissions:
  contents: read

concurrency:
  group: vercel-production-fallback
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_xxJGO7S7h1ZP4BHidYV0CX9Z
  VERCEL_PROJECT_ID: prj_rAhxzdSdrK9MwKjUMeAXGxk8z8Ch
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    name: Validate and deploy canonical production fallback
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enforce Vercel Hobby function budget
        run: node --test tests/vercel-function-budget.test.js

      - name: Detect direct Vercel credentials
        id: vercel-creds
        shell: bash
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_TOKEN is not configured in GitHub; trying protected credentials on the 3DVR server workers."
          fi

      - name: Deploy through authenticated server worker
        if: ${{ steps.vercel-creds.outputs.enabled != 'true' }}
        shell: bash
        env:
          SSH_A: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
          SSH_B: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_C: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077

          write_key() {
            local raw="$1" dest="$2"
            [ -n "$raw" ] || return 0
            printf '%s\n' "$raw" > "$dest.raw"
            if grep -q 'BEGIN .*PRIVATE KEY' "$dest.raw"; then
              cp "$dest.raw" "$dest"
            elif base64 -d "$dest.raw" > "$dest" 2>/dev/null && grep -q 'BEGIN .*PRIVATE KEY' "$dest"; then
              :
            else
              rm -f "$dest" "$dest.raw"
              return 0
            fi
            chmod 600 "$dest"
            rm -f "$dest.raw"
          }

          write_key "$SSH_A" /tmp/vercel-a
          write_key "$SSH_B" /tmp/vercel-b
          write_key "$SSH_C" /tmp/vercel-c

          connection=''
          user_auth_probe='set -a; [ -r "$HOME/.config/3dvr/money-printer.env" ] && . "$HOME/.config/3dvr/money-printer.env"; set +a; if [ -n "${VERCEL_TOKEN:-}" ] && curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" https://api.vercel.com/v2/user >/dev/null 2>&1; then exit 0; fi; if command -v vercel >/dev/null 2>&1; then vercel whoami >/dev/null 2>&1; else npx --yes vercel@latest whoami >/dev/null 2>&1; fi'
          printf -v root_auth_probe 'sudo -n env HOME=/root bash -lc %q' "$user_auth_probe"

          # Prefer OVH, our primary control/recovery node, then fall back to Hetzner.
          # A server may keep deployment credentials under root even when SSH access
          # intentionally lands on an unprivileged sudo-capable account.
          for host in 40.160.137.41 167.233.174.20; do
            for user in debian root ubuntu tmsteph; do
              for key in /tmp/vercel-a /tmp/vercel-b /tmp/vercel-c; do
                [ -f "$key" ] || continue
                if ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=6 "$user@$host" "$user_auth_probe" >/dev/null 2>&1; then
                  connection="$host|$user|$key|user"
                  break 3
                fi
                if [ "$user" != root ] && ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=6 "$user@$host" "$root_auth_probe" >/dev/null 2>&1; then
                  connection="$host|$user|$key|root"
                  break 3
                fi
              done
            done
          done

          [ -n "$connection" ] || { echo "::error::No 3DVR server worker has a valid stored Vercel token or authenticated CLI session."; exit 1; }
          IFS='|' read -r host user key auth_home <<< "$connection"
          echo "Using authenticated Vercel worker: $user@$host (credential home: $auth_home)"

          if [ "$auth_home" = root ] && [ "$user" != root ]; then
            remote_command="sudo -n env HOME=/root GITHUB_REPOSITORY='$GITHUB_REPOSITORY' DEPLOY_SHA='$DEPLOY_SHA' bash -s"
          else
            remote_command="GITHUB_REPOSITORY='$GITHUB_REPOSITORY' DEPLOY_SHA='$DEPLOY_SHA' bash -s"
          fi

          ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new "$user@$host" \
            "$remote_command" <<'REMOTE'
          set -euo pipefail
          deploy_root="/var/tmp/3dvr-vercel-deploy-${USER:-worker}"
          mkdir -p "$deploy_root"
          work="$(mktemp -d "$deploy_root/work.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          git clone --quiet --depth=1 --filter=blob:none "https://github.com/$GITHUB_REPOSITORY.git" "$work/repo"
          git -C "$work/repo" checkout --quiet --detach "$DEPLOY_SHA"
          cd "$work/repo"

          if [ -r "$HOME/.config/3dvr/money-printer.env" ]; then
            set -a
            . "$HOME/.config/3dvr/money-printer.env"
            set +a
          fi

          export VERCEL_ORG_ID="team_xxJGO7S7h1ZP4BHidYV0CX9Z"
          export VERCEL_PROJECT_ID="prj_rAhxzdSdrK9MwKjUMeAXGxk8z8Ch"
          if command -v vercel >/dev/null 2>&1; then
            vercel_cmd=(vercel)
          else
            vercel_cmd=(npx --yes vercel@latest)
          fi

          auth_args=()
          if [ -n "${VERCEL_TOKEN:-}" ]; then
            if curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" https://api.vercel.com/v2/user >/dev/null 2>&1; then
              auth_args=(--token "$VERCEL_TOKEN")
            else
              unset VERCEL_TOKEN
            fi
          fi

          if [ "${#auth_args[@]}" -eq 0 ] && ! "${vercel_cmd[@]}" whoami >/dev/null 2>&1; then
            echo "No valid Vercel credential is available on this worker." >&2
            exit 1
          fi

          "${vercel_cmd[@]}" pull --yes --environment=production "${auth_args[@]}"
          "${vercel_cmd[@]}" build --prod "${auth_args[@]}"
          deploy_url="$("${vercel_cmd[@]}" deploy --prebuilt --prod --yes "${auth_args[@]}")"
          echo "Production deployment created: $deploy_url"
          REMOTE

          rm -f /tmp/vercel-a /tmp/vercel-b /tmp/vercel-c

      - name: Install Vercel CLI
        if: ${{ steps.vercel-creds.outputs.enabled == 'true' }}
        run: npm install --global vercel

      - name: Pull production environment
        if: ${{ steps.vercel-creds.outputs.enabled == 'true' }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production artifact
        if: ${{ steps.vercel-creds.outputs.enabled == 'true' }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production artifact
        if: ${{ steps.vercel-creds.outputs.enabled == 'true' }}
        id: deploy
        shell: bash
        run: |
          DEPLOY_URL="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" --yes)"
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Production URL: $DEPLOY_URL"

      - name: Verify canonical portal
        shell: bash
        run: |
          set -euo pipefail

          # A healthy API does not prove the public root is current. Vercel can
          # serve stale HTML while /__3dvr-health reaches the self-hosted lane.
          expected_hash="$(sha256sum index.html | awk '{print $1}')"
          live_hash=""

          for attempt in $(seq 1 12); do
            curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --retry-all-errors \
              'https://portal.3dvr.tech/' --output /tmp/live-portal-home.html
            live_hash="$(sha256sum /tmp/live-portal-home.html | awk '{print $1}')"
            if [ "$live_hash" = "$expected_hash" ]; then
              break
            fi
            echo "Canonical root is not current yet (attempt $attempt/12): expected $expected_hash, got $live_hash"
            sleep 5
          done

          if [ "$live_hash" != "$expected_hash" ]; then
            echo "::error::portal.3dvr.tech is serving a different homepage artifact than this release."
            exit 1
          fi

          grep -q 'data-portal-swirl-logo' /tmp/live-portal-home.html
          grep -q 'id="homeOperatorForm"' /tmp/live-portal-home.html

          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 --retry-all-errors \
            'https://portal.3dvr.tech/__3dvr-health' --output /tmp/live-portal-health.json
          node -e 'const fs=require("node:fs"); const h=JSON.parse(fs.readFileSync("/tmp/live-portal-health.json","utf8")); if(!h.ok||h.operatorApi!=="native") throw new Error(`canonical health mismatch: ${JSON.stringify(h)}`);'

          echo "Canonical root matches release artifact: $expected_hash"

