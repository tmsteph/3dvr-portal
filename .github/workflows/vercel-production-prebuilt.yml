name: Vercel Production Fallback

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vercel-production-prebuilt.yml'
      - 'ops/vercel-production-trigger.txt'

permissions:
  contents: read

concurrency:
  group: vercel-production-fallback
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_xxJGO7S7h1ZP4BHidYV0CX9Z
  VERCEL_PROJECT_ID: prj_rAhxzdSdrK9MwKjUMeAXGxk8z8Ch
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    name: Validate and deploy canonical production fallback
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enforce Vercel Hobby function budget
        run: node --test tests/vercel-function-budget.test.js

      - name: Detect direct Vercel credentials
        id: vercel-creds
        shell: bash
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VERCEL_TOKEN is not configured; skipping the optional Vercel fallback deployment."
          fi

      - name: Install Vercel CLI
        if: ${{ steps.vercel-creds.outputs.enabled == 'true' }}
        run: npm install --global vercel

      - name: Pull production environment
        if: ${{ steps.vercel-creds.outputs.enabled == 'true' }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production artifact
        if: ${{ steps.vercel-creds.outputs.enabled == 'true' }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production artifact
        if: ${{ steps.vercel-creds.outputs.enabled == 'true' }}
        id: deploy
        shell: bash
        run: |
          DEPLOY_URL="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" --yes)"
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Production URL: $DEPLOY_URL"

      - name: Verify canonical portal
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors 'https://portal.3dvr.tech/' --output /tmp/live-portal-home.html
          grep -q 'data-portal-swirl-logo' /tmp/live-portal-home.html
          grep -q 'id="homeOperatorForm"' /tmp/live-portal-home.html
