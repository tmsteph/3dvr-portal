name: Vercel Production Fallback

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ops/vercel-production-trigger.txt'

permissions:
  contents: read

concurrency:
  group: vercel-production-fallback
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_xxJGO7S7h1ZP4BHidYV0CX9Z
  VERCEL_PROJECT_ID: prj_rAhxzdSdrK9MwKjUMeAXGxk8z8Ch
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    name: Validate and deploy canonical production fallback
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enforce Vercel Hobby function budget
        run: node --test tests/vercel-function-budget.test.js

      - name: Detect direct Vercel credentials
        id: vercel-creds
        shell: bash
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_TOKEN is not configured; trying the authenticated Hetzner deployment worker."
          fi

      - name: Deploy through authenticated Hetzner worker
        if: ${{ steps.vercel-creds.outputs.enabled != 'true' }}
        shell: bash
        env:
          SSH_A: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
          SSH_B: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_C: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077

          write_key() {
            local raw="$1" dest="$2"
            [ -n "$raw" ] || return 0
            printf '%s\n' "$raw" > "$dest.raw"
            if grep -q 'BEGIN .*PRIVATE KEY' "$dest.raw"; then
              cp "$dest.raw" "$dest"
            elif base64 -d "$dest.raw" > "$dest" 2>/dev/null && grep -q 'BEGIN .*PRIVATE KEY' "$dest"; then
              :
            else
              rm -f "$dest" "$dest.raw"
              return 0
            fi
            chmod 600 "$dest"
            rm -f "$dest.raw"
          }

          write_key "$SSH_A" /tmp/vercel-a
          write_key "$SSH_B" /tmp/vercel-b
          write_key "$SSH_C" /tmp/vercel-c

          connection=''
          for user in root debian ubuntu tmsteph; do
            for key in /tmp/vercel-a /tmp/vercel-b /tmp/vercel-c; do
              [ -f "$key" ] || continue
              if ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=6 "$user@167.233.174.20" \
                'if command -v vercel >/dev/null 2>&1; then vercel whoami >/dev/null 2>&1; else npx --yes vercel@latest whoami >/dev/null 2>&1; fi' >/dev/null 2>&1; then
                connection="$user|$key"
                break 2
              fi
            done
          done

          [ -n "$connection" ] || { echo "::error::Hetzner is reachable only without a usable persisted Vercel CLI login."; exit 1; }
          IFS='|' read -r user key <<< "$connection"

          ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new "$user@167.233.174.20" \
            "GITHUB_REPOSITORY='$GITHUB_REPOSITORY' DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          git clone --quiet "https://github.com/$GITHUB_REPOSITORY.git" "$work/repo"
          git -C "$work/repo" checkout --quiet --detach "$DEPLOY_SHA"
          cd "$work/repo"

          export VERCEL_ORG_ID="team_xxJGO7S7h1ZP4BHidYV0CX9Z"
          export VERCEL_PROJECT_ID="prj_rAhxzdSdrK9MwKjUMeAXGxk8z8Ch"
          if command -v vercel >/dev/null 2>&1; then
            vercel_cmd=(vercel)
          else
            vercel_cmd=(npx --yes vercel@latest)
          fi

          "${vercel_cmd[@]}" pull --yes --environment=production
          "${vercel_cmd[@]}" domains add games.3dvr.tech --scope=tmstephs-projects --force >/tmp/games-domain.txt 2>&1 || {
            cat /tmp/games-domain.txt
            "${vercel_cmd[@]}" domains inspect games.3dvr.tech --scope=tmstephs-projects >/dev/null
          }
          "${vercel_cmd[@]}" build --prod
          deploy_url="$("${vercel_cmd[@]}" deploy --prebuilt --prod --yes)"
          echo "Production deployment created: $deploy_url"
          REMOTE

          rm -f /tmp/vercel-a /tmp/vercel-b /tmp/vercel-c

      - name: Install Vercel CLI
        if: ${{ steps.vercel-creds.outputs.enabled == 'true' }}
        run: npm install --global vercel

      - name: Pull production environment
        if: ${{ steps.vercel-creds.outputs.enabled == 'true' }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Ensure games subdomain
        if: ${{ steps.vercel-creds.outputs.enabled == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! vercel domains add games.3dvr.tech --token="$VERCEL_TOKEN" --scope=tmstephs-projects --force; then
            vercel domains inspect games.3dvr.tech --token="$VERCEL_TOKEN" --scope=tmstephs-projects >/dev/null
          fi

      - name: Build production artifact
        if: ${{ steps.vercel-creds.outputs.enabled == 'true' }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production artifact
        if: ${{ steps.vercel-creds.outputs.enabled == 'true' }}
        id: deploy
        shell: bash
        run: |
          DEPLOY_URL="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" --yes)"
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Production URL: $DEPLOY_URL"

      - name: Verify canonical portal
        shell: bash
        run: |
          set -euo pipefail

          # A healthy API does not prove the public root is current. Vercel can
          # serve stale HTML while /__3dvr-health reaches the self-hosted lane.
          expected_hash="$(sha256sum index.html | awk '{print $1}')"
          live_hash=""

          for attempt in $(seq 1 12); do
            curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --retry-all-errors \
              'https://portal.3dvr.tech/' --output /tmp/live-portal-home.html
            live_hash="$(sha256sum /tmp/live-portal-home.html | awk '{print $1}')"
            if [ "$live_hash" = "$expected_hash" ]; then
              break
            fi
            echo "Canonical root is not current yet (attempt $attempt/12): expected $expected_hash, got $live_hash"
            sleep 5
          done

          if [ "$live_hash" != "$expected_hash" ]; then
            echo "::error::portal.3dvr.tech is serving a different homepage artifact than this release."
            exit 1
          fi

          grep -q 'data-portal-swirl-logo' /tmp/live-portal-home.html
          grep -q 'id="homeOperatorForm"' /tmp/live-portal-home.html

          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 --retry-all-errors \
            'https://portal.3dvr.tech/__3dvr-health' --output /tmp/live-portal-health.json
          node -e 'const fs=require("node:fs"); const h=JSON.parse(fs.readFileSync("/tmp/live-portal-health.json","utf8")); if(!h.ok||h.operatorApi!=="native") throw new Error(`canonical health mismatch: ${JSON.stringify(h)}`);'

          echo "Canonical root matches release artifact: $expected_hash"
