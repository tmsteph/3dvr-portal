name: Vercel Production

on:
  workflow_dispatch:
  issues:
    types: [opened]
  push:
    branches:
      - main
    paths-ignore:
      - 'apps/agent/**'
      - 'apps/companion/**'
      - '.github/**'
      - 'ops/**'
      - 'tests/**'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_xxJGO7S7h1ZP4BHidYV0CX9Z
  VERCEL_PROJECT_ID: prj_rAhxzdSdrK9MwKjUMeAXGxk8z8Ch
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    if: github.event_name != 'issues' || (github.event.issue.user.login == github.repository_owner && github.event.issue.title == 'Deploy portal production')
    name: Deploy canonical production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require direct Vercel credentials
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not configured."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Pull production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production artifact
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production artifact
        id: deploy
        shell: bash
        run: |
          DEPLOY_URL="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" --yes)"
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Production URL: $DEPLOY_URL"

      - name: Verify deployed artifact
        shell: bash
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location \
            --retry 8 --retry-delay 3 --retry-all-errors \
            "$DEPLOY_URL/" \
            --output /tmp/portal-home.html
          grep -q '<title>3DVR Portal</title>' /tmp/portal-home.html
          grep -q 'id="home-title">What do you want to do?' /tmp/portal-home.html
          grep -q 'data-portal-swirl-logo' /tmp/portal-home.html
          grep -q 'id="homeOperatorForm"' /tmp/portal-home.html

          curl --fail --silent --show-error --location \
            --retry 8 --retry-delay 3 --retry-all-errors \
            "$DEPLOY_URL/context-hq/" \
            --output /tmp/context-hq.html
          grep -q '<title>Context HQ | 3DVR Portal</title>' /tmp/context-hq.html

          curl --fail --silent --show-error --location \
            --retry 8 --retry-delay 3 --retry-all-errors \
            "$DEPLOY_URL/workspace/" \
            --output /tmp/workspace.html
          grep -q '<title>3DVR Workspace</title>' /tmp/workspace.html
          grep -q './main.js' /tmp/workspace.html

      - name: Verify canonical portal alias
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 5 --retry-all-errors \
            'https://portal.3dvr.tech/' \
            --output /tmp/live-portal-home.html
          grep -q 'data-portal-swirl-logo' /tmp/live-portal-home.html
          grep -q 'id="homeOperatorForm"' /tmp/live-portal-home.html
          echo "Canonical production verified at portal.3dvr.tech."
