name: Codex Terminal Auth Probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'ops/codex-auth-probe-trigger.txt'

permissions:
  contents: write

jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      RESULT_BRANCH: ${{ github.head_ref }}
      CODEX_URL: https://codex.167.233.174.20.nip.io/
    steps:
      - name: Test known secret-name candidates without exposing values
        shell: bash
        env:
          AUTH_A: ${{ secrets.CODEX_CLOUD_BASIC_AUTH }}
          AUTH_B: ${{ secrets.CODEX_CLOUD_AUTH }}
          AUTH_C: ${{ secrets.TTYD_AUTH }}
          AUTH_D: ${{ secrets.TERMINAL_AUTH }}
          USER_A: ${{ secrets.CODEX_CLOUD_USERNAME }}
          USER_B: ${{ secrets.CODEX_CLOUD_USER }}
          USER_C: ${{ secrets.CODEX_USERNAME }}
          USER_D: ${{ secrets.TTYD_USERNAME }}
          USER_E: ${{ secrets.TERMINAL_USERNAME }}
          PASS_A: ${{ secrets.CODEX_CLOUD_PASSWORD }}
          PASS_B: ${{ secrets.CODEX_PASSWORD }}
          PASS_C: ${{ secrets.TTYD_PASSWORD }}
          PASS_D: ${{ secrets.TERMINAL_PASSWORD }}
        run: |
          set -euo pipefail
          combined=''
          user=''
          pass=''
          for x in "$AUTH_A" "$AUTH_B" "$AUTH_C" "$AUTH_D"; do
            if [ -z "$combined" ] && [ -n "$x" ]; then combined="$x"; fi
          done
          for x in "$USER_A" "$USER_B" "$USER_C" "$USER_D" "$USER_E"; do
            if [ -z "$user" ] && [ -n "$x" ]; then user="$x"; fi
          done
          for x in "$PASS_A" "$PASS_B" "$PASS_C" "$PASS_D"; do
            if [ -z "$pass" ] && [ -n "$x" ]; then pass="$x"; fi
          done
          combined_present=$([ -n "$combined" ] && echo true || echo false)
          user_present=$([ -n "$user" ] && echo true || echo false)
          pass_present=$([ -n "$pass" ] && echo true || echo false)
          if [ -n "$combined" ] && [[ "$combined" == *:* ]]; then
            user="${combined%%:*}"
            pass="${combined#*:}"
          fi
          auth_code=000
          if [ -n "$user" ] && [ -n "$pass" ]; then
            auth_code="$(curl -ksS -o /tmp/page -w '%{http_code}' --user "$user:$pass" --connect-timeout 6 --max-time 10 "$CODEX_URL" || true)"
          fi
          COMBINED="$combined_present" USERP="$user_present" PASSP="$pass_present" CODE="$auth_code" python3 -c 'import json,os; print(json.dumps({"combinedAuthSecretPresent":os.environ["COMBINED"]=="true","usernameSecretPresent":os.environ["USERP"]=="true","passwordSecretPresent":os.environ["PASSP"]=="true","authenticatedHttpCode":os.environ["CODE"],"authenticated":os.environ["CODE"]=="200"},indent=2))' >/tmp/result.json

      - name: Persist sanitized auth result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -s /tmp/result.json ]; then printf '{"workflowFailedBeforeResult":true}\n' >/tmp/result.json; fi
          content="$(base64 -w0 /tmp/result.json)"
          payload="$(CONTENT="$content" BRANCH="$RESULT_BRANCH" python3 -c 'import json,os; print(json.dumps({"message":"Record Codex terminal auth probe","content":os.environ["CONTENT"],"branch":os.environ["BRANCH"]}))')"
          curl -fsS -X PUT -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/ops/codex-auth-probe-result.json" -d "$payload" >/dev/null
