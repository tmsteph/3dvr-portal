name: Operator portal E2E

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Acceptance mode
        required: true
        default: bootstrap
        type: choice
        options:
          - bootstrap
          - edit
  pull_request:
    paths:
      - '.github/e2e/operator-e2e-mode.txt'
      - 'scripts/operator-portal-e2e.mjs'
      - 'scripts/ops/operator-private-worker.cjs'
      - 'tests/operator-private-worker.test.js'
      - 'tests/operator-dispatch.test.js'
      - 'src/operator-runtime/**'
      - 'apps/agent/thomas-agent/node/task-queue-sqlite-store.js'
      - 'operator/**'
      - 'sign-in.html'
      - 'auth-identity.js'
      - 'home-operator.js'
      - 'gun-init.js'
      - 'tests/home-operator-persistence.e2e.test.js'
      - 'tests/operator-device-sync.e2e.test.js'
      - '.github/workflows/operator-portal-e2e.yml'
      - 'src/operator/**'
      - 'api/openai-site.js'

permissions:
  contents: read

jobs:
  # Full Agent Checks are normally scoped to PRs targeting main/dev.
  # Run the same security and regression gates for this stacked integration
  # before it can be reconciled into main. No deployment or live queue access.
  combined-agent-tests:
    if: github.event_name == 'pull_request' && github.base_ref == 'operator/queue-routing-audit-20261022-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: apps/agent/package-lock.json
      - run: npm ci
      - name: Build Operator Core for agent tests
        run: |
          npm --prefix ../../operator-core/operator-core ci --ignore-scripts
          npm --prefix ../../operator-core/operator-core run build
      - name: Full agent regressions
        run: npm test
      - name: Production dependency security audit
        run: npm audit --omit=dev

  # Test whether the stacked safety branch can be reconciled with today's main
  # without modifying main, production, or any live queue. A conflict is a
  # release blocker, not permission to drop either side's protections.
  main-reconciliation-preview:
    if: github.event_name == 'pull_request' && github.base_ref == 'operator/queue-routing-audit-20261022-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - name: Merge main into the PR test checkout without committing or pushing
        shell: bash
        run: |
          git fetch --no-tags origin main
          set +e
          git -c user.name='Operator CI' -c user.email='operator-ci@users.noreply.github.com' merge --no-commit --no-ff origin/main > /tmp/operator-main-merge.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo '### Operator integration with current main: blocked' >> "$GITHUB_STEP_SUMMARY"
            echo 'The draft cannot be released without reviewing these merge conflicts:' >> "$GITHUB_STEP_SUMMARY"
            git diff --name-only --diff-filter=U | tee -a "$GITHUB_STEP_SUMMARY"
            cat /tmp/operator-main-merge.log
            exit 1
          fi
          echo '### Operator integration with current main: clean merge preview' >> "$GITHUB_STEP_SUMMARY"
          echo 'No commit, push, deployment, or live task execution occurred.' >> "$GITHUB_STEP_SUMMARY"
      - name: Test queue and dispatch against the main reconciliation preview
        run: node --test tests/operator-private-worker.test.js tests/operator-dispatch.test.js

  portal-e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify the PR checkout with isolated local servers
        if: github.event_name == 'pull_request'
        run: |
          node --test tests/operator-private-worker.test.js tests/operator-dispatch.test.js
          node --test --test-concurrency=1 tests/home-operator-persistence.e2e.test.js tests/operator-device-sync.e2e.test.js
          node scripts/operator-attachment-branch-e2e.mjs
      - name: Run production acceptance test
        if: github.event_name == 'workflow_dispatch'
        env:
          PORTAL_E2E_URL: https://portal.3dvr.tech
          PORTAL_E2E_MODE: ${{ inputs.mode || 'bootstrap' }}
          PORTAL_E2E_ALIAS: ${{ secrets.PORTAL_E2E_ALIAS }}
          PORTAL_E2E_PASSWORD: ${{ secrets.PORTAL_E2E_PASSWORD }}
        run: node scripts/operator-portal-e2e.mjs
      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-portal-e2e
          path: e2e-artifacts
          if-no-files-found: ignore
