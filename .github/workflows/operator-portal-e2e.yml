name: Operator portal E2E

on:
  pull_request:
    paths:
      - '.github/e2e/operator-e2e-mode.txt'
      - 'scripts/operator-portal-e2e.mjs'
      - 'operator/**'
      - 'sign-in.html'
      - 'auth-identity.js'
      - 'src/operator/**'
      - 'api/openai-site.js'

permissions:
  contents: read

jobs:
  portal-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PORTAL_E2E_URL: https://portal.3dvr.tech
      PORTAL_E2E_ALIAS: operator-e2e-20260823@3dvr
      PORTAL_E2E_PASSWORD: PublicE2E-20260823-Disposable-Account!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run portal acceptance test
        run: node scripts/operator-portal-e2e.mjs
      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-portal-e2e
          path: e2e-artifacts
          if-no-files-found: ignore
