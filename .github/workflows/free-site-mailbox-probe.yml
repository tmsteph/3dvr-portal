name: Free Site Mailbox Probe

on:
  push:
    branches:
      - test/free-site-mailbox-probe-20260820
    paths:
      - ".github/workflows/free-site-mailbox-probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/agent
    env:
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/free-site-mailbox-probe-20260820
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: apps/agent/package-lock.json
      - run: npm ci
      - name: Probe canonical mailbox without exposing mail content
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { ImapFlow } from 'imapflow';

          const user = process.env.GMAIL_USER || '3dvr.tech@gmail.com';
          const pass = process.env.GMAIL_APP_PASSWORD || '';
          if (!pass) throw new Error('canonical Gmail credential is unavailable');

          const client = new ImapFlow({
            host: 'imap.gmail.com',
            port: 993,
            secure: true,
            auth: { user, pass },
            logger: false,
          });

          let found = false;
          await client.connect();
          const lock = await client.getMailboxLock('INBOX');
          try {
            const since = new Date(Date.now() - (6 * 60 * 60 * 1000));
            const uids = await client.search({ since });
            const recent = uids.slice(-50);
            for await (const message of client.fetch(recent, { envelope: true, source: true }, { uid: true })) {
              const subject = String(message.envelope?.subject || '').toLowerCase();
              const source = message.source ? message.source.toString('utf8').toLowerCase() : '';
              if (subject.includes('website') && source.includes('cats')) {
                found = true;
                break;
              }
            }
          } finally {
            lock.release();
            await client.logout();
          }

          fs.writeFileSync('/tmp/free-site-mailbox-probe.txt', found ? 'FOUND\n' : 'NOT_FOUND\n');
          console.log('Mailbox probe completed; private content was not logged.');
          NODE
      - name: Persist privacy-safe receipt
        shell: bash
        working-directory: .
        run: |
          mkdir -p ops/tmp
          cp /tmp/free-site-mailbox-probe.txt ops/tmp/free-site-mailbox-probe.txt
          git config user.name "3DVR Actions"
          git config user.email "3dvr.tech@gmail.com"
          git add -- ops/tmp/free-site-mailbox-probe.txt
          if ! git diff --cached --quiet; then
            git commit -m "test: record mailbox probe result"
            git push origin HEAD:test/free-site-mailbox-probe-20260820
          fi
      - name: Require request to be found
        shell: bash
        run: test "$(cat /tmp/free-site-mailbox-probe.txt)" = "FOUND"
