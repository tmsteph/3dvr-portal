name: Companion Android

on:
  push:
    branches: [main]
    paths:
      - 'apps/companion/**'
      - '.github/workflows/companion-android.yml'
  pull_request:
    paths:
      - 'apps/companion/**'
      - '.github/workflows/companion-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPANION_BUILD_NUMBER: ${{ github.run_number }}
      COMPANION_BUILD_NAME: 0.4.${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        with:
          channel: stable
          cache: true

      - name: Scaffold Companion
        run: |
          chmod +x apps/companion/scaffold.sh
          apps/companion/scaffold.sh

      - name: Test Companion
        working-directory: apps/companion
        run: flutter test

      - name: Build versioned debug APK
        working-directory: apps/companion
        run: |
          flutter build apk --debug \
            --build-name "$COMPANION_BUILD_NAME" \
            --build-number "$COMPANION_BUILD_NUMBER"

      - name: Sign APK with persistent Companion key
        env:
          COMPANION_KEYSTORE_BASE64: ${{ secrets.COMPANION_KEYSTORE_BASE64 }}
          COMPANION_KEYSTORE_PASSWORD: ${{ secrets.COMPANION_KEYSTORE_PASSWORD }}
          COMPANION_KEY_PASSWORD: ${{ secrets.COMPANION_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$COMPANION_KEYSTORE_BASE64"
          test -n "$COMPANION_KEYSTORE_PASSWORD"
          test -n "$COMPANION_KEY_PASSWORD"
          KEYSTORE="$RUNNER_TEMP/3dvr-companion-dev.p12"
          printf '%s' "$COMPANION_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          APKSIGNER="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          APK="apps/companion/build/app/outputs/flutter-apk/app-debug.apk"
          SIGNED="$RUNNER_TEMP/3dvr-companion-signed.apk"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-type PKCS12 \
            --ks-key-alias 3dvr-companion \
            --ks-pass env:COMPANION_KEYSTORE_PASSWORD \
            --key-pass env:COMPANION_KEY_PASSWORD \
            --out "$SIGNED" \
            "$APK"
          mv "$SIGNED" "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Prepare canonical APK
        run: |
          cp apps/companion/build/app/outputs/flutter-apk/app-debug.apk "$RUNNER_TEMP/3dvr-companion.apk"
          sha256sum "$RUNNER_TEMP/3dvr-companion.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3dvr-companion-apk
          path: ${{ runner.temp }}/3dvr-companion.apk
          if-no-files-found: error

      - name: Publish canonical Companion release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/3dvr-companion.apk"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          TAG="companion-build-${COMPANION_BUILD_NUMBER}"
          NOTES="$(printf '{\"versionCode\":%s,\"versionName\":\"%s\",\"sha256\":\"%s\"}' "$COMPANION_BUILD_NUMBER" "$COMPANION_BUILD_NAME" "$SHA256")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --title "3DVR Companion $COMPANION_BUILD_NAME" --notes "$NOTES"
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "3DVR Companion $COMPANION_BUILD_NAME" \
              --notes "$NOTES"
          fi
