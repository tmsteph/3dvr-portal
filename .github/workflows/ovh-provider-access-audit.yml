name: OVH Provider Access Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ovh-provider-access-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    if: github.event.head_commit.message == 'Audit OVH provider access'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check configured OVH API secret names
        shell: bash
        env:
          OVH_APPLICATION_KEY: ${{ secrets.OVH_APPLICATION_KEY }}
          OVH_APPLICATION_SECRET: ${{ secrets.OVH_APPLICATION_SECRET }}
          OVH_CONSUMER_KEY: ${{ secrets.OVH_CONSUMER_KEY }}
          OVH_ENDPOINT: ${{ secrets.OVH_ENDPOINT }}
        run: |
          set -euo pipefail
          present=0
          for name in OVH_APPLICATION_KEY OVH_APPLICATION_SECRET OVH_CONSUMER_KEY; do
            if [ -n "${!name:-}" ]; then
              echo "$name=present"
              present=$((present + 1))
            else
              echo "$name=absent"
            fi
          done
          if [ -n "${OVH_ENDPOINT:-}" ]; then echo 'OVH_ENDPOINT=present'; else echo 'OVH_ENDPOINT=absent'; fi
          if [ "$present" -eq 3 ]; then echo 'OVH_API_CREDENTIAL_SET=complete'; elif [ "$present" -eq 0 ]; then echo 'OVH_API_CREDENTIAL_SET=absent'; else echo 'OVH_API_CREDENTIAL_SET=partial'; fi

      - name: Check OVH host for provider configuration names only
        shell: bash
        env:
          RAW_KEY: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
          OVH_HOST: 40.160.137.41
          OVH_USER: debian
        run: |
          set -euo pipefail
          [ -n "$RAW_KEY" ]
          umask 077
          printf '%s\n' "$RAW_KEY" > /tmp/key.raw
          if grep -q 'BEGIN .*PRIVATE KEY' /tmp/key.raw; then cp /tmp/key.raw /tmp/key; else base64 -d /tmp/key.raw > /tmp/key; fi
          chmod 600 /tmp/key
          rm -f /tmp/key.raw
          opts=(-i /tmp/key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8)
          ssh "${opts[@]}" "$OVH_USER@$OVH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== known OVH config files ==='
          for f in "$HOME/.ovh.conf" "$HOME/.config/ovh/ovh.conf" "$HOME/.config/ovh.conf" /root/.ovh.conf /root/.config/ovh/ovh.conf /root/.config/ovh.conf; do
            if sudo test -f "$f"; then echo "$f=present"; else echo "$f=absent"; fi
          done
          echo '=== OVH-related credential variable names (values suppressed) ==='
          (env; sudo env) | cut -d= -f1 | grep -Ei '^(OVH|OVHCLOUD)_' | sort -u || true
          echo '=== OVH-related executables ==='
          for cmd in ovh ovhcloud openstack; do
            if command -v "$cmd" >/dev/null 2>&1; then echo "$cmd=$(command -v "$cmd")"; else echo "$cmd=absent"; fi
          done
          REMOTE
          rm -f /tmp/key
