name: Playwright Checks

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  smoke:
    name: Run Workboard unit + Playwright E2E + smoke tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify signed Operator task delivery
        run: |
          node --test tests/operator-dispatch.test.js tests/operator-delegate-task.test.js tests/operator-public-modules.test.js tests/self-host-sea-runtime.test.js tests/operator-action-receipt.test.js
          python3 tests/helm-native-python.py

      - name: Run Operator self-edit integration test
        run: node --test tests/operator-self-edit-integration.test.js

      - name: Run Operator business system regression tests
        run: node --test tests/operator-business-system.test.js tests/operator-runtime-resources.test.js tests/growth-desk.test.js

      - name: Run browser lane regression tests
        run: node --test tests/browser-lane-lease.test.js

      - name: Run Workboard regression tests
        run: node --test tests/workboard-*.test.js

      - name: Run freelancer scheduling regression tests
        run: node --test tests/freelance-client-system.test.js tests/freelance-opportunity-pipeline.test.js tests/av-booking-availability.test.js tests/av-booking-agent-integration.test.js tests/freelance-source-health.test.js tests/work-schedule-coordinator.test.js tests/iatse-availability-set.test.js tests/manual-workforce-reconcile-workflow.test.js

      - name: Enforce Vercel Hobby function budget
        run: node --test tests/vercel-function-budget.test.js

      - name: Run SD Day Traders booking mail tests
        run: node --test tests/booking-request-email.test.js

      - name: Run autonomous dollar challenge tests
        run: node --test tests/challenge-api.test.js

      - name: Validate self-host money cron gate and deployment script
        run: |
          bash -n scripts/ops/deploy-self-host-portal.sh
          node --test tests/money-autopilot-cron-systemd-gate.test.js tests/money-autopilot-cron-api.test.js tests/money-autopilot.test.js tests/money-engine.test.js

      - name: Run Campaigns Gmail sender regression tests
        run: node --test tests/campaigns.test.js tests/oauth-provider-api.test.js

      - name: Run Cell privacy regression tests
        run: node --test tests/cell-private-store.test.js tests/cell-network.test.js tests/cell-cross-app.test.js tests/cell-invitations.test.js

      - name: Run Playwright checks
        # GitHub hosted runners already include common browser libraries. Avoid slow apt mirrors.
        env:
          PLAYWRIGHT_INSTALL_DEPS: 'false'
        run: npm run playwright:verify:linux

      - name: Run private Cell mobile browser check
        run: node --test tests/cell-private.e2e.test.js
