name: LicheePi Mainline Preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/licheepi-mainline-preflight.yml'
      - 'scripts/ops/licheepi-mainline-preflight.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Inspect mainline candidate without changing boot state
        env:
          SSH_A: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
          SSH_B: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_C: ${{ secrets.SSH_PRIVATE_KEY }}
          OVH_HOST: 40.160.137.41
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/ops/licheepi-mainline-preflight.sh
