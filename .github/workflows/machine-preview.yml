name: 3DVR Machine Preview

on:
  push:
    branches:
      - 'machine-preview/**'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: 3dvr-machine-preview
  cancel-in-progress: true

env:
  PREVIEW_HOST: preview.167.172.193.194.nip.io
  PREVIEW_IP: 167.172.193.194
  PREVIEW_POINTER: machine-host/current

jobs:
  preview:
    name: Publish stable server preview
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Point stable preview at this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl -fsS -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/refs/heads/$PREVIEW_POINTER" \
            -d "{\"sha\":\"$PREVIEW_SHA\",\"force\":true}" >/dev/null

      - name: Verify stable preview from outside the server
        id: verify
        shell: bash
        env:
          PREVIEW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="https://$PREVIEW_HOST"
          resolve="--resolve $PREVIEW_HOST:443:$PREVIEW_IP"
          health=''

          for _ in $(seq 1 40); do
            if health="$(curl -fsS $resolve --connect-timeout 5 --max-time 10 "$base/__3dvr-preview" 2>/dev/null)"; then
              if HEALTH="$health" EXPECTED_SHA="$PREVIEW_SHA" python3 -c 'import json,os; h=json.loads(os.environ["HEALTH"]); raise SystemExit(0 if h.get("ok") is True and h.get("sha")==os.environ["EXPECTED_SHA"] else 1)'; then
                break
              fi
            fi
            health=''
            sleep 3
          done

          if [ -z "$health" ]; then
            echo "Stable preview did not become healthy for $PREVIEW_SHA" >&2
            exit 1
          fi

          printf '%s\n' "$health"
          curl -fsS $resolve --connect-timeout 5 --max-time 10 "$base/guide/" | grep -Fq '3DVR Guide'
          echo "preview_url=$base/guide/" >> "$GITHUB_OUTPUT"

      - name: Publish preview status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_SHA: ${{ github.sha }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          PREVIEW_URL: ${{ steps.verify.outputs.preview_url }}
        run: |
          set -euo pipefail
          state=failure
          description='3DVR server preview failed'
          target_url="https://$PREVIEW_HOST/guide/"

          if [ "$VERIFY_OUTCOME" = success ]; then
            state=success
            description='3DVR server preview ready'
          fi

          payload="$(STATE="$state" DESCRIPTION="$description" TARGET_URL="$target_url" python3 - <<'PY'
import json, os
print(json.dumps({
  'state': os.environ['STATE'],
  'context': '3DVR Machine Preview',
  'description': os.environ['DESCRIPTION'],
  'target_url': os.environ['TARGET_URL'],
}))
PY
)"

          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$PREVIEW_SHA" \
            -d "$payload" >/dev/null

          if [ "$state" = success ]; then
            {
              echo '## 3DVR Machine Preview'
              echo
              echo "Preview: $target_url"
              echo
              echo "Ref: $GITHUB_REF_NAME"
              echo "SHA: $PREVIEW_SHA"
              echo 'Host: stable 3DVR server preview'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          [ "$state" = success ]
