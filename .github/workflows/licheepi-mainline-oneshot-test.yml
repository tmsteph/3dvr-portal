name: LicheePi Mainline One-Shot Test

on:
  workflow_dispatch:
    inputs:
      safety_ack:
        description: 'Type RUN_MAINLINE71_ONESHOT only when physical recovery is available and vendor l0 has been re-verified'
        required: true
        type: string

permissions:
  contents: write

jobs:
  test:
    if: ${{ inputs.safety_ack == 'RUN_MAINLINE71_ONESHOT' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Require explicit recovery-ready acknowledgement
        run: test "${{ inputs.safety_ack }}" = 'RUN_MAINLINE71_ONESHOT'
      - name: Run one-shot mainline71 with durable vendor fallback
        env:
          SSH_A: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
          SSH_B: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_C: ${{ secrets.SSH_PRIVATE_KEY }}
          OVH_HOST: 40.160.137.41
          DO_HOST: 167.172.193.194
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/ops/licheepi-mainline-oneshot-test.sh
