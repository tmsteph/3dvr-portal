name: 3DVR Server Preview

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch, or tag to preview
        required: false
        default: main

permissions:
  contents: read
  statuses: write

concurrency:
  group: 3dvr-server-preview
  cancel-in-progress: true

jobs:
  preview:
    name: Refresh German server preview
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      THREEDVR_AGENT_OWNER_ALIAS: ${{ vars.THREEDVR_AGENT_TASK_OWNER_ALIAS || '3dvr-managed' }}
      PREVIEW_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || inputs.ref || 'main' }}
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: apps/agent/package-lock.json

      - name: Install queue client
        run: npm ci

      - name: Queue lightweight preview refresh
        id: queue
        shell: bash
        run: |
          set -euo pipefail

          task="$(cat <<'REMOTE'
          set -euo pipefail
          preview_dir="$HOME/3dvr-portal-preview"
          preview_pid="$HOME/.3dvr-preview.pid"
          preview_log="$HOME/.3dvr-preview.log"
          preview_server="$HOME/.3dvr-preview-server.mjs"
          ref="__PREVIEW_REF__"
          port=4173

          if [ -e "$preview_dir" ] && [ ! -d "$preview_dir/.git" ]; then
            rm -rf "$preview_dir"
          fi
          if [ ! -d "$preview_dir/.git" ]; then
            git clone --filter=blob:none https://github.com/tmsteph/3dvr-portal.git "$preview_dir"
          fi

          git -C "$preview_dir" fetch --prune origin "$ref"
          git -C "$preview_dir" checkout --detach FETCH_HEAD
          git -C "$preview_dir" reset --hard FETCH_HEAD
          git -C "$preview_dir" clean -fdx
          sha="$(git -C "$preview_dir" rev-parse HEAD)"

          if [ -f "$preview_pid" ]; then
            old_pid="$(cat "$preview_pid" 2>/dev/null || true)"
            if [ -n "$old_pid" ] && kill -0 "$old_pid" 2>/dev/null; then
              kill "$old_pid" || true
              for _ in $(seq 1 10); do
                kill -0 "$old_pid" 2>/dev/null || break
                sleep 0.2
              done
            fi
          fi

          printf '%s' ' aWNvJywnaW1hZ2UveC1pY29uJ10sWy c ' | base64 -d > "$preview_server"
          nohup nice -n 15 env \
            HOST=0.0.0.0 \
            PORT="$port" \
            PREVIEW_ROOT="$preview_dir" \
            PREVIEW_SHA="$sha" \
            PREVIEW_REF="$ref" \
            node --max-old-space-size=96 "$preview_server" \
            >"$preview_log" 2>&1 &
          echo "$!" > "$preview_pid"

          sleep 1
          curl -fsS --max-time 5 "http://127.0.0.1:$port/__3dvr-preview"
          public_ip="$(curl -4 -fsS --max-time 5 https://api.ipify.org || true)"
          if [ -z "$public_ip" ]; then
            public_ip="$(hostname -I 2>/dev/null | awk '{print $1}')"
          fi
          echo
          echo "preview_url=http://$public_ip:$port/"
          echo "preview_sha=$sha"
          REMOTE
          )"
          task="${task/__PREVIEW_REF__/$PREVIEW_REF}"

          enqueue_and_wait() {
            local owner_alias="$1"
            local result task_id status
            result="$(THREEDVR_AGENT_OWNER_ALIAS="$owner_alias" node thomas-agent/node/agent-task-queue.js enqueue \
              --json \
              --backend shell \
              --risk workspace_write \
              --approval-status approved \
              --unsafe \
              --requires shell \
              --max-runtime-ms 180000 \
              "$task")"
            task_id="$(printf '%s' "$result" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const i=s.indexOf('{');if(i<0)throw new Error('queue JSON missing');console.log(JSON.parse(s.slice(i)).id)})")"
            for attempt in $(seq 1 30); do
              result="$(THREEDVR_AGENT_OWNER_ALIAS="$owner_alias" node thomas-agent/node/agent-task-queue.js status --id "$task_id" --json)"
              status="$(printf '%s' "$result" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const i=s.indexOf('{');if(i<0)throw new Error('status JSON missing');console.log(JSON.parse(s.slice(i)).status||'')})")"
              case "$status" in
                completed)
                  printf '%s\n' "$result"
                  printf '%s' "$result" > /tmp/3dvr-preview-result.json
                  return 0
                  ;;
                failed|skipped)
                  printf '%s\n' "$result" >&2
                  return 1
                  ;;
              esac
              sleep 5
            done
            return 1
          }

          if ! enqueue_and_wait "$THREEDVR_AGENT_OWNER_ALIAS"; then
            echo "Managed worker queue did not complete; trying legacy queue." >&2
            enqueue_and_wait "anonymous@3dvr"
          fi

          summary="$(cat /tmp/3dvr-preview-result.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const i=s.indexOf('{');const j=JSON.parse(s.slice(i));process.stdout.write(j.resultSummary||'')})")"
          preview_url="$(printf '%s\n' "$summary" | sed -n 's/.*preview_url=\(http[^ ]*\).*/\1/p' | tail -1)"
          preview_sha="$(printf '%s\n' "$summary" | sed -n 's/.*preview_sha=\([0-9a-f]*\).*/\1/p' | tail -1)"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "preview_sha=$preview_sha" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$summary"

      - name: Verify preview from outside
        id: verify
        shell: bash
        working-directory: .
        env:
          PREVIEW_URL: ${{ steps.queue.outputs.preview_url }}
        run: |
          set -euo pipefail
          test -n "$PREVIEW_URL"
          curl -fsS --max-time 10 "${PREVIEW_URL}__3dvr-preview"
          curl -fsS --max-time 10 "${PREVIEW_URL}" >/dev/null

      - name: Publish preview status
        if: always()
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.queue.outputs.preview_url }}
          QUEUE_OUTCOME: ${{ steps.queue.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          state=failure
          description='3DVR server preview unavailable'
          target_url=''
          if [ "$QUEUE_OUTCOME" = success ] && [ "$VERIFY_OUTCOME" = success ]; then
            state=success
            description='3DVR server preview ready on German worker'
            target_url="$PREVIEW_URL"
          elif [ "$QUEUE_OUTCOME" = success ]; then
            description='Preview running locally but public port is unreachable'
          else
            description='German preview queue did not complete'
          fi

          payload="$(STATE="$state" DESCRIPTION="$description" TARGET_URL="$target_url" node -e "console.log(JSON.stringify({state:process.env.STATE,context:'3DVR Server Preview',description:process.env.DESCRIPTION,...(process.env.TARGET_URL?{target_url:process.env.TARGET_URL}:{})}))")"

          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload" || true

          if [ "$state" = success ]; then
            echo "Preview: $target_url"
          else
            echo "$description" >&2
            exit 1
          fi
