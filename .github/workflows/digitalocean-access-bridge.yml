name: DigitalOcean Access Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/digitalocean-access-bridge.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digitalocean-access-bridge
  cancel-in-progress: false

env:
  DO_HOST: 167.172.193.194
  DO_USER: root

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve DigitalOcean SSH key
        shell: bash
        env:
          SSH_A: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
          SSH_B: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_C: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key=''
          for candidate in "$SSH_A" "$SSH_B" "$SSH_C"; do
            if [ -z "$key" ] && [ -n "$candidate" ]; then key="$candidate"; fi
          done
          [ -n "$key" ] || { echo 'No DigitalOcean SSH key is configured.' >&2; exit 1; }
          umask 077
          printf '%s\n' "$key" > /tmp/3dvr-do-key.raw
          if grep -q 'BEGIN .*PRIVATE KEY' /tmp/3dvr-do-key.raw; then
            cp /tmp/3dvr-do-key.raw /tmp/3dvr-do-key
          elif base64 -d /tmp/3dvr-do-key.raw > /tmp/3dvr-do-key 2>/dev/null && grep -q 'BEGIN .*PRIVATE KEY' /tmp/3dvr-do-key; then
            :
          else
            echo 'Configured DigitalOcean SSH key could not be decoded.' >&2
            exit 1
          fi
          chmod 600 /tmp/3dvr-do-key
          rm -f /tmp/3dvr-do-key.raw
          printf '%s\n' '167.172.193.194 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFoepoGbXWiidk4axaBwsI1Y/GWVckiqJxGLkBpTV6Pc' > /tmp/3dvr-known-hosts
          chmod 600 /tmp/3dvr-known-hosts

      - name: Ensure Remote Desktop Commander service
        shell: bash
        run: |
          set -euo pipefail
          opts=(-i /tmp/3dvr-do-key -o BatchMode=yes -o UserKnownHostsFile=/tmp/3dvr-known-hosts -o StrictHostKeyChecking=yes -o ConnectTimeout=10)
          ssh "${opts[@]}" "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          unit=desktop-commander-remote.service
          node_bin=/opt/node-v22/bin/node
          dc_entry=/usr/local/lib/node_modules/@wonderwhy-er/desktop-commander/dist/index.js
          [ -x "$node_bin" ] || { echo 'Managed Node 22 runtime is unavailable.' >&2; exit 1; }
          [ -f "$dc_entry" ] || { echo 'Desktop Commander global install is unavailable.' >&2; exit 1; }
          "$node_bin" -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major < 22 || (major === 22 && minor < 12)) process.exit(1)'

          cat >/etc/systemd/system/$unit <<UNIT
          [Unit]
          Description=Remote Desktop Commander device agent
          After=network-online.target
          Wants=network-online.target
          StartLimitIntervalSec=120
          StartLimitBurst=15

          [Service]
          Type=simple
          User=root
          Group=root
          WorkingDirectory=/root
          Environment=HOME=/root
          Environment=PATH=/opt/node-v22/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          ExecStart=$node_bin $dc_entry remote --persist-session
          Restart=on-failure
          RestartSec=10
          KillSignal=SIGINT
          TimeoutStopSec=20

          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload
          systemctl reset-failed "$unit" || true
          systemctl enable "$unit"

          repo="$HOME/.3dvr/portal"
          if [ -d "$repo/.git" ]; then
            if ! git -C "$repo" diff --quiet || ! git -C "$repo" diff --cached --quiet || [ -n "$(git -C "$repo" ls-files --others --exclude-standard)" ]; then
              git -C "$repo" stash push --include-untracked -m "access-bridge-$(date -u +%Y%m%dT%H%M%SZ)"
            fi
            git -C "$repo" fetch --prune origin main
            git -C "$repo" checkout main
            git -C "$repo" pull --ff-only origin main
          fi

          resilience="$repo/scripts/ops/install-desktop-commander-resilience.sh"
          if [ -f "$resilience" ]; then
            bash "$resilience"
          fi

          systemctl restart "$unit"
          ready=0
          pairing=0
          for attempt in 1 2 3 4 5 6; do
            sleep 5
            logs="$(journalctl -u "$unit" --since '-90 seconds' --no-pager)"
            if printf '%s\n' "$logs" | grep -Fq 'Device ready'; then
              ready=1
              break
            fi
            if printf '%s\n' "$logs" | grep -Fq 'Waiting for authorization'; then
              pairing=1
              break
            fi
            systemctl is-active --quiet "$unit" || continue
            pid="$(systemctl show "$unit" -p MainPID --value)"
            [ -n "$pid" ] && [ "$pid" != 0 ] || continue
            exe="$(readlink -f "/proc/$pid/exe" 2>/dev/null || true)"
            case "$exe" in
              /opt/node-v22*/bin/node|/opt/node-v22/bin/node) ;;
              *) echo "Control bridge is not running on managed Node 22: ${exe:-unknown}" >&2 ;;
            esac
          done

          if [ "$ready" -eq 1 ]; then
            echo 'REMOTE_DESKTOP_COMMANDER_READY=1'
            systemctl --no-pager --full status "$unit" | sed -n '1,12p'
            exit 0
          fi

          if [ "$pairing" -eq 1 ]; then
            echo 'REMOTE_DESKTOP_COMMANDER_PAIRING_REQUIRED=1' >&2
            echo 'The machine runtime is healthy; the existing OAuth refresh token was already consumed and one browser approval is required.' >&2
            journalctl -u "$unit" --since '-90 seconds' --no-pager \
              | grep -E 'Persisted session invalid|Please complete authentication|https://mcp\.desktopcommander\.app/device/verify|Enter this code|Code expires|Waiting for authorization' \
              | tail -12 || true
            exit 2
          fi

          echo 'Remote Desktop Commander did not reach Device ready state.' >&2
          systemctl --no-pager --full status "$unit" | sed -n '1,14p' || true
          journalctl -u "$unit" --since '-2 minutes' --no-pager \
            | grep -E 'Starting MCP Device|Connected to (Desktop Commander|Remote) MCP|Device ready|Device startup failed|Suggested solution|Shutting down device|Main process exited|Failed with result' \
            | tail -40 || true
          exit 1
          REMOTE

      - name: Remove SSH key
        if: always()
        shell: bash
        run: rm -f /tmp/3dvr-do-key /tmp/3dvr-do-key.raw /tmp/3dvr-known-hosts
