name: GPT-6 Astra Canary

on:
  pull_request:
    paths:
      - 'api/astra-canary.js'
      - 'tests/astra-canary.test.js'
      - '.github/workflows/astra-canary.yml'
  push:
    branches:
      - main
    paths:
      - 'api/astra-canary.js'
      - 'tests/astra-canary.test.js'
      - '.github/workflows/astra-canary.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/astra-canary.test.js
