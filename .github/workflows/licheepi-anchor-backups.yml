name: LicheePi Independent Recovery Backups

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/licheepi-anchor-backups.yml'
      - 'scripts/ops/licheepi-anchor-backup.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SSH_A: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
      SSH_B: ${{ secrets.DO_SSH_PRIVATE_KEY }}
      SSH_C: ${{ secrets.SSH_PRIVATE_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Choose shared backup stamp
        run: echo "STAMP=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_ENV"
      - name: Back up through OVH tunnel
        run: |
          set -euo pipefail
          STAMP="$STAMP" ANCHOR_HOST=40.160.137.41 ANCHOR_USERS='debian root' PI_ALIAS=lpi4a bash scripts/ops/licheepi-anchor-backup.sh | tee /tmp/ovh-backup.txt
          grep -q '^ENV_SHA=' /tmp/ovh-backup.txt
          grep -q '^BOOT_SHA=' /tmp/ovh-backup.txt
      - name: Back up through Hetzner tunnel
        run: |
          set -euo pipefail
          STAMP="$STAMP" ANCHOR_HOST=167.233.174.20 ANCHOR_USERS='root debian ubuntu tmsteph' PI_ALIAS=lpi4a-hetzner bash scripts/ops/licheepi-anchor-backup.sh | tee /tmp/hetz-backup.txt
          grep -q '^ENV_SHA=' /tmp/hetz-backup.txt
          grep -q '^BOOT_SHA=' /tmp/hetz-backup.txt
      - name: Compare and record verified backups
        run: |
          set -euo pipefail
          field(){ sed -n "s/^$2=//p" "$1"; }
          oe="$(field /tmp/ovh-backup.txt ENV_SHA)"; he="$(field /tmp/hetz-backup.txt ENV_SHA)"
          ob="$(field /tmp/ovh-backup.txt BOOT_SHA)"; hb="$(field /tmp/hetz-backup.txt BOOT_SHA)"
          lu="$(field /tmp/ovh-backup.txt LIVE_UBOOT)"
          test -n "$oe" -a -n "$he" -a -n "$ob" -a -n "$hb" -a -n "$lu"
          test "$oe" = "$he"
          # Compressed tar bytes may differ because gzip/tar can encode creation
          # time. Environment bytes must match exactly; each boot archive is
          # independently checksum-verified on its anchor.
          STAMP="$STAMP" ENV_SHA="$oe" OVH_BOOT_SHA="$ob" HETZ_BOOT_SHA="$hb" LIVE_UBOOT="$lu" python3 - <<'PY' >/tmp/result.json
          import datetime,json,os
          print(json.dumps({
            'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'ok':True,'backupStamp':os.environ['STAMP'],
            'ovhBackup':True,'hetznerBackup':True,'independentPulls':True,
            'environmentSha256':os.environ['ENV_SHA'],
            'ovhVendorBootSha256':os.environ['OVH_BOOT_SHA'],
            'hetznerVendorBootSha256':os.environ['HETZ_BOOT_SHA'],
            'liveUboot':os.environ['LIVE_UBOOT'],
            'verification':'OVH and Hetzner independently pulled and locally checksum-verified the exact U-Boot environment and known-good vendor boot recovery set through separate Pi reverse tunnels. Exact environment hashes match across anchors.'
          },indent=2))
          PY
          cat /tmp/result.json
          content="$(base64 -w0 /tmp/result.json)"
          url="https://api.github.com/repos/$GITHUB_REPOSITORY/contents/ops/licheepi-anchor-backup-result.json"
          sha="$(curl -fsS -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' "$url" 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("sha", ""))' 2>/dev/null || true)"
          python3 - "$content" "$sha" <<'PY' >/tmp/payload.json
          import json,sys
          p={'message':'Record verified LicheePi anchor backups','content':sys.argv[1],'branch':'main'}
          if sys.argv[2]: p['sha']=sys.argv[2]
          print(json.dumps(p))
          PY
          curl -fsS -X PUT -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' "$url" --data-binary @/tmp/payload.json >/dev/null
