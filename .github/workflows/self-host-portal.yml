name: Self-host 3DVR Portal

on:
  push:
    branches:
      - 'deploy/self-host-portal-v2'
    paths:
      - 'ops/self-host-deploy-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: 3dvr-self-host-portal
  cancel-in-progress: true

env:
  KNOWN_HOST: 167.172.193.194
  DEPLOY_REF: deploy/self-host-portal-v2

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Resolve 3DVR server credentials
        id: resolve
        shell: bash
        env:
          SSH_A: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
          SSH_B: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_C: ${{ secrets.SSH_PRIVATE_KEY }}
          DO_A: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          DO_B: ${{ secrets.DIGITALOCEAN_TOKEN }}
          DO_C: ${{ secrets.DO_TOKEN }}
        run: |
          set -euo pipefail
          ssh_key=''
          do_token=''
          for candidate in "$SSH_A" "$SSH_B" "$SSH_C"; do
            if [ -z "$ssh_key" ] && [ -n "$candidate" ]; then ssh_key="$candidate"; fi
          done
          for candidate in "$DO_A" "$DO_B" "$DO_C"; do
            if [ -z "$do_token" ] && [ -n "$candidate" ]; then do_token="$candidate"; fi
          done
          if [ -z "$ssh_key" ]; then
            echo 'No 3DVR server SSH key is configured.' >&2
            exit 1
          fi

          target="$KNOWN_HOST"
          power_action='not-requested'
          if [ -n "$do_token" ]; then
            code="$(curl -sS -o /tmp/droplets.json -w '%{http_code}' -H "Authorization: Bearer $do_token" 'https://api.digitalocean.com/v2/droplets?per_page=200' || true)"
            if [ "$code" = 200 ]; then
              read -r id state ip < <(python3 - "$KNOWN_HOST" <<'PY'
import json,sys
known=sys.argv[1]
data=json.load(open('/tmp/droplets.json'))
for d in data.get('droplets',[]):
    ips=[v.get('ip_address','') for v in d.get('networks',{}).get('v4',[]) if v.get('type')=='public']
    if known in ips or d.get('name')=='3dvr-agent':
        print(d.get('id',''), d.get('status',''), ips[0] if ips else '')
        break
else:
    print('','','')
PY
              )
              if [ -n "${id:-}" ]; then
                [ -n "${ip:-}" ] && target="$ip"
                if [ "${state:-}" = off ]; then
                  action_code="$(curl -sS -o /tmp/power.json -w '%{http_code}' -X POST -H "Authorization: Bearer $do_token" -H 'Content-Type: application/json' -d '{"type":"power_on"}' "https://api.digitalocean.com/v2/droplets/$id/actions" || true)"
                  [ "$action_code" = 201 ] && power_action='power-on' || power_action='power-on-failed'
                  sleep 15
                else
                  power_action='already-active'
                fi
              else
                power_action='droplet-not-found'
              fi
            else
              power_action='api-unavailable'
            fi
          fi

          umask 077
          printf '%s\n' "$ssh_key" > /tmp/3dvr-key.raw
          if grep -q 'BEGIN .*PRIVATE KEY' /tmp/3dvr-key.raw; then
            cp /tmp/3dvr-key.raw /tmp/3dvr-key
          elif base64 -d /tmp/3dvr-key.raw > /tmp/3dvr-key 2>/dev/null && grep -q 'BEGIN .*PRIVATE KEY' /tmp/3dvr-key; then
            :
          else
            echo 'Configured 3DVR SSH key could not be decoded.' >&2
            exit 1
          fi
          chmod 600 /tmp/3dvr-key
          rm -f /tmp/3dvr-key.raw /tmp/droplets.json /tmp/power.json
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "power_action=$power_action" >> "$GITHUB_OUTPUT"

      - name: Wait for SSH
        id: probe
        shell: bash
        env:
          TARGET: ${{ steps.resolve.outputs.target }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if timeout 5 bash -c "</dev/tcp/$TARGET/22" 2>/dev/null; then
              echo 'ready=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo "3DVR server $TARGET is not reachable on SSH." >&2
          exit 1

      - name: Deploy Portal and Forge worker
        id: remote
        shell: bash
        env:
          TARGET: ${{ steps.resolve.outputs.target }}
        run: |
          set -euo pipefail
          opts=(-i /tmp/3dvr-key -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10)
          ssh "${opts[@]}" "root@$TARGET" "GITHUB_REPOSITORY='$GITHUB_REPOSITORY' DEPLOY_REF='$DEPLOY_REF' bash -s" <<'REMOTE' | tee /tmp/self-host.out
          set -euo pipefail
          repo="$HOME/.3dvr/self-host-portal/source"
          mkdir -p "$(dirname "$repo")"
          if [ ! -d "$repo/.git" ]; then
            rm -rf "$repo"
            git clone --branch "$DEPLOY_REF" "https://github.com/$GITHUB_REPOSITORY.git" "$repo"
          fi

          if [ -z "$(git -C "$repo" status --porcelain)" ]; then
            git -C "$repo" fetch --prune origin "$DEPLOY_REF"
            git -C "$repo" checkout "$DEPLOY_REF"
            git -C "$repo" reset --hard "origin/$DEPLOY_REF"
          else
            echo 'Preserving existing live Forge edits; deploy checkout is dirty.'
          fi

          npm --prefix "$repo/apps/agent" ci
          chmod +x "$repo/scripts/ops/start-self-hosted-portal.sh"
          "$repo/scripts/ops/start-self-hosted-portal.sh" "$repo" 4310
          REMOTE

          url="$(sed -n 's/^SELF_HOST_URL=//p' /tmp/self-host.out | tail -n 1)"
          sha="$(sed -n 's/^SELF_HOST_SHA=//p' /tmp/self-host.out | tail -n 1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Verify self-hosted Portal externally
        id: verify
        shell: bash
        env:
          URL: ${{ steps.remote.outputs.url }}
        run: |
          set -euo pipefail
          curl -fsS --retry 10 --retry-delay 2 --retry-all-errors "$URL/__3dvr-preview" | grep -Fq '"ok":true'
          curl -fsS --retry 5 --retry-delay 1 --retry-all-errors "$URL/" | grep -Fq 'home-operator.js'
          curl -fsS --retry 5 --retry-delay 1 --retry-all-errors "$URL/operator/" | grep -Fq 'Message your operator'
          status="$(curl -sS -o /dev/null -w '%{http_code}' -X OPTIONS "$URL/api/openai-site?provider=operator")"
          [ "$status" = 204 ]

      - name: Publish self-host status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.remote.outputs.url }}
          REMOTE_OUTCOME: ${{ steps.remote.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          POWER_ACTION: ${{ steps.resolve.outputs.power_action }}
        run: |
          set -euo pipefail
          state=failure
          description="3DVR self-host deploy failed; power=$POWER_ACTION"
          target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$REMOTE_OUTCOME" = success ] && [ "$VERIFY_OUTCOME" = success ] && [ -n "$URL" ]; then
            state=success
            description='3DVR Portal running on our server; Operator route verified'
            target_url="$URL"
          fi
          payload="$(STATE="$state" DESCRIPTION="$description" TARGET_URL="$target_url" node -e 'process.stdout.write(JSON.stringify({state:process.env.STATE,context:"3DVR Self-Hosted Portal",description:process.env.DESCRIPTION,target_url:process.env.TARGET_URL}))')"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload"
          rm -f /tmp/3dvr-key /tmp/self-host.out
          [ "$state" = success ]
