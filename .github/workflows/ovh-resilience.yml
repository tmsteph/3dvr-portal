name: Install OVH Resilience Guardrails

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ops/resilience/install-ovh-guardrails.sh'
      - 'ops/browser/3dvr-browser-lane-start'
      - 'ops/browser/3dvr-browser-admit'
      - 'apps/agent/thomas-agent/node/human-handoff-gateway.js'
      - '.github/workflows/ovh-resilience.yml'

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Resolve OVH SSH key
        shell: bash
        env:
          RAW_KEY: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [ -n "$RAW_KEY" ]
          umask 077
          printf '%s\n' "$RAW_KEY" > /tmp/key.raw
          if grep -q 'BEGIN .*PRIVATE KEY' /tmp/key.raw; then
            cp /tmp/key.raw /tmp/key
          else
            base64 -d /tmp/key.raw > /tmp/key
          fi
          chmod 600 /tmp/key
          rm -f /tmp/key.raw

      - name: Install resilience controls on OVH
        shell: bash
        run: |
          set -euo pipefail
          opts=(-i /tmp/key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8)
          scp "${opts[@]}"             ops/resilience/install-ovh-guardrails.sh             ops/browser/3dvr-browser-lane-start             ops/browser/3dvr-browser-admit \
            apps/agent/thomas-agent/node/human-handoff-gateway.js \
            debian@40.160.137.41:/tmp/
          ssh "${opts[@]}" debian@40.160.137.41 '
            set -e
            sudo -n install -m 0755 /tmp/3dvr-browser-lane-start /usr/local/bin/3dvr-browser-lane-start
            sudo -n install -m 0755 /tmp/3dvr-browser-admit /usr/local/bin/3dvr-browser-admit
            sudo -n bash /tmp/install-ovh-guardrails.sh
            sudo -n install -o debian -g debian -m 0644 /tmp/human-handoff-gateway.js /home/debian/worktrees/human-handoff-live/apps/agent/thomas-agent/node/human-handoff-gateway.js
            sudo -n systemctl restart 3dvr-human-handoff.service
            rm -f /tmp/install-ovh-guardrails.sh /tmp/3dvr-browser-lane-start /tmp/3dvr-browser-admit /tmp/human-handoff-gateway.js
          '

      - name: Verify public portal remains healthy
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 6 --retry-delay 2 --retry-all-errors https://portal.3dvr.tech/__3dvr-health > /tmp/health.json
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/health.json","utf8"));if(!x.ok||x.host!=="self")process.exit(1)'

      - name: Remove SSH key
        if: always()
        run: rm -f /tmp/key /tmp/health.json
