name: UCN protocol tests
on:
  push:
    paths:
      - 'src/lib/universal-credit/**'
      - 'package.json'
      - '.github/workflows/ucn-tests.yml'
  pull_request:
    paths:
      - 'src/lib/universal-credit/**'
      - 'package.json'
      - '.github/workflows/ucn-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm run test:ucn
