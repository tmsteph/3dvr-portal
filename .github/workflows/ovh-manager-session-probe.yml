name: OVH Manager Session Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ovh-manager-session-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Probe OVH manager session'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve OVH SSH key
        shell: bash
        env:
          RAW_KEY: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [ -n "$RAW_KEY" ]
          umask 077
          printf '%s\n' "$RAW_KEY" > /tmp/key.raw
          if grep -q 'BEGIN .*PRIVATE KEY' /tmp/key.raw; then cp /tmp/key.raw /tmp/key; else base64 -d /tmp/key.raw > /tmp/key; fi
          chmod 600 /tmp/key
          rm -f /tmp/key.raw

      - name: Probe existing authenticated OVH Manager session
        shell: bash
        env:
          OVH_HOST: 40.160.137.41
          OVH_USER: debian
        run: |
          set -euo pipefail
          opts=(-i /tmp/key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8)
          lease_owner="github-actions-ovh-manager-session-probe-${GITHUB_RUN_ID:-unknown}"
          lease_token="$(ssh "${opts[@]}" "$OVH_USER@$OVH_HOST" "sudo -n /usr/local/bin/3dvr-browser-lease acquire general '$lease_owner' 300")"
          release_lease() {
            ssh "${opts[@]}" "$OVH_USER@$OVH_HOST" "sudo -n /usr/local/bin/3dvr-browser-lease release general '$lease_token'" >/dev/null 2>&1 || true
          }
          trap release_lease EXIT

          ssh "${opts[@]}" "$OVH_USER@$OVH_HOST" 'node -' <<'NODE'
          const http = require('node:http');
          (async () => {
            const delay = ms => new Promise(r => setTimeout(r, ms));
            const request = (method, path) => new Promise((resolve, reject) => {
              const req = http.request({host:'127.0.0.1', port:9222, method, path}, res => {
                let body=''; res.setEncoding('utf8'); res.on('data', d => body += d); res.on('end', () => {
                  if (res.statusCode < 200 || res.statusCode >= 300) return reject(new Error(`CDP HTTP ${res.statusCode}`));
                  resolve(body);
                });
              });
              req.on('error', reject); req.end();
            });
            const target = JSON.parse(await request('PUT', '/json/new?https%3A%2F%2Fwww.ovh.com%2Fmanager%2F'));
            if (!target.webSocketDebuggerUrl) throw new Error('No CDP target websocket');
            let ws;
            try {
              ws = new WebSocket(target.webSocketDebuggerUrl);
              await new Promise((resolve, reject) => { ws.addEventListener('open', resolve, {once:true}); ws.addEventListener('error', reject, {once:true}); });
              let seq=0; const pending=new Map();
              ws.addEventListener('message', ev => { const m=JSON.parse(ev.data); if (m.id && pending.has(m.id)) { const {resolve,reject}=pending.get(m.id); pending.delete(m.id); m.error ? reject(new Error(m.error.message)) : resolve(m.result); } });
              const send=(method,params={}) => new Promise((resolve,reject)=>{ const id=++seq; pending.set(id,{resolve,reject}); ws.send(JSON.stringify({id,method,params})); });
              await send('Page.enable'); await send('Runtime.enable'); await delay(5000);
              const result = await send('Runtime.evaluate',{expression:`JSON.stringify({href:location.href,title:document.title,text:(document.body?.innerText||'').slice(0,12000)})`,returnByValue:true});
              const page = JSON.parse(result.result.value || '{}');
              const href=String(page.href||'').toLowerCase(); const text=String(page.text||'').toLowerCase();
              let state='unknown';
              if (href.includes('/auth') || (text.includes('account id or email address') && text.includes('password'))) state='login_required';
              else if (href.includes('/manager') && (text.includes('bare metal') || text.includes('public cloud') || text.includes('network'))) state='authenticated';
              console.log(`OVH_MANAGER_SESSION=${state}`);
            } finally {
              try { if (ws) ws.close(); } catch {}
              try { await request('GET', `/json/close/${encodeURIComponent(target.id)}`); } catch {}
            }
          })().catch(error => { console.error(`OVH_MANAGER_SESSION_PROBE_ERROR=${error.message}`); process.exit(1); });
          NODE

      - name: Remove SSH key
        if: always()
        run: rm -f /tmp/key /tmp/key.raw
