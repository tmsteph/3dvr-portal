name: LicheePi Boot Rollback Guard

on:
  push:
    branches: [main]
    paths:
      - 'scripts/ops/licheepi-**'
      - 'docs/licheepi-**'
      - '.github/workflows/licheepi-**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify known-good boot path is still preserved
        shell: bash
        env:
          SSH_A: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
          SSH_B: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_C: ${{ secrets.SSH_PRIVATE_KEY }}
          OVH_HOST: 40.160.137.41
        run: |
          set -euo pipefail
          write_key(){ raw="$1"; dest="$2"; [ -n "$raw" ] || return 0; printf '%s\n' "$raw" > "$dest.raw"; if grep -q 'BEGIN .*PRIVATE KEY' "$dest.raw"; then cp "$dest.raw" "$dest"; elif base64 -d "$dest.raw" > "$dest" 2>/dev/null && grep -q 'BEGIN .*PRIVATE KEY' "$dest"; then :; else rm -f "$dest" "$dest.raw"; return 0; fi; chmod 600 "$dest"; rm -f "$dest.raw"; }
          write_key "$SSH_A" /tmp/a; write_key "$SSH_B" /tmp/b; write_key "$SSH_C" /tmp/c
          user=''; key=''
          for u in debian root; do for k in /tmp/a /tmp/b /tmp/c; do [ -f "$k" ] || continue; if ssh -i "$k" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=6 "$u@$OVH_HOST" true >/dev/null 2>&1; then user="$u"; key="$k"; break 2; fi; done; done
          test -n "$user"
          opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=6)
          ssh "${opts[@]}" "$user@$OVH_HOST" "ssh -o BatchMode=yes -o ConnectTimeout=8 lpi4a 'bash -s'" < scripts/ops/licheepi-boot-guard.sh
      - name: Configure OVH jump alias for on-site drill
        if: contains(github.event.head_commit.message, '[lpi-drill]')
        shell: bash
        env:
          SSH_A: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
          OVH_HOST: 40.160.137.41
        run: |
          set -euo pipefail
          printf '%s\n' "$SSH_A" > /tmp/key.raw
          if grep -q 'BEGIN .*PRIVATE KEY' /tmp/key.raw; then cp /tmp/key.raw /tmp/key; else base64 -d /tmp/key.raw > /tmp/key; fi
          chmod 600 /tmp/key
          user=''
          for u in debian root; do if ssh -i /tmp/key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=6 "$u@$OVH_HOST" true >/dev/null 2>&1; then user="$u"; break; fi; done
          test -n "$user"
          ssh -i /tmp/key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new "$user@$OVH_HOST" 'bash -s' <<'OVH'
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=6 3dvr-hetzner true
          cfg="$HOME/.ssh/config"; mkdir -p "$HOME/.ssh"; touch "$cfg"; chmod 700 "$HOME/.ssh"; chmod 600 "$cfg"
          identity="$(ssh -G lpi4a 2>/dev/null | awk '$1=="identityfile"{print $2; exit}')"
          piuser="$(ssh -G lpi4a 2>/dev/null | awk '$1=="user"{print $2; exit}')"
          test -n "$identity" -a -n "$piuser"
          tmp="$(mktemp)"
          sed '/^# BEGIN 3DVR LPI4A HETZNER JUMP$/,/^# END 3DVR LPI4A HETZNER JUMP$/d' "$cfg" > "$tmp"
          cat >> "$tmp" <<CFG
# BEGIN 3DVR LPI4A HETZNER JUMP
Host lpi4a-hetzner
  HostName 127.0.0.1
  Port 2223
  User $piuser
  IdentityFile $identity
  IdentitiesOnly yes
  BatchMode yes
  StrictHostKeyChecking accept-new
  ConnectTimeout 6
  ProxyCommand ssh -o BatchMode=yes -o ConnectTimeout=6 3dvr-hetzner -W %h:%p
# END 3DVR LPI4A HETZNER JUMP
CFG
          mv "$tmp" "$cfg"; chmod 600 "$cfg"
          ssh -o BatchMode=yes -o ConnectTimeout=8 lpi4a true
          ssh -o BatchMode=yes -o ConnectTimeout=8 lpi4a-hetzner true
          OVH
      - name: Run on-site resilience drill
        if: contains(github.event.head_commit.message, '[lpi-drill]')
        env:
          SSH_A: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
          SSH_B: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_C: ${{ secrets.SSH_PRIVATE_KEY }}
          OVH_HOST: 40.160.137.41
          HETZNER_HOST: 40.160.137.41
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/ops/licheepi-resilience-drill.sh
