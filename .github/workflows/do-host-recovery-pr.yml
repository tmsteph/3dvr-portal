name: DigitalOcean Preview Recovery Probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'ops/do-host-recovery-trigger.txt'

permissions:
  contents: write

concurrency:
  group: 3dvr-do-recovery-pr
  cancel-in-progress: true

jobs:
  recover:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KNOWN_HOST: 167.172.193.194
      PREVIEW_SHA: ${{ github.event.pull_request.base.sha }}
      RESULT_BRANCH: ${{ github.head_ref }}
    steps:
      - name: Recover host and preview
        id: recovery
        shell: bash
        env:
          SSH_A: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
          SSH_B: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_C: ${{ secrets.SSH_PRIVATE_KEY }}
          DO_A: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          DO_B: ${{ secrets.DIGITALOCEAN_TOKEN }}
          DO_C: ${{ secrets.DO_TOKEN }}
        run: |
          set -euo pipefail
          ssh_key=''; token=''
          for x in "$SSH_A" "$SSH_B" "$SSH_C"; do [ -z "$ssh_key" ] && [ -n "$x" ] && ssh_key="$x" || true; done
          for x in "$DO_A" "$DO_B" "$DO_C"; do [ -z "$token" ] && [ -n "$x" ] && token="$x" || true; done
          ssh_present=$([ -n "$ssh_key" ] && echo true || echo false)
          token_present=$([ -n "$token" ] && echo true || echo false)
          target="$KNOWN_HOST"; api_matched=false; power_action=unavailable

          if [ -n "$token" ]; then
            code="$(curl -sS -o /tmp/do.json -w '%{http_code}' -H "Authorization: Bearer $token" 'https://api.digitalocean.com/v2/droplets?per_page=200' || true)"
            if [ "$code" = 200 ]; then
              read -r id state ip < <(python3 - "$KNOWN_HOST" <<'PY'
import json,sys
known=sys.argv[1]; data=json.load(open('/tmp/do.json'))
for d in data.get('droplets',[]):
    ips=[n.get('ip_address','') for n in d.get('networks',{}).get('v4',[]) if n.get('type')=='public']
    if known in ips or d.get('name')=='3dvr-agent':
        print(d.get('id',''),d.get('status',''),ips[0] if ips else ''); break
else: print('','','')
PY
              )
              if [ -n "${id:-}" ]; then
                api_matched=true; [ -n "${ip:-}" ] && target="$ip"
                if [ "${state:-}" = off ]; then
                  ac="$(curl -sS -o /tmp/action.json -w '%{http_code}' -X POST -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d '{"type":"power_on"}' "https://api.digitalocean.com/v2/droplets/$id/actions" || true)"
                  [ "$ac" = 201 ] && power_action=power_on || power_action=failed
                  sleep 10
                else power_action=already_active; fi
              else power_action=not_found; fi
            else power_action=api_unavailable; fi
          fi

          p(){ timeout 4 bash -c "</dev/tcp/$target/$1" 2>/dev/null && echo true || echo false; }
          p22=$(p 22); p80=$(p 80); p443=$(p 443); p4310=$(p 4310)
          auth=false; worker=false; url=''; verified=false

          if [ "$ssh_present" = true ] && [ "$p22" = true ]; then
            umask 077; printf '%s\n' "$ssh_key" >/tmp/key.raw
            if grep -q 'BEGIN .*PRIVATE KEY' /tmp/key.raw; then cp /tmp/key.raw /tmp/key
            elif base64 -d /tmp/key.raw >/tmp/key 2>/dev/null && grep -q 'BEGIN .*PRIVATE KEY' /tmp/key; then :
            else rm -f /tmp/key; fi
            chmod 600 /tmp/key 2>/dev/null || true
            if [ -f /tmp/key ]; then
              opts=(-i /tmp/key -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8)
              if ssh "${opts[@]}" "root@$target" true; then
                auth=true
                ssh "${opts[@]}" "root@$target" "PREVIEW_SHA='$PREVIEW_SHA' bash -s" <<'REMOTE' | tee /tmp/preview.out
                set -euo pipefail
                repo="$HOME/.cache/3dvr-preview-source"
                mkdir -p "$HOME/.cache"
                if [ ! -d "$repo/.git" ]; then rm -rf "$repo"; git clone --filter=blob:none https://github.com/tmsteph/3dvr-portal.git "$repo"; fi
                git -C "$repo" fetch --force origin main
                git -C "$repo" cat-file -e "$PREVIEW_SHA^{commit}"

                agent=''
                for c in /opt/3dvr-agent "$HOME/.3dvr/portal/apps/agent" "$repo/apps/agent"; do
                  [ -f "$c/thomas-agent/node/agent-task-queue.js" ] && { agent="$c"; break; }
                done
                if [ -n "$agent" ] && command -v tmux >/dev/null 2>&1; then
                  [ -f "$HOME/.3dvr/config/env" ] && { set -a; . "$HOME/.3dvr/config/env"; set +a; }
                  tmux kill-session -t 3dvr-preview-worker 2>/dev/null || true
                  printf -v aq '%q' "$agent"
                  cmd="export THREEDVR_AGENT_OWNER_ALIAS=3dvr-preview THREEDVR_AGENT_WORKER_CAPABILITIES=shell,static-hosting THREEDVR_AGENT_WORKER_RISK_CLASSES=read_only,workspace_write; cd $aq; exec node thomas-agent/node/agent-task-queue.js loop --backend shell --interval-seconds 10 --worker-capabilities shell,static-hosting --worker-risk-classes read_only,workspace_write"
                  tmux new-session -d -s 3dvr-preview-worker "$cmd"
                fi
                chmod +x "$repo/scripts/ops/start-machine-preview.sh"
                "$repo/scripts/ops/start-machine-preview.sh" "$repo" main "$PREVIEW_SHA" 4310
                REMOTE
                url="$(sed -n 's/^PREVIEW_URL=//p' /tmp/preview.out | tail -n1)"
                [ -n "$url" ] && worker=true
              fi
            fi
          fi

          if [ -n "$url" ]; then
            if curl -fsS --retry 8 --retry-delay 2 --retry-all-errors "$url/__3dvr-preview" >/tmp/health.json; then
              if python3 - "$PREVIEW_SHA" <<'PY'
import json,sys
h=json.load(open('/tmp/health.json')); assert h.get('ok') is True and h.get('sha')==sys.argv[1]
PY
              then
                curl -fsS --retry 5 --retry-delay 1 --retry-all-errors "$url/home-operator.js" | grep -Fq 'persistHistory' && verified=true || true
              fi
            fi
          fi

          SSH_PRESENT="$ssh_present" TOKEN_PRESENT="$token_present" API_MATCHED="$api_matched" POWER_ACTION="$power_action" \
          P22="$p22" P80="$p80" P443="$p443" P4310="$p4310" AUTH="$auth" WORKER="$worker" URL="$url" VERIFIED="$verified" \
          python3 - <<'PY' >/tmp/result.json
import datetime,json,os
b=lambda k: os.environ.get(k,'').lower()=='true'
u=os.environ.get('URL',''); u=u if u.startswith('https://') else ''
print(json.dumps({'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
'sshKeyPresent':b('SSH_PRESENT'),'doTokenPresent':b('TOKEN_PRESENT'),'apiMatchedKnownHost':b('API_MATCHED'),
'powerAction':os.environ.get('POWER_ACTION') or 'unavailable','port22':b('P22'),'port80':b('P80'),'port443':b('P443'),'port4310':b('P4310'),
'sshAuthenticated':b('AUTH'),'previewWorkerRecovered':b('WORKER'),'previewUrl':u,'previewVerified':b('VERIFIED')},indent=2))
PY
          rm -f /tmp/key /tmp/key.raw /tmp/do.json /tmp/action.json /tmp/preview.out /tmp/health.json

      - name: Persist sanitized result on recovery branch
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -s /tmp/result.json ] || printf '{"workflowFailedBeforeResult":true}\n' >/tmp/result.json
          content="$(base64 -w0 /tmp/result.json)"
          python3 - "$content" "$RESULT_BRANCH" <<'PY' >/tmp/payload.json
import json,sys
print(json.dumps({'message':'Record DigitalOcean recovery result','content':sys.argv[1],'branch':sys.argv[2]}))
PY
          curl -fsS -X PUT -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/ops/do-host-recovery-result.json" --data-binary @/tmp/payload.json >/dev/null
