name: DigitalOcean Preview Recovery Probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'ops/do-host-recovery-trigger.txt'

permissions:
  contents: write

concurrency:
  group: 3dvr-do-recovery-pr
  cancel-in-progress: true

jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      KNOWN_HOST: 167.172.193.194
      RESULT_BRANCH: ${{ github.head_ref }}
    steps:
      - name: Probe DigitalOcean account and host
        id: probe
        shell: bash
        env:
          SSH_A: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
          SSH_B: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_C: ${{ secrets.SSH_PRIVATE_KEY }}
          DO_A: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          DO_B: ${{ secrets.DIGITALOCEAN_TOKEN }}
          DO_C: ${{ secrets.DO_TOKEN }}
        run: |
          set -euo pipefail
          ssh_key=''
          token=''
          for x in "$SSH_A" "$SSH_B" "$SSH_C"; do
            if [ -z "$ssh_key" ] && [ -n "$x" ]; then ssh_key="$x"; fi
          done
          for x in "$DO_A" "$DO_B" "$DO_C"; do
            if [ -z "$token" ] && [ -n "$x" ]; then token="$x"; fi
          done
          ssh_present=$([ -n "$ssh_key" ] && echo true || echo false)
          token_present=$([ -n "$token" ] && echo true || echo false)
          target="$KNOWN_HOST"
          api_matched=false
          power_action=unavailable

          if [ -n "$token" ]; then
            code="$(curl -sS -o /tmp/do.json -w '%{http_code}' -H "Authorization: Bearer $token" 'https://api.digitalocean.com/v2/droplets?per_page=200' || true)"
            if [ "$code" = 200 ]; then
              match="$(KNOWN_HOST="$KNOWN_HOST" python3 -c 'import json,os; d=json.load(open("/tmp/do.json")); k=os.environ["KNOWN_HOST"]; m=[]; [(m.append((str(x.get("id","")),str(x.get("status","")),next((n.get("ip_address","") for n in x.get("networks",{}).get("v4",[]) if n.get("type")=="public"),"")))) for x in d.get("droplets",[]) if k in [n.get("ip_address","") for n in x.get("networks",{}).get("v4",[])] or x.get("name")=="3dvr-agent"]; print("|".join(m[0]) if m else "||")')"
              IFS='|' read -r droplet_id droplet_state droplet_ip <<<"$match"
              if [ -n "${droplet_id:-}" ]; then
                api_matched=true
                if [ -n "${droplet_ip:-}" ]; then target="$droplet_ip"; fi
                if [ "${droplet_state:-}" = off ]; then
                  ac="$(curl -sS -o /tmp/action.json -w '%{http_code}' -X POST -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d '{"type":"power_on"}' "https://api.digitalocean.com/v2/droplets/$droplet_id/actions" || true)"
                  if [ "$ac" = 201 ]; then power_action=power_on; else power_action=failed; fi
                  sleep 10
                else
                  power_action=already_active
                fi
              else
                power_action=not_found
              fi
            else
              power_action=api_unavailable
            fi
          fi

          probe_port() {
            if timeout 4 bash -c "</dev/tcp/$target/$1" 2>/dev/null; then echo true; else echo false; fi
          }
          p22=$(probe_port 22)
          p80=$(probe_port 80)
          p443=$(probe_port 443)
          p4310=$(probe_port 4310)
          authenticated=false

          if [ "$ssh_present" = true ] && [ "$p22" = true ]; then
            umask 077
            printf '%s\n' "$ssh_key" >/tmp/key.raw
            if grep -q 'BEGIN .*PRIVATE KEY' /tmp/key.raw; then
              cp /tmp/key.raw /tmp/key
            elif base64 -d /tmp/key.raw >/tmp/key 2>/dev/null && grep -q 'BEGIN .*PRIVATE KEY' /tmp/key; then
              true
            else
              rm -f /tmp/key
            fi
            chmod 600 /tmp/key 2>/dev/null || true
            if [ -f /tmp/key ] && ssh -i /tmp/key -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 "root@$target" true; then
              authenticated=true
            fi
          fi

          SSH_PRESENT="$ssh_present" TOKEN_PRESENT="$token_present" API_MATCHED="$api_matched" POWER_ACTION="$power_action" P22="$p22" P80="$p80" P443="$p443" P4310="$p4310" AUTH="$authenticated" python3 -c 'import datetime,json,os; b=lambda k:os.environ.get(k,"").lower()=="true"; print(json.dumps({"checkedAt":datetime.datetime.now(datetime.timezone.utc).isoformat(),"sshKeyPresent":b("SSH_PRESENT"),"doTokenPresent":b("TOKEN_PRESENT"),"apiMatchedKnownHost":b("API_MATCHED"),"powerAction":os.environ.get("POWER_ACTION") or "unavailable","port22":b("P22"),"port80":b("P80"),"port443":b("P443"),"port4310":b("P4310"),"sshAuthenticated":b("AUTH")},indent=2))' >/tmp/result.json
          rm -f /tmp/key /tmp/key.raw /tmp/do.json /tmp/action.json

      - name: Persist sanitized probe result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -s /tmp/result.json ]; then printf '{"workflowFailedBeforeResult":true}\n' >/tmp/result.json; fi
          content="$(base64 -w0 /tmp/result.json)"
          payload="$(CONTENT="$content" BRANCH="$RESULT_BRANCH" python3 -c 'import json,os; print(json.dumps({"message":"Record DigitalOcean recovery probe","content":os.environ["CONTENT"],"branch":os.environ["BRANCH"]}))')"
          curl -fsS -X PUT -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/ops/do-host-recovery-result.json" -d "$payload" >/dev/null
