name: OVH Manager Target Status

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ovh-manager-target-status.yml'

permissions:
  contents: read

jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Read OVH manager target status'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Resolve OVH SSH key
        shell: bash
        env:
          RAW_KEY: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [ -n "$RAW_KEY" ]
          umask 077
          printf '%s\n' "$RAW_KEY" > /tmp/key.raw
          if grep -q 'BEGIN .*PRIVATE KEY' /tmp/key.raw; then cp /tmp/key.raw /tmp/key; else base64 -d /tmp/key.raw > /tmp/key; fi
          chmod 600 /tmp/key
          rm -f /tmp/key.raw

      - name: Classify existing OVH Manager target without browser mutation
        shell: bash
        env:
          OVH_HOST: 40.160.137.41
          OVH_USER: debian
        run: |
          set -euo pipefail
          opts=(-i /tmp/key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8)
          ssh "${opts[@]}" "$OVH_USER@$OVH_HOST" 'python3 -' <<'PY'
          import json, urllib.request
          with urllib.request.urlopen('http://127.0.0.1:9222/json/list', timeout=5) as r:
              targets=json.load(r)
          urls=[str(t.get('url','')) for t in targets if t.get('type')=='page']
          ovh=[u for u in urls if 'ovh.' in u.lower() or 'ovhcloud.' in u.lower()]
          state='no_target'
          for url in ovh:
              low=url.lower()
              if '/auth' in low or 'login' in low or 'signin' in low:
                  state='login_required'; break
              if '/manager' in low:
                  state='manager_target'; break
          print(f'OVH_MANAGER_TARGET={state}')
          PY

      - name: Remove SSH key
        if: always()
        run: rm -f /tmp/key /tmp/key.raw
