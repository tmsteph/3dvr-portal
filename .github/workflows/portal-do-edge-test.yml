name: Portal Direct DigitalOcean Edge Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/portal-do-edge-test.yml'

permissions:
  contents: read

concurrency:
  group: portal-do-edge-test
  cancel-in-progress: true

env:
  OVH_HOST: 40.160.137.41
  OVH_USER: debian
  DO_HOST: 167.172.193.194

jobs:
  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve SSH keys
        id: keys
        shell: bash
        env:
          SSH_A: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
          SSH_B: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_C: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          write_key() {
            local raw="$1" dest="$2"
            [ -n "$raw" ] || return 0
            printf '%s\n' "$raw" > "$dest.raw"
            if grep -q 'BEGIN .*PRIVATE KEY' "$dest.raw"; then
              cp "$dest.raw" "$dest"
            elif base64 -d "$dest.raw" > "$dest" 2>/dev/null && grep -q 'BEGIN .*PRIVATE KEY' "$dest"; then
              :
            else
              rm -f "$dest" "$dest.raw"
              return 0
            fi
            chmod 600 "$dest"
            rm -f "$dest.raw"
          }
          write_key "$SSH_A" /tmp/key-a
          write_key "$SSH_B" /tmp/key-b
          write_key "$SSH_C" /tmp/key-c

          pick() {
            local host="$1"; shift
            local user key
            for user in "$@"; do
              for key in /tmp/key-a /tmp/key-b /tmp/key-c; do
                [ -f "$key" ] || continue
                if ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=6 "$user@$host" true >/dev/null 2>&1; then
                  printf '%s|%s\n' "$user" "$key"
                  return 0
                fi
              done
            done
            return 1
          }

          ovh="$(pick "$OVH_HOST" debian root)"
          do_conn="$(pick "$DO_HOST" root debian)"
          IFS='|' read -r ovh_user ovh_key <<< "$ovh"
          IFS='|' read -r do_user do_key <<< "$do_conn"
          cp "$ovh_key" /tmp/ovh-key
          cp "$do_key" /tmp/do-key
          chmod 600 /tmp/ovh-key /tmp/do-key
          echo "ovh_user=$ovh_user" >> "$GITHUB_OUTPUT"
          echo "do_user=$do_user" >> "$GITHUB_OUTPUT"

      - name: Create restricted DigitalOcean to OVH tunnel
        id: tunnel
        shell: bash
        env:
          OVH_USER_RESOLVED: ${{ steps.keys.outputs.ovh_user }}
          DO_USER_RESOLVED: ${{ steps.keys.outputs.do_user }}
        run: |
          set -euo pipefail
          [ "$DO_USER_RESOLVED" = root ] || { echo 'DigitalOcean edge currently expects root SSH for the dedicated tunnel service.' >&2; exit 4; }
          opts_ovh=(-i /tmp/ovh-key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8)
          opts_do=(-i /tmp/do-key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8)

          pubkey="$(ssh "${opts_do[@]}" root@"$DO_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          install -d -m 700 /root/.ssh
          if [ ! -f /root/.ssh/3dvr-portal-edge ]; then
            ssh-keygen -q -t ed25519 -N '' -C 3dvr-portal-edge -f /root/.ssh/3dvr-portal-edge
            chmod 600 /root/.ssh/3dvr-portal-edge
          fi
          cat /root/.ssh/3dvr-portal-edge.pub
          REMOTE
          )"
          [[ "$pubkey" == ssh-ed25519\ * ]] || { echo 'Dedicated edge public key was not created.' >&2; exit 5; }

          printf '%s\n' "$pubkey" | ssh "${opts_ovh[@]}" "$OVH_USER_RESOLVED@$OVH_HOST" "DO_HOST='$DO_HOST' bash -s" <<'REMOTE'
          set -euo pipefail
          read -r pubkey
          install -d -m 700 "$HOME/.ssh"
          touch "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"
          marker='3dvr-portal-edge'
          grep -v "$marker" "$HOME/.ssh/authorized_keys" > "$HOME/.ssh/authorized_keys.next" || true
          printf 'from="%s",no-agent-forwarding,no-X11-forwarding,no-pty,no-user-rc,permitopen="127.0.0.1:4320" %s\n' "$DO_HOST" "$pubkey" >> "$HOME/.ssh/authorized_keys.next"
          mv "$HOME/.ssh/authorized_keys.next" "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"
          REMOTE

          ssh "${opts_do[@]}" root@"$DO_HOST" "OVH_HOST='$OVH_HOST' OVH_USER='$OVH_USER_RESOLVED' bash -s" <<'REMOTE'
          set -euo pipefail
          systemctl stop 3dvr-portal-ovh-tunnel.service 2>/dev/null || true
          if ss -ltnp | grep -qE '127\.0\.0\.1:54321[[:space:]]'; then
            echo 'Reserved Portal tunnel port 54321 is already in use.' >&2
            ss -ltnp | grep -E '127\.0\.0\.1:54321[[:space:]]' >&2 || true
            exit 7
          fi
          cat > /etc/systemd/system/3dvr-portal-ovh-tunnel.service <<EOF
          [Unit]
          Description=3DVR Portal tunnel to OVH
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          ExecStart=/usr/bin/ssh -N -T -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ExitOnForwardFailure=yes -o StrictHostKeyChecking=accept-new -i /root/.ssh/3dvr-portal-edge -L 127.0.0.1:54321:127.0.0.1:4320 $OVH_USER@$OVH_HOST
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
          EOF
          systemctl daemon-reload
          systemctl enable --now 3dvr-portal-ovh-tunnel.service
          systemctl restart 3dvr-portal-ovh-tunnel.service

          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 3 http://127.0.0.1:54321/__3dvr-health > /tmp/3dvr-edge-health.json; then
              break
            fi
            [ "$attempt" -lt 12 ] || {
              systemctl status 3dvr-portal-ovh-tunnel.service --no-pager >&2 || true
              journalctl -u 3dvr-portal-ovh-tunnel.service -n 80 --no-pager >&2 || true
              timeout 12s ssh -vv -N -T -o BatchMode=yes -o ConnectTimeout=8 -o ExitOnForwardFailure=yes -o StrictHostKeyChecking=accept-new -i /root/.ssh/3dvr-portal-edge -L 127.0.0.1:54322:127.0.0.1:4320 "$OVH_USER@$OVH_HOST" 2>&1 | tail -n 80 >&2 || true
              exit 6
            }
            sleep 1
          done
          node -e 'const fs=require("node:fs");const h=JSON.parse(fs.readFileSync("/tmp/3dvr-edge-health.json","utf8"));if(!h.ok||h.operatorApi!=="native")process.exit(1)'
          rm -f /tmp/3dvr-edge-health.json
          REMOTE

      - name: Stage guarded DigitalOcean HTTP edge
        shell: bash
        env:
          DO_USER_RESOLVED: ${{ steps.keys.outputs.do_user }}
        run: |
          set -euo pipefail
          opts=(-i /tmp/do-key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8)
          ssh "${opts[@]}" "$DO_USER_RESOLVED@$DO_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          if ss -ltnp | grep -qE '[:.]80[[:space:]]'; then
            if systemctl is-active --quiet caddy 2>/dev/null && grep -Fq '3DVR Portal direct test edge' /etc/caddy/Caddyfile 2>/dev/null; then
              :
            else
              echo 'Port 80 is already in use on the DigitalOcean edge; refusing to overwrite it.' >&2
              ss -ltnp | grep -E '[:.]80[[:space:]]' >&2 || true
              exit 8
            fi
          fi

          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y caddy
          if command -v ufw >/dev/null 2>&1 && ufw status | grep -Fq 'Status: active'; then
            ufw allow 80/tcp
          fi
          cat > /etc/caddy/Caddyfile <<'CADDY'
          # 3DVR Portal direct test edge
          http://portal.3dvr.tech, http://167.172.193.194 {
            reverse_proxy 127.0.0.1:54321
          }
          CADDY
          caddy validate --config /etc/caddy/Caddyfile
          systemctl enable --now caddy
          systemctl restart caddy
          curl -fsS -H 'Host: portal.3dvr.tech' http://127.0.0.1/__3dvr-health >/tmp/3dvr-public-edge-health.json
          node -e 'const fs=require("node:fs");const h=JSON.parse(fs.readFileSync("/tmp/3dvr-public-edge-health.json","utf8"));if(!h.ok||h.operatorApi!=="native")process.exit(1)'
          rm -f /tmp/3dvr-public-edge-health.json
          REMOTE

      - name: Verify direct Portal from public internet
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 12 -H 'Host: portal.3dvr.tech' "http://$DO_HOST/__3dvr-health" > /tmp/public-health.json
          node -e 'const fs=require("node:fs");const h=JSON.parse(fs.readFileSync("/tmp/public-health.json","utf8"));if(!h.ok||h.operatorApi!=="native")process.exit(1)'
          curl -fsS --max-time 12 -H 'Host: portal.3dvr.tech' "http://$DO_HOST/operator/" | grep -Fq 'Message your operator'
          curl -fsS --max-time 12 -H 'Host: portal.3dvr.tech' "http://$DO_HOST/operator/handoff.js" | grep -Fq 'operatorHandoffUrl'
          echo "Direct test URL: http://$DO_HOST/"
          echo "### Direct Portal test" >> "$GITHUB_STEP_SUMMARY"
          echo "http://$DO_HOST/" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove SSH keys
        if: always()
        run: rm -f /tmp/key-a /tmp/key-b /tmp/key-c /tmp/ovh-key /tmp/do-key /tmp/private-health.json /tmp/public-health.json
