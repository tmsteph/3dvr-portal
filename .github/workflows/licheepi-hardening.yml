name: Harden LicheePi Remote Access

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/licheepi-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install redundant LicheePi recovery path
        shell: bash
        env:
          SSH_A: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
          SSH_B: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_C: ${{ secrets.SSH_PRIVATE_KEY }}
          OVH_HOST: 40.160.137.41
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -u
          write_key(){ raw="$1"; dest="$2"; [ -n "$raw" ] || return 0; printf '%s\n' "$raw" > "$dest.raw"; if grep -q 'BEGIN .*PRIVATE KEY' "$dest.raw"; then cp "$dest.raw" "$dest"; elif base64 -d "$dest.raw" > "$dest" 2>/dev/null && grep -q 'BEGIN .*PRIVATE KEY' "$dest"; then :; else rm -f "$dest" "$dest.raw"; return 0; fi; chmod 600 "$dest"; rm -f "$dest.raw"; }
          write_key "$SSH_A" /tmp/key-a; write_key "$SSH_B" /tmp/key-b; write_key "$SSH_C" /tmp/key-c
          ovh_user=''; ovh_key=''
          for u in debian root; do for k in /tmp/key-a /tmp/key-b /tmp/key-c; do [ -f "$k" ] || continue; if ssh -i "$k" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=6 "$u@$OVH_HOST" true >/dev/null 2>&1; then ovh_user="$u"; ovh_key="$k"; break 2; fi; done; done
          result=/tmp/result.json
          if [ -z "$ovh_user" ]; then echo '{"ok":false,"note":"OVH bootstrap unavailable; existing LicheePi configuration left untouched"}' > "$result"; else
            opts=(-i "$ovh_key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=6)
            if ! ssh "${opts[@]}" "$ovh_user@$OVH_HOST" "ssh -o BatchMode=yes -o ConnectTimeout=8 lpi4a true" >/dev/null 2>&1; then
              echo '{"ok":false,"note":"Primary lpi4a route unavailable; no Pi-side changes attempted"}' > "$result"
            else
              # Add a second, independent cloud entry point. Never disturb the known-good port 2223.
              ssh "${opts[@]}" "$ovh_user@$OVH_HOST" 'bash -s' <<'OVH'
set -euo pipefail
cfg="$HOME/.ssh/config"; mkdir -p "$HOME/.ssh"; touch "$cfg"; chmod 700 "$HOME/.ssh"; chmod 600 "$cfg"
tmp="$(mktemp)"; sed '/^# BEGIN 3DVR LPI4A FALLBACK$/,/^# END 3DVR LPI4A FALLBACK$/d' "$cfg" > "$tmp"
cat >> "$tmp" <<'CFG'
# BEGIN 3DVR LPI4A FALLBACK
Host lpi4a-fallback
  HostName 127.0.0.1
  Port 2224
  User sipeed
  IdentityFile ~/.ssh/id_ed25519_3dvr_mesh
  IdentitiesOnly yes
  BatchMode yes
  StrictHostKeyChecking accept-new
  ConnectTimeout 6
  ServerAliveInterval 20
  ServerAliveCountMax 3
# END 3DVR LPI4A FALLBACK
CFG
mv "$tmp" "$cfg"; chmod 600 "$cfg"
OVH

              # Configure the Pi over the still-working primary tunnel.
              ssh "${opts[@]}" "$ovh_user@$OVH_HOST" "ssh -o BatchMode=yes -o ConnectTimeout=8 lpi4a 'OVH_HOST=$OVH_HOST bash -s'" <<'PI' >/tmp/pi-hardening.txt 2>&1 || true
set -u
mkdir -p "$HOME/.local/bin" "$HOME/.ssh" "$HOME/.config/systemd/user"
chmod 700 "$HOME/.ssh"

# Find a Pi-side key that can reach the OVH rendezvous without touching the current tunnel.
out_user=''; out_key=''
for u in debian root; do
  for k in "$HOME/.ssh/id_ed25519_3dvr" "$HOME/.ssh/id_ed25519_3dvr_mesh" "$HOME/.ssh/id_ed25519"; do
    [ -s "$k" ] || continue
    if ssh -i "$k" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=6 "$u@$OVH_HOST" true >/dev/null 2>&1; then out_user="$u"; out_key="$k"; break 2; fi
  done
done

printf 'outbound_ovh=%s\n' "$([ -n "$out_key" ] && echo true || echo false)"
printf 'outbound_user=%s\n' "$out_user"
printf 'outbound_key=%s\n' "$out_key"

if [ -n "$out_key" ]; then
  cfg="$HOME/.ssh/config"; touch "$cfg"; chmod 600 "$cfg"; tmp="$(mktemp)"
  sed '/^# BEGIN 3DVR LPI4A OUTBOUND FALLBACK$/,/^# END 3DVR LPI4A OUTBOUND FALLBACK$/d' "$cfg" > "$tmp"
  cat >> "$tmp" <<CFG
# BEGIN 3DVR LPI4A OUTBOUND FALLBACK
Host 3dvr-ovh-lpi-fallback
  HostName $OVH_HOST
  User $out_user
  IdentityFile $out_key
  IdentitiesOnly yes
  BatchMode yes
  StrictHostKeyChecking accept-new
  ConnectTimeout 8
  ServerAliveInterval 20
  ServerAliveCountMax 3
# END 3DVR LPI4A OUTBOUND FALLBACK
CFG
  mv "$tmp" "$cfg"; chmod 600 "$cfg"

  cat > "$HOME/.local/bin/3dvr-lpi-fallback-tunnel" <<'SH'
#!/usr/bin/env bash
exec ssh -N -T -o ExitOnForwardFailure=yes -o BatchMode=yes -o ConnectTimeout=8 -o ServerAliveInterval=20 -o ServerAliveCountMax=3 -R 127.0.0.1:2224:127.0.0.1:22 3dvr-ovh-lpi-fallback
SH
  chmod 700 "$HOME/.local/bin/3dvr-lpi-fallback-tunnel"
fi

sudo_ok=false; sudo -n true >/dev/null 2>&1 && sudo_ok=true
printf 'sudo_nopasswd=%s\n' "$sudo_ok"

# Keep the SSH server alive across every reboot.
if [ "$sudo_ok" = true ]; then
  if sudo systemctl cat ssh >/dev/null 2>&1; then sudo systemctl enable --now ssh >/dev/null 2>&1 || true
  elif sudo systemctl cat sshd >/dev/null 2>&1; then sudo systemctl enable --now sshd >/dev/null 2>&1 || true; fi
fi

fallback_install='none'
if [ -n "$out_key" ]; then
  if [ "$sudo_ok" = true ]; then
    sudo tee /etc/systemd/system/3dvr-lpi-fallback.service >/dev/null <<EOF
[Unit]
Description=3DVR LicheePi redundant reverse SSH tunnel
Wants=network-online.target
After=network-online.target

[Service]
Type=simple
User=$(id -un)
Environment=HOME=$HOME
ExecStart=$HOME/.local/bin/3dvr-lpi-fallback-tunnel
Restart=always
RestartSec=10
StartLimitIntervalSec=0

[Install]
WantedBy=multi-user.target
EOF
    sudo systemctl daemon-reload
    sudo systemctl enable --now 3dvr-lpi-fallback.service >/dev/null 2>&1 || true
    fallback_install='system'
  else
    linger="$(loginctl show-user "$(id -un)" -p Linger --value 2>/dev/null || true)"
    if [ "$linger" = yes ] && systemctl --user is-system-running >/dev/null 2>&1; then
      cat > "$HOME/.config/systemd/user/3dvr-lpi-fallback.service" <<EOF
[Unit]
Description=3DVR LicheePi redundant reverse SSH tunnel
After=network-online.target

[Service]
ExecStart=$HOME/.local/bin/3dvr-lpi-fallback-tunnel
Restart=always
RestartSec=10

[Install]
WantedBy=default.target
EOF
      systemctl --user daemon-reload || true
      systemctl --user enable --now 3dvr-lpi-fallback.service >/dev/null 2>&1 || true
      fallback_install='user-systemd'
    elif command -v crontab >/dev/null 2>&1; then
      (crontab -l 2>/dev/null | grep -v '3dvr-lpi-fallback-tunnel' || true; echo '@reboot sleep 45; while true; do $HOME/.local/bin/3dvr-lpi-fallback-tunnel; sleep 10; done') | crontab -
      pgrep -f '3dvr-lpi-fallback-tunnel' >/dev/null 2>&1 || nohup sh -c 'while true; do "$HOME/.local/bin/3dvr-lpi-fallback-tunnel"; sleep 10; done' >"$HOME/.3dvr-lpi-fallback.log" 2>&1 &
      fallback_install='cron'
    fi
  fi
fi
printf 'fallback_install=%s\n' "$fallback_install"

# Network self-heal: conservative. Only restart networking after 3 consecutive
# failures to reach the OVH SSH port, and only when we have passwordless sudo.
if [ "$sudo_ok" = true ]; then
  sudo tee /usr/local/sbin/3dvr-lpi-network-heal >/dev/null <<'SH'
#!/usr/bin/env bash
set -u
host=40.160.137.41
state=/run/3dvr-lpi-network-failures
if timeout 6 bash -c "</dev/tcp/$host/22" 2>/dev/null; then echo 0 > "$state"; exit 0; fi
n="$(cat "$state" 2>/dev/null || echo 0)"; case "$n" in ''|*[!0-9]*) n=0;; esac; n=$((n+1)); echo "$n" > "$state"
[ "$n" -ge 3 ] || exit 0
if systemctl is-active --quiet NetworkManager; then systemctl restart NetworkManager
elif systemctl is-active --quiet systemd-networkd; then systemctl restart systemd-networkd
elif systemctl is-active --quiet wpa_supplicant; then systemctl restart wpa_supplicant
fi
echo 0 > "$state"
SH
  sudo chmod 755 /usr/local/sbin/3dvr-lpi-network-heal
  sudo tee /etc/systemd/system/3dvr-lpi-network-heal.service >/dev/null <<'EOF'
[Unit]
Description=3DVR LicheePi network self-heal check
After=network-online.target
[Service]
Type=oneshot
ExecStart=/usr/local/sbin/3dvr-lpi-network-heal
EOF
  sudo tee /etc/systemd/system/3dvr-lpi-network-heal.timer >/dev/null <<'EOF'
[Unit]
Description=Run 3DVR LicheePi network self-heal
[Timer]
OnBootSec=2min
OnUnitActiveSec=2min
Persistent=true
[Install]
WantedBy=timers.target
EOF
  sudo systemctl daemon-reload
  sudo systemctl enable --now 3dvr-lpi-network-heal.timer >/dev/null 2>&1 || true
fi

printf 'primary_process=%s\n' "$(ps -ef | grep -E '[s]sh .*2223|[m]esh-tunnel' | head -n1 | tr '\n' ' ')"
printf 'fallback_process=%s\n' "$(ps -ef | grep -E '[s]sh .*2224|[f]allback-tunnel' | head -n1 | tr '\n' ' ')"
printf 'ssh_active=%s\n' "$(systemctl is-active ssh 2>/dev/null || systemctl is-active sshd 2>/dev/null || true)"
printf 'network_timer=%s\n' "$(systemctl is-enabled 3dvr-lpi-network-heal.timer 2>/dev/null || true)"
printf 'ips=%s\n' "$(hostname -I 2>/dev/null)"
PI

              # Verify the independent port from the rendezvous host.
              fallback=false
              for i in 1 2 3 4 5 6 7 8; do
                if ssh "${opts[@]}" "$ovh_user@$OVH_HOST" "ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=5 lpi4a-fallback true" >/dev/null 2>&1; then fallback=true; break; fi
                sleep 2
              done
              primary=false; ssh "${opts[@]}" "$ovh_user@$OVH_HOST" "ssh -o BatchMode=yes -o ConnectTimeout=5 lpi4a true" >/dev/null 2>&1 && primary=true
              DETAILS="$(cat /tmp/pi-hardening.txt)" PRIMARY="$primary" FALLBACK="$fallback" python3 - <<'PY' > "$result"
import json,os,datetime
raw=os.environ.get('DETAILS','')
kv={}
for line in raw.splitlines():
    if '=' in line:
        k,v=line.split('=',1); kv[k]=v
print(json.dumps({
  'ok': os.environ.get('PRIMARY')=='true',
  'checkedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
  'primaryPort2223': os.environ.get('PRIMARY')=='true',
  'fallbackPort2224': os.environ.get('FALLBACK')=='true',
  'pi': kv,
  'raw': raw
},indent=2))
PY
            fi
          fi
          cat "$result"
          content="$(base64 -w0 "$result")"; url="https://api.github.com/repos/$GITHUB_REPOSITORY/contents/ops/licheepi-hardening-result.json"; sha="$(curl -fsS -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' "$url" 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("sha", ""))' 2>/dev/null || true)"
          python3 - "$content" "$sha" <<'PY' >/tmp/payload.json
import json,sys
p={'message':'Record LicheePi hardening result','content':sys.argv[1],'branch':'main'}
if sys.argv[2]: p['sha']=sys.argv[2]
print(json.dumps(p))
PY
          curl -fsS -X PUT -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' "$url" --data-binary @/tmp/payload.json >/dev/null
