name: LicheePi Three-Path Resilience Drill

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/licheepi-resilience-drill.yml'
      - 'scripts/ops/licheepi-resilience-drill.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test failover and reboot recovery
        env:
          SSH_A: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
          SSH_B: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_C: ${{ secrets.SSH_PRIVATE_KEY }}
          OVH_HOST: 40.160.137.41
          HETZNER_HOST: 167.233.174.20
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/ops/licheepi-resilience-drill.sh

# Manual resilience run requested while physical recovery is available: 2026-09-04
