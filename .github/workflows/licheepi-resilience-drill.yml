name: LicheePi Dual-Cloud Reboot Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/licheepi-resilience-drill.yml'
      - 'scripts/ops/licheepi-dual-cloud-reboot-test.sh'
      - 'scripts/ops/licheepi-configure-hetzner-jump.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reboot-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Enforce on-site safety window
        run: test "$(date -u +%s)" -lt "$(date -u -d '2026-09-04 23:00:00Z' +%s)"
      - name: Configure OVH to Hetzner jump path
        env:
          SSH_A: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
          SSH_B: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_C: ${{ secrets.SSH_PRIVATE_KEY }}
          OVH_HOST: 40.160.137.41
        run: bash scripts/ops/licheepi-configure-hetzner-jump.sh
      - name: Reboot known-good l0 and verify both clouds return
        env:
          SSH_A: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
          SSH_B: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_C: ${{ secrets.SSH_PRIVATE_KEY }}
          OVH_HOST: 40.160.137.41
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/ops/licheepi-dual-cloud-reboot-test.sh
