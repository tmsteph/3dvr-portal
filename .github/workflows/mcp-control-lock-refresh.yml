name: Refresh Control MCP Lockfile

on:
  push:
    branches: [feat/3dvr-control-mcp]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/3dvr-control-mcp
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - name: Refresh agent lockfile
        working-directory: apps/agent
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/agent/package-lock.json; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name '3DVR CI'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/agent/package-lock.json
          git commit -m 'chore: refresh control mcp lockfile'
          git push origin HEAD:feat/3dvr-control-mcp
