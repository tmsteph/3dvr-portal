name: Deploy Digital Organism to OVH

on:
  push:
    branches: [main]
    paths:
      - 'apps/agent/thomas-agent/node/digital-organism.js'
      - 'apps/agent/thomas-agent/node/digital-organism-server.js'
      - 'apps/agent/thomas-agent/node/digital-organism-bridge.js'
      - 'apps/agent/thomas-agent/node/retrieval-lab.js'
      - 'apps/agent/thomas-agent/node/organism-sync.js'
      - 'apps/agent/thomas-agent/node/task-memory-sync.js'
      - 'apps/agent/thomas-agent/node/task-handoff-sync.js'
      - 'apps/agent/test/digital-organism.test.js'
      - 'apps/agent/test/retrieval-lab.test.js'
      - 'apps/agent/test/organism-sync.test.js'
      - 'apps/agent/test/task-memory-sync.test.js'
      - '.github/workflows/digital-organism-ovh.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digital-organism-ovh
  cancel-in-progress: true

env:
  OVH_HOST: 40.160.137.41
  OVH_USER: debian
  ORGANISM_PORT: 4311

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve SSH key
        shell: bash
        env:
          RAW_KEY: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [ -n "$RAW_KEY" ]
          umask 077
          printf '%s\n' "$RAW_KEY" > /tmp/key.raw
          if grep -q 'BEGIN .*PRIVATE KEY' /tmp/key.raw; then
            cp /tmp/key.raw /tmp/key
          else
            base64 -d /tmp/key.raw > /tmp/key
          fi
          chmod 600 /tmp/key
          rm -f /tmp/key.raw
          ssh -i /tmp/key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 "$OVH_USER@$OVH_HOST" true

      - name: Deploy, test, bootstrap, and start private organism
        shell: bash
        run: |
          set -euo pipefail
          opts=(-i /tmp/key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8)
          ssh "${opts[@]}" "$OVH_USER@$OVH_HOST" "ORGANISM_PORT='$ORGANISM_PORT' bash -s" <<'REMOTE'
          set -euo pipefail

          repo="$HOME/services/3dvr-portal-organism"
          mkdir -p "$(dirname "$repo")"
          if [ -d "$repo/.git" ]; then
            git -C "$repo" fetch --depth=1 origin main
            git -C "$repo" reset --hard origin/main
          else
            git clone --depth=1 --branch main https://github.com/tmsteph/3dvr-portal.git "$repo"
          fi

          node_bin="$(command -v node)"
          test -n "$node_bin"
          npm --prefix "$repo/apps/agent" ci

          tmp_state="$(mktemp -d)"
          trap 'rm -rf "$tmp_state"' EXIT
          THREEDVR_ORGANISM_DIR="$tmp_state" "$node_bin" --test \
            "$repo/apps/agent/test/digital-organism.test.js" \
            "$repo/apps/agent/test/retrieval-lab.test.js" \
            "$repo/apps/agent/test/organism-sync.test.js" \
            "$repo/apps/agent/test/task-memory-sync.test.js"
          THREEDVR_ORGANISM_DIR="$tmp_state" "$node_bin" "$repo/apps/agent/thomas-agent/node/digital-organism.js" eval

          memory_dir="$HOME/.3dvr/state/organism"
          memory_log="$memory_dir/memories.jsonl"
          mkdir -p "$memory_dir"
          chmod 700 "$memory_dir" 2>/dev/null || true
          if [ ! -s "$memory_log" ]; then
            bootstrap="$(mktemp)"
            if ssh -o BatchMode=yes -o ConnectTimeout=8 3dvr-do 'test -s ~/.3dvr/state/organism/memories.jsonl && cat ~/.3dvr/state/organism/memories.jsonl' > "$bootstrap" 2>/dev/null && [ -s "$bootstrap" ]; then
              if "$node_bin" -e 'const fs=require("node:fs"); for (const line of fs.readFileSync(process.argv[1],"utf8").split(/\r?\n/).filter(Boolean)) JSON.parse(line)' "$bootstrap"; then
                mv "$bootstrap" "$memory_log"
                chmod 600 "$memory_log"
                echo 'Bootstrapped existing private Organism state from the DigitalOcean control node.'
              else
                rm -f "$bootstrap"
                echo 'DigitalOcean Organism state was invalid; leaving OVH memory empty.' >&2
              fi
            else
              rm -f "$bootstrap"
              echo 'No existing DigitalOcean Organism state found; OVH starts with an empty durable memory log.'
            fi
          else
            echo 'Preserving existing OVH Organism memory state.'
          fi

          # Context HQ contains deliberate session handoffs. Keep this compatibility
          # source, but do not depend on the relay for local task continuity.
          context_sessions="$(mktemp)"
          if ssh -o BatchMode=yes -o ConnectTimeout=8 3dvr-do \
            'repo="$HOME/.3dvr/self-host-portal-source"; test -f "$repo/apps/agent/thomas-agent/node/context-hq.js"; cd "$repo/apps/agent"; node thomas-agent/node/context-hq.js sessions --owner tmsteph@3dvr --json' \
            > "$context_sessions" 2>/dev/null; then
            if [ -s "$context_sessions" ]; then
              ORGANISM_MODULE="$repo/apps/agent/thomas-agent/node/digital-organism.js" \
              CONTEXT_SESSIONS="$context_sessions" \
              "$node_bin" -e '
                const fs = require("node:fs");
                const organism = require(process.env.ORGANISM_MODULE);
                const sessions = JSON.parse(fs.readFileSync(process.env.CONTEXT_SESSIONS, "utf8"));
                organism.importContextSessions(Array.isArray(sessions) ? sessions : []).then(result => {
                  process.stdout.write(`Imported ${result.imported.length} approved Context HQ handoff(s); skipped ${result.skipped.length}.\n`);
                }).catch(error => { console.error(error); process.exit(1); });
              '
            fi
          else
            echo 'Context HQ handoffs were not reachable from the DigitalOcean control node; preserving existing Organism state.' >&2
          fi
          rm -f "$context_sessions"

          # Pull only public task records from the managed SQLite queue. The local
          # task-memory compiler discards raw result/model/tool output, excludes
          # health probes, and imports finalized work through the same provenance-
          # idempotent memory boundary used by approved handoffs.
          task_records="$(mktemp)"
          if ssh -o BatchMode=yes -o ConnectTimeout=8 3dvr-do '
            set -e
            repo="$HOME/.3dvr/portal"
            cd "$repo/apps/agent"
            export THREEDVR_CONFIG_FILE="$HOME/.3dvr/config/env"
            if [ -f "$THREEDVR_CONFIG_FILE" ]; then set -a; . "$THREEDVR_CONFIG_FILE"; set +a; fi
            node_bin="${THREEDVR_NODE_BIN:-/opt/node-v22/bin/node}"
            "$node_bin" thomas-agent/node/agent-task-queue.js list --json --queue-store sqlite --limit 100
          ' > "$task_records" 2>/dev/null; then
            if [ -s "$task_records" ]; then
              TASK_MEMORY_MODULE="$repo/apps/agent/thomas-agent/node/task-memory-sync.js" \
              TASK_RECORDS="$task_records" \
              "$node_bin" -e '
                const fs = require("node:fs");
                const taskMemory = require(process.env.TASK_MEMORY_MODULE);
                const tasks = JSON.parse(fs.readFileSync(process.env.TASK_RECORDS, "utf8"));
                taskMemory.importTaskHandoffsFromTasks(Array.isArray(tasks) ? tasks : []).then(result => {
                  process.stdout.write(`Safe task handoffs: imported ${result.imported.length}; skipped ${result.skipped.length}; scanned ${result.scanned}.\n`);
                }).catch(error => { console.error(error); process.exit(1); });
              '
            fi
          else
            echo 'Managed task records were not reachable from DigitalOcean; preserving existing Organism state.' >&2
          fi
          rm -f "$task_records"

          echo 'OVH Organism evidence (aggregate only):'
          "$node_bin" "$repo/apps/agent/thomas-agent/node/retrieval-lab.js" evidence
          echo 'OVH Organism retrieval tournament:'
          "$node_bin" "$repo/apps/agent/thomas-agent/node/retrieval-lab.js" real-tournament --promote

          sudo mkdir -p /etc/3dvr
          sudo touch /etc/3dvr/organism.env
          sudo chmod 600 /etc/3dvr/organism.env

          sudo tee /etc/systemd/system/3dvr-organism.service >/dev/null <<SERVICE
          [Unit]
          Description=3DVR Digital Organism
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=$USER
          WorkingDirectory=$repo/apps/agent
          Environment=NODE_ENV=production
          Environment=THREEDVR_ORGANISM_HOST=127.0.0.1
          Environment=THREEDVR_ORGANISM_PORT=$ORGANISM_PORT
          Environment=THREEDVR_ORGANISM_REMOTE_RECALL=0
          EnvironmentFile=-/etc/3dvr/organism.env
          ExecStart=$node_bin $repo/apps/agent/thomas-agent/node/digital-organism-server.js
          Restart=always
          RestartSec=3
          Slice=3dvr-production.slice
          NoNewPrivileges=true
          PrivateTmp=true

          [Install]
          WantedBy=multi-user.target
          SERVICE

          sudo systemctl daemon-reload
          sudo systemctl enable --now 3dvr-organism.service
          sudo systemctl restart 3dvr-organism.service

          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error "http://127.0.0.1:$ORGANISM_PORT/health" >/tmp/organism-health.json; then break; fi
            sleep 1
          done
          test -s /tmp/organism-health.json
          cat /tmp/organism-health.json
          sudo systemctl is-active --quiet 3dvr-organism.service
          REMOTE

      - name: Verify private health over SSH
        shell: bash
        run: |
          set -euo pipefail
          opts=(-i /tmp/key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8)
          ssh "${opts[@]}" "$OVH_USER@$OVH_HOST" "curl --fail --silent --show-error http://127.0.0.1:$ORGANISM_PORT/health"

      - name: Remove SSH key
        if: always()
        run: rm -f /tmp/key /tmp/key.raw
