name: Publish Operator Domain on OVH

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/operator-domain-ovh.yml'

permissions:
  contents: read

concurrency:
  group: operator-domain-ovh
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OVH_HOST: 40.160.137.41
      OVH_USER: debian
    steps:
      - name: Resolve OVH SSH key
        env:
          RAW_KEY: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$RAW_KEY" > /tmp/key.raw
          if grep -q 'BEGIN .*PRIVATE KEY' /tmp/key.raw; then cp /tmp/key.raw /tmp/key; else base64 -d /tmp/key.raw > /tmp/key; fi
          chmod 600 /tmp/key

      - name: Add explicit Operator DNS record
        run: |
          set -euo pipefail
          opts=(-i /tmp/key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8)
          ssh "${opts[@]}" "$OVH_USER@$OVH_HOST" \
            "npx --yes vercel@59.11.7 dns add 3dvr.tech operator A '$OVH_HOST' --scope 3dvr --non-interactive"

      - name: Confirm authoritative DNS
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            answer="$(dig +short @ns1.vercel-dns.com operator.3dvr.tech A | tail -n1 || true)"
            echo "authoritative operator A: ${answer:-pending}"
            if [ "$answer" = "$OVH_HOST" ]; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Publish Operator through Caddy
        run: |
          set -euo pipefail
          opts=(-i /tmp/key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8)
          ssh "${opts[@]}" "$OVH_USER@$OVH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:4320/operator/ | grep -F '<title>3DVR Operator</title>'
          sudo tee /etc/caddy/Caddyfile >/dev/null <<'CADDY'
          http://portal.3dvr.tech {
            reverse_proxy 127.0.0.1:4320
          }

          operator.3dvr.tech {
            encode zstd gzip
            @operator_root path /
            rewrite @operator_root /operator/
            reverse_proxy 127.0.0.1:4320
          }
          CADDY
          sudo caddy validate --config /etc/caddy/Caddyfile
          sudo systemctl restart caddy
          REMOTE

      - name: Verify Operator HTTPS on OVH
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 15 \
              --resolve "operator.3dvr.tech:443:$OVH_HOST" \
              https://operator.3dvr.tech/ | grep -Fq '<title>3DVR Operator</title>'; then
              curl --fail --silent --show-error --max-time 15 \
                --resolve "operator.3dvr.tech:443:$OVH_HOST" \
                https://operator.3dvr.tech/__3dvr-health
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Verify public Operator
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 https://operator.3dvr.tech/ \
            | grep -F '<title>3DVR Operator</title>'
          test "$(curl --silent --show-error --output /dev/null --write-out '%{url_effective}' https://operator.3dvr.tech/)" = "https://operator.3dvr.tech/"

      - name: Remove SSH key
        if: always()
        run: rm -f /tmp/key /tmp/key.raw
