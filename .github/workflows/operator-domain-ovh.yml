name: Publish Operator Domain on OVH

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['3DVR Self-Hosted Production']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: operator-domain-ovh
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OVH_HOST: 40.160.137.41
      OVH_USER: debian
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve OVH SSH key
        env:
          RAW_KEY: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$RAW_KEY" > /tmp/key.raw
          if grep -q 'BEGIN .*PRIVATE KEY' /tmp/key.raw; then cp /tmp/key.raw /tmp/key; else base64 -d /tmp/key.raw > /tmp/key; fi
          chmod 600 /tmp/key

      - name: Publish Operator without replacing other Caddy sites
        run: |
          set -euo pipefail
          opts=(-i /tmp/key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8)
          scp "${opts[@]}" scripts/ops/prepare-operator-origin.py "$OVH_USER@$OVH_HOST:/tmp/3dvr-prepare-operator-origin.py"
          ssh "${opts[@]}" "$OVH_USER@$OVH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          # Wait until the page is origin-portable before changing the edge route.
          page="$(curl --fail --silent --show-error http://127.0.0.1:4320/operator/)"
          printf '%s' "$page" | grep -F '<title>3DVR Operator</title>'
          if printf '%s' "$page" | grep -Fq "location.hostname === 'operator.3dvr.tech'"; then
            echo 'Operator still redirects to Portal; deploy the portable page first.' >&2
            exit 1
          fi
          candidate="$(mktemp /tmp/3dvr-operator-caddy.XXXXXX)"
          backup="$(mktemp /tmp/3dvr-operator-backup.XXXXXX)"
          trap 'rm -f "$candidate" "$backup" /tmp/3dvr-prepare-operator-origin.py' EXIT
          sudo cat /etc/caddy/Caddyfile > "$backup"
          python3 /tmp/3dvr-prepare-operator-origin.py "$backup" "$candidate"
          sudo caddy validate --config "$candidate" --adapter caddyfile
          sudo cp "$candidate" /etc/caddy/Caddyfile
          if ! sudo systemctl reload caddy; then
            sudo cp "$backup" /etc/caddy/Caddyfile
            sudo systemctl reload caddy
            exit 1
          fi
          if ! curl --fail --silent --show-error --max-time 20 \
            --resolve operator.3dvr.tech:443:127.0.0.1 \
            https://operator.3dvr.tech/operator/ | grep -F '<title>3DVR Operator</title>'; then
            sudo cp "$backup" /etc/caddy/Caddyfile
            sudo systemctl reload caddy
            exit 1
          fi
          REMOTE

      - name: Verify public app, identity and API on Operator origin
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.request
          origin = 'https://operator.3dvr.tech'
          with urllib.request.urlopen(origin + '/', timeout=25) as response:
              assert response.url == origin + '/operator/', response.url
              page = response.read().decode()
              assert '<title>3DVR Operator</title>' in page
              assert "location.hostname === 'operator.3dvr.tech'" not in page
          for path in ['/operator/app.js', '/operator/install.js', '/operator/service-worker.js', '/sign-in.html?redirect=%2Foperator%2F', '/gun-init.js', '/auth-identity.js', '/icons/icon-192.png', '/icons/icon-512.png']:
              with urllib.request.urlopen(origin + path, timeout=25) as response:
                  assert response.status == 200, path
                  assert response.url.startswith(origin + '/'), response.url
          with urllib.request.urlopen(origin + '/operator/operator.webmanifest', timeout=25) as response:
              manifest = json.load(response)
              assert manifest['id'] == '/operator/'
              assert manifest['scope'] == '/operator/'
              assert manifest['start_url'] == '/operator/'
          with urllib.request.urlopen(origin + '/__3dvr-health', timeout=25) as response:
              assert json.load(response)['operatorApi'] == 'native'
          print('Operator serves independently with its own manifest, sign-in page, assets and native API.')
          PY

      - name: Remove SSH key
        if: always()
        run: rm -f /tmp/key /tmp/key.raw
