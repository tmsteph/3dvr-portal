name: Repair OVH Remote Desktop

on:
  push:
    paths:
      - '.github/workflows/remote-desktop-restart.yml'
  workflow_dispatch:

permissions:
  contents: read

# Trigger marker: 2026-09-05T22:07Z
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repair Desktop Commander on OVH
        shell: bash
        env:
          SSH_A: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
          SSH_B: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_C: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          write_key() {
            local raw="$1" dest="$2"
            [ -n "$raw" ] || return 0
            printf '%s\n' "$raw" > "$dest.raw"
            if grep -q 'BEGIN .*PRIVATE KEY' "$dest.raw"; then cp "$dest.raw" "$dest";
            elif base64 -d "$dest.raw" > "$dest" 2>/dev/null && grep -q 'BEGIN .*PRIVATE KEY' "$dest"; then :;
            else rm -f "$dest" "$dest.raw"; return 0; fi
            chmod 600 "$dest"; rm -f "$dest.raw"
          }
          write_key "$SSH_A" /tmp/key-a
          write_key "$SSH_B" /tmp/key-b
          write_key "$SSH_C" /tmp/key-c
          selected=''
          for user in debian root; do
            for key in /tmp/key-a /tmp/key-b /tmp/key-c; do
              [ -f "$key" ] || continue
              if ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=6 "$user@40.160.137.41" true >/dev/null 2>&1; then
                selected="$user|$key"; break 2
              fi
            done
          done
          [ -n "$selected" ] || { echo 'OVH SSH unavailable' >&2; exit 1; }
          IFS='|' read -r user key <<< "$selected"
          opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8)
          ssh "${opts[@]}" "$user@40.160.137.41" 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n mkdir -p /etc/systemd/system/desktop-commander-remote.service.d
          sudo -n tee /etc/systemd/system/desktop-commander-remote.service.d/3dvr-reliability.conf >/dev/null <<'EOF'
          [Service]
          ExecStart=
          ExecStart=/usr/bin/npx -y @wonderwhy-er/desktop-commander@0.2.48 remote
          Restart=always
          RestartSec=10s
          RuntimeMaxSec=1d
          TimeoutStopSec=10s
          EOF
          sudo -n systemctl daemon-reload
          sudo -n systemctl restart desktop-commander-remote.service
          sleep 5
          sudo -n systemctl is-active --quiet desktop-commander-remote.service
          sudo -n systemctl show desktop-commander-remote.service -p ActiveState -p SubState -p Restart -p RuntimeMaxUSec -p ExecStart --no-pager
          REMOTE
