name: LicheePi U-Boot Environment CRC Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/licheepi-env-crc-probe.yml'
      - 'scripts/ops/licheepi-env-crc-probe.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Derive environment layout by read-only CRC
        env:
          SSH_A: ${{ secrets.THREEDVR_SSH_PRIVATE_KEY }}
          SSH_B: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_C: ${{ secrets.SSH_PRIVATE_KEY }}
          OVH_HOST: 40.160.137.41
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/ops/licheepi-env-crc-probe.sh
