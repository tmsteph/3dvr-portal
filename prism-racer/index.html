<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Prism Racer · 3DVR</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b13;color:#fff;font-family:Inter,system-ui,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;inset:0;pointer-events:none;padding:14px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;gap:8px}.back,.pill{pointer-events:auto;background:#08101dd9;border:1px solid #ffffff32;border-radius:999px;padding:8px 11px;color:#fff;text-decoration:none;font-weight:850;font-size:.78rem;backdrop-filter:blur(10px)}
.stats{margin-left:auto;display:flex;gap:7px}.title{font-weight:950;letter-spacing:.04em;text-shadow:0 2px 12px #000}.hint{margin-top:auto;align-self:center;background:#08101ddd;border:1px solid #ffffff32;border-radius:999px;padding:9px 13px;font-size:.75rem;backdrop-filter:blur(10px)}
.toast{position:fixed;left:50%;top:20%;transform:translateX(-50%);padding:10px 14px;border-radius:999px;background:#08101ded;border:1px solid #ffffff44;font-weight:900;opacity:0;transition:.18s;pointer-events:none}.toast.show{opacity:1}
</style>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<canvas id="game" aria-label="3DVR arcade racing game"></canvas>
<div class="hud">
  <div class="top">
    <a class="back" href="/games.html">← Games</a>
    <div class="title">Prism Racer</div>
    <div class="stats"><span class="pill">lap <b id="lap">1/3</b></span><span class="pill">speed <b id="speed">0</b></span></div>
  </div>
  <div class="hint">W throttle · S brake/reverse · A/D steer · Shift boost · Space handbrake · Esc releases mouse</div>
</div>
<div class="toast" id="toast"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js';

const canvas=document.getElementById('game');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight,false);renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x090d18);scene.fog=new THREE.Fog(0x090d18,70,230);
const camera=new THREE.PerspectiveCamera(66,innerWidth/innerHeight,.1,400);
scene.add(new THREE.HemisphereLight(0xb8d7ff,0x151322,1.8));
const sun=new THREE.DirectionalLight(0xffffff,2.6);sun.position.set(-30,45,20);scene.add(sun);

const center=new THREE.Vector3(0,0,0), trackRadius=42, laneWidth=12;
const ground=new THREE.Mesh(new THREE.CircleGeometry(90,96),new THREE.MeshStandardMaterial({color:0x182430,roughness:.96}));
ground.rotation.x=-Math.PI/2;ground.position.y=-.55;scene.add(ground);
const road=new THREE.Mesh(new THREE.RingGeometry(trackRadius-laneWidth/2,trackRadius+laneWidth/2,128),new THREE.MeshStandardMaterial({color:0x292d38,roughness:.72,metalness:.08}));
road.rotation.x=-Math.PI/2;road.position.y=-.5;scene.add(road);
const edgeMat=new THREE.MeshBasicMaterial({color:0x65e7ff,transparent:true,opacity:.75});
for(const r of [trackRadius-laneWidth/2,trackRadius+laneWidth/2]){
  const ring=new THREE.Mesh(new THREE.RingGeometry(r-.13,r+.13,128),edgeMat);ring.rotation.x=-Math.PI/2;ring.position.y=-.42;scene.add(ring);
}
for(let i=0;i<64;i++){
  const a=i/64*Math.PI*2,r=trackRadius+(i%2?0:0);
  const m=new THREE.Mesh(new THREE.BoxGeometry(.26,.04,2.1),new THREE.MeshBasicMaterial({color:i%4===0?0xff5ddd:0xffffff,transparent:true,opacity:.75}));
  m.position.set(Math.cos(a)*r,-.39,Math.sin(a)*r);m.rotation.y=-a;m.rotation.x=0;scene.add(m);
}

const car=new THREE.Group();
const body=new THREE.Mesh(new THREE.BoxGeometry(2.3,.7,4.2),new THREE.MeshStandardMaterial({color:0xff386d,emissive:0x4f061b,emissiveIntensity:.8,roughness:.32,metalness:.28}));
body.position.y=.65;car.add(body);
const canopy=new THREE.Mesh(new THREE.BoxGeometry(1.45,.62,1.7),new THREE.MeshStandardMaterial({color:0x66dcff,emissive:0x13465c,emissiveIntensity:1.2,roughness:.12,metalness:.35}));
canopy.position.set(0,1.2,-.25);car.add(canopy);
for(const x of [-1.05,1.05])for(const z of [-1.35,1.35]){
  const w=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.34,14),new THREE.MeshStandardMaterial({color:0x101216,roughness:.8}));
  w.rotation.z=Math.PI/2;w.position.set(x,.28,z);car.add(w);
}
scene.add(car);car.position.set(trackRadius,0,0);car.rotation.y=-Math.PI/2;

const checkpoints=[];
for(let i=0;i<8;i++){
  const a=i/8*Math.PI*2;
  const gate=new THREE.Group();
  const mat=new THREE.MeshBasicMaterial({color:i===0?0xffe95e:0x79f7ff,transparent:true,opacity:.65});
  const left=new THREE.Mesh(new THREE.BoxGeometry(.35,5,.35),mat),right=left.clone(),top=new THREE.Mesh(new THREE.BoxGeometry(laneWidth-1,.35,.35),mat);
  left.position.set(-laneWidth/2+1,2.5,0);right.position.set(laneWidth/2-1,2.5,0);top.position.set(0,5,0);gate.add(left,right,top);
  gate.position.set(Math.cos(a)*trackRadius,0,Math.sin(a)*trackRadius);gate.rotation.y=-a;scene.add(gate);checkpoints.push({gate,a});
}

const keys=new Set(), vel=new THREE.Vector3();
let heading=-Math.PI/2,speed=0,steer=0,nextCheckpoint=1,lap=1,toastTimer=0;
const lapEl=document.getElementById('lap'),speedEl=document.getElementById('speed'),toast=document.getElementById('toast');
function say(t){toast.textContent=t;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),950)}
addEventListener('keydown',e=>{keys.add(e.code);if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});
addEventListener('keyup',e=>keys.delete(e.code));
canvas.addEventListener('pointerdown',()=>canvas.requestPointerLock?.());
canvas.addEventListener('contextmenu',e=>e.preventDefault());

const clock=new THREE.Clock();
function wrapAngle(a){while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a}
function update(){
  const dt=Math.min(clock.getDelta(),.05);
  const throttle=(keys.has('KeyW')||keys.has('ArrowUp'))?1:0;
  const brake=(keys.has('KeyS')||keys.has('ArrowDown'))?1:0;
  const left=(keys.has('KeyA')||keys.has('ArrowLeft'))?1:0,right=(keys.has('KeyD')||keys.has('ArrowRight'))?1:0;
  const boost=keys.has('ShiftLeft')||keys.has('ShiftRight'), hand=keys.has('Space');
  const max=boost?31:22;
  speed+=throttle*(boost?17:12)*dt; speed-=brake*18*dt;
  speed*=Math.exp(-(hand?2.5:.42)*dt); speed=THREE.MathUtils.clamp(speed,-8,max);
  steer=THREE.MathUtils.damp(steer,right-left,8,dt);
  heading-=steer*(1.45+Math.min(Math.abs(speed)/18,1)*1.4)*dt*(speed>=0?1:-1);

  const forward=new THREE.Vector3(Math.sin(heading),0,Math.cos(heading));
  car.position.addScaledVector(forward,speed*dt);

  const radial=Math.hypot(car.position.x,car.position.z)||1;
  const distanceFromCenterline=Math.abs(radial-trackRadius);
  if(distanceFromCenterline<laneWidth*1.5){
    const targetR=trackRadius;
    const tx=car.position.x/radial*targetR,tz=car.position.z/radial*targetR;
    const magnet=THREE.MathUtils.clamp(1-distanceFromCenterline/(laneWidth*1.5),0,1);
    car.position.x=THREE.MathUtils.lerp(car.position.x,tx,magnet*.55*dt);
    car.position.z=THREE.MathUtils.lerp(car.position.z,tz,magnet*.55*dt);
    const tangentHeading=Math.atan2(-car.position.z,car.position.x)-Math.PI/2;
    const delta=wrapAngle(tangentHeading-heading);
    heading+=delta*magnet*.32*dt;
  }else{
    speed*=Math.exp(-1.7*dt);
  }

  car.rotation.y=heading;
  const cp=checkpoints[nextCheckpoint];
  if(cp && car.position.distanceTo(cp.gate.position)<7){
    nextCheckpoint++;
    if(nextCheckpoint>=checkpoints.length){
      nextCheckpoint=0;
    }else if(nextCheckpoint===1){
      lap++;
      if(lap>3){lap=1;say('Race complete! Go again.')} else say('Lap '+lap);
      lapEl.textContent=lap+'/3';
    }
  }
  if(nextCheckpoint===0 && car.position.distanceTo(checkpoints[0].gate.position)<7){
    nextCheckpoint=1;
  }

  const camBack=new THREE.Vector3(-Math.sin(heading),.34,-Math.cos(heading)).normalize().multiplyScalar(10);
  const desiredCam=car.position.clone().add(new THREE.Vector3(0,3.2,0)).add(camBack);
  camera.position.lerp(desiredCam,1-Math.exp(-6*dt));
  camera.lookAt(car.position.x,car.position.y+1,car.position.z);
  speedEl.textContent=Math.abs(speed).toFixed(0);
  renderer.render(scene,camera);requestAnimationFrame(update);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight,false);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7))});
say('Three laps. The road helps instead of punishing you.');update();
</script>
</body>
</html>
