<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>3DVR Pocket Window</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#05090f;color:#eafaff;font-family:system-ui,sans-serif}
#world{position:absolute;inset:-8%;perspective:320px;transform-style:preserve-3d;background:radial-gradient(circle at 50% 45%,#123247,#07111c 38%,#030609 72%);transition:filter .2s}
.layer{position:absolute;left:50%;top:50%;transform-style:preserve-3d}.frame{width:68vw;height:58vh;margin:-29vh 0 0 -34vw;border:8px solid #69dff055;border-radius:24px;box-shadow:0 0 60px #34d8ff33,inset 0 0 45px #35dfff22}
.orb{width:84px;height:84px;margin:-42px;border-radius:50%;background:#bdf9ff;box-shadow:0 0 35px #4deaff,0 0 100px #39d9ff;transform:translateZ(90px)}
.grid{width:150vw;height:100vh;margin:-5vh 0 0 -75vw;background-image:linear-gradient(#51dfff22 1px,transparent 1px),linear-gradient(90deg,#51dfff22 1px,transparent 1px);background-size:44px 44px;transform:rotateX(70deg) translateZ(-520px);transform-origin:center top}
.block{position:absolute;width:120px;height:120px;background:#12394b;border:1px solid #65dff055;box-shadow:0 0 25px #0008}.b1{transform:translate3d(-380px,-80px,180px)}.b2{transform:translate3d(330px,120px,-420px)}.b3{transform:translate3d(-140px,-230px,-1100px)}.b4{transform:translate3d(230px,-190px,120px) rotate(28deg)}.b5{transform:translate3d(-420px,190px,-620px) rotate(45deg)}
#hud{position:fixed;inset:0;padding:max(16px,env(safe-area-inset-top)) 16px;pointer-events:none}.card{pointer-events:auto;max-width:420px;padding:14px;border-radius:16px;background:#07121ddd;border:1px solid #77e8ff55;backdrop-filter:blur(12px)}
h1{font-size:18px;margin:0 0 4px}.sub,#status{font-size:12px;line-height:1.35;opacity:.75}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}button{border:1px solid #7ae9ff66;background:#102739;color:white;border-radius:999px;padding:9px 12px;font-weight:650}button.on{background:#d9fbff;color:#05202b}
#video{position:fixed;right:12px;bottom:12px;width:96px;border-radius:12px;opacity:.15;transform:scaleX(-1);display:none}.privacy{position:fixed;left:16px;bottom:16px;font-size:11px;opacity:.5}
</style></head><body>
<div id="world"><div class="layer frame"></div><div class="layer orb"></div><div class="layer grid"></div><div class="layer block b1"></div><div class="layer block b2"></div><div class="layer block b3"></div><div class="layer block b4"></div><div class="layer block b5"></div></div>
<video id="video" autoplay muted playsinline></video>
<div id="hud"><div class="card"><h1>3DVR Pocket Window</h1><div class="sub">Your screen is a window into a 3D world. Lean around it. Move closer. Look behind things. Tilt your phone or drag.</div><div class="buttons"><button id="cam">Enable Camera</button><button id="motion">Enable Motion</button><button id="center">Center</button></div><div id="status">Pointer / touch tracking active.</div></div></div>
<div class="privacy">Camera frames stay on this device.</div>
<script>
const world=document.querySelector('#world'),video=document.querySelector('#video'),statusEl=document.querySelector('#status');
let pointer={x:0,y:0},motion={x:0,y:0},head={x:0,y:0,z:0},base={x:0,y:0,z:0},view={x:0,y:0,z:0};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
function point(x,y){pointer.x=(x/innerWidth-.5)*2;pointer.y=(y/innerHeight-.5)*-2}
addEventListener('pointermove',e=>point(e.clientX,e.clientY));addEventListener('touchmove',e=>{const t=e.touches[0];if(t)point(t.clientX,t.clientY)},{passive:true});
addEventListener('deviceorientation',e=>{if(e.gamma!=null){motion.x=clamp(e.gamma/35,-1,1);motion.y=clamp((e.beta-45)/45,-1,1)}});
motion.onclick=async()=>{try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function')await DeviceOrientationEvent.requestPermission();document.querySelector('#motion').classList.add('on');statusEl.textContent='Motion + pointer sensor fusion active.'}catch(e){statusEl.textContent='Motion permission unavailable; pointer still works.'}};
center.onclick=()=>{base={...head};pointer={x:0,y:0};motion={x:0,y:0};statusEl.textContent='View centered.'};
let stream,detector,lastDetect=0,canvas,ctx,prevFrame;
cam.onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:320},height:{ideal:240}},audio:false});video.srcObject=stream;await video.play();document.querySelector('#cam').classList.add('on');if('FaceDetector' in window){detector=new FaceDetector({fastMode:true,maxDetectedFaces:1});statusEl.textContent='Face + motion + pointer sensor fusion active.';trackFace()}else{statusEl.textContent='Camera motion + device motion + pointer fusion active.';setupMotionVision();trackMotionVision()}}catch(e){statusEl.textContent='Camera unavailable; motion / pointer still work.'}};
async function trackFace(){if(!detector||!stream)return;try{if(performance.now()-lastDetect>70){lastDetect=performance.now();const faces=await detector.detect(video);if(faces[0]){const b=faces[0].boundingBox;head.x=(.5-(b.x+b.width/2)/video.videoWidth)*4.8;head.y=(.5-(b.y+b.height/2)/video.videoHeight)*3.6;head.z=clamp(b.width/video.videoWidth-.28,-.2,.35)*8}}}catch(e){}requestAnimationFrame(trackFace)}
function setupMotionVision(){canvas=document.createElement('canvas');canvas.width=40;canvas.height=30;ctx=canvas.getContext('2d',{willReadFrequently:true})}
function trackMotionVision(){if(!stream)return;ctx.drawImage(video,0,0,40,30);const d=ctx.getImageData(0,0,40,30).data;if(prevFrame){let sx=0,sy=0,w=0;for(let y=0;y<30;y+=2)for(let x=0;x<40;x+=2){const i=(y*40+x)*4,diff=Math.abs(d[i]-prevFrame[i])+Math.abs(d[i+1]-prevFrame[i+1])+Math.abs(d[i+2]-prevFrame[i+2]);if(diff>55){sx+=x*diff;sy+=y*diff;w+=diff}}if(w>500){head.x=lerp(head.x,(.5-sx/w/40)*1.6,.12);head.y=lerp(head.y,(.5-sy/w/30)*1.2,.12)}}prevFrame=new Uint8ClampedArray(d);requestAnimationFrame(trackMotionVision)}
function animate(){const hx=head.x-base.x,hy=head.y-base.y,hz=head.z-base.z;const tx=hx*1.8+motion.x*1.15+pointer.x*.58,ty=hy*1.55-motion.y*.9+pointer.y*.5,tz=hz;view.x=lerp(view.x,tx,.16);view.y=lerp(view.y,ty,.16);view.z=lerp(view.z,tz,.14);world.style.transform='translate('+(-view.x*105)+'px,'+(view.y*86)+'px) scale('+clamp(1+view.z*.22,.7,1.7)+') rotateY('+(view.x*12)+'deg) rotateX('+(-view.y*9)+'deg)';document.querySelector('.orb').style.transform='translate('+(-view.x*42)+'px,'+(view.y*34)+'px) translateZ(160px) scale('+(1+view.z*.18)+')';document.querySelector('.b1').style.marginLeft=(-view.x*35)+'px';document.querySelector('.b4').style.marginLeft=(-view.x*48)+'px';requestAnimationFrame(animate)}animate();
</script><script defer src="/issue-launcher.js"></script></body></html>
