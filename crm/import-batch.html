<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>3DVR CRM · Batch import</title>
  <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
  <script src="../gun-init.js"></script>
  <style>body{font-family:system-ui,sans-serif;background:#070b12;color:#eef2ff;margin:0;padding:24px}main{max-width:680px;margin:auto}pre{white-space:pre-wrap;background:#111827;padding:14px;border-radius:12px}.muted{color:#94a3b8}.ok{color:#86efac}.err{color:#fca5a5}a{color:#7dd3fc}</style>
</head>
<body><main><h1>3DVR CRM import</h1><p class="muted">Private batch data stays in the URL fragment on this device and is never stored in this page or repository.</p><p id="summary">Reading batch…</p><pre id="status"></pre><p><a href="./">Open CRM</a></p></main>
<script>
const summary=document.getElementById('summary');
const status=document.getElementById('status');
const peers=(window.__GUN_PEERS__&&window.__GUN_PEERS__.length)?window.__GUN_PEERS__:['wss://gun-relay-3dvr.fly.dev/gun','https://gun-relay-3dvr.fly.dev/gun'];
const gun=Gun({peers,axe:true,localStorage:false,radisk:false});
const root=gun.get('3dvr-crm');
let connected=false;
gun.on('hi',()=>{connected=true;});
const clean=v=>String(v==null?'':v).trim();
const slug=v=>clean(v).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,72);
function b64bytes(raw){raw=raw.replace(/-/g,'+').replace(/_/g,'/');while(raw.length%4)raw+='=';return Uint8Array.from(atob(raw),c=>c.charCodeAt(0));}
async function decodeBatch(){const raw=location.hash.replace(/^#(?:go=|data=)?/,'');if(!raw)return[];const bytes=b64bytes(raw);const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const text=await new Response(stream).text();const data=JSON.parse(text);return Array.isArray(data)?data:[];}
function waitForPeer(timeout=8000){if(connected)return Promise.resolve(true);return new Promise(resolve=>{const start=Date.now();const timer=setInterval(()=>{if(connected){clearInterval(timer);resolve(true);}else if(Date.now()-start>=timeout){clearInterval(timer);resolve(false);}},100);});}
async function put(record){return new Promise((resolve,reject)=>root.get(record.id).put(record,ack=>ack&&ack.err?reject(new Error(ack.err)):resolve()));}
function readFresh(id,timeout=3500){return new Promise(resolve=>{const verifier=Gun({peers,axe:true,localStorage:false,radisk:false});let settled=false;const timer=setTimeout(()=>{if(!settled){settled=true;resolve(null);}},timeout);verifier.get('3dvr-crm').get(id).once(data=>{if(settled)return;settled=true;clearTimeout(timer);resolve(data&&typeof data==='object'?data:null);});});}
async function run(){
  try{
    const leads=await decodeBatch();
    if(!leads.length){summary.textContent='No lead batch found in this link.';return;}
    summary.textContent='Connecting to shared CRM relay…';status.textContent=`Prepared ${leads.length} leads. Waiting for a real relay connection.`;
    if(!(await waitForPeer()))throw new Error('could not connect to the shared CRM relay; nothing was imported');
    summary.textContent=`Writing ${leads.length} leads…`;
    const now=new Date().toISOString();const ids=[];
    for(const item of leads){
      const name=clean(item.name);if(!name)continue;const id=clean(item.id)||`import-${slug(item.company||name)}-${slug(name)}`;
      await put({id,recordType:'person',name,email:clean(item.email),company:clean(item.company),phone:clean(item.phone),role:clean(item.role),tags:clean(item.tags),status:clean(item.status)||'Lead',warmth:clean(item.warmth)||'warm',fit:clean(item.fit),urgency:clean(item.urgency),nextFollowUp:clean(item.nextFollowUp),marketSegment:clean(item.marketSegment),primaryPain:clean(item.primaryPain),painSeverity:clean(item.painSeverity),currentWorkaround:clean(item.currentWorkaround),pilotStatus:clean(item.pilotStatus),offerAmount:clean(item.offerAmount),lastSignal:clean(item.lastSignal),nextExperiment:clean(item.nextExperiment),nextBestAction:clean(item.nextBestAction),objection:clean(item.objection),lastContacted:clean(item.lastContacted),notes:clean(item.notes),source:'Lead import',created:clean(item.created)||now,updated:now,activityCount:Number(item.activityCount||0),contactId:''});
      ids.push(id);
    }
    await new Promise(resolve=>setTimeout(resolve,1200));summary.textContent='Verifying relay persistence…';let verified=0;
    for(const id of ids){const data=await readFresh(id);if(data&&data.id===id)verified++;}
    if(verified!==ids.length)throw new Error(`relay verification found ${verified} of ${ids.length}`);
    summary.textContent='Import verified.';status.textContent=`Verified ${verified} lead${verified===1?'':'s'} in the shared CRM relay.`;status.className='ok';
  }catch(err){summary.textContent='Import was not verified.';status.textContent=err.message;status.className='err';}
}
run();
</script></body></html>
