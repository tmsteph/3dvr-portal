<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <title>3DVR Operator</title>
  <meta name="theme-color" content="#07101c">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gun/sea.js"></script>
  <script src="/gun-init.js"></script>
  <script src="/auth-identity.js"></script>
  <script type="module" src="app.js"></script>
  <script type="module" src="live-awareness.js"></script>
</head>
<body>
  <main>
    <header>
      <a href="/">3DVR</a>
      <div class="header-actions">
        <button id="show-history" type="button" aria-expanded="false" aria-controls="conversation-history">Past conversations</button>
        <button id="clear-chat" type="button">New conversation</button>
      </div>
    </header>
    <aside id="conversation-history" hidden aria-label="Past conversations">
      <div><h2>Past conversations</h2><button id="close-history" type="button" aria-label="Close past conversations">Close</button></div>
      <p id="history-empty">Your saved conversations will appear here.</p>
      <nav id="history-list" aria-label="Saved conversations"></nav>
    </aside>
    <section id="operator-log" aria-live="polite" aria-relevant="additions"></section>
    <button id="operator-latest" type="button" hidden aria-label="Jump to the latest message">↓ Latest message</button>
    <section class="welcome">
      <p>YOUR OPERATOR</p>
      <h1>What do you want me to do?</h1>
      <span>Talk normally. I can guide you and make safe changes inside the portal.</span>
      <div class="quick-prompts" aria-label="Things to try">
        <button type="button" data-prompt="Help me plan my day and choose the most important next step.">Plan my day</button>
        <button type="button" data-prompt="Help me capture and organize an idea I have.">Organize an idea</button>
        <button type="button" data-prompt="Help me find the best next opportunity to make money.">Find opportunities</button>
        <button type="button" data-prompt="Turn what I need to do into a clear checklist.">Make a checklist</button>
      </div>
    </section>
    <form id="operator-form">
      <label for="operator-input">Message your operator</label>
      <textarea id="operator-input" rows="3" placeholder="Save this idea… Find me customers… Help me plan today…" aria-describedby="operator-status operator-sync operator-hint" required></textarea>
      <div><span><small id="operator-status" role="status">Ready</small><small id="operator-sync" role="status">Saved on this device</small><small id="operator-hint">Ctrl + Enter to send</small></span><button type="submit">Do it →</button></div>
    </form>
  </main>
</body>
</html>
