<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <title>3DVR Operator</title>
  <meta name="theme-color" content="#07101c">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="mobile-header-fix.css">
  <link rel="stylesheet" href="app-search.css">
  <link rel="stylesheet" href="focus.css">
  <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gun/sea.js"></script>
  <script src="/gun-init.js"></script>
  <script src="/auth-identity.js"></script>
  <script type="module" src="app.js"></script>
  <script type="module" src="app-search.js"></script>
  <script type="module" src="live-awareness.js"></script>
  <script type="module" src="secrets.js"></script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <main>
    <header>
      <a href="/">3DVR</a>
      <div class="header-actions">
        <a class="workboard-link" href="/plan/">Plan</a>
        <button id="show-history" type="button" aria-label="Past conversations" aria-expanded="false" aria-controls="conversation-history">History</button>
        <button id="clear-chat" type="button" aria-label="New conversation" title="New conversation">＋</button>
      </div>
    </header>
    <aside id="conversation-history" hidden aria-label="Past conversations">
      <div><h2>Conversations</h2><button id="close-history" type="button" aria-label="Close past conversations">×</button></div>
      <small id="operator-sync" role="status">Checking history…</small>
      <p id="history-empty">Loading conversations…</p>
      <nav id="history-list" aria-label="Saved conversations"></nav>
    </aside>
    <section id="operator-log" aria-live="polite" aria-relevant="additions"></section>
    <button id="operator-latest" type="button" hidden aria-label="Jump to the latest message">↓ Latest message</button>
    <section class="welcome">
      <p>YOUR OPERATOR</p>
      <h1>What do you want to do?</h1>
      <span>Ask anything, or open a 3DVR app.</span>
      <div class="quick-prompts" aria-label="Things to try">
        <button type="button" data-prompt="Help me plan my day and choose the most important next step.">Plan my day</button>
        <button type="button" data-prompt="Help me capture and organize an idea I have.">Organize an idea</button>
        <button type="button" data-prompt="Help me find the best next opportunity to make money.">Find opportunities</button>
        <button type="button" data-prompt="Turn what I need to do into a clear checklist.">Make a checklist</button>
      </div>
    </section>
    <section id="app-search-results" hidden aria-label="3DVR app search results">
      <div class="app-search-heading"><strong>3DVR apps</strong><small id="app-search-count"></small></div>
      <nav id="app-search-list" aria-label="Matching 3DVR apps and pages"></nav>
    </section>
    <form id="operator-form">
      <label for="operator-input">Message your operator or search 3DVR</label>
      <textarea id="operator-input" rows="2" placeholder="Ask Operator…" aria-describedby="operator-status"></textarea>
      <div><span><small id="operator-status" role="status">Ready</small></span><div class="operator-actions"><button id="save-secret" type="button" aria-label="Save a secret" title="Save a secret">🔐</button><button type="submit" aria-label="Send to Operator" title="Send">→</button></div></div>
    </form>
      <dialog id="secret-dialog">
      <form id="secret-form">
        <button class="secret-close" type="button" aria-label="Close">×</button>
        <p>3DVR SECRETS</p>
        <h2>Save to 3DVR Secrets</h2>
        <span>The value goes directly to the OVH broker and Bitwarden. It is never added to this chat.</span>
        <label>Name<input id="secret-key" autocomplete="off" placeholder="Example: SERVICE_KEY" required></label>
        <label>Value<input id="secret-value" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" required></label>
        <label>Note (optional)<input id="secret-note" autocomplete="off" placeholder="What this is for"></label>
        <small id="secret-status" role="status"></small>
        <button class="secret-save" type="submit">Save securely</button>
      </form>
    </dialog>
  </main>
  <footer aria-label="Portal feedback"></footer>
  <script src="teach-handoff.js"></script>
  <script defer src="/issue-launcher.js"></script>
</body>
</html>
