<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020304">
  <meta name="portal:issue-launcher" content="off">
  <title>Asteroids · Dad's Arcade · 3DVR</title>
  <style>
    :root{color-scheme:dark;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;overflow:hidden;background:#020304;color:#eefcf3;user-select:none}
    canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
    .hud{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 12px);left:calc(env(safe-area-inset-left,0px) + 14px);right:calc(env(safe-area-inset-right,0px) + 14px);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;pointer-events:none;text-shadow:0 0 12px rgba(149,249,186,.35)}
    .hud a,.hud button{pointer-events:auto}
    .stats{display:flex;gap:18px;flex-wrap:wrap}
    .stat{display:grid;gap:2px}.label{font-size:.66rem;color:#8ea498;letter-spacing:.16em}.value{font-size:1.08rem;font-weight:900}
    .nav{display:flex;gap:8px}.nav a,.nav button{min-height:40px;padding:0 12px;border:1px solid rgba(238,252,243,.18);border-radius:999px;background:rgba(4,7,5,.72);color:#e9fff0;text-decoration:none;font:inherit;cursor:pointer}
    .message{position:fixed;z-index:4;inset:0;display:grid;place-items:center;pointer-events:none;text-align:center;padding:24px}
    .message div{max-width:520px;padding:20px 24px;border:1px solid rgba(149,249,186,.23);border-radius:18px;background:rgba(2,4,3,.78);backdrop-filter:blur(9px)}
    .message h1{margin:0 0 8px;font-size:clamp(2.2rem,9vw,5.5rem);letter-spacing:-.07em;line-height:.9}.message p{margin:8px 0;color:#a6b7ad;line-height:1.5}.message strong{color:#dfffea}
    .controls{position:fixed;z-index:6;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:none;justify-content:space-between;align-items:end;padding:0 14px;pointer-events:none}
    .cluster{display:flex;gap:9px;pointer-events:auto}.controls button{width:58px;height:58px;border-radius:50%;border:1px solid rgba(238,252,243,.24);background:rgba(8,12,10,.78);color:#ecfff2;font:900 1.1rem/1 ui-monospace,monospace;touch-action:none;box-shadow:inset 0 0 18px rgba(149,249,186,.04)}
    .controls button[data-active="true"]{background:rgba(149,249,186,.18);border-color:#95f9ba}
    .fire{width:72px!important;height:72px!important;color:#95f9ba!important}
    .hint{position:fixed;z-index:3;left:50%;bottom:18px;transform:translateX(-50%);color:#718078;font-size:.72rem;letter-spacing:.05em;white-space:nowrap;pointer-events:none}
    @media (pointer:coarse),(max-width:760px){.controls{display:flex}.hint{display:none}.hud{font-size:.9rem}.nav button{display:none}}
  </style>
</head>
<body>
  <canvas id="game" aria-label="Asteroids game"></canvas>
  <div class="hud">
    <div class="stats">
      <div class="stat"><span class="label">SCORE</span><span class="value" id="score">000000</span></div>
      <div class="stat"><span class="label">HIGH</span><span class="value" id="high">000000</span></div>
      <div class="stat"><span class="label">LIVES</span><span class="value" id="lives">3</span></div>
      <div class="stat"><span class="label">WAVE</span><span class="value" id="wave">1</span></div>
    </div>
    <div class="nav"><a href="../">← Arcade</a><button id="pause" type="button">Pause</button></div>
  </div>
  <div class="message" id="message">
    <div><h1>ASTEROIDS</h1><p><strong>← →</strong> rotate · <strong>↑</strong> thrust · <strong>Space</strong> fire</p><p>Press Space or tap FIRE to begin.</p></div>
  </div>
  <div class="controls" aria-label="Touch controls">
    <div class="cluster"><button type="button" data-arcade-action="left" aria-label="Rotate left">↺</button><button type="button" data-arcade-action="thrust" aria-label="Thrust">▲</button><button type="button" data-arcade-action="right" aria-label="Rotate right">↻</button></div>
    <div class="cluster"><button class="fire" type="button" data-arcade-action="fire" aria-label="Fire">FIRE</button></div>
  </div>
  <div class="hint">←/A rotate · →/D rotate · ↑/W thrust · Space/Z fire · P pause · R restart</div>
  <script src="../input.js"></script>
  <script>
  (() => {
    'use strict';
    const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
    const scoreEl=document.querySelector('#score'),highEl=document.querySelector('#high'),livesEl=document.querySelector('#lives'),waveEl=document.querySelector('#wave');
    const message=document.querySelector('#message'),pauseBtn=document.querySelector('#pause');
    const input=window.DadArcadeInput.create({canvas,keyMap:{
      ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'thrust',KeyW:'thrust',
      Space:'fire',KeyZ:'fire',KeyX:'fire',KeyP:'pause',Escape:'pause',KeyR:'restart',Enter:'restart'
    }});

    let W=0,H=0,dpr=1,last=0,started=false,paused=false,gameOver=false,score=0,wave=1,lives=3,high=0,fireCooldown=0,stars=[];
    let ship,asteroids=[],bullets=[],sparks=[];
    try{high=Number(localStorage.getItem('3dvr-dad-arcade-asteroids-high')||0)}catch{}
    highEl.textContent=fmt(high);

    function fmt(n){return String(Math.max(0,Math.floor(n))).padStart(6,'0')}
    function resize(){
      dpr=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;
      canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
      stars=Array.from({length:Math.min(180,Math.floor(W*H/7000))},()=>({x:Math.random()*W,y:Math.random()*H,a:.18+Math.random()*.55,s:.4+Math.random()*1.2}));
      if(ship){ship.x=wrap(ship.x,W);ship.y=wrap(ship.y,H)}
    }
    window.addEventListener('resize',resize);

    function wrap(v,max){return (v%max+max)%max}
    function torusDelta(a,b,max){let d=a-b;if(d>max/2)d-=max;if(d<-max/2)d+=max;return d}
    function dist(a,b){const dx=torusDelta(a.x,b.x,W),dy=torusDelta(a.y,b.y,H);return Math.hypot(dx,dy)}
    function makeShip(){
      return {x:W/2,y:H/2,vx:0,vy:0,a:-Math.PI/2,r:11,inv:2.2};
    }
    function rockRadius(size){return size===3?42:size===2?26:14}
    function spawnRock(size=3,x=null,y=null){
      if(x==null){
        do{x=Math.random()*W;y=Math.random()*H}while(ship&&Math.hypot(torusDelta(x,ship.x,W),torusDelta(y,ship.y,H))<Math.min(W,H)*.28);
      }
      const speed=(size===3?36:size===2?58:82)*(0.75+Math.random()*.55)*(1+wave*.035),angle=Math.random()*Math.PI*2;
      const n=8+Math.floor(Math.random()*5),shape=Array.from({length:n},(_,i)=>({a:i/n*Math.PI*2,r:.72+Math.random()*.4}));
      asteroids.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,a:Math.random()*6,spin:(Math.random()-.5)*.7,size,r:rockRadius(size),shape});
    }
    function spawnWave(){
      const count=Math.min(10,3+wave);
      for(let i=0;i<count;i++)spawnRock(3);
      waveEl.textContent=wave;
    }
    function reset(full=true){
      if(full){score=0;wave=1;lives=3;gameOver=false}
      ship=makeShip();asteroids=[];bullets=[];sparks=[];fireCooldown=0;spawnWave();updateHud();
      paused=false;pauseBtn.textContent='Pause';message.style.display='none';
    }
    function begin(){
      if(started&&!gameOver)return;
      started=true;reset(true);
    }
    function updateHud(){
      scoreEl.textContent=fmt(score);livesEl.textContent=lives;waveEl.textContent=wave;
      if(score>high){high=score;highEl.textContent=fmt(high);try{localStorage.setItem('3dvr-dad-arcade-asteroids-high',String(high))}catch{}}
    }
    function fire(){
      if(fireCooldown>0||!ship)return;
      const nose=15;
      bullets.push({x:wrap(ship.x+Math.cos(ship.a)*nose,W),y:wrap(ship.y+Math.sin(ship.a)*nose,H),vx:ship.vx+Math.cos(ship.a)*420,vy:ship.vy+Math.sin(ship.a)*420,life:1.05,r:2});
      ship.vx-=Math.cos(ship.a)*3;ship.vy-=Math.sin(ship.a)*3;fireCooldown=.13;
    }
    function burst(x,y,count=12){
      for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,s=25+Math.random()*110;sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.35+Math.random()*.55,max:.9})}
    }
    function splitRock(index){
      const r=asteroids[index];score+=r.size===3?20:r.size===2?50:100;burst(r.x,r.y,r.size*5+6);
      asteroids.splice(index,1);
      if(r.size>1){for(let i=0;i<2;i++)spawnRock(r.size-1,r.x+(Math.random()-.5)*8,r.y+(Math.random()-.5)*8)}
      updateHud();
    }
    function killShip(){
      if(ship.inv>0)return;
      burst(ship.x,ship.y,24);lives--;updateHud();
      if(lives<=0){
        gameOver=true;started=false;message.innerHTML='<div><h1>GAME OVER</h1><p>Score <strong>'+fmt(score)+'</strong></p><p>Press R / Enter, or tap FIRE to play again.</p></div>';message.style.display='grid';return;
      }
      ship=makeShip();
    }
    function togglePause(){
      if(!started||gameOver)return;paused=!paused;pauseBtn.textContent=paused?'Resume':'Pause';
      message.innerHTML=paused?'<div><h1>PAUSED</h1><p>Press P / Escape to continue.</p></div>':'';message.style.display=paused?'grid':'none';
    }
    pauseBtn.addEventListener('click',togglePause);

    function update(dt){
      if(input.consume('pause'))togglePause();
      if(input.consume('restart')){started=true;reset(true)}
      if(!started){
        if(input.down('fire'))begin();
        return;
      }
      if(paused||gameOver)return;
      fireCooldown=Math.max(0,fireCooldown-dt);
      ship.inv=Math.max(0,ship.inv-dt);
      if(input.down('left'))ship.a-=3.55*dt;
      if(input.down('right'))ship.a+=3.55*dt;
      if(input.down('thrust')){ship.vx+=Math.cos(ship.a)*205*dt;ship.vy+=Math.sin(ship.a)*205*dt}
      const drag=Math.pow(.992,dt*60);ship.vx*=drag;ship.vy*=drag;
      const max=340,spd=Math.hypot(ship.vx,ship.vy);if(spd>max){ship.vx=ship.vx/spd*max;ship.vy=ship.vy/spd*max}
      ship.x=wrap(ship.x+ship.vx*dt,W);ship.y=wrap(ship.y+ship.vy*dt,H);
      if(input.down('fire'))fire();

      for(const b of bullets){b.x=wrap(b.x+b.vx*dt,W);b.y=wrap(b.y+b.vy*dt,H);b.life-=dt}
      bullets=bullets.filter(b=>b.life>0);
      for(const r of asteroids){r.x=wrap(r.x+r.vx*dt,W);r.y=wrap(r.y+r.vy*dt,H);r.a+=r.spin*dt}
      for(const p of sparks){p.x=wrap(p.x+p.vx*dt,W);p.y=wrap(p.y+p.vy*dt,H);p.vx*=.985;p.vy*=.985;p.life-=dt}
      sparks=sparks.filter(p=>p.life>0);

      bulletLoop: for(let bi=bullets.length-1;bi>=0;bi--){
        const b=bullets[bi];
        for(let ai=asteroids.length-1;ai>=0;ai--){
          if(dist(b,asteroids[ai])<asteroids[ai].r+b.r){bullets.splice(bi,1);splitRock(ai);continue bulletLoop}
        }
      }
      for(const r of asteroids){if(dist(ship,r)<ship.r+r.r*.82){killShip();break}}
      if(!asteroids.length){wave++;spawnWave()}
    }

    function draw(){
      ctx.clearRect(0,0,W,H);
      ctx.fillStyle='#020304';ctx.fillRect(0,0,W,H);
      for(const s of stars){ctx.globalAlpha=s.a;ctx.fillStyle='#dfffea';ctx.fillRect(s.x,s.y,s.s,s.s)}ctx.globalAlpha=1;
      ctx.strokeStyle='rgba(149,249,186,.07)';ctx.lineWidth=1;
      const step=80;ctx.beginPath();for(let x=0;x<W;x+=step){ctx.moveTo(x,0);ctx.lineTo(x,H)}for(let y=0;y<H;y+=step){ctx.moveTo(0,y);ctx.lineTo(W,y)}ctx.stroke();

      for(const r of asteroids){
        ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.a);ctx.beginPath();
        r.shape.forEach((p,i)=>{const rr=r.r*p.r,x=Math.cos(p.a)*rr,y=Math.sin(p.a)*rr;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();
        ctx.strokeStyle='#d7fbe3';ctx.lineWidth=1.7;ctx.shadowColor='rgba(149,249,186,.32)';ctx.shadowBlur=8;ctx.stroke();ctx.restore();
      }
      ctx.shadowBlur=0;
      for(const b of bullets){ctx.fillStyle='#95f9ba';ctx.beginPath();ctx.arc(b.x,b.y,2.2,0,Math.PI*2);ctx.fill()}
      for(const p of sparks){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle='#dfffea';ctx.fillRect(p.x,p.y,1.5,1.5)}ctx.globalAlpha=1;

      if(ship && (!ship.inv || Math.floor(ship.inv*12)%2===0)){
        ctx.save();ctx.translate(ship.x,ship.y);ctx.rotate(ship.a);ctx.strokeStyle='#f3fff6';ctx.lineWidth=1.8;ctx.shadowColor='rgba(149,249,186,.45)';ctx.shadowBlur=10;
        ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(-11,-9);ctx.lineTo(-6,0);ctx.lineTo(-11,9);ctx.closePath();ctx.stroke();
        if(started&&!paused&&input.down('thrust')){
          ctx.strokeStyle='#95f9ba';ctx.beginPath();ctx.moveTo(-8,-5);ctx.lineTo(-18,0);ctx.lineTo(-8,5);ctx.stroke();
        }
        ctx.restore();ctx.shadowBlur=0;
      }
      if(paused){ctx.fillStyle='rgba(0,0,0,.2)';ctx.fillRect(0,0,W,H)}
    }

    function loop(t){
      const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop);
    }
    resize();ship=makeShip();for(let i=0;i<5;i++)spawnRock(3);updateHud();requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
