<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Universal Brain · Local History</title><style>body{font:16px system-ui;background:#0b1220;color:#f1f6ff;max-width:850px;margin:40px auto;padding:20px}input,button{font:inherit;padding:12px;border-radius:8px;margin:5px}input{background:#17253a;color:white;border:1px solid #53677d}button{cursor:pointer}article{padding:12px;border-bottom:1px solid #34445b}a{color:#8cdbff}small{color:#b3c1d1}header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}</style><header><h1>Universal Brain</h1><a href="./">About</a></header><p>Import your browser history as a CSV with columns <code>url,title,visitTime</code> (or <code>lastVisitTime</code>). Search it locally. Nothing is uploaded.</p><p><input id="file" type="file" accept=".csv,text/csv"><button id="clear">Erase local memory</button></p><input id="search" type="search" placeholder="Search your history" aria-label="Search history"><p id="status"></p><section id="results"></section><script type="module">
const dbReq=indexedDB.open('universal-brain-v1',1);dbReq.onupgradeneeded=()=>{const db=dbReq.result;if(!db.objectStoreNames.contains('visits'))db.createObjectStore('visits',{keyPath:'id'});};const db=await new Promise((resolve,reject)=>{dbReq.onsuccess=()=>resolve(dbReq.result);dbReq.onerror=()=>reject(dbReq.error)});
const tx=(mode)=>db.transaction('visits',mode).objectStore('visits');
const all=()=>new Promise((resolve,reject)=>{const r=tx('readonly').getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
function csvRows(s){let rows=[],row=[],cell='',quoted=false;for(let i=0;i<s.length;i++){const c=s[i];if(c==='"'){if(quoted&&s[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&s[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows}
function dateValue(s){if(!s)return 0;const n=Number(s);if(Number.isFinite(n)&&n>0){if(n>1e15)return Math.floor(n/1000-11644473600000);if(n>1e12)return n;return n*1000}return Date.parse(s)||0}
function safeUrl(s){try{const u=new URL(s);return ['http:','https:'].includes(u.protocol)?u.href:null}catch{return null}}
async function render(){const q=document.querySelector('#search').value.toLowerCase();const visits=(await all()).filter(v=>(v.title+' '+v.url).toLowerCase().includes(q)).sort((a,b)=>b.time-a.time).slice(0,200);const out=document.querySelector('#results');out.replaceChildren();for(const v of visits){const item=document.createElement('article'),a=document.createElement('a'),meta=document.createElement('small');a.href=v.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=v.title||v.url;meta.textContent=' · '+(v.time?new Date(v.time).toLocaleString():'Unknown date');item.append(a,meta);out.append(item)}document.querySelector('#status').textContent=visits.length+' matching visits (up to 200 shown)'}
document.querySelector('#file').onchange=async e=>{const file=e.target.files[0];if(!file)return;const rows=csvRows(await file.text());const headers=rows.shift().map(s=>s.trim().toLowerCase());const u=headers.indexOf('url'),t=headers.indexOf('title'),d=headers.findIndex(x=>['visittime','lastvisittime','date','time'].includes(x));if(u<0){alert('CSV needs a url column');return}let count=0;for(const row of rows){const url=safeUrl(row[u]);if(!url)continue;const time=dateValue(row[d]);const title=t>=0?row[t]||'':'';const id=url+'|'+time;await new Promise((resolve,reject)=>{const r=tx('readwrite').put({id,url,title,time});r.onsuccess=resolve;r.onerror=()=>reject(r.error)});count++}alert('Imported '+count+' visits');render()};
document.querySelector('#search').oninput=render;document.querySelector('#clear').onclick=async()=>{if(!confirm('Erase all locally imported history?'))return;await new Promise((resolve,reject)=>{const r=tx('readwrite').clear();r.onsuccess=resolve;r.onerror=()=>reject(r.error)});render()};render();
</script></html>
