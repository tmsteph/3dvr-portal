<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3DVR Visualizer</title>
<meta name="description" content="MilkDrop-style music visualizer for 3DVR. Play a file, or join a station and every device dances to the same track.">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #f2f2f2; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .bar { position: fixed; left: 50%; transform: translateX(-50%); width: min(880px, calc(100% - 16px));
    background: rgba(12,12,16,.82); border: 1px solid rgba(255,255,255,.14); border-radius: 14px;
    backdrop-filter: blur(10px); padding: 10px 12px; z-index: 5;
    transition: opacity .45s ease; }
  body.ui-hidden .bar { opacity: 0; pointer-events: none; }
  body.ui-hidden { cursor: none; }
  #topbar { top: 8px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #topbar .brand { font-weight: 700; letter-spacing: .04em; }
  #topbar .brand span { color: #ffd75e; }
  #presetName { font-size: 12px; opacity: .85; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; flex: 1 1 160px; min-width: 120px; }
  #controls { bottom: 8px; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  button, .filebtn { background: #1d1d26; color: #f2f2f2; border: 1px solid rgba(255,255,255,.2);
    border-radius: 10px; padding: 8px 12px; font-size: 14px; cursor: pointer; }
  button:hover, .filebtn:hover { background: #2a2a38; }
  button.active { background: #ffd75e; color: #111; border-color: #ffd75e; font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  input[type="text"] { background: #101016; color: #f2f2f2; border: 1px solid rgba(255,255,255,.2);
    border-radius: 10px; padding: 8px 10px; font-size: 14px; }
  input[type="range"] { accent-color: #ffd75e; }
  input[type="file"] { display: none; }
  #seek { flex: 1 1 160px; }
  .hint { font-size: 12px; opacity: .75; line-height: 1.45; }
  #status { font-size: 12px; color: #ffd75e; min-height: 15px; }
  #stationPanel { display: none; }
  #stationPanel.open { display: flex; }
  .grow { flex: 1 1 180px; }
  @media (max-width: 560px) { #presetName { flex-basis: 100%; order: 3; } }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div class="bar" id="topbar">
  <div class="brand">3DVR <span>VISUALIZER</span></div>
  <div id="presetName">Pick a track to start the show</div>
  <button id="prevPreset" title="Previous visual">&#9664; Visual</button>
  <button id="nextPreset" title="Next visual">Visual &#9654;</button>
  <button id="cycleBtn" class="active" title="Auto-cycle visuals">Auto-cycle</button>
  <button id="fullBtn" title="Fullscreen">Fullscreen</button>
</div>

<div class="bar" id="controls">
  <div class="row">
    <label class="filebtn" for="fileInput">Open audio file</label>
    <input type="file" id="fileInput" accept="audio/*">
    <button id="playBtn" disabled>Play</button>
    <input type="range" id="seek" min="0" max="1000" value="0" disabled>
    <span id="clock" class="hint">0:00 / 0:00</span>
    <span id="trackName" class="hint"></span>
  </div>
  <div class="row">
    <button id="stationBtn">Station mode</button>
    <button id="demoBtn">Demo stream</button>
    <button id="directBtn" title="Direct sound plays the track without the visualizer feed. Use it when a link plays silently.">Direct sound: off</button>
    <span class="hint">Station mode: one device DJs a track link, every other device that joins hears it in sync and dances to the same visuals. Double-tap the picture for the next visual.</span>
  </div>
  <div class="row" id="stationPanel">
    <input type="text" id="stationCode" placeholder="Station code (e.g. main-stage)" class="grow">
    <button id="joinBtn">Join station</button>
    <button id="djBtn">DJ this station</button>
    <button id="copyLinkBtn">Copy station link</button>
  </div>
  <div class="row" id="djPanel" style="display:none">
    <input type="text" id="trackUrl" placeholder="Paste an audio file or stream link to broadcast" class="grow">
    <button id="setTrackBtn">Set track</button>
  </div>
  <div id="status"></div>
</div>

<audio id="player" preload="auto" playsinline></audio>
<audio id="playerDirect" preload="auto" playsinline style="display:none"></audio>

<script src="https://unpkg.com/butterchurn@2.6.7/lib/butterchurn.min.js"></script>
<script src="https://unpkg.com/butterchurn-presets@2.4.7/lib/butterchurnPresets.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
<script src="/gun-init.js"></script>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('stage');
  var audio = document.getElementById('player');
  var directAudio = document.getElementById('playerDirect');
  var playBtn = document.getElementById('playBtn');
  var seek = document.getElementById('seek');
  var clock = document.getElementById('clock');
  var trackNameEl = document.getElementById('trackName');
  var presetNameEl = document.getElementById('presetName');
  var statusEl = document.getElementById('status');
  var fileInput = document.getElementById('fileInput');
  var directBtn = document.getElementById('directBtn');

  var audioCtx = null, analyser = null, visualizer = null;
  var directMode = false;
  var presets = {}, presetKeys = [], presetIdx = 0, cycleTimer = null, cycleOn = true;
  var station = { code: null, isDJ: false, joined: false, node: null, lastState: null, heartbeat: null, driftTimer: null };

  function cur() { return directMode ? directAudio : audio; }
  function setStatus(msg) { statusEl.textContent = msg || ''; }
  function fmt(t) { if (!isFinite(t) || t < 0) t = 0; var m = Math.floor(t / 60), s = Math.floor(t % 60); return m + ':' + (s < 10 ? '0' : '') + s; }

  function ensureAudioGraph() {
    if (audioCtx) { if (audioCtx.state === 'suspended') audioCtx.resume(); return; }
    var AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    var src = audioCtx.createMediaElementSource(audio);
    src.connect(analyser); analyser.connect(audioCtx.destination);
    initVisualizer();
  }

  function initVisualizer() {
    if (visualizer || typeof butterchurnPresets === 'undefined') return;
    var BC = window.butterchurn && (window.butterchurn.default || window.butterchurn);
    if (!BC || typeof BC.createVisualizer !== 'function') return;
    presets = butterchurnPresets.getPresets() || {};
    presetKeys = Object.keys(presets);
    visualizer = BC.createVisualizer(audioCtx, canvas, {
      width: window.innerWidth, height: window.innerHeight,
      pixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    });
    visualizer.connectAudio(analyser);
    if (presetKeys.length) loadPreset(Math.floor(Math.random() * presetKeys.length), 0);
    (function loop() { if (visualizer) visualizer.render(); requestAnimationFrame(loop); })();
    startCycle();
  }

  function loadPreset(idx, blend) {
    if (!visualizer || !presetKeys.length) return;
    presetIdx = ((idx % presetKeys.length) + presetKeys.length) % presetKeys.length;
    var name = presetKeys[presetIdx];
    visualizer.loadPreset(presets[name], blend == null ? 2.7 : blend);
    presetNameEl.textContent = name;
    presetNameEl.title = name;
    if (station.isDJ) publishState();
  }

  function startCycle() {
    stopCycle();
    if (!cycleOn) return;
    cycleTimer = setInterval(function () {
      if (cur().paused || !presetKeys.length) return;
      if (station.joined && !station.isDJ) return;
      loadPreset(Math.floor(Math.random() * presetKeys.length));
    }, 20000);
  }
  function stopCycle() { if (cycleTimer) { clearInterval(cycleTimer); cycleTimer = null; } }

  window.addEventListener('resize', function () {
    if (visualizer) visualizer.setRendererSize(window.innerWidth, window.innerHeight);
  });

  document.getElementById('nextPreset').addEventListener('click', function () { loadPreset(presetIdx + 1); });
  document.getElementById('prevPreset').addEventListener('click', function () { loadPreset(presetIdx - 1); });
  document.getElementById('cycleBtn').addEventListener('click', function () {
    cycleOn = !cycleOn; this.classList.toggle('active', cycleOn); startCycle();
  });
  document.getElementById('fullBtn').addEventListener('click', function () {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  });
  canvas.addEventListener('dblclick', function () { loadPreset(presetIdx + 1); });
  document.addEventListener('keydown', function (e) {
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (e.code === 'Space') { e.preventDefault(); playBtn.click(); }
    else if (e.key === 'ArrowRight') loadPreset(presetIdx + 1);
    else if (e.key === 'ArrowLeft') loadPreset(presetIdx - 1);
    else if (e.key === 'f' || e.key === 'F') document.getElementById('fullBtn').click();
  });

  /* Immersive: hide the bars while the show plays */
  var idleTimer = null;
  function pokeUI() {
    document.body.classList.remove('ui-hidden');
    if (idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { if (!cur().paused) document.body.classList.add('ui-hidden'); }, 3500);
  }
  ['pointermove', 'pointerdown', 'touchstart', 'keydown'].forEach(function (ev) {
    document.addEventListener(ev, pokeUI, { passive: true });
  });
  pokeUI();

  function labelFor(src) {
    if (!src) return '';
    if (src.indexOf('blob:') === 0) return 'Local file';
    try { var p = new URL(src).pathname.split('/').filter(Boolean).pop(); return decodeURIComponent(p || src); }
    catch (e) { return src; }
  }

  function setTrack(src, cors) {
    ensureAudioGraph();
    directMode = false; directBtn.textContent = 'Direct sound: off'; directBtn.classList.remove('active');
    directAudio.pause(); directAudio.removeAttribute('src');
    if (cors) audio.crossOrigin = 'anonymous'; else audio.removeAttribute('crossorigin');
    audio.src = src;
    trackNameEl.textContent = labelFor(src);
    playBtn.disabled = false; seek.disabled = false;
  }

  function engageDirect(reason) {
    var from = audio, to = directAudio;
    var src = from.src, pos = from.currentTime || 0, wasPlaying = !from.paused;
    if (!src) return;
    directMode = true; directBtn.textContent = 'Direct sound: on'; directBtn.classList.add('active');
    to.removeAttribute('crossorigin');
    to.src = src;
    to.addEventListener('loadedmetadata', function once() {
      to.removeEventListener('loadedmetadata', once);
      if (isFinite(to.duration) && pos > 0 && pos < to.duration) to.currentTime = pos;
      if (wasPlaying) to.play().catch(function () {});
    });
    from.pause();
    setStatus(reason + ' Direct sound is on: you hear the track, but the visuals cannot react to this one.');
    if (station.isDJ) publishState();
  }

  audio.addEventListener('error', function () {
    if (directMode || !audio.src || audio.src.indexOf('blob:') === 0) return;
    engageDirect('That link would not load through the visualizer.');
  });

  directBtn.addEventListener('click', function () {
    if (!directMode) { if (audio.src) engageDirect('Switched by hand.'); return; }
    var from = directAudio, to = audio;
    var src = from.src, pos = from.currentTime || 0, wasPlaying = !from.paused;
    directMode = false; directBtn.textContent = 'Direct sound: off'; directBtn.classList.remove('active');
    to.src = src;
    to.addEventListener('loadedmetadata', function once() {
      to.removeEventListener('loadedmetadata', once);
      if (isFinite(to.duration) && pos > 0 && pos < to.duration) to.currentTime = pos;
      if (wasPlaying) to.play().catch(function () {});
    });
    from.pause();
    setStatus('Back through the visualizer feed.');
    if (station.isDJ) publishState();
  });

  fileInput.addEventListener('change', function () {
    var f = fileInput.files && fileInput.files[0];
    if (!f) return;
    if (station.joined) setStatus('Station stopped: a local file plays on this device only. To DJ, paste a track link instead.');
    leaveStation();
    setTrack(URL.createObjectURL(f), false);
    trackNameEl.textContent = f.name;
    cur().play();
  });
  document.addEventListener('dragover', function (e) { e.preventDefault(); });
  document.addEventListener('drop', function (e) {
    e.preventDefault();
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) { leaveStation(); setTrack(URL.createObjectURL(f), false); trackNameEl.textContent = f.name; cur().play(); }
  });

  document.getElementById('demoBtn').addEventListener('click', function () {
    leaveStation();
    setTrack('https://ice1.somafm.com/groovesalad-128-mp3', true);
    cur().play().catch(function () { setStatus('Demo stream blocked by the browser. Press Play.'); });
    setStatus('Demo stream: SomaFM Groove Salad.');
  });

  playBtn.addEventListener('click', function () {
    ensureAudioGraph();
    var p = cur();
    if (p.paused) p.play(); else p.pause();
    if (station.isDJ) publishState();
  });
  [audio, directAudio].forEach(function (el) {
    el.addEventListener('play', function () { playBtn.textContent = 'Pause'; pokeUI(); if (station.isDJ && el === cur()) publishState(); });
    el.addEventListener('pause', function () { playBtn.textContent = 'Play'; document.body.classList.remove('ui-hidden'); if (station.isDJ && el === cur()) publishState(); });
    el.addEventListener('timeupdate', function () {
      if (el !== cur()) return;
      var live = !isFinite(el.duration);
      clock.textContent = live ? fmt(el.currentTime) + ' LIVE' : fmt(el.currentTime) + ' / ' + fmt(el.duration);
      if (!live && el.duration > 0 && document.activeElement !== seek) seek.value = Math.round(el.currentTime / el.duration * 1000);
    });
  });
  seek.addEventListener('input', function () {
    var p = cur();
    if (isFinite(p.duration) && p.duration > 0) { p.currentTime = seek.value / 1000 * p.duration; if (station.isDJ) publishState(); }
  });

  /* ---------- Station mode (Gun sync-play) ---------- */
  var gun = null;
  function getGun() {
    if (gun) return gun;
    gun = Gun({ peers: window.__GUN_PEERS__ || ['wss://portal.3dvr.tech/gun-relay'] });
    return gun;
  }
  function stationNode(code) { return getGun().get('3dvr-visualizer/station/' + code); }

  function publishState() {
    if (!station.isDJ || !station.node) return;
    var p = cur();
    var url = p.src && p.src.indexOf('blob:') !== 0 ? p.src : (station.lastState && station.lastState.url) || '';
    station.node.put({
      url: url,
      playing: !p.paused,
      pos: p.currentTime || 0,
      at: Date.now(),
      preset: presetKeys[presetIdx] || '',
      dj: 'this device'
    });
  }

  function expectedPos(st) {
    if (!st) return 0;
    return st.playing ? (st.pos || 0) + (Date.now() - (st.at || Date.now())) / 1000 : (st.pos || 0);
  }

  function applyState(st) {
    if (!st || station.isDJ) return;
    station.lastState = st;
    var p = cur();
    var want = expectedPos(st);
    if (st.url && p.src !== st.url) {
      setTrack(st.url, true);
      p = cur();
      p.addEventListener('loadedmetadata', function once() {
        p.removeEventListener('loadedmetadata', once);
        if (isFinite(p.duration) && want > 0 && want < p.duration) p.currentTime = want;
        if (st.playing) p.play().catch(function () {});
      });
    } else if (st.url) {
      if (st.playing && p.paused) p.play().catch(function () {});
      if (!st.playing && !p.paused) p.pause();
      if (isFinite(p.duration) && Math.abs(p.currentTime - want) > 2 && want < p.duration) p.currentTime = want;
    }
    if (st.preset && presetKeys.length) {
      var idx = presetKeys.indexOf(st.preset);
      if (idx >= 0 && idx !== presetIdx) loadPreset(idx);
    }
  }

  function joinStation(code, asDJ) {
    leaveStation();
    station.code = code; station.joined = true; station.isDJ = !!asDJ;
    station.node = stationNode(code);
    document.getElementById('djPanel').style.display = asDJ ? 'flex' : 'none';
    document.getElementById('djBtn').classList.toggle('active', asDJ);
    document.getElementById('joinBtn').classList.toggle('active', !asDJ);
    var link = location.origin + location.pathname + '?station=' + encodeURIComponent(code);
    if (asDJ) {
      publishState();
      station.heartbeat = setInterval(publishState, 4000);
      setStatus('You are the DJ of station "' + code + '". Set a track link, press Play, and share the station link: ' + link);
    } else {
      station.node.on(applyState);
      station.driftTimer = setInterval(function () { if (station.lastState) applyState(station.lastState); }, 3000);
      setStatus('Joined station "' + code + '". Waiting for the DJ track. Keep this page open; visuals follow the station.');
    }
  }

  function leaveStation() {
    if (station.node && !station.isDJ) station.node.off();
    if (station.heartbeat) clearInterval(station.heartbeat);
    if (station.driftTimer) clearInterval(station.driftTimer);
    station = { code: null, isDJ: false, joined: false, node: null, lastState: null, heartbeat: null, driftTimer: null };
    document.getElementById('djPanel').style.display = 'none';
    document.getElementById('djBtn').classList.remove('active');
    document.getElementById('joinBtn').classList.remove('active');
  }

  document.getElementById('stationBtn').addEventListener('click', function () {
    document.getElementById('stationPanel').classList.toggle('open');
  });
  document.getElementById('joinBtn').addEventListener('click', function () {
    var code = (document.getElementById('stationCode').value || 'main-stage').trim();
    ensureAudioGraph(); joinStation(code, false);
  });
  document.getElementById('djBtn').addEventListener('click', function () {
    var code = (document.getElementById('stationCode').value || 'main-stage').trim();
    ensureAudioGraph(); joinStation(code, true);
  });
  document.getElementById('setTrackBtn').addEventListener('click', function () {
    var url = (document.getElementById('trackUrl').value || '').trim();
    if (!url) { setStatus('Paste an audio link first.'); return; }
    setTrack(url, true);
    cur().play().catch(function () {});
    publishState();
  });
  document.getElementById('copyLinkBtn').addEventListener('click', function () {
    var code = (document.getElementById('stationCode').value || station.code || 'main-stage').trim();
    var link = location.origin + location.pathname + '?station=' + encodeURIComponent(code);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(link).then(function () { setStatus('Station link copied: ' + link); },
        function () { setStatus('Station link: ' + link); });
    } else setStatus('Station link: ' + link);
  });

  var params = new URLSearchParams(location.search);
  if (params.get('station')) {
    document.getElementById('stationPanel').classList.add('open');
    document.getElementById('stationCode').value = params.get('station');
    setStatus('Station "' + params.get('station') + '" linked. Tap Join station, then Play if the browser asks.');
  }
})();
</script>
</body>
</html>
