<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3DVR Meditation — Be Here</title>
  <meta name="description" content="A quiet visual meditation space from 3DVR: breathe, soften your focus, and stay as long as you like." />
  <meta name="theme-color" content="#071521" />
  <script defer src="/_vercel/insights/script.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --ink: #e7f0ea;
      --muted: rgba(231, 240, 234, .64);
      --line: rgba(231, 240, 234, .14);
      --panel: rgba(4, 18, 28, .40);
      --glow: rgba(153, 222, 201, .38);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #06131e; }
    body {
      min-height: 100svh;
      overflow: hidden;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 20%, rgba(53, 116, 113, .33), transparent 36%),
        radial-gradient(circle at 85% 78%, rgba(61, 78, 128, .28), transparent 40%),
        linear-gradient(160deg, #05111b 0%, #0a1c25 50%, #07131e 100%);
    }

    .sky,
    .wash,
    .vignette { position: fixed; inset: 0; pointer-events: none; }
    .sky { width: 100%; height: 100%; opacity: .58; }

    .wash::before,
    .wash::after {
      content: "";
      position: absolute;
      width: 56vmax;
      height: 56vmax;
      border-radius: 50%;
      filter: blur(70px);
      opacity: .18;
      animation: drift 28s ease-in-out infinite alternate;
    }

    .wash::before {
      left: -16vmax;
      top: -18vmax;
      background: #5ea493;
    }

    .wash::after {
      right: -21vmax;
      bottom: -20vmax;
      background: #626fa4;
      animation-duration: 34s;
      animation-direction: alternate-reverse;
    }

    .vignette {
      background: radial-gradient(circle at center, transparent 30%, rgba(0, 0, 0, .37) 100%);
    }

    @keyframes drift {
      from { transform: translate3d(-2vw, -1vh, 0) scale(.96); }
      to   { transform: translate3d(7vw, 6vh, 0) scale(1.12); }
    }

    main {
      position: relative;
      z-index: 2;
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(1rem, 3vw, 2.2rem);
    }

    header,
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      font-size: .82rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    a { color: inherit; text-decoration: none; }
    a:hover { color: var(--ink); }

    .center {
      display: grid;
      place-items: center;
      text-align: center;
    }

    .practice {
      width: min(92vw, 720px);
      display: grid;
      justify-items: center;
      gap: clamp(1rem, 3vh, 1.8rem);
    }

    .orb-wrap {
      width: min(46vw, 280px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      position: relative;
      transition: transform 1.2s ease;
    }

    .orb-ring,
    .orb {
      position: absolute;
      border-radius: 50%;
      will-change: transform, opacity;
    }

    .orb-ring {
      inset: 4%;
      border: 1px solid rgba(219, 245, 235, .20);
      box-shadow: 0 0 90px rgba(102, 187, 164, .12);
      animation: breathe-ring 12s ease-in-out infinite;
    }

    .orb {
      inset: 18%;
      background:
        radial-gradient(circle at 34% 28%, rgba(246, 255, 250, .68), rgba(151, 218, 198, .24) 30%, rgba(79, 139, 129, .10) 66%, rgba(0,0,0,0) 76%);
      box-shadow:
        0 0 60px var(--glow),
        inset 0 0 44px rgba(233, 255, 247, .15);
      animation: breathe 12s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(.72); opacity: .68; }
      48%, 56% { transform: scale(1.18); opacity: 1; }
    }

    @keyframes breathe-ring {
      0%, 100% { transform: scale(.82); opacity: .25; }
      48%, 56% { transform: scale(1.08); opacity: .78; }
    }

    .breath-label {
      min-height: 1.4em;
      margin: 0;
      font-size: clamp(.84rem, 2vw, 1rem);
      letter-spacing: .22em;
      text-transform: uppercase;
      color: rgba(231, 240, 234, .74);
      transition: opacity .8s ease;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 5rem);
      line-height: .95;
      font-weight: 450;
      letter-spacing: -.045em;
    }

    .thought {
      max-width: 32rem;
      min-height: 3.2em;
      margin: 0;
      font-size: clamp(1rem, 2.6vw, 1.3rem);
      line-height: 1.55;
      color: var(--muted);
      transition: opacity 1.2s ease;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: .55rem;
    }

    button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      border-radius: 999px;
      padding: .7rem 1rem;
      font: inherit;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: background .2s ease, color .2s ease, border-color .2s ease;
    }

    button:hover,
    button:focus-visible {
      color: var(--ink);
      border-color: rgba(231, 240, 234, .28);
      background: rgba(9, 29, 39, .66);
      outline: none;
    }

    body.words-hidden h1,
    body.words-hidden .thought,
    body.words-hidden .breath-label { opacity: 0; }
    body.words-hidden .orb-wrap { transform: scale(1.12); }

    @media (max-width: 600px) {
      main { padding: 1rem; }
      header span:last-child { display: none; }
      footer { font-size: .7rem; }
      .orb-wrap { width: min(58vw, 250px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .wash::before, .wash::after, .orb, .orb-ring { animation: none; }
      .orb { transform: scale(.92); }
    }
  </style>
</head>
<body>
  <canvas class="sky" aria-hidden="true"></canvas>
  <div class="wash" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <main>
    <header>
      <a href="../index.html">3dvr · meditation</a>
      <span>nothing to accomplish here</span>
    </header>

    <section class="center" aria-label="Meditation space">
      <div class="practice">
        <div class="orb-wrap" aria-hidden="true">
          <div class="orb-ring"></div>
          <div class="orb"></div>
        </div>
        <p class="breath-label" id="breathLabel">breathe in</p>
        <h1>Be here.</h1>
        <p class="thought" id="thought">You do not need to solve the next hour from inside this minute.</p>
        <div class="controls" aria-label="Meditation controls">
          <button type="button" id="wordsButton">Hide words</button>
          <button type="button" id="fullscreenButton">Fullscreen</button>
          <button type="button" id="resetButton">New thought</button>
        </div>
      </div>
    </section>

    <footer>
      <span>inhale · soften · exhale</span>
      <span>stay as long as you like</span>
    </footer>
  </main>

  <script>
    (() => {
      const thoughts = [
        "You do not need to solve the next hour from inside this minute.",
        "Let the world keep moving without you for a moment.",
        "Notice the space around the thought, not only the thought.",
        "Your breath is already happening. You can simply notice it.",
        "Soften your eyes. Unclench what can unclench.",
        "Nothing is asking you to hurry here.",
        "The next useful thing can wait until after this breath.",
        "Feel gravity holding you without effort.",
        "For one minute, existence is enough.",
        "You are allowed to simply observe."
      ];

      const thought = document.getElementById("thought");
      const breathLabel = document.getElementById("breathLabel");
      const wordsButton = document.getElementById("wordsButton");
      const fullscreenButton = document.getElementById("fullscreenButton");
      const resetButton = document.getElementById("resetButton");
      let thoughtIndex = 0;

      function newThought() {
        thoughtIndex = (thoughtIndex + 1 + Math.floor(Math.random() * (thoughts.length - 1))) % thoughts.length;
        thought.style.opacity = 0;
        setTimeout(() => {
          thought.textContent = thoughts[thoughtIndex];
          thought.style.opacity = 1;
        }, 700);
      }

      resetButton.addEventListener("click", newThought);
      setInterval(newThought, 30000);

      wordsButton.addEventListener("click", () => {
        document.body.classList.toggle("words-hidden");
        wordsButton.textContent = document.body.classList.contains("words-hidden") ? "Show words" : "Hide words";
      });

      fullscreenButton.addEventListener("click", async () => {
        try {
          if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
          else await document.exitFullscreen();
        } catch (_) {}
      });

      function updateBreathLabel() {
        const phase = (performance.now() / 1000) % 12;
        breathLabel.textContent = phase < 5.6 ? "breathe in" : phase < 6.4 ? "rest" : "breathe out";
        requestAnimationFrame(updateBreathLabel);
      }
      requestAnimationFrame(updateBreathLabel);

      const canvas = document.querySelector(".sky");
      const ctx = canvas.getContext("2d");
      const dots = [];
      const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

      function resize() {
        const dpr = Math.min(devicePixelRatio || 1, 2);
        canvas.width = innerWidth * dpr;
        canvas.height = innerHeight * dpr;
        canvas.style.width = innerWidth + "px";
        canvas.style.height = innerHeight + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        dots.length = 0;
        const count = Math.max(26, Math.min(80, Math.floor((innerWidth * innerHeight) / 22000)));
        for (let i = 0; i < count; i++) {
          dots.push({
            x: Math.random() * innerWidth,
            y: Math.random() * innerHeight,
            r: .35 + Math.random() * 1.2,
            a: .08 + Math.random() * .28,
            s: reduceMotion ? 0 : .02 + Math.random() * .08,
            p: Math.random() * Math.PI * 2
          });
        }
      }

      function draw(t) {
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        for (const d of dots) {
          const glow = d.a + Math.sin(t * .00022 + d.p) * .06;
          d.y -= d.s;
          if (d.y < -4) d.y = innerHeight + 4;
          ctx.beginPath();
          ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(224, 244, 237, ${Math.max(.03, glow)})`;
          ctx.fill();
        }
        requestAnimationFrame(draw);
      }

      addEventListener("resize", resize, { passive: true });
      resize();
      requestAnimationFrame(draw);
    })();
  </script>
</body>
</html>
