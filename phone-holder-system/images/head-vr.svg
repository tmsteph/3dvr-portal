<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
<title id="title">3DVR head and VR mode concept</title>
<desc id="desc">A lightweight headband moves the phone between a full VR position and a lower floating-screen position with a flip-up hinge.</desc>
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0e151a"/><stop offset="1" stop-color="#202f38"/></linearGradient></defs>
<rect width="800" height="520" rx="36" fill="url(#bg)"/>
<text x="48" y="62" fill="#f2f4ef" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800">Head / VR mode</text>
<text x="48" y="96" fill="#a6b1b6" font-family="Inter,Arial,sans-serif" font-size="18">From immersive viewer to floating personal screen</text>
<circle cx="324" cy="274" r="118" fill="#b88767"/>
<path d="M239 188 C267 133 374 128 421 187" fill="none" stroke="#2e2a28" stroke-width="48" stroke-linecap="round"/>
<path d="M221 245 C160 226 128 226 82 250" fill="none" stroke="#222b31" stroke-width="26" stroke-linecap="round"/>
<path d="M398 214 C475 178 575 175 676 207" fill="none" stroke="#27343c" stroke-width="24" stroke-linecap="round"/>
<g transform="translate(430 160)">
  <rect x="0" y="0" width="230" height="146" rx="28" fill="#090e11" stroke="#6a7c85" stroke-width="5"/>
  <rect x="16" y="16" width="198" height="114" rx="18" fill="#204a64"/>
  <rect x="-31" y="33" width="36" height="80" rx="12" fill="#24323a"/>
  <circle cx="-13" cy="73" r="8" fill="#7ed8ff"/>
</g>
<path d="M470 342 q84 62 178 4" fill="none" stroke="#73dfb0" stroke-width="5" stroke-dasharray="10 10"/>
<path d="M640 334 l22 11 -19 16" fill="none" stroke="#73dfb0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(510 352) rotate(-20)">
  <rect width="160" height="88" rx="18" fill="#10181d" stroke="#70818a" stroke-width="4"/>
  <rect x="13" y="12" width="134" height="64" rx="12" fill="#315f7e"/>
</g>
<text x="492" y="468" fill="#dce6e8" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800">Flip-down “floating screen”</text>
<text x="492" y="493" fill="#9caaaf" font-family="Inter,Arial,sans-serif" font-size="15">Use on transit; keep peripheral vision available</text>
<text x="75" y="400" fill="#7ed8ff" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800">Rear-balanced headband</text>
<text x="75" y="425" fill="#9caaaf" font-family="Inter,Arial,sans-serif" font-size="15">Counterweight or battery can move mass off the face</text>
</svg>