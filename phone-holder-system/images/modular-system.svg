<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">3DVR modular wearable phone system</title>
<desc id="desc">A central quick-release phone cradle connects to belt, chest, head, desk and keyboard modules.</desc>
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f5f1e8"/><stop offset="1" stop-color="#e2dbce"/></linearGradient></defs>
<rect width="1200" height="620" rx="40" fill="url(#bg)"/>
<text x="54" y="70" fill="#1c252a" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="850">One cradle. Many postures.</text>
<text x="54" y="108" fill="#697378" font-family="Inter,Arial,sans-serif" font-size="20">A shared 3DVR quick-release interface turns the phone into a wearable, handheld, desk or VR computer.</text>
