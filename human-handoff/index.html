<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111">
  <meta name="referrer" content="no-referrer">
  <title>Human Handoff · 3DVR</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section class="card" id="intro">
      <div class="mark">3DVR</div>
      <p class="eyebrow">Human needed</p>
      <h1 id="title">A site needs you</h1>
      <p class="why" id="reason">A human-only step is blocking your agent.</p>
      <div class="meta">
        <span id="expiry">Short-lived access</span>
        <span>Same browser session</span>
      </div>
      <button id="continue" disabled>Continue</button>
      <p class="privacy" id="status">Checking secure handoff…</p>
    </section>

    <section id="session" class="session" hidden>
      <header>
        <div>
          <strong id="sessionTitle">Human Handoff</strong>
          <small id="sessionStatus">Connected to the exact browser tab</small>
        </div>
        <div class="header-actions">
          <button id="paste" type="button">Paste</button>
          <button id="backspace" type="button">⌫ Backspace</button>
          <button id="done">Done — return to agent</button>
        </div>
      </header>
      <section id="guide" class="guide" hidden aria-live="polite">
        <div class="guide-copy">
          <small id="guideProgress">Step 1 of 1</small>
          <strong id="guideInstruction">Complete this step.</strong>
        </div>
        <div class="guide-actions">
          <button id="guideBack" type="button" class="secondary">Back</button>
          <button id="guideNext" type="button">Next</button>
        </div>
      </section>
      <div class="viewport" id="viewport">
        <img id="frame" alt="Live remote browser viewport">
        <div class="placeholder" id="loading">
          <strong>Connecting…</strong>
          <span>Your browser session stays on your agent server.</span>
        </div>
      </div>
      <textarea
        id="keyboardProxy"
        class="keyboard-proxy"
        aria-label="Remote keyboard input"
        autocomplete="off"
        autocapitalize="none"
        spellcheck="false"
        tabindex="-1"
      ></textarea>
    </section>
  </main>
  <script src="app.js?v=20260919-guided-edge-pan"></script>
</body>
</html>
