<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111">
  <meta name="referrer" content="no-referrer">
  <title>Human Handoff · 3DVR</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section class="card" id="intro">
      <div class="mark">3DVR</div>
      <p class="eyebrow">Human needed</p>
      <h1 id="title">A site needs you</h1>
      <p class="why" id="reason">A human-only step is blocking your agent.</p>
      <div class="meta">
        <span id="expiry">Short-lived access</span>
        <span>Same browser session</span>
      </div>
      <button id="continue" disabled>Continue</button>
      <p class="privacy" id="status">Checking secure handoff…</p>
    </section>

    <section id="session" class="session" hidden>
      <header>
        <div>
          <strong id="sessionTitle">Human Handoff</strong>
          <small id="sessionStatus">Connected to the exact browser tab</small>
        </div>
        <div class="header-actions">
          <button class="secondary" id="keyboard">Keyboard</button>
          <button id="done">Done — return to agent</button>
        </div>
      </header>
      <div class="viewport" id="viewport">
        <img id="frame" alt="Live remote browser viewport">
        <div class="placeholder" id="loading">
          <strong>Connecting…</strong>
          <span>Your browser session stays on your agent server.</span>
        </div>
      </div>
      <form id="textBar" class="text-bar" hidden>
        <input id="textInput" autocomplete="off" autocapitalize="none" placeholder="Type into the selected field">
        <button type="submit">Send</button>
        <button type="button" class="secondary" data-key="Tab">Tab</button>
        <button type="button" class="secondary" data-key="Enter">Enter</button>
        <button type="button" class="secondary" data-key="Backspace">⌫</button>
      </form>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
