<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Life · 3DVR</title><style>body{font:16px system-ui;background:#0b1727;color:#edf6ff;max-width:680px;margin:auto;padding:24px}section{background:#192b40;border-radius:16px;padding:20px;margin:16px 0}input,button{font:inherit;padding:12px;border-radius:8px;margin:4px;background:#304e72;color:white;border:1px solid #6382a3}input[type=text]{width:80%}li{padding:9px}a{color:#9cd6ff}button{cursor:pointer}</style><a href="/life/">← Life Command Center</a><h1>Daily Life</h1><p>A small, private daily planner. Data stays on this device.</p><section><h2>Priorities</h2><form id="form"><input id="new" type="text" maxlength="160" placeholder="What matters today?" aria-label="New priority" required><button>Add</button></form><ul id="list"></ul><p id="progress"></p></section><section><h2>Daily care</h2><div id="care"></div></section><section><h2>Freedom projects</h2><p><a href="/launch-room/">Income and automation</a> · <a href="/pocket-window/">Nomad inventions</a> · <a href="/open-space-network/">Community</a></p></section><section><button id="export">Export data</button><button id="clear">Clear data</button><p>Prototype: no account sync or encryption. Avoid sensitive information.</p></section><script>
const key='3dvr-daily-v1',day=new Date().toLocaleDateString('en-CA');let data;try{data=JSON.parse(localStorage.getItem(key))||{tasks:[],care:{}}}catch{data={tasks:[],care:{}}}const save=()=>localStorage.setItem(key,JSON.stringify(data)),get=id=>document.getElementById(id);
function render(){get('list').replaceChildren();data.tasks.forEach((t,i)=>{const li=document.createElement('li'),check=document.createElement('input'),label=document.createElement('span'),remove=document.createElement('button');check.type='checkbox';check.checked=t.done;check.setAttribute('aria-label','Complete '+t.text);check.onchange=()=>{t.done=check.checked;save();render()};label.textContent=t.text;label.style.textDecoration=t.done?'line-through':'';remove.textContent='Remove';remove.onclick=()=>{data.tasks.splice(i,1);save();render()};li.append(check,label,remove);get('list').append(li)});get('progress').textContent=data.tasks.filter(t=>t.done).length+' / '+data.tasks.length+' complete';get('care').replaceChildren();['Move','Rest','Connect','Reflect'].forEach(n=>{const label=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.checked=!!data.care[day+n];check.onchange=()=>{data.care[day+n]=check.checked;save()};label.append(check,document.createTextNode(n+'  '));get('care').append(label)})}
get('form').onsubmit=e=>{e.preventDefault();const text=get('new').value.trim();if(!text)return;data.tasks.push({text,done:false});get('new').value='';save();render()};get('export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='3dvr-daily.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};get('clear').onclick=()=>{if(confirm('Delete local planner data?')){data={tasks:[],care:{}};save();render()}};render();</script></html>
