<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">3dvr portal logo</title>
  <desc id="desc">A gold coin mark with the words 3dvr portal.</desc>
  <defs>
    <radialGradient id="coin-face" cx="31%" cy="24%" r="82%">
      <stop offset="0" stop-color="#fff1a8"/>
      <stop offset="0.22" stop-color="#f9d976"/>
      <stop offset="0.58" stop-color="#d99a2b"/>
      <stop offset="0.86" stop-color="#a96816"/>
      <stop offset="1" stop-color="#6f3f0b"/>
    </radialGradient>
    <linearGradient id="coin-rim" x1="112" x2="402" y1="104" y2="408" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff1a8"/>
      <stop offset="0.42" stop-color="#d99a2b"/>
      <stop offset="1" stop-color="#7c470d"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#1f1307"/>
  <circle cx="256" cy="256" r="170" fill="url(#coin-face)" stroke="url(#coin-rim)" stroke-width="18" filter="url(#soft-shadow)"/>
  <circle cx="256" cy="256" r="134" fill="none" stroke="#7c470d" stroke-width="9" opacity="0.62"/>
  <circle cx="256" cy="256" r="116" fill="none" stroke="#fff1a8" stroke-width="4" opacity="0.32"/>
  <circle cx="256" cy="256" r="62" fill="#6f3f0b" fill-opacity="0.16" stroke="#fff1a8" stroke-width="5" stroke-opacity="0.5"/>
  <text x="256" y="274" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="76" font-weight="900" fill="#6f3f0b" letter-spacing="-3">3dvr</text>
  <text x="256" y="324" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" fill="#8a5515" letter-spacing="1">portal</text>
</svg>
