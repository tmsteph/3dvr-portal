<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">3dvr portal logo</title>
  <desc id="desc">A polished portal coin with luminous teal depth, a warm gold rim, and the words 3dvr portal.</desc>
  <defs>
    <radialGradient id="portal-face" cx="38%" cy="31%" r="76%">
      <stop offset="0" stop-color="#d9ffff"/>
      <stop offset="0.12" stop-color="#7de8ee"/>
      <stop offset="0.38" stop-color="#1da7aa"/>
      <stop offset="0.66" stop-color="#0d5f69"/>
      <stop offset="1" stop-color="#07111f"/>
    </radialGradient>
    <linearGradient id="portal-gold" x1="104" y1="94" x2="414" y2="424" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff4b8"/>
      <stop offset="0.28" stop-color="#edc052"/>
      <stop offset="0.64" stop-color="#9a5e10"/>
      <stop offset="0.86" stop-color="#d79b2b"/>
      <stop offset="1" stop-color="#6b3d08"/>
    </linearGradient>
    <linearGradient id="portal-light" x1="162" y1="136" x2="354" y2="364" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0ffff"/>
      <stop offset="0.46" stop-color="#79edf4"/>
      <stop offset="1" stop-color="#20d5b5"/>
    </linearGradient>
    <filter id="portal-shadow" x="-24%" y="-24%" width="148%" height="154%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#050b13"/>
  <g filter="url(#portal-shadow)">
    <circle cx="256" cy="246" r="192" fill="#07111f" stroke="url(#portal-gold)" stroke-width="18"/>
    <circle cx="256" cy="246" r="167" fill="url(#portal-face)" stroke="#155f69" stroke-width="5"/>
    <g fill="none" stroke="url(#portal-light)" stroke-width="22" stroke-linecap="round" opacity="0.58">
      <path d="M256 246c50-8 84-44 82-88-2-34-25-63-59-74"/>
      <path d="M256 246c50-8 84-44 82-88-2-34-25-63-59-74" transform="rotate(72 256 246)"/>
      <path d="M256 246c50-8 84-44 82-88-2-34-25-63-59-74" transform="rotate(144 256 246)"/>
      <path d="M256 246c50-8 84-44 82-88-2-34-25-63-59-74" transform="rotate(216 256 246)"/>
      <path d="M256 246c50-8 84-44 82-88-2-34-25-63-59-74" transform="rotate(288 256 246)"/>
    </g>
    <circle cx="256" cy="246" r="117" fill="none" stroke="#d9ffff" stroke-width="5" opacity="0.42"/>
    <circle cx="256" cy="246" r="82" fill="#06111b" stroke="url(#portal-gold)" stroke-width="5" opacity="0.98"/>
    <text x="256" y="250" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="78" font-weight="900" fill="#f8ffff" letter-spacing="-4">3dvr</text>
    <text x="256" y="302" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="850" fill="#f0ca63" letter-spacing="2">portal</text>
  </g>
</svg>
