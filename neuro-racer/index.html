<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b13"><title>Neuro Racer · 3DVR</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b13;color:#fff;font-family:Inter,system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;inset:0;pointer-events:none;padding:14px;display:flex;flex-direction:column;gap:10px}.top{display:flex;align-items:center;gap:8px}.back,.pill{pointer-events:auto;background:#08101ddd;border:1px solid #ffffff32;border-radius:999px;padding:8px 11px;color:#fff;text-decoration:none;font-weight:850;font-size:.76rem;backdrop-filter:blur(10px)}.stats{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.title{font-weight:950;letter-spacing:.05em}.mission{margin:auto;align-self:center;max-width:min(86vw,620px);padding:15px 18px;border-radius:18px;background:#08101dea;border:1px solid #ffffff35;text-align:center;font-weight:850;opacity:0;transform:scale(.96);transition:.18s}.mission.show{opacity:1;transform:scale(1)}.cue{font-size:2rem;margin-bottom:4px}.hint{margin-top:auto;align-self:center;background:#08101ddd;border:1px solid #ffffff32;border-radius:999px;padding:9px 13px;font-size:.72rem;text-align:center}.toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);padding:10px 14px;border-radius:999px;background:#08101ded;border:1px solid #ffffff44;font-weight:900;opacity:0;transition:.18s;pointer-events:none}.toast.show{opacity:1}@media(max-width:720px){.title{display:none}.pill{font-size:.68rem;padding:7px 9px}.hint{font-size:.65rem}}</style></head>
<body><canvas id="game" aria-label="3DVR adaptive cognitive racing game"></canvas><div class="hud"><div class="top"><a class="back" href="/games.html">← Games</a><div class="title">NEURO RACER · LAB</div><div class="stats"><span class="pill">lap <b id="lap">1/3</b></span><span class="pill">speed <b id="speed">0</b></span><span class="pill">focus <b id="focus">1.0×</b></span><span class="pill">score <b id="score">0</b></span></div></div><div class="mission" id="mission"><div class="cue" id="cue">◀</div><div id="cueText">LEFT — tap Q</div></div><div class="hint">Drive: W/S · A/D · Shift boost · Space handbrake · Q/E answer cues · R reset</div></div><div class="toast" id="toast"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js';
import {advanceCheckpointState,chooseNearestTangentHeading,wrapAngle} from './physics.js';
const $=id=>document.getElementById(id),canvas=$('game'),renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight,false);renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x070b16);scene.fog=new THREE.Fog(0x070b16,70,230);const camera=new THREE.PerspectiveCamera(66,innerWidth/innerHeight,.1,400);scene.add(new THREE.HemisphereLight(0xb8d7ff,0x151322,1.8));const sun=new THREE.DirectionalLight(0xffffff,2.6);sun.position.set(-30,45,20);scene.add(sun);
const R=42,W=12,LAPS=3;const ground=new THREE.Mesh(new THREE.CircleGeometry(90,96),new THREE.MeshStandardMaterial({color:0x142331,roughness:.96}));ground.rotation.x=-Math.PI/2;ground.position.y=-.55;scene.add(ground);const road=new THREE.Mesh(new THREE.RingGeometry(R-W/2,R+W/2,128),new THREE.MeshStandardMaterial({color:0x292d38,roughness:.72}));road.rotation.x=-Math.PI/2;road.position.y=-.5;scene.add(road);
for(const r of [R-W/2,R+W/2]){const x=new THREE.Mesh(new THREE.RingGeometry(r-.13,r+.13,128),new THREE.MeshBasicMaterial({color:0x65e7ff,transparent:true,opacity:.75}));x.rotation.x=-Math.PI/2;x.position.y=-.42;scene.add(x)}
for(let i=0;i<64;i++){const a=i/64*Math.PI*2,m=new THREE.Mesh(new THREE.BoxGeometry(.26,.04,2.1),new THREE.MeshBasicMaterial({color:i%4===0?0xff5ddd:0xffffff,transparent:true,opacity:.75}));m.position.set(Math.cos(a)*R,-.39,Math.sin(a)*R);m.rotation.y=-a;scene.add(m)}
const car=new THREE.Group(),bodyMat=new THREE.MeshStandardMaterial({color:0xff386d,emissive:0x4f061b,emissiveIntensity:.8,roughness:.32,metalness:.28});const body=new THREE.Mesh(new THREE.BoxGeometry(2.3,.7,4.2),bodyMat);body.position.y=.65;car.add(body);const canopy=new THREE.Mesh(new THREE.BoxGeometry(1.45,.62,1.7),new THREE.MeshStandardMaterial({color:0x66dcff,emissive:0x13465c,emissiveIntensity:1.2}));canopy.position.set(0,1.2,-.25);car.add(canopy);for(const x of [-1.05,1.05])for(const z of [-1.35,1.35]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.34,14),new THREE.MeshStandardMaterial({color:0x101216}));w.rotation.z=Math.PI/2;w.position.set(x,.28,z);car.add(w)}scene.add(car);
const checkpoints=[];for(let i=0;i<8;i++){const a=i/8*Math.PI*2,g=new THREE.Group(),mat=new THREE.MeshBasicMaterial({color:0x79f7ff,transparent:true,opacity:.42}),l=new THREE.Mesh(new THREE.BoxGeometry(.35,5,.35),mat),r=l.clone(),t=new THREE.Mesh(new THREE.BoxGeometry(W-1,.35,.35),mat);l.position.set(-W/2+1,2.5,0);r.position.set(W/2-1,2.5,0);t.position.set(0,5,0);g.add(l,r,t);g.position.set(Math.cos(a)*R,0,Math.sin(a)*R);g.rotation.y=-a;scene.add(g);checkpoints.push({gate:g,mat})}
const keys=new Set();let heading=0,speed=0,steer=0,nextCheckpoint=1,lap=1,finished=false,raceStart=performance.now(),score=0,level=1,streak=0,cue=null,cueAt=0,nextCue=performance.now()+5000,toastTimer;
function say(t,ms=1100){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),ms)}
function reset(){heading=0;speed=0;steer=0;nextCheckpoint=1;lap=1;finished=false;score=0;level=1;streak=0;cue=null;raceStart=performance.now();nextCue=performance.now()+4500;car.position.set(R,0,0);car.rotation.y=0;$('lap').textContent='1/3';$('score').textContent='0';$('focus').textContent='1.0×';$('mission').classList.remove('show');say('Drive first. The second task will appear when you settle in.',1600)}
function spawnCue(){if(finished||cue)return;const left=Math.random()<.5;cue=left?'Q':'E';cueAt=performance.now();$('cue').textContent=left?'◀':'▶';$('cueText').textContent=(left?'LEFT':'RIGHT')+' — tap '+cue;$('mission').classList.add('show')}
function answer(k){if(!cue)return;const reaction=performance.now()-cueAt,ok=k===cue;if(ok){streak++;score+=Math.max(50,Math.round(300-reaction/6))*level;if(streak>=3&&level<5){level++;streak=0;say('Focus level '+level+' — cues accelerate')}}else{streak=0;score=Math.max(0,score-100);level=Math.max(1,level-1);say('Miss — difficulty eased')}$('score').textContent=score;$('focus').textContent=(1+(level-1)*.25).toFixed(2)+'×';cue=null;$('mission').classList.remove('show');nextCue=performance.now()+Math.max(1800,5200-level*650)}
addEventListener('keydown',e=>{keys.add(e.code);if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='KeyR'&&!e.repeat)reset();if(!e.repeat&&(e.code==='KeyQ'||e.code==='KeyE'))answer(e.code.slice(3))});addEventListener('keyup',e=>keys.delete(e.code));
reset();const clock=new THREE.Clock();function update(){const dt=Math.min(clock.getDelta(),.05),now=performance.now();if(!cue&&now>nextCue)spawnCue();if(cue&&now-cueAt>Math.max(1100,2800-level*260)){answer('MISS')}
const throttle=!finished&&(keys.has('KeyW')||keys.has('ArrowUp')),brake=!finished&&(keys.has('KeyS')||keys.has('ArrowDown')),left=!finished&&(keys.has('KeyA')||keys.has('ArrowLeft')),right=!finished&&(keys.has('KeyD')||keys.has('ArrowRight')),boost=!finished&&throttle&&(keys.has('ShiftLeft')||keys.has('ShiftRight')),hand=!finished&&keys.has('Space');
if(throttle)speed+=(speed<0?22:(boost?17:12))*dt;if(brake)speed+=speed>0?-25*dt:-10*dt;if(!throttle&&!brake)speed*=Math.exp(-.48*dt);if(hand)speed*=Math.exp(-1.15*dt);if(finished)speed*=Math.exp(-3.2*dt);speed=THREE.MathUtils.clamp(speed,-7,boost?34:24);steer=THREE.MathUtils.damp(steer,right-left,9,dt);heading+=steer*(.22+THREE.MathUtils.clamp(Math.abs(speed)/24,0,1)*1.9)*(hand?1.75:1)*dt*(speed>=0?1:-1);car.position.addScaledVector(new THREE.Vector3(Math.sin(heading),0,Math.cos(heading)),speed*dt);
const radial=Math.hypot(car.position.x,car.position.z)||1,d=Math.abs(radial-R);if(d<W*1.65){const magnet=THREE.MathUtils.clamp(1-d/(W*1.65),0,1),pull=magnet*(hand?.35:1.05)*dt;car.position.x=THREE.MathUtils.lerp(car.position.x,car.position.x/radial*R,pull);car.position.z=THREE.MathUtils.lerp(car.position.z,car.position.z/radial*R,pull);const tangent=chooseNearestTangentHeading(car.position.x,car.position.z,heading);heading+=wrapAngle(tangent-heading)*magnet*(hand?.1:.38)*dt}else speed*=Math.exp(-1.25*dt);
car.rotation.y=heading;checkpoints.forEach((c,i)=>{c.mat.opacity=i===nextCheckpoint?1:.4;c.mat.color.setHex(i===nextCheckpoint?0xffe95e:0x79f7ff)});const cp=checkpoints[nextCheckpoint];if(!finished&&cp&&car.position.distanceTo(cp.gate.position)<6.2){const s=advanceCheckpointState({nextCheckpoint,lap,checkpointCount:checkpoints.length,totalLaps:LAPS});nextCheckpoint=s.nextCheckpoint;if(s.finished){finished=true;say('Finished · cognitive score '+score,3500)}else if(s.lapAdvanced){lap=s.lap;$('lap').textContent=lap+'/3';say('Lap '+lap)}}
const camBack=new THREE.Vector3(-Math.sin(heading),.34,-Math.cos(heading)).normalize().multiplyScalar(10),desired=car.position.clone().add(new THREE.Vector3(0,3.2,0)).add(camBack);camera.position.lerp(desired,1-Math.exp(-6*dt));camera.lookAt(car.position.x,car.position.y+1,car.position.z);camera.fov=THREE.MathUtils.damp(camera.fov,66+Math.min(Math.abs(speed)/34,1)*7,5,dt);camera.updateProjectionMatrix();bodyMat.emissiveIntensity=boost?1.8:.8;$('speed').textContent=Math.abs(speed).toFixed(0);renderer.render(scene,camera);requestAnimationFrame(update)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight,false)});update();
</script></body></html>
