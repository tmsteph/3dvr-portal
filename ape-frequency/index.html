<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark">
<meta name="description" content="Ape Frequency. Find the latest on YouTube, TikTok, and Instagram.">
<title>Ape Frequency | Site Preview</title>
<style>
:root{font-family:Inter,Arial,sans-serif;color:#f7f7f8;background:#09090a;color-scheme:dark;--muted:#bcbcc3}
*{box-sizing:border-box} body{margin:0;min-width:0;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(16px,4vw,56px);background:radial-gradient(ellipse at 50% 2%,#26262a 0%,#121214 43%,#09090a 74%)}
main{width:min(100%,1120px)} .shell{position:relative;isolation:isolate;display:grid;grid-template-rows:auto 1fr auto auto;min-height:clamp(470px,73svh,740px);overflow:hidden;border:1px solid #bfbfc336;border-radius:clamp(20px,4vw,42px);background:linear-gradient(147deg,#252528,#121214 46%,#18181c);box-shadow:0 28px 85px #0009,inset 0 1px 0 #ffffff15}
.shell::before{content:"";position:absolute;z-index:-1;inset:0;background:repeating-linear-gradient(0deg,transparent 0 37px,#f5f5ff06 38px 39px),repeating-linear-gradient(90deg,transparent 0 37px,#f5f5ff06 38px 39px);mask-image:radial-gradient(ellipse at 46% 60%,#000,transparent 68%);pointer-events:none}
.top,.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:clamp(16px,3vw,34px);font-size:.68rem;font-weight:700;line-height:1.4;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.top{align-self:start}.top img{width:clamp(65px,12vw,100px);height:auto;display:block;mix-blend-mode:screen}.badge{padding:.65em .9em;border:1px solid #e5e5ef37;border-radius:999px;background:#2424289c;backdrop-filter:blur(12px)}
.led{width:7px;height:7px;display:inline-block;vertical-align:middle;border-radius:50%;background:#e5e5e9;margin-inline-end:.65em;box-shadow:0 0 10px #ffffff82}
.hero{min-width:0;position:relative;display:grid;place-items:center;align-content:center;text-align:center;padding:0 14px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
.logo-slot{position:relative;display:grid;place-items:center;width:min(100%,680px)}
.logo-slot::before{content:"";position:absolute;z-index:-1;width:85%;height:60%;background:radial-gradient(ellipse,#fff1,transparent 67%);pointer-events:none}
.logo-slot img{display:block;width:100%;height:auto;mix-blend-mode:screen}
.bottom{border-top:1px solid #ededff17;background:#10101270;backdrop-filter:blur(12px)}
.bottom span:last-child{text-align:right}.bottom a{color:inherit;text-underline-offset:.2em}.bottom a:focus-visible{outline:2px solid white;outline-offset:3px}
nav:not([hidden]){display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:0 18px 24px}
nav a{padding:.65em 1em;color:inherit;text-decoration:none;border:1px solid #e5e5ef55;border-radius:999px;background:#252529a0;font-size:.875rem;line-height:1.5;font-weight:700;transition:background-color .18s ease,border-color .18s ease} nav a:hover{border-color:#bebec1;background:#37373b}
nav a:focus-visible{outline:2px solid white;outline-offset:3px}
@media(prefers-reduced-motion:no-preference){.logo-slot::before{animation:breathe 5s ease-in-out infinite alternate}@keyframes breathe{from{opacity:.34;transform:scale(.9)}to{opacity:.82;transform:scale(1.05)}}}
@media(prefers-reduced-motion:reduce){nav a{transition:none}}
@media(max-width:370px){.top,.bottom{letter-spacing:.09em;font-size:.63rem}.hero{padding-inline:8px}}
</style>
</head>
<body>
<main><section class="shell" aria-labelledby="title">
<header class="top"><img src="ape-frequency-mark.jpg" width="2048" height="683" alt=""><span class="badge">Design preview</span></header>
<div class="hero">
<div class="logo-slot"><h1 class="sr-only" id="title">Ape Frequency</h1><img src="ape-frequency-wordmark.jpg" width="1600" height="1200" alt=""></div>
</div>
<nav aria-label="Ape Frequency social accounts">
<a href="https://www.youtube.com/@ApeFrequency">YouTube</a>
<a href="https://www.tiktok.com/@ape.frequency">TikTok</a>
<a href="https://www.instagram.com/apefrequency/">Instagram</a>
</nav>
<footer class="bottom"><span>Ape Frequency</span><span><a href="https://apefrequency.com/">Current site</a></span></footer>
</section></main>
</body>
</html>
