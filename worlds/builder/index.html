<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3DVR Worlds Builder</title><style>body{margin:0;background:#101c2b;color:white;font:15px system-ui}canvas{display:block}aside{position:fixed;z-index:2;top:12px;left:12px;background:#14263aee;padding:16px;border-radius:14px;max-width:280px}button,input,select{font:inherit;padding:8px;margin:3px;border-radius:8px}button{cursor:pointer}input[type=range]{width:90%}small{display:block;color:#ccd}a{color:#9df}</style><aside><h2>✦ 3DVR World Builder</h2><small>Local prototype · no public hosting yet</small><p><input id="name" maxlength="80" value="My World" aria-label="World name"></p><select id="kind"><option>box</option><option>tree</option><option>tower</option></select><button id="add">Add object</button><p><select id="selected" aria-label="Selected object"></select><button id="remove">Remove</button></p><label>X <input id="x" type="range" min="-15" max="15" step=".5"></label><label>Z <input id="z" type="range" min="-15" max="15" step=".5"></label><label>Size <input id="scale" type="range" min=".5" max="3" step=".1"></label><p><button id="save">Save draft</button><button id="export">Export JSON</button></p><input id="file" type="file" accept=".json,application/json" aria-label="Import world JSON"><p id="status" role="status">Drag to orbit · scroll to zoom</p><a href="/worlds/">Existing Worlds playground</a></aside><script type="module">
const $=id=>document.getElementById(id),key='3dvr-world-builder-v1',validKinds=['box','tree','tower'];let world={version:1,name:'My World',objects:[{id:'first',kind:'box',x:0,z:0,scale:1}]},selected='first';
function validate(w){if(w?.version!==1||typeof w.name!=='string'||w.name.length>80||!Array.isArray(w.objects)||w.objects.length>100)throw Error('Invalid world');const ids=new Set();for(const o of w.objects){if(typeof o.id!=='string'||ids.has(o.id)||!validKinds.includes(o.kind)||![o.x,o.z,o.scale].every(Number.isFinite)||Math.abs(o.x)>15||Math.abs(o.z)>15||o.scale<.5||o.scale>3)throw Error('Invalid object');ids.add(o.id)}return {version:1,name:w.name,objects:w.objects.map(({id,kind,x,z,scale})=>({id,kind,x,z,scale}))}}
try{const saved=localStorage.getItem(key);if(saved)world=validate(JSON.parse(saved))}catch(e){$('status').textContent=e.message}
$('name').value=world.name;selected=world.objects[0]?.id;
let draw=()=>{};
function sync(){const sel=$('selected');sel.replaceChildren();world.objects.forEach(o=>{const el=document.createElement('option');el.value=o.id;el.textContent=o.kind+' '+o.id.slice(0,6);sel.append(el)});if(!world.objects.some(o=>o.id===selected))selected=world.objects[0]?.id;sel.value=selected||'';const o=world.objects.find(o=>o.id===selected);for(const k of ['x','z','scale']){ $(k).disabled=!o;if(o)$(k).value=o[k]}draw()}
$('selected').onchange=e=>{selected=e.target.value;sync()};for(const k of ['x','z','scale'])$(k).oninput=e=>{const o=world.objects.find(o=>o.id===selected);if(o){o[k]=Number(e.target.value);draw()}};
$('add').onclick=()=>{if(world.objects.length>=100)return;selected=crypto.randomUUID();world.objects.push({id:selected,kind:$('kind').value,x:0,z:0,scale:1});sync()};$('remove').onclick=()=>{world.objects=world.objects.filter(o=>o.id!==selected);sync()};
$('save').onclick=()=>{try{world.name=$('name').value;localStorage.setItem(key,JSON.stringify(validate(world)));$('status').textContent='Saved on this device'}catch(e){$('status').textContent=e.message}};
$('export').onclick=()=>{try{world.name=$('name').value;const blob=new Blob([JSON.stringify(validate(world),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='3dvr-world.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){$('status').textContent=e.message}};
$('file').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>50000)throw Error('File too large');world=validate(JSON.parse(await f.text()));$('name').value=world.name;selected=world.objects[0]?.id;sync();$('status').textContent='Imported'}catch(e){$('status').textContent=e.message}};
try{const T=await import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js');const scene=new T.Scene();scene.background=new T.Color(0x16263b);const camera=new T.PerspectiveCamera(60,innerWidth/innerHeight,.1,100);const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));document.body.append(renderer.domElement);scene.add(new T.HemisphereLight(0xffffff,0x3b5945,2));const light=new T.DirectionalLight(0xffdfac,2);light.position.set(10,20,6);scene.add(light);const ground=new T.Mesh(new T.PlaneGeometry(70,70),new T.MeshStandardMaterial({color:0x31594c}));ground.rotation.x=-Math.PI/2;scene.add(ground);scene.add(new T.GridHelper(35,35));const objects=new T.Group();scene.add(objects);const mat=c=>new T.MeshStandardMaterial({color:c});draw=()=>{while(objects.children.length){const g=objects.children[0];objects.remove(g);g.traverse(m=>{m.geometry?.dispose();m.material?.dispose()})}for(const o of world.objects){const g=new T.Group();let m;if(o.kind==='tree'){m=new T.Mesh(new T.ConeGeometry(1.2,3,8),mat(0x4fa37d));m.position.y=2}else if(o.kind==='tower'){m=new T.Mesh(new T.CylinderGeometry(.8,1.3,4,8),mat(0xb6a0d7));m.position.y=2}else{m=new T.Mesh(new T.BoxGeometry(2,2,2),mat(0x5bc3cc));m.position.y=1}g.add(m);g.position.set(o.x,0,o.z);g.scale.setScalar(o.scale);if(o.id===selected)m.material.emissive.setHex(0x282015);objects.add(g)}};draw();let angle=.7,height=.8,dist=30,point=null;function cameraUpdate(){height=Math.max(.25,Math.min(1.4,height));dist=Math.max(10,Math.min(60,dist));camera.position.set(dist*Math.sin(height)*Math.sin(angle),dist*Math.cos(height),dist*Math.sin(height)*Math.cos(angle));camera.lookAt(0,0,0)}cameraUpdate();renderer.domElement.onpointerdown=e=>{point=[e.clientX,e.clientY];renderer.domElement.setPointerCapture(e.pointerId)};renderer.domElement.onpointermove=e=>{if(!point)return;angle-=(e.clientX-point[0])*.006;height-=(e.clientY-point[1])*.006;point=[e.clientX,e.clientY];cameraUpdate()};renderer.domElement.onpointerup=()=>point=null;renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();dist+=e.deltaY*.02;cameraUpdate()},{passive:false});window.onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};renderer.setAnimationLoop(()=>{if(!document.hidden)renderer.render(scene,camera)})}catch(e){$('status').textContent='3D unavailable; editor/export still work'}
sync();</script></html>
