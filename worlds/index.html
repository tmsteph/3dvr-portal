<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3DVR Worlds — Alpha Playground</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#101b2a;color:white;font:16px system-ui}canvas{display:block}header{position:absolute;top:1rem;left:1rem;background:#102235dc;padding:1rem;border-radius:14px;max-width:310px}button{padding:.65rem;border:0;border-radius:9px;margin:.2rem;cursor:pointer}#status{font-size:.8rem;color:#bde}#touch{position:absolute;bottom:1rem;left:1rem;display:flex;gap:.5rem}#touch button{min-width:52px;min-height:52px;background:#ffffffbb}a{color:#9de}</style></head>
<body><header><strong>🌍 3DVR Worlds</strong><div id="status">Local single-player prototype · saved on this device</div><p>WASD / arrows to move · drag to look · click ground to build</p><button id="remove">Remove mode: off</button><button id="save">Export world</button><button id="reset">Reset</button><label style="display:block;margin-top:.5rem">Import world <input id="import" type="file" accept="application/json"></label><p><a href="/home/">Back to Portal</a></p></header><div id="touch"><button data-key="KeyW">↑</button><button data-key="KeyA">←</button><button data-key="KeyS">↓</button><button data-key="KeyD">→</button><button id="place">Build</button></div>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.169.0';
const scene=new THREE.Scene();scene.background=new THREE.Color('#8bd2ff');scene.fog=new THREE.Fog('#8bd2ff',25,85);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,150);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x557766,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(10,20,8);scene.add(sun);
const ground=new THREE.Mesh(new THREE.BoxGeometry(80,.4,80),new THREE.MeshStandardMaterial({color:'#68bb76'}));ground.position.y=-.2;scene.add(ground);
const grid=new THREE.GridHelper(80,80,0xffffff,0xffffff);grid.material.transparent=true;grid.material.opacity=.12;scene.add(grid);
const blockGeo=new THREE.BoxGeometry(1,1,1),blockMat=new THREE.MeshStandardMaterial({color:'#f7a96b'});const blocks=new Map();const key=(x,z)=>x+','+z;
function add(x,z){if(!Number.isInteger(x)||!Number.isInteger(z)||Math.abs(x)>39||Math.abs(z)>39||blocks.size>=2000||blocks.has(key(x,z)))return;const m=new THREE.Mesh(blockGeo,blockMat);m.position.set(x,.5,z);scene.add(m);blocks.set(key(x,z),m);persist()}
function del(x,z){const k=key(x,z),m=blocks.get(k);if(m){scene.remove(m);blocks.delete(k);persist()}}
function persist(){try{localStorage.setItem('3dvr-worlds-alpha',JSON.stringify([...blocks.keys()]))}catch{}}
function load(data){if(!Array.isArray(data)||data.length>2000||!data.every(v=>typeof v==='string'&&/^-?\d+,-?\d+$/.test(v)))throw Error('Invalid world');for(const m of blocks.values())scene.remove(m);blocks.clear();for(const item of data){const [x,z]=item.split(',').map(Number);add(x,z)}}
try{load(JSON.parse(localStorage.getItem('3dvr-worlds-alpha')||'[]'))}catch{localStorage.removeItem('3dvr-worlds-alpha')}
let remove=false,yaw=0,pitch=-.25;const player=new THREE.Vector3(0,1.8,7),pressed=new Set();const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
document.getElementById('remove').onclick=e=>{remove=!remove;e.target.textContent='Remove mode: '+(remove?'on':'off')};
document.getElementById('reset').onclick=()=>{if(confirm('Clear this local world?'))load([])};
document.getElementById('save').onclick=()=>{const blob=new Blob([JSON.stringify({format:'3dvr-worlds-alpha-v1',blocks:[...blocks.keys()]},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-world.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
document.getElementById('import').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(data.format!=='3dvr-worlds-alpha-v1')throw Error('Unknown format');load(data.blocks)}catch(err){alert('Import failed: '+err.message)}e.target.value=''};
function interact(x,y){mouse.set(x/innerWidth*2-1,-y/innerHeight*2+1);ray.setFromCamera(mouse,camera);const hits=ray.intersectObjects([...blocks.values(),ground]);if(!hits.length)return;const hit=hits[0];if(remove&&hit.object!==ground){del(hit.object.position.x,hit.object.position.z);return}const p=hit.point.clone().addScaledVector(hit.face.normal,.1);if(hit.object!==ground && hit.face.normal.y!==1)return;add(Math.round(p.x),Math.round(p.z))}
let drag=null;renderer.domElement.style.touchAction='none';renderer.domElement.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,lastX:e.clientX,lastY:e.clientY,moved:false};renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.lastX,dy=e.clientY-drag.lastY;if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8)drag.moved=true;if(drag.moved){yaw-=dx*.004;pitch=Math.max(-1.3,Math.min(.6,pitch-dy*.004))}drag.lastX=e.clientX;drag.lastY=e.clientY});
renderer.domElement.addEventListener('pointerup',e=>{if(drag&&!drag.moved)interact(e.clientX,e.clientY);drag=null});
document.getElementById('place').onclick=()=>interact(innerWidth/2,innerHeight/2);
addEventListener('keydown',e=>{if(['INPUT','BUTTON'].includes(document.activeElement.tagName))return;pressed.add(e.code);if(e.code.startsWith('Arrow'))e.preventDefault()});addEventListener('keyup',e=>pressed.delete(e.code));
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();pressed.add(k)});for(const ev of ['pointerup','pointercancel','pointerleave'])b.addEventListener(ev,()=>pressed.delete(k))});
let last=performance.now();function frame(now){const dt=Math.min((now-last)/1000,.05);last=now;const forward=Number(pressed.has('KeyW')||pressed.has('ArrowUp'))-Number(pressed.has('KeyS')||pressed.has('ArrowDown')),side=Number(pressed.has('KeyD')||pressed.has('ArrowRight'))-Number(pressed.has('KeyA')||pressed.has('ArrowLeft'));const v=new THREE.Vector3(Math.sin(yaw)*forward+Math.cos(yaw)*side,0,-Math.cos(yaw)*forward+Math.sin(yaw)*side);if(v.lengthSq())player.addScaledVector(v.normalize(),dt*5);player.x=THREE.MathUtils.clamp(player.x,-38,38);player.z=THREE.MathUtils.clamp(player.z,-38,38);camera.position.copy(player);camera.rotation.order='YXZ';camera.rotation.set(pitch,yaw,0);renderer.render(scene,camera);requestAnimationFrame(frame)}requestAnimationFrame(frame);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
