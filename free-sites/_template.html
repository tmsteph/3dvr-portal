<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{BUSINESS_NAME}}</title>
  <meta name="description" content="{{META_DESCRIPTION}}">
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111d;
      --card: rgba(255, 255, 255, 0.08);
      --line: rgba(255, 255, 255, 0.16);
      --text: #f7fbff;
      --muted: #b9c6d4;
      --accent: #69f0d2;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 15%, rgba(48, 190, 170, 0.22), transparent 35%),
        radial-gradient(circle at 85% 80%, rgba(74, 112, 255, 0.2), transparent 40%),
        var(--bg);
    }
    a { color: inherit; }
    main {
      width: min(100% - 2rem, 920px);
      margin: 0 auto;
      padding: 5rem 0 3rem;
    }
    .eyebrow {
      margin: 0 0 1rem;
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    h1 {
      max-width: 13ch;
      margin: 0;
      font-size: clamp(3rem, 10vw, 6.5rem);
      line-height: 0.95;
      letter-spacing: -0.055em;
    }
    .lede {
      max-width: 680px;
      margin: 1.5rem 0 0;
      color: var(--muted);
      font-size: clamp(1.1rem, 2.5vw, 1.35rem);
      line-height: 1.65;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      margin-top: 2rem;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0.8rem 1.15rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      text-decoration: none;
      font-weight: 800;
    }
    .button.primary {
      border-color: transparent;
      background: var(--accent);
      color: #04110e;
    }
    .panel {
      margin-top: 4rem;
      padding: clamp(1.4rem, 4vw, 2.2rem);
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--card);
      backdrop-filter: blur(14px);
    }
    .panel h2 {
      margin: 0 0 0.8rem;
      font-size: clamp(1.8rem, 4vw, 2.5rem);
    }
    .panel p {
      margin: 0;
      color: var(--muted);
      line-height: 1.75;
      white-space: pre-line;
    }
    footer {
      width: min(100% - 2rem, 920px);
      margin: 0 auto;
      padding: 1rem 0 3rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">{{EYEBROW}}</p>
    <h1>{{BUSINESS_NAME}}</h1>
    <p class="lede">{{TAGLINE}}</p>
    <div class="actions">
      <a class="button primary" href="{{PRIMARY_URL}}">{{PRIMARY_LABEL}}</a>
      <a class="button" href="mailto:{{CONTACT_EMAIL}}">Email</a>
    </div>

    <section class="panel">
      <h2>{{SECTION_HEADING}}</h2>
      <p>{{SECTION_BODY}}</p>
    </section>
  </main>
  <footer>
    Free site hosted by <a href="https://3dvr.tech/">3DVR</a>. The owner can upgrade, move, or expand it anytime.
  </footer>
</body>
</html>
