<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b22"><title>3DVR Portal Runner</title><style>
*{box-sizing:border-box}body{margin:0;background:#090b22;color:#f4f0ff;font:16px system-ui,sans-serif;display:grid;place-items:center;min-height:100dvh}main{width:min(100%,440px);padding:12px;text-align:center}h1{margin:4px 0 10px;color:#b8a1ff}header{display:flex;justify-content:space-between;margin-bottom:8px}canvas{display:block;width:100%;aspect-ratio:3/4;background:#090b22;border:1px solid #6350b9;border-radius:14px;touch-action:none}nav{display:flex;gap:12px;justify-content:center;margin-top:12px}button{border:0;border-radius:12px;background:#433e69;color:white;padding:14px 24px;font-size:18px;touch-action:none;cursor:pointer}#start{background:#7553d6}p{font-size:13px;opacity:.75}</style></head><body><main><h1>3DVR Portal Runner</h1><header><span>✨ <b id="score">0</b></span><span>❤️ <b id="lives">3</b></span><span>Level <b id="level">1</b></span></header><canvas id="game" width="360" height="480" aria-label="Portal Runner game"></canvas><nav><button id="left" aria-label="Move left">◀</button><button id="start">Start</button><button id="right" aria-label="Move right">▶</button></nav><p>Collect teal crystals. Dodge red drones. Move with A/D, arrow keys, touch, or buttons.</p><a style="color:#b8a1ff" href="/">← Portal</a></main><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),scoreEl=document.querySelector('#score'),livesEl=document.querySelector('#lives'),levelEl=document.querySelector('#level');let x=180,items=[],score=0,lives=3,frame=0,running=false,last=0,spawn=0,keys={left:false,right:false};const stars=Array.from({length:65},()=>({x:Math.random()*360,y:Math.random()*480,r:Math.random()*1.7}));
function reset(){x=180;items=[];score=0;lives=3;frame=0;spawn=0;running=true;scoreEl.textContent=0;livesEl.textContent=3;levelEl.textContent=1;document.querySelector('#start').textContent='Restart'}
document.querySelector('#start').onclick=reset;
for(const side of ['left','right']){const b=document.querySelector('#'+side);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[side]=true;b.setPointerCapture(e.pointerId)});for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>keys[side]=false)}
function key(e,down){const side=['ArrowLeft','a','A'].includes(e.key)?'left':['ArrowRight','d','D'].includes(e.key)?'right':null;if(side){keys[side]=down;e.preventDefault()}}window.addEventListener('keydown',e=>key(e,true));window.addEventListener('keyup',e=>key(e,false));window.addEventListener('blur',()=>{keys.left=keys.right=false});
function touch(e){const r=canvas.getBoundingClientRect();x=Math.max(20,Math.min(340,(e.clientX-r.left)*360/r.width))}canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);touch(e)});canvas.addEventListener('pointermove',e=>{if(e.buttons)touch(e)});
function render(){ctx.fillStyle='#090b22';ctx.fillRect(0,0,360,480);for(const s of stars){ctx.globalAlpha=.35;ctx.fillStyle='#9fa8e9';ctx.fillRect(s.x,s.y,s.r,s.r)}ctx.globalAlpha=1;ctx.strokeStyle='#48369b';ctx.lineWidth=3;for(let i=0;i<4;i++){ctx.beginPath();ctx.ellipse(180,210,40+i*35,95+i*40,0,0,Math.PI*2);ctx.stroke()}for(const o of items){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(frame*.025);ctx.fillStyle=o.bad?'#ff506b':'#4df5d3';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=18;ctx.beginPath();if(o.bad)ctx.rect(-12,-12,24,24);else{ctx.moveTo(0,-14);ctx.lineTo(11,0);ctx.lineTo(0,14);ctx.lineTo(-11,0);ctx.closePath()}ctx.fill();ctx.restore()}ctx.save();ctx.translate(x,425);ctx.shadowBlur=22;ctx.shadowColor='#b6a0ff';ctx.fillStyle='#e3d8ff';ctx.beginPath();ctx.moveTo(0,-21);ctx.lineTo(17,17);ctx.lineTo(0,9);ctx.lineTo(-17,17);ctx.closePath();ctx.fill();ctx.restore();if(!running){ctx.fillStyle='#070b21cc';ctx.fillRect(0,100,360,260);ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold 27px system-ui';ctx.fillText(lives<=0?'GAME OVER':'ENTER THE PORTAL',180,190);ctx.font='16px system-ui';ctx.fillText(lives<=0?'Energy collected: '+score:'Collect energy. Avoid the drones.',180,225);ctx.fillText('Press Start to play',180,258)}}
function loop(now){const dt=Math.min((now-last)/16.67||1,2);last=now;if(running){frame+=dt;const level=1+Math.floor(score/100);if(keys.left)x-=5*dt;if(keys.right)x+=5*dt;x=Math.max(20,Math.min(340,x));spawn+=dt;if(spawn>=Math.max(12,35-level*2)){spawn=0;items.push({x:20+Math.random()*320,y:-20,bad:Math.random()<.32})}for(let i=items.length-1;i>=0;i--){const o=items[i];o.y+=(2.8+level*.65)*dt;if(Math.hypot(o.x-x,o.y-425)<24){if(o.bad){lives--;livesEl.textContent=lives;if(lives<=0)running=false}else{score+=10;scoreEl.textContent=score;levelEl.textContent=1+Math.floor(score/100)}items.splice(i,1)}else if(o.y>500)items.splice(i,1)}}render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
